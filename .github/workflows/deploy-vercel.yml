name: Deploy to Vercel Production
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Envia um e-mail automatico para o gestor sempre que um merge na main
  # conclui o deploy de producao com sucesso. So roda se o job 'deploy'
  # terminar OK (needs + if: success()). O corpo traz SEMPRE um resumo do
  # que foi feito, montado a partir das mensagens dos commits do merge.
  #
  # Secrets necessarios no repo (Settings > Secrets and variables > Actions):
  #   MAIL_USERNAME    · e-mail Gmail/Workspace que envia (ex.: bot@cbrio.com.br)
  #   MAIL_PASSWORD    · "senha de app" do Google (NAO a senha normal · exige 2FA)
  #   MERGE_NOTIFY_TO  · destinatario(s) do aviso · ex.: chefe@cbrio.com.br
  #                      (varios separados por virgula)
  notify-email:
    needs: deploy
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Montar resumo do que foi feito
        id: resumo
        env:
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          commit_url="$SERVER_URL/$REPO/commit/$SHA"
          run_url="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          short_sha="${SHA:0:7}"
          # Data e hora do deploy no fuso de Brasilia (o runner roda em UTC).
          quando="$(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M')"

          # Lista de commits do merge (cada mensagem = "o que foi feito").
          # Lido via jq do payload do evento -> evita injecao de shell e
          # escapa o HTML basico das mensagens de commit (forcaram aspas/<>).
          itens="$(jq -r '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            (.commits // [])[]
            | "<li><strong>\((.message | split("\n")[0]) | esc)</strong>"
              + " <span style=\"color:#777\">— \((.author.name) | esc)</span></li>"
          ' "$GITHUB_EVENT_PATH")"
          if [ -z "$itens" ]; then
            itens="<li>(execução manual — sem commits no evento)</li>"
          fi

          # Assunto = resumo curto (titulo do 1o commit do merge).
          assunto="$(jq -r '(.commits // [])[0].message // "" | split("\n")[0]' "$GITHUB_EVENT_PATH")"
          if [ -z "$assunto" ]; then assunto="deploy de produção"; fi
          echo "subject=[CBRio] Produção no ar · $assunto" >> "$GITHUB_OUTPUT"

          {
            echo 'html<<HTML_EOF'
            echo "<div style=\"font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222\">"
            echo "<h2 style=\"color:#00B39D;margin-bottom:4px\">Deploy em produção concluído</h2>"
            echo "<p>Um merge na branch <strong>main</strong> foi publicado em produção com sucesso.</p>"
            echo "<h3 style=\"margin-bottom:4px\">Resumo do que foi feito</h3>"
            echo "<ul style=\"margin-top:4px\">$itens</ul>"
            echo "<table cellpadding=\"6\" style=\"border-collapse:collapse;font-size:13px;margin-top:8px\">"
            echo "<tr><td><strong>Repositório</strong></td><td>$REPO</td></tr>"
            echo "<tr><td><strong>Quem publicou</strong></td><td>$ACTOR</td></tr>"
            echo "<tr><td><strong>Quando</strong></td><td>$quando (horário de Brasília)</td></tr>"
            echo "<tr><td><strong>Commit</strong></td><td><a href=\"$commit_url\">$short_sha</a></td></tr>"
            echo "</table>"
            echo "<p style=\"margin-top:16px\"><a href=\"https://cbrio.org\">Abrir o sistema em produção</a> · <a href=\"$run_url\">Ver a execução no GitHub Actions</a></p>"
            echo "<p style=\"color:#999;font-size:12px\">E-mail automático enviado pelo GitHub Actions da CBRio a cada deploy de produção.</p>"
            echo "</div>"
            echo HTML_EOF
          } >> "$GITHUB_OUTPUT"

      # Confirma que os secrets do Microsoft Graph existem ANTES de tentar
      # enviar. Sem isso, o envio falharia e marcaria o deploy (que já foi pro
      # ar) como "failure". Aqui logamos qual secret falta (sem expor valores) e,
      # se faltar algum, pulamos o envio com um aviso — o deploy continua verde.
      - name: Verificar configuração de e-mail
        id: mailcfg
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GRAPH_MAIL_SENDER: ${{ secrets.GRAPH_MAIL_SENDER }}
          MERGE_NOTIFY_TO: ${{ secrets.MERGE_NOTIFY_TO }}
        run: |
          ok=true
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET GRAPH_MAIL_SENDER MERGE_NOTIFY_TO; do
            if [ -n "${!v}" ]; then echo "$v: definido"; else echo "$v: VAZIO"; ok=false; fi
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::E-mail de deploy NAO enviado: configure os secrets faltantes (acima) em Settings > Secrets and variables > Actions > aba Secrets. O deploy de producao foi concluido normalmente."
          fi
          echo "configured=$ok" >> "$GITHUB_OUTPUT"

      # Envia via Microsoft Graph (sendMail · fluxo client credentials). O app
      # precisa da permissão de APLICATIVO Mail.Send com consentimento de admin,
      # e GRAPH_MAIL_SENDER deve ser uma caixa real e licenciada no tenant.
      # MERGE_NOTIFY_TO aceita vários destinatários separados por vírgula.
      # Falha de envio vira aviso (não derruba o deploy, que já foi pro ar).
      - name: Enviar e-mail de notificação (Microsoft Graph)
        if: ${{ steps.mailcfg.outputs.configured == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GRAPH_MAIL_SENDER: ${{ secrets.GRAPH_MAIL_SENDER }}
          MERGE_NOTIFY_TO: ${{ secrets.MERGE_NOTIFY_TO }}
          SUBJECT: ${{ steps.resumo.outputs.subject }}
          HTML: ${{ steps.resumo.outputs.html }}
        run: |
          set -uo pipefail
          # 1) Token de aplicativo (client credentials)
          tok=$(curl -sS -w $'\n%{http_code}' -X POST \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${AZURE_CLIENT_ID}" \
            --data-urlencode "client_secret=${AZURE_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials") || true
          tcode=$(printf '%s' "$tok" | tail -n1)
          tbody=$(printf '%s' "$tok" | sed '$d')
          if [ "$tcode" != "200" ]; then
            echo "::warning::Falha ao obter token do Azure (HTTP $tcode). Verifique AZURE_TENANT_ID, AZURE_CLIENT_ID e AZURE_CLIENT_SECRET (use o VALOR do segredo, não o ID dele)."
            printf '%s' "$tbody" | head -c 500; echo
            exit 0
          fi
          access_token=$(printf '%s' "$tbody" | jq -r '.access_token // empty')
          if [ -z "$access_token" ]; then
            echo "::warning::Token vazio na resposta do Azure."
            exit 0
          fi
          # 2) Monta o payload do sendMail (jq escapa assunto/HTML/destinatários)
          payload=$(jq -n \
            --arg subject "$SUBJECT" \
            --arg html "$HTML" \
            --arg to "$MERGE_NOTIFY_TO" \
            '{
              message: {
                subject: $subject,
                body: { contentType: "HTML", content: $html },
                toRecipients: ($to | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0)) | map({emailAddress:{address:.}}))
              },
              saveToSentItems: false
            }')
          # 3) Envia (202 = aceito)
          scode=$(curl -sS -o /tmp/graph_resp -w '%{http_code}' -X POST \
            "https://graph.microsoft.com/v1.0/users/${GRAPH_MAIL_SENDER}/sendMail" \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json" \
            -d "$payload") || true
          echo "Graph sendMail HTTP: $scode"
          if [ "$scode" = "202" ]; then
            echo "E-mail enviado com sucesso (Microsoft Graph)."
          else
            echo "Resposta:"; head -c 800 /tmp/graph_resp 2>/dev/null || true; echo
            echo "::warning::Falha ao enviar e-mail pelo Graph (HTTP $scode). O deploy foi concluido normalmente. Verifique a permissao Mail.Send (Aplicativo, com consentimento de admin) e se GRAPH_MAIL_SENDER e uma caixa real licenciada no tenant."
          fi
