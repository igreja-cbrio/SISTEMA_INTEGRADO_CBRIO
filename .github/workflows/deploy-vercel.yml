name: Deploy to Vercel Production
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Inscrições field contract
        run: npm run test:inscricao-contrato

      - name: Inscrições doors and route aliases
        run: npm run test:inscricao-portas

      - name: Inscrições orphan queue keys and door pointers
        run: npm run test:inscricao-orfas

      - name: Inscrições QR signature and inventory hash
        run: npm run test:inscricao-qr

      - name: Contrato do censo (politica de recadastramento)
        run: npm run test:censo

      - name: Contrato do detector de nome derivado do e-mail
        run: npm run test:nome-email

      - name: Contrato do nome mais completo (promoção no matcher)
        run: npm run test:nome-completo

      - name: Politica de duplicidade (fila das Entradas)
        run: npm run test:duplicidade

      - name: Pontuacao da fila progressiva (nascimento corrobora, genero veta)
        run: npm run test:identidade-pares

      # Gate estreito: SO a regra de ordem dos hooks do React. O lint completo
      # tem ~1.714 problemas de codigo legado (quase todos no-explicit-any) e
      # ficaria vermelho pra sempre — gate que ninguem mantem verde e removido
      # na primeira urgencia. Esta regra tem ZERO violacoes e pega a classe de
      # bug que derrubou a tela do voluntariado em producao (16/08/2026):
      # useState depois de um early return -> React #310.
      - name: Ordem dos hooks do React (react-hooks/rules-of-hooks)
        run: npm run lint:hooks

      - name: Politica de familia (fila Vincular familias)
        run: npm run test:familia

      # Trava o conserto de 18/08: a coleta precisa reprocessar o periodo
      # anterior, senao o mes fecha subcontado (julho perdeu R$ 42 mil).
      - name: Periodos da coleta de KPI (fecha o periodo anterior)
        run: npm run test:kpi-periodos

      - name: Matcher grava nascimento e sexo na criacao
        run: npm run test:matcher-insert

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ⚠️ O BUILD RODA NO VERCEL, não mais aqui (2026-08-21 · pedido do Marcos:
      # deploy sem derrubar aba aberta). O fluxo antigo (`vercel build` +
      # `deploy --prebuilt`) não tem System Environment Variables no build —
      # em particular o VERCEL_DEPLOYMENT_ID que o vite.config usa pra anexar
      # `?dpl=` aos assets, que é o que faz o Skew Protection (ligado no painel,
      # 12h) funcionar de verdade: quem está com a aba aberta segue sendo
      # servido pela versão antiga em vez de cair na tela "uma atualização está
      # sendo publicada". A doc do --prebuilt diz explicitamente: "If you need
      # System Environment Variables at build time, do not use the --prebuilt
      # flag". Os previews SEMPRE buildaram no Vercel — o build remoto deste
      # projeto é o caminho já provado. Os gates acima continuam mandando: nada
      # sobe sem os testes passarem NESTE job.
      - name: Deploy to Production (build no Vercel)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ⚠️ Job SEPARADO com `if: failure()`, não um step dentro do deploy. Um step
  # com `if: failure()` só roda se o job chegou até ele; se a falha for no
  # checkout, no npm install ou num dos contratos de teste lá em cima, o step
  # nunca é alcançado e o aviso não sai — justamente nos casos em que ele mais
  # importa. Como job com `needs`, ele dispara para QUALQUER falha do deploy.
  avisar-falha:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avisar que o deploy falhou
        env:
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID || secrets.AZURE_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          MERGE_MAIL_SENDER: ${{ secrets.MERGE_MAIL_SENDER || secrets.GRAPH_MAIL_SENDER || 'noreply@cbrio.org' }}
          DEPLOY_ALERTA_TO: ${{ secrets.DEPLOY_ALERTA_TO || vars.DEPLOY_ALERTA_TO || 'matheus.toscano@cbrio.org' }}
          COMMIT_MENSAGEM: ${{ github.event.head_commit.message }}
          COMMIT_AUTOR: ${{ github.event.head_commit.author.name }}
        run: node scripts/alerta-deploy-falhou.mjs

# NOTA (2026-06-23): o job 'notify-email' (e-mail "Produção no ar" a CADA deploy
# de produção, enviado pro MERGE_NOTIFY_TO via Microsoft Graph) foi REMOVIDO —
# era ele que mandava um e-mail pro Eduardo a cada atualização do sistema.
# Agora o ÚNICO aviso por e-mail é o RESUMO SEMANAL de sexta-feira
# (.github/workflows/resumo-merge-email.yml). Não reintroduzir o envio por deploy
# sem alinhar com a gestão (o secret MERGE_NOTIFY_TO pode ser removido do repo).
