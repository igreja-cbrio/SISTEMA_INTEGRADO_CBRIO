name: Resumo semanal por e-mail (Eduardo)

# Toda sexta-feira gera UM resumo consolidado em linguagem de leigo (Claude
# Haiku) de tudo que entrou no sistema durante a semana e envia por e-mail
# (Microsoft Graph) para o Eduardo. Substitui o antigo e-mail a cada merge —
# agora e um unico digest semanal, pra nao lotar a caixa de entrada.
# Roda 100% no CI — nao toca no app nem no banco em producao.

on:
  schedule:
    # Sexta-feira 20:00 UTC = 17:00 BRT (fim do expediente).
    # Cron do GitHub Actions e sempre em UTC; dia-da-semana 5 = sexta.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias olhar pra tras (padrao: 7)"
        required: false
        default: "7"

permissions:
  contents: read
  pull-requests: read

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar resumo da semana e enviar e-mail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DIAS: ${{ github.event.inputs.dias || '7' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID || secrets.AZURE_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          MERGE_MAIL_SENDER: ${{ secrets.MERGE_MAIL_SENDER || secrets.GRAPH_MAIL_SENDER || vars.MERGE_MAIL_SENDER || 'noreply@cbrio.org' }}
          MERGE_MAIL_TO: ${{ vars.MERGE_MAIL_TO }}
        run: node scripts/resumo-merge-email.mjs
