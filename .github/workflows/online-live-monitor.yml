name: Online · Live Monitor (loop 5min)

# Vercel Hobby nao permite cron sub-diario. Live monitor roda aqui no GitHub
# Actions · so age (server-side) se ha culto na janela.
#
# ⚠️ LICAO (2026-07-01): o schedule `*/5` do GitHub Actions e ESTRANGULADO —
# na pratica disparava ~1x/hora (no culto de quarta 20h BRT rodou so 2x: 19:58
# e 21:17 · o pico real do meio do culto nunca foi amostrado → pico gravado 99).
# O fix: cada disparo vira um LOOP interno que amostra a cada 5 min por ate
# ~58 min. Assim, MESMO com o cron atrasando/pulando, qualquer disparo dentro
# da janela cobre a hora seguinte inteira com amostras 5/5min.
#
# Janelas de execucao (UTC · BRT = UTC-3):
#   Cultos fixos com has_online=true (BRT) → janela [-30min, +4h]:
#     Dom 09:30 / 11:30 / 19:00 · Qua 20:00 · Sab 20:00 (AMI)
#     ⚠️ Grade de domingo mudou em 24/08/2026 (era 08:30/10:00/11:30/19:00).
#     As janelas UTC abaixo continuam cobrindo — 09:30 BRT = 12:30 UTC.
#   Cron 1 · Dom UTC 11-15 (BRT 08-12): cultos da manha de domingo.
#   Cron 2 · diario UTC 16-23 (BRT 13-20): inicio dos cultos da noite
#     (Dom 19h, Qua 20h, Sab 20h) + eventos atipicos.
#   Cron 3 · diario UTC 0-4 (BRT 21-01): termino dos cultos da noite (+4h).
#   Pula UTC 05-10 (BRT 02-07h) · sem culto nesse horario. Pra evento atipico,
#   botao "Coletar pico agora" em /ministerial/online.
#
# Custo: repo publico → minutos de Actions gratuitos em runner padrao. O loop
# sai cedo (apos 3 respostas "fora_de_janela" seguidas) pra nao segurar runner
# a toa em hora sem culto.
#
# Secrets necessarios no repo (Settings > Secrets > Actions):
#   CRON_SECRET    · mesmo valor da env CRON_SECRET no Vercel
#   APP_BASE_URL   · ex.: https://cbrio.org

on:
  schedule:
    # ⚠️ DOIS disparos por hora no domingo de manha (31/08/2026). O GitHub
    # ESTRANGULA schedule: em 30/08 os disparos de UTC 11,12,13,14 foram TODOS
    # descartados e o culto de 09:30 (12:30 UTC) ficou sem NENHUMA amostra. O
    # loop interno cobre ~58min, entao :00 e :30 dobram a chance de pegar a
    # live mesmo perdendo metade dos disparos. `cancel-in-progress` faz o
    # disparo novo substituir o loop anterior — a amostragem continua.
    - cron: '0,30 11-15 * * 0'  # Dom · 2x/hora, loop cobre a hora
    - cron: '0 16-23 * * *'  # Diario 13:00-20:xx BRT
    - cron: '0 0-4 * * *'    # Diario 21:00-01:xx BRT
  workflow_dispatch: # permite run manual via UI

# Um novo disparo SUBSTITUI o loop anterior (sem fila crescendo · a amostragem
# continua no run novo).
concurrency:
  group: online-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Loop live-monitor (amostra 5/5min por ~58min)
        run: |
          set -uo pipefail
          # -L segue redirect (ex.: 308 apex<->www) · sem isso o curl parava no
          # "Redirecting..." e o monitor nunca rodava.
          fora_seguidas=0
          for i in $(seq 1 12); do
            out=$(curl -sS -L --max-time 60 -w "\n[http_code=%{http_code} url=%{url_effective}]" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              -H "user-agent: github-actions-cron" \
              "${{ secrets.APP_BASE_URL }}/api/online/cron/live-monitor") || true
            echo "[$(date -u +%H:%M:%S)] amostra $i/12:"
            echo "$out"
            echo "$out" | grep -q '"ok"\|"skipped"' \
              || echo "::warning::live-monitor nao retornou JSON esperado · verifique APP_BASE_URL (dominio canonico, ex. https://cbrio.org) e CRON_SECRET"
            # Fora da janela de culto? Depois de 3 seguidas, encerra o loop
            # (nao ha culto agora · o proximo disparo horario recomeca).
            if echo "$out" | grep -q '"fora_de_janela"'; then
              fora_seguidas=$((fora_seguidas+1))
              if [ "$fora_seguidas" -ge 3 ]; then
                echo "3x fora_de_janela seguidas · encerrando loop cedo."
                exit 0
              fi
            else
              fora_seguidas=0
            fi
            # ⚠️ `if`, NÃO `[ ... ] && sleep`: na ULTIMA volta a condição é falsa,
            # o comando composto devolve 1, e como é o último comando do step o
            # GitHub marcava o run como FAILURE — todo loop que rodava as 12
            # amostras aparecia vermelho. Alarme que grita quando está tudo bem
            # treina a equipe a ignorar o painel (a lição do alerta do DS).
            if [ "$i" -lt 12 ]; then sleep 300; fi
          done
          exit 0
