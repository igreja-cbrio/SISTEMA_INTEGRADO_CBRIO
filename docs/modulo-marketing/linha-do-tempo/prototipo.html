<title>Linha do Marketing 2027</title>
<style>
:root {
  --ground: #eef2f1;
  --paper: #ffffff;
  --paper-2: #f6faf9;
  --ink: #102a28;
  --ink-2: #3d5450;
  --ink-3: #6b8782;
  --line: #d6e1dd;
  --line-2: #e7eeec;
  --accent: #00a693;
  --accent-deep: #00766a;
  --accent-soft: #d6ebe6;
  --grid: rgba(16,42,40,0.07);
  --bar-bg: rgba(255,255,255,.86);
  --shadow: 0 1px 2px rgba(16,42,40,.04), 0 8px 24px -16px rgba(16,42,40,.18);
  --shadow-up: 0 12px 30px -10px rgba(16,42,40,.35);
  --red: #c4453b;
  --red-soft: rgba(196,69,59,.09);
  --amber: #bd861c;
  --amber-soft: rgba(189,134,28,.14);
  --green: #1f9d6b;
  --on-status: #ffffff;
  --note: #fbf3cf;
  --note-ink: #4d4424;
  --ln-ins: #00a693;
  --ln-sis: #2f5d74;
  --ln-int: #7a6fb0;
  --ln-rot: #bd861c;
  --ln-sem: #c4453b;
  --scrim: rgba(16,42,40,.42);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1817; --paper: #15221f; --paper-2: #1a2a27; --ink: #e4efec; --ink-2: #b3c6c1; --ink-3: #82a09a;
    --line: #2a3d39; --line-2: #22332f; --accent: #2cc4ae; --accent-deep: #5fd8c5; --accent-soft: #173a34;
    --grid: rgba(220,240,235,0.07); --bar-bg: rgba(21,34,31,.88);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6); --shadow-up: 0 12px 30px -10px rgba(0,0,0,.7);
    --red: #e0645a; --red-soft: rgba(224,100,90,.12); --amber: #d9a43e; --amber-soft: rgba(217,164,62,.16); --green: #3bb885; --on-status: #0e1817;
    --note: #3a3520; --note-ink: #e8dfb8;
    --ln-ins: #2cc4ae; --ln-sis: #6ea3bd; --ln-int: #a499d6; --ln-rot: #d9a43e; --ln-sem: #e0645a; --scrim: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1817; --paper: #15221f; --paper-2: #1a2a27; --ink: #e4efec; --ink-2: #b3c6c1; --ink-3: #82a09a;
  --line: #2a3d39; --line-2: #22332f; --accent: #2cc4ae; --accent-deep: #5fd8c5; --accent-soft: #173a34;
  --grid: rgba(220,240,235,0.07); --bar-bg: rgba(21,34,31,.88);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6); --shadow-up: 0 12px 30px -10px rgba(0,0,0,.7);
  --red: #e0645a; --red-soft: rgba(224,100,90,.12); --amber: #d9a43e; --amber-soft: rgba(217,164,62,.16); --green: #3bb885; --on-status: #0e1817;
  --note: #3a3520; --note-ink: #e8dfb8;
  --ln-ins: #2cc4ae; --ln-sis: #6ea3bd; --ln-int: #a499d6; --ln-rot: #d9a43e; --ln-sem: #e0645a; --scrim: rgba(0,0,0,.6);
}

html, body { height: 100%; }
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.fx-root { height: 100%; display: flex; flex-direction: column; background: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 26px 26px; background-color: var(--ground); }

/* barra (igual ao /atlas/fluxograma) */
.fx-bar { flex: none; display: flex; align-items: center; gap: 8px 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bar-bg); backdrop-filter: blur(3px); flex-wrap: wrap; z-index: 6; }
.fx-title { font-weight: 750; letter-spacing: -.01em; margin-right: 4px; font-size: 14px; }
.fx-title b { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent-deep); font-weight: 600; display: block; }
.fx-btn { font-size: 12.5px; padding: 5px 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); border-radius: 8px; cursor: pointer; }
.fx-btn:hover { border-color: var(--accent); color: var(--accent-deep); }
.fx-btn.primary { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--paper); font-weight: 650; }
.fx-btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.fx-zoom { font-family: var(--mono); font-size: 12px; color: var(--ink-3); min-width: 46px; text-align: center; }
.fx-sep { width: 1px; height: 22px; background: var(--line); }
.seg { display: flex; gap: 2px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--accent-deep); font-weight: 650; box-shadow: 0 0 0 1.5px var(--accent) inset; }
.ctl { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); }
.ctl input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.ctl input[type="range"] { width: 110px; accent-color: var(--accent); }
.ctl output { font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 92px; }
.fx-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.fx-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
.fx-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.lg-red { background: var(--red); } .lg-green { background: var(--green); }
.lg-late { background: var(--red-soft); border: 1.5px solid var(--red); }
.lg-now { background: var(--accent-soft); border: 1px dashed var(--accent); }
.lg-amber { background: var(--amber); }

.fx-viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; }
.fx-viewport.panning { cursor: grabbing; }
.fx-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
.fx-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); background: var(--bar-bg); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; white-space: nowrap; pointer-events: none; }
@media (max-width: 760px) { .fx-hint, .fx-legend { display: none; } }

/* objetos do quadro */
.abs { position: absolute; }
.yr { display: grid; gap: 6px; pointer-events: none; }
.yr b { font-size: 112px; font-weight: 800; letter-spacing: -.05em; line-height: .8; font-variant-numeric: tabular-nums; }
.yr span { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .18em; color: var(--accent-deep); font-weight: 600; }
.yr em { font-style: normal; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 7px; justify-self: start; }

.vdiv { width: 0; border-left: 1px dashed var(--line); }
.band { border: 1px dashed transparent; border-radius: 16px; }
.band.now { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); border-color: var(--accent); }
.band.late { background: var(--red-soft); border: 1.5px solid var(--red); }
.colhead { display: grid; gap: 2px; pointer-events: none; }
.colhead .mo { font-style: normal; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent-deep); font-weight: 600; min-height: 14px; }
.colhead b { font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
.colhead span { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.colhead em { font-style: normal; justify-self: start; margin-top: 4px; font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; border-radius: 5px; padding: 2px 7px; }
.colhead.now em { background: var(--accent-soft); color: var(--accent-deep); }
.colhead.late b, .colhead.late span { color: var(--red); }
.colhead.late em { background: var(--red); color: var(--on-status); }

/* quadrados macro e de versão */
.blk { border: 0; border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; text-align: left; cursor: pointer; color: var(--on-status); box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; }
.blk.red { background: var(--red); --st: var(--red); }
.blk.green { background: var(--green); --st: var(--green); }
.blk:hover { transform: translateY(-1px); box-shadow: var(--shadow-up); }
.blk.exp { box-shadow: 0 0 0 4px var(--ground), 0 0 0 6.5px var(--st), var(--shadow-up); }
.blk .k { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; opacity: .85; font-weight: 600; }
.blk .nm { font-weight: 800; font-size: 19px; letter-spacing: -.015em; }
.blk .ds { font-size: 12px; line-height: 1.35; opacity: .92; }
.blk .st { margin-top: 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; min-height: 14px; }
.blk .ar { position: absolute; right: 14px; top: 12px; font-family: var(--mono); font-size: 16px; transition: transform .2s; }
.blk.exp .ar { transform: translateX(4px); }
.blk.sem { outline: 2px dashed color-mix(in srgb, var(--on-status) 55%, transparent); outline-offset: -7px; }
.blk.vb { padding: 12px 14px; z-index: 2; }
.blk.vb .nm { font-size: 17px; }
.blk .pg { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--on-status) 30%, transparent); overflow: hidden; margin-top: 4px; }
.blk .pg i { display: block; height: 100%; background: var(--on-status); }
.blk .nx { font-size: 11px; opacity: .92; line-height: 1.3; }

.note { background: var(--note); color: var(--note-ink); border-radius: 4px; padding: 14px 14px 16px; font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow); transform: rotate(-.6deg); }
.note b { font-weight: 700; }
.note .t { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; display: block; margin-bottom: 6px; }

/* cards (mesma linguagem do fx-node) */
.fx-node { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s, opacity .15s; z-index: 2; text-align: left; padding: 0; overflow: hidden; cursor: pointer; }
.fx-node:hover { border-color: var(--lc); box-shadow: var(--shadow-up); }
.fx-node.dim { opacity: .28; }
.fx-node .nd-bar { height: 5px; background: var(--lc); }
.fx-node.fut { border-style: dashed; box-shadow: none; background: var(--paper-2); }
.fx-node.fut .nd-bar { opacity: .35; }
.fx-node.fut .fx-nd-title { color: var(--ink-2); }
.fx-node.c-sem { border-color: color-mix(in srgb, var(--ln-sem) 45%, var(--line)); }
.fx-nd-body { padding: 9px 12px 11px; display: grid; gap: 3px; }
.fx-nd-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.fx-nd-title { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; line-height: 1.2; }
.fx-nd-val { font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-deep); flex: none; }
.fx-nd-sub { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.fx-nd-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }
.fx-nd-own { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--accent-deep); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; }
.fx-nd-cta { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--ln-sem); }
.readbtn { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.readbtn:hover { border-color: var(--lc); color: var(--ink); }
.prog { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
.prog .tr { flex: 1; height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.prog .tr i { display: block; height: 100%; background: var(--lc); }
.prog span { font-family: var(--mono); font-size: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.l-ins { --lc: var(--ln-ins); } .l-sis { --lc: var(--ln-sis); } .l-int { --lc: var(--ln-int); } .l-rot { --lc: var(--ln-rot); } .l-sem { --lc: var(--ln-sem); }

.subs { list-style: none; margin: 0; padding: 9px 12px 11px 24px; display: grid; gap: 5px; position: relative; border-top: 1px dashed var(--line); }
.subs::before { content: ""; position: absolute; left: 16px; top: 9px; bottom: 22px; border-left: 1.5px solid var(--line); }
.subs li { position: relative; display: flex; align-items: center; gap: 7px; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 7px; font-size: 12px; transition: opacity .3s, transform .3s; cursor: default; }
.subs li::before { content: ""; position: absolute; left: -8px; top: 50%; width: 7px; border-top: 1.5px solid var(--line); }
.subs li.leaving { opacity: 0; transform: translateX(10px); }
.subs label { display: flex; align-items: center; gap: 7px; flex: 1; cursor: pointer; min-width: 0; }
.subs input { width: 15px; height: 15px; accent-color: var(--green); flex: none; margin: 0; }
.subs .h, .m-list .h { font-family: var(--mono); font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.av { flex: none; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 8.5px; font-weight: 700; color: #fff; background: var(--pc); font-family: var(--sans); letter-spacing: 0; }
.av.lg { width: 34px; height: 34px; font-size: 12px; }
.p-pedro { --pc: #3d5450; } .p-leticia { --pc: #b4507a; } .p-caua { --pc: #2f5d74; }
.p-lorena { --pc: #7a6fb0; } .p-allan { --pc: #9a6b1a; } .p-aline { --pc: #4f7d6f; }

/* arestas */
.fx-edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: 1; }
.fx-edges path { fill: none; stroke: var(--lc); transition: opacity .15s; }
.fx-edges .spine { stroke-width: 3.6; }
.fx-edges .br { stroke-width: 2; }
.fx-edges .br.fut { stroke-dasharray: 4 5; opacity: .6; }
.fx-edges .spine.fut { stroke-dasharray: 2 6; opacity: .7; stroke-width: 2.4; }
.fx-edges circle { fill: var(--lc); stroke: var(--ground); stroke-width: 3; }
.fx-edges circle.late { fill: var(--red); }
.fx-edges circle.fut { fill: var(--paper); stroke: var(--lc); stroke-width: 2; }
.fx-edges .dim { opacity: .12; }
.fx-edges .hot { stroke-width: 3.4; }

/* planner */
.pp { background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-content: start; }
.pp .av { grid-row: span 2; }
.pp .nm { font-weight: 750; font-size: 15px; letter-spacing: -.01em; }
.pp .rl { font-size: 11.5px; color: var(--ink-3); }
.pp .wk { grid-column: 1 / -1; margin-top: 6px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
.pp .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.pp .bar i { display: block; height: 100%; background: var(--ok); }
.ld { --ok: var(--accent); } .ld.warn { --ok: var(--amber); } .ld.over { --ok: var(--red); }
.pc { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 9px 11px; display: grid; gap: 5px; align-content: start; cursor: pointer; text-align: left; box-shadow: var(--shadow); z-index: 2; }
.pc:hover { border-color: var(--ok); }
.pc .n { display: flex; align-items: baseline; gap: 5px; }
.pc .n b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.pc .n span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.pc .tr { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.pc .tr i { display: block; height: 100%; background: var(--ok); }
.pc .it { font-size: 10.5px; color: var(--ink-3); line-height: 1.3; }
.pc.warn { background: var(--amber-soft); border-color: var(--amber); }
.pc.over { background: var(--red-soft); border-color: var(--red); }
.pc.over .n b { color: var(--red); }

/* modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); color: var(--ink); border-radius: 16px; width: min(540px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); border: 1px solid var(--line); }
.modal.wide { width: min(700px, 100%); }
.modal .nd-bar { height: 7px; background: var(--lc, var(--accent)); }
.m-hd { padding: 16px 18px 12px; display: grid; gap: 5px; border-bottom: 1px solid var(--line-2); }
.m-hd .id { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
.m-hd h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; text-wrap: balance; }
.m-hd .ctx { font-size: 13px; color: var(--ink-2); }
.m-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.m-facts b { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; margin-right: 5px; }
.m-sec { padding: 12px 18px 4px; display: grid; gap: 6px; }
.m-sec h3 { margin: 0; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); font-weight: 600; }
.m-sec p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); max-width: 62ch; white-space: pre-wrap; }
.m-sec .quote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: 13.5px; }
.m-sec .quote small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); }
.m-list { list-style: none; margin: 0; padding: 4px 18px 12px; display: grid; gap: 6px; }
.m-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; background: var(--paper-2); min-height: 40px; }
.m-list label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; font-size: 13.5px; }
.m-list .ro { flex: 1; font-size: 13.5px; }
.m-list input { width: 17px; height: 17px; accent-color: var(--green); margin: 0; }
.m-list li.is-done .sn { text-decoration: line-through; color: var(--ink-3); }
.m-list .who-n { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.m-list li.row-btn { cursor: pointer; }
.m-list li.row-btn:hover { border-color: var(--accent); }
.pill { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
.pill.op { background: var(--line-2); color: var(--ink-2); }
.pill.lt { background: var(--red); color: var(--on-status); }
.m-ft { padding: 10px 18px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.m-ft .acts { display: flex; gap: 8px; margin-left: auto; }
.mine-h { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--accent-deep); border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.mine-h b { font-size: 18px; font-variant-numeric: tabular-nums; }

/* editor */
.ed-body { padding: 14px 18px 4px; display: grid; gap: 12px; }
.fld { display: grid; gap: 5px; }
.fld > span { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; }
.fld input, .fld select, .fld textarea, .it input, .it select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 9px; font-size: 13.5px; min-width: 0; width: 100%; }

<script>
(function () {
  const DAY = 86400000;
  const D = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const pad = n => String(n).padStart(2, '0');
  const fmt = t => { const d = new Date(t); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1); };
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hrs = h => (Math.round(h * 10) / 10).toString().replace('.', ',') + 'h';
  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Semanas de domingo a sábado · semana 1 = 01/01 (sex) – 02/01 (sáb)
  const START = D('2027-01-01'), END = D('2027-12-31');
  const WEEKS = [{ n: 1, start: START, end: D('2027-01-02') }];
  for (let s = D('2027-01-03'), n = 2; s <= END; s += 7 * DAY, n++) WEEKS.push({ n, start: s, end: Math.min(s + 6 * DAY, END) });
  const weekOf = t => (WEEKS.find(w => t >= w.start && t <= w.end) || WEEKS[WEEKS.length - 1]).n;
  const wEnd = n => WEEKS[n - 1].end;

  const PEOPLE = {
    pedro:   { name: 'Pedro Paiva',     first: 'Pedro',   ini: 'PP', role: 'Líder do Marketing', lider: true },
    leticia: { name: 'Letícia Baldner', first: 'Letícia', ini: 'LB', role: 'Social media', cap: 30 },
    caua:    { name: 'Cauã Pedreti',    first: 'Cauã',    ini: 'CP', role: 'Designer', cap: 40 },
    lorena:  { name: 'Lorena Pariz',    first: 'Lorena',  ini: 'LP', role: 'Social media', cap: 40 },
    allan:   { name: 'Allan Santana',   first: 'Allan',   ini: 'AS', role: 'Videomaker', cap: 40 },
    aline:   { name: 'Aline',           first: 'Aline',   ini: 'AL', role: 'Fotógrafa · domingos', cap: 6 },
  };
  const PROFILES = ['pedro', 'leticia', 'caua'];
  const TEAM = ['caua', 'leticia', 'lorena', 'allan', 'aline'];
  const LANES = [
    { key: 'ins', name: 'Institucionais', desc: 'Séries com ciclo criativo · CBRio, AMI e Kids' },
    { key: 'sis', name: 'Sistema',        desc: 'Solicitações feitas pelo formulário' },
    { key: 'int', name: 'Interno',        desc: 'Demandas do Pedro para a equipe' },
    { key: 'rot', name: 'Rotina',         desc: 'O que cada pessoa faz na semana' },
  ];
  const SEM = { key: 'sem', name: 'Sem responsável', desc: 'Pedidos do formulário esperando o Pedro alocar' };
  const LANE_NAME = { ins: 'Institucionais', sis: 'Sistema', int: 'Interno', rot: 'Rotina', sem: 'Sem responsável' };

  // ---------- responsabilidades por versão da série ----------
  const VERSIONS = [
    { key: 'cbrio', name: 'CBRio', desc: 'Ciclo da igreja', V: 'C' },
    { key: 'ami',   name: 'AMI',   desc: 'Ciclo do AMI',    V: 'A' },
    { key: 'kids',  name: 'Kids',  desc: 'Ciclo do Kids',   V: 'K' },
  ];
  const PHASES = [
    { off: -8, t: 'Briefing', short: 'Briefing', brief: 'Alinhar com a liderança o objetivo da série, o público e a mensagem central.',
      subs: [['brief', 'Reunião de briefing com a liderança', 1.5], ['publico', 'Público, objetivo e mensagem', 1]] },
    { off: -7, t: 'Brainstorm e conceito', short: 'Brainstorm', brief: 'Gerar ideias com a equipe e fechar o conceito da série em uma frase e um texto curto, com referências visuais.',
      subs: [['brain', 'Sessão de brainstorm', 1.5], ['conceito', 'Conceito escrito', 1.5], ['refs', 'Referências visuais', 1.5]] },
    { off: -6, t: 'ID estratégia', short: 'ID estratégia', brief: 'Transformar o conceito em identidade e estratégia: roteiro, logo, cores, tipografia, apresentação visual e o plano de redes.',
      subs: [['roteiro', 'Roteiro', 2], ['logo', 'Logo', 3], ['cores', 'Cores', 1], ['tipo', 'Tipografia', 1], ['apres', 'Apresentação visual', 2], ['planred', 'Planejamento de redes', 1.5]] },
    { off: -4, t: 'Produção de peças', short: 'Produção', brief: 'Produzir as peças a partir da identidade aprovada: feed, stories, telão, teaser e impressos.',
      subs: [['feed', 'Artes de feed', 3], ['stories', 'Stories', 2], ['telao', 'Telão', 1.5], ['teaser', 'Vídeo teaser', 4], ['impressos', 'Impressos', 1.5]] },
    { off: -2, t: 'Divulgação', short: 'Divulgação', brief: 'Colocar a série na rua: post nas redes, vídeo-chamada no culto, reels e disparo no WhatsApp.',
      subs: [['post', 'Post nas redes', 1], ['chamada', 'Vídeo-chamada no culto', 2], ['reels', 'Reels', 2], ['disparo', 'Disparo no WhatsApp', .5]] },
    { off: 0, t: 'Cobertura', short: 'Cobertura', brief: 'Cobrir o domingo de lançamento com fotos, stories ao vivo e material para o aftermovie.',
      subs: [['fotos', 'Fotos', 1.5], ['aovivo', 'Stories ao vivo', 1.5], ['after', 'Aftermovie', 4]] },
    { off: 4, t: 'Pós-série', short: 'Pós', brief: 'Fechar a série no último domingo: relatório de alcance e arquivo de mídia organizado no Drive.',
      subs: [['relat', 'Relatório de alcance', 1.5], ['arquivo', 'Arquivo de mídia', 1]] },
  ];
  const CICLO_IGREJA = { geral: 'caua', brief: 'caua', publico: 'caua', brain: 'caua', conceito: 'caua', refs: 'caua', roteiro: 'allan', logo: 'caua', cores: 'caua', tipo: 'caua', apres: 'caua', planred: 'lorena',
    feed: 'caua', stories: 'lorena', telao: 'caua', teaser: 'allan', impressos: 'caua', post: 'lorena', chamada: 'allan', reels: 'allan', disparo: 'lorena',
    fotos: 'aline', aovivo: 'lorena', after: 'allan', relat: 'lorena', arquivo: 'allan' };
  const MATRIX = {
    cbrio: CICLO_IGREJA,
    ami: CICLO_IGREJA,
    kids: { geral: 'leticia', brief: 'leticia', publico: 'leticia', brain: 'leticia', conceito: 'leticia', refs: 'leticia', roteiro: 'allan', logo: 'leticia', cores: 'leticia', tipo: 'leticia', apres: 'leticia', planred: 'leticia',
      feed: 'leticia', stories: 'leticia', telao: 'leticia', teaser: 'allan', impressos: 'leticia', post: 'lorena', chamada: 'allan', reels: 'allan', disparo: 'leticia',
      fotos: 'aline', aovivo: 'leticia', after: 'allan', relat: 'leticia', arquivo: 'allan' },
  };
  // 12 séries no ano, uma por mês · o ciclo de cada uma é o mesmo nas 3 versões
  const SERIES = [
    { code: 'ETN', name: 'Eis que tudo se fez novo', date: '2027-01-10' },
    { code: 'RAI', name: 'Raízes',                   date: '2027-02-07' },
    { code: 'CRZ', name: 'Caminho da Cruz',          date: '2027-03-07' },
    { code: 'TES', name: 'Testemunhas',              date: '2027-04-04' },
    { code: 'FAM', name: 'Família no centro',        date: '2027-05-02' },
    { code: 'CHA', name: 'Chamados',                 date: '2027-06-06' },
    { code: 'FOL', name: 'Fôlego',                   date: '2027-07-04' },
    { code: 'VDC', name: 'Valores de Cristo',        date: '2027-08-01' },
    { code: 'SAL', name: 'Sal e luz',                date: '2027-09-05' },
    { code: 'GRA', name: 'Graça',                    date: '2027-10-03' },
    { code: 'GRT', name: 'Gratidão',                 date: '2027-11-07' },
    { code: 'NAT', name: 'Natal: Emanuel',           date: '2027-12-05' },
  ];
  const SERIE_BY = Object.fromEntries(SERIES.map(s => [s.code, s]));

  const MIN = [['Kids', 'Culto Kids especial'], ['Jovens', 'Culto de Jovens'], ['Família', 'Encontro de Casais'], ['Integração', 'Café de boas-vindas'],
               ['Grupos', 'Abertura de semestre dos grupos'], ['Voluntariado', 'Dia do Voluntário'], ['Missões', 'Noite missionária'], ['Louvor', 'Noite de adoração']];
  const TYPES = {
    'Arte':  { resp: 'caua',    subs: [['Arte de feed', 'caua', 2], ['Versão story', 'caua', 1], ['Revisão com o solicitante', 'caua', .5]],
               req: o => `Precisamos de arte para divulgar ${o} no feed e nos stories. A ideia é começar a divulgar uma semana antes.` },
    'Vídeo': { resp: 'allan',   subs: [['Roteiro', 'allan', 1.5], ['Captação', 'allan', 3], ['Edição', 'allan', 5], ['Legenda e publicação', 'leticia', .5]],
               req: o => `Queremos um vídeo curto chamando para ${o}, para passar no culto e postar nas redes.` },
    'Post':  { resp: 'leticia', subs: [['Legenda', 'leticia', 1], ['Arte do post', 'caua', 1.5], ['Agendamento', 'lorena', .5]],
               req: o => `Pedimos um post nas redes da igreja convidando para ${o}, com data, horário e local.` },
  };
  const TYPE_KEYS = Object.keys(TYPES);
  const PEDRO_BRIEF_SIS = 'Seguir a identidade visual da série do momento. Mandar a primeira versão para aprovação antes de publicar.';

  // ---------- dados de exemplo ----------
  let seed = 2027, subSeq = 0;
  const rng = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const SEED_W = 12;
  function buildData() {
    seed = 2027; subSeq = 0;
    const T = [];
    const add = o => {
      o.subs = o.subs.map(([t, who, h]) => ({ id: 's' + (subSeq++), t, who, h, done: false }));
      o.due = o.due || wEnd(o.week);
      const w = o.week, r = rng(), full = o.lane === 'rot' ? .99 : .975;
      if (o.lane !== 'sem') {
        if (w < SEED_W - 1) { if (r < full) o.subs.forEach(s => s.done = true); else o.subs.forEach(s => s.done = rng() < .5); }
        else if (w === SEED_W - 1) { if (r < .6) o.subs.forEach(s => s.done = true); else o.subs.forEach(s => s.done = rng() < .5); }
        else if (w === SEED_W) { if (r < .2) o.subs.forEach(s => s.done = true); else o.subs.forEach(s => s.done = rng() < .35); }
      }
      T.push(o);
    };
    SERIES.forEach(se => {
      const ew = weekOf(D(se.date));
      VERSIONS.forEach(v => {
        const M = MATRIX[v.key];
        PHASES.forEach((ph, i) => {
          const week = ew + ph.off;
          if (week < 1 || week > 53) return;   // essa etapa aconteceu em 2026
          add({
            id: `${se.code}-${v.V}-0${i + 1}`, lane: 'ins', ver: v.key, serie: se.code, phase: i,
            title: ph.t, ctx: `${se.name} · ${v.name}`, when: 'Lançamento em ' + fmt(D(se.date)),
            week, resp: M.geral, brief: ph.brief,
            subs: ph.subs.map(([k, t, h]) => [t, M[k], h]),
          });
        });
      });
    });
    let sol = 1;
    for (let w = 1; w <= 53; w++) {
      const k = 1 + Math.floor(rng() * 2.2);
      for (let j = 0; j < k; j++) {
        const [m, occ] = MIN[Math.floor(rng() * MIN.length)];
        const ty = TYPE_KEYS[Math.floor(rng() * TYPE_KEYS.length)];
        add({ id: 'SOL-' + String(sol++).padStart(3, '0'), lane: 'sis', title: `${ty} · ${occ}`, ctx: 'Ministério ' + m, when: 'Pedido pelo formulário',
              week: w, resp: TYPES[ty].resp, req: TYPES[ty].req(occ), reqBy: 'Ministério ' + m, brief: PEDRO_BRIEF_SIS, subs: TYPES[ty].subs });
      }
    }
    // pedidos que chegaram pelo formulário e ainda não têm dono
