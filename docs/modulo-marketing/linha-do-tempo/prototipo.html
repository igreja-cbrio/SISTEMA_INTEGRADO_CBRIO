  const TKEY = 'mkt-linha-2027-v4-tasks';
  let TASKS, BY_ID = {};
  function loadTasks() {
    TASKS = null;
    try { const s = JSON.parse(localStorage.getItem(TKEY) || 'null'); if (s && s.v === 4 && Array.isArray(s.tasks)) TASKS = s.tasks; } catch (e) {}
    if (!TASKS) TASKS = buildData();
    subSeq = TASKS.reduce((m, t) => Math.max(m, ...t.subs.map(s => +s.id.slice(1) || 0)), 0) + 1;
    BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));
  }
  const saveTasks = () => { try { localStorage.setItem(TKEY, JSON.stringify({ v: 4, tasks: TASKS })); } catch (e) {} };
  loadTasks();

  // ---------- estado ----------
  const KEY = 'mkt-linha-2027-v4';
  const state = { profile: 'pedro', open: 'ins', hideDone: true, todayW: 12, tab: 'linha', insMode: 'serie' };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  if (!PROFILES.includes(state.profile)) state.profile = 'pedro';
  if (!(state.todayW >= 1 && state.todayW <= 53)) state.todayW = 12;
  if (state.tab !== 'planner') state.tab = 'linha';
  if (state.insMode !== 'versao') state.insMode = 'serie';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const todayTs = () => { const w = WEEKS[state.todayW - 1]; return Math.min(w.start + 3 * DAY, w.end); };
  const curW = () => state.todayW;
  const isLider = () => !!PEOPLE[state.profile].lider;

  // ---------- regra de visibilidade ----------
  // líder vê a TAREFA · responsável vê a tarefa com todas as subtarefas · demais veem só as subtarefas deles
  function view(t, p) {
    if (t.lane === 'sem') return PEOPLE[p].lider ? { mode: 'task', subs: t.subs, open: t.subs } : null;
    if (PEOPLE[p].lider) return { mode: 'task', subs: t.subs, open: t.subs.filter(s => !s.done) };
    if (t.resp === p)    return { mode: 'branch', subs: t.subs, open: t.subs.filter(s => !s.done) };
    const mine = t.subs.filter(s => s.who === p);
    if (!mine.length) return null;
    return { mode: 'mine', subs: mine, open: mine.filter(s => !s.done) };
  }
  const unitOpen = v => v.mode === 'task' ? (v.open.length ? 1 : 0) : v.open.length;
  const unitTotal = v => v.mode === 'task' ? 1 : v.subs.length;

  function stats(filter, wn) {
    let open = 0, total = 0;
    for (const t of TASKS) {
      if (t.week !== wn || !filter(t)) continue;
      const v = view(t, state.profile); if (!v) continue;
      open += unitOpen(v); total += unitTotal(v);
    }
    return { open, total };
  }
  const inLanes = lanes => t => lanes.includes(t.lane);
  const isLate = (f, w) => w.n < curW() && stats(f, w.n).open > 0;
  function status(f, all) {
    let late = 0, now = 0;
    for (const w of WEEKS) {
      if (!all && w.n > curW()) break;
      const s = stats(f, w.n).open;
      if (w.n < curW()) late += s; else now += s;
    }
    return { late, now, red: late + now > 0 };
  }
  function columns(f) {
    return WEEKS.filter(w => (!state.hideDone || w.n >= curW()) ? true : stats(f, w.n).open > 0);
  }
  function load(p, wn, exclId) {
    let h = 0;
    for (const t of TASKS) { if (t.lane === 'sem' || t.week !== wn || t.id === exclId) continue; for (const s of t.subs) if (s.who === p) h += +s.h || 0; }
    return h;
  }
  const loadCls = (h, cap) => h > cap ? 'over' : h > cap * .85 ? 'warn' : '';

  // ---------- geometria ----------
  const BX = 60, BW = 240, BH = 128, BGAP = 36, TOPY = 250;
  const HY = 150, COLW = 256, SPX = 22, NX = 44, NW = 200;
  const SBX = BX + BW + 70, SBW = 224, SBH = 132;
  let X0 = BX + BW + 100;
  const laneY = i => TOPY + i * (BH + BGAP) + BH / 2;
  const colX = i => X0 + i * COLW;

  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('viewport');
  let CW = 2000, CH = 1000, COLS = [];
  const av = (p, lg) => p ? `<span class="av p-${p} ${lg ? 'lg' : ''}" title="${PEOPLE[p].name}">${PEOPLE[p].ini}</span>` : '';
  const lanesList = () => isLider() ? [...LANES, SEM] : LANES;

  function nodeHtml(t, v, x, i, gi, fut) {
    const lk = t.lane;
    const cls = `abs fx-node l-${lk} ${fut ? 'fut' : ''} ${lk === 'sem' ? 'c-sem' : ''}`;
    const data = `data-node="${t.id}" data-col="${i}" data-g="${gi}" style="left:${x}px;top:0;width:${NW}px"`;
    const total = t.subs.reduce((a, s) => a + (+s.h || 0), 0);
    if (lk === 'sem') {
      return `<button type="button" class="${cls}" data-alloc="${t.id}" ${data}><div class="nd-bar"></div><div class="fx-nd-body">
        <div class="fx-nd-top"><span class="fx-nd-title">${esc(t.title)}</span><span class="fx-nd-val">${t.id}</span></div>
        <div class="fx-nd-sub">${esc(t.ctx)} · quer para ${fmt(t.due)}</div>
        <div class="fx-nd-foot"><span class="fx-nd-cta">Alocar →</span><span>${hrs(total)} estimadas</span></div></div></button>`;
    }
    if (v.mode === 'task') {
      const done = t.subs.length - v.open.length;
      return `<button type="button" class="${cls}" data-open="${t.id}" ${data}><div class="nd-bar"></div><div class="fx-nd-body">
        <div class="fx-nd-top"><span class="fx-nd-title">${esc(t.title)}</span><span class="fx-nd-val">${t.id}</span></div>
        <div class="fx-nd-sub">${esc(t.ctx)}</div>
        <div class="prog"><div class="tr"><i style="width:${Math.round(done / t.subs.length * 100)}%"></i></div><span>${done}/${t.subs.length}</span></div>
        <div class="fx-nd-foot"><span>${hrs(total)} · ${t.subs.length} itens</span>${av(t.resp)}</div></div></button>`;
    }
    const mineH = v.subs.reduce((a, s) => a + (+s.h || 0), 0);
    const tag = v.mode === 'branch' ? '<span class="fx-nd-own">Você é responsável</span>' : `<span>Resp. ${esc(PEOPLE[t.resp] ? PEOPLE[t.resp].first : '')} ${av(t.resp)}</span>`;
    const count = fut ? `${v.subs.length} previstas` : `${v.open.length} de ${v.subs.length} em aberto`;
    return `<div class="${cls}" data-open="${t.id}" ${data}><div class="nd-bar"></div><div class="fx-nd-body">
      <div class="fx-nd-top"><span class="fx-nd-title">${esc(t.title)}</span><span class="fx-nd-val">${t.id}</span></div>
      <div class="fx-nd-sub">${esc(t.ctx)} · ${count}</div>
      <div class="fx-nd-foot">${tag}<button type="button" class="readbtn" data-open="${t.id}">Ler · ${hrs(mineH)}</button></div></div>
      <ul class="subs">${v.open.map(s => `<li><label><input type="checkbox" data-t="${t.id}" data-s="${s.id}"><span>${esc(s.t)}</span></label><span class="h">${hrs(+s.h || 0)}</span>${av(s.who)}</li>`).join('')}</ul></div>`;
  }

  const stText = st => st.red ? [st.late ? `${st.late} atrasada${st.late > 1 ? 's' : ''}` : '', st.now ? `${st.now} nesta semana` : ''].filter(Boolean).join(' · ') : '';

  // cartão de etapa (visão por série): uma faixa por culto, cada faixa é uma tarefa com etiqueta
  function etapaNode(se, pi, strands, x, i, gi, fut) {
    const ph = PHASES[pi], lider = isLider();
    const rows = strands.map(({ V, t, v }) => {
      const done = v.subs.length - v.open.length;
      const cls = !v.open.length ? '' : t.week < curW() ? 'late' : t.week === curW() ? 'now' : 'fut';
      const count = lider ? `${done}/${v.subs.length}` : fut ? `${v.subs.length} previstas` : `${v.open.length} de ${v.subs.length}`;
      const list = !lider && v.open.length ? `<ul class="subs">${v.open.map(s => `<li><label><input type="checkbox" data-t="${t.id}" data-s="${s.id}"><span>${esc(s.t)}</span></label><span class="h">${hrs(+s.h || 0)}</span>${av(s.who)}</li>`).join('')}</ul>` : '';
      return `<div class="strand t-${V.key}"><button type="button" class="sh" data-open="${t.id}" aria-label="Abrir ${ph.t} · ${V.name}"><span class="tag t-${V.key}">${V.name}</span>${av(t.resp)}<span class="mini"><i style="width:${Math.round(done / v.subs.length * 100)}%"></i></span><span class="ct">${count}</span><span class="dot ${cls}"></span></button>${list}</div>`;
    }).join('');
    return `<div class="abs fx-node l-ins ${fut ? 'fut' : ''}" data-node="${se.code}-${pi}" data-etapa="${se.code}|${pi}" data-col="${i}" data-g="${gi}" style="left:${x}px;top:0;width:${NW}px">
      <div class="nd-bar"></div><div class="fx-nd-body"><div class="fx-nd-top"><span class="fx-nd-title">${ph.t}</span><span class="fx-nd-val">${se.code}-0${pi + 1}</span></div>
      <div class="fx-nd-sub">${esc(se.name)} · ${strands.length} ${strands.length > 1 ? 'versões' : 'versão'}</div></div>${rows}</div>`;
  }

  function serieBlock(se, gi) {
    const f = t => t.lane === 'ins' && t.serie === se.code;
    const st = status(f);
    const chips = VERSIONS.map(V => {
      const vf = t => f(t) && t.ver === V.key;
      if (!TASKS.some(t => vf(t) && view(t, state.profile))) return `<span class="off">${V.name}</span>`;
      return `<span class="${status(vf).late ? 'late' : ''}">${V.name}</span>`;
    }).join('');
    const cur = TASKS.filter(t => f(t) && view(t, state.profile) && view(t, state.profile).open.length).sort((a, b) => a.week - b.week)[0];
    const when = cur ? (cur.week < curW() ? 'Atrasada' : cur.week === curW() ? 'Esta semana' : 'Próxima') : '';
    return `<button type="button" class="abs blk vb ${st.red ? 'red' : 'green'}" data-serie="${se.code}" data-sub="${gi}" style="left:${SBX}px;top:0;width:${SBW}px;min-height:118px">
      <span class="k">Lançamento ${fmt(D(se.date))} · sem ${weekOf(D(se.date))}</span><span class="nm">${esc(se.name)}</span><span class="vchips">${chips}</span>
      ${cur ? `<span class="nx">${when}: ${PHASES[cur.phase].t} · sem ${cur.week}</span>` : ''}<span class="st">${stText(st)}</span></button>`;
  }

  function lensText() {
    const p = state.profile, P = PEOPLE[p];
    if (state.tab === 'planner') return P.lider
      ? `<span class="t">Planner do ${P.first}</span>Horas previstas de cada pessoa por semana, somando rotina, séries, solicitações e demandas internas. <b>Amarelo</b> passa de 85% da capacidade e <b>vermelho</b> estoura. Pedidos sem responsável não entram na conta.`
      : `<span class="t">Planner de ${P.first}</span>Suas horas previstas por semana, somando tudo que está no seu nome. Clique numa semana para ver de onde vêm as horas.`;
    const modo = state.insMode === 'serie'
      ? ' Institucionais abre <b>por série</b>: cada etapa tem uma tarefa por culto, com etiqueta CBRio, AMI ou Kids.'
      : ' Institucionais abre <b>por versão</b>: CBRio, AMI e Kids com a própria linha.';
    if (P.lider) return `<span class="t">Visão do ${P.first}</span>Cada demanda aparece como <b>uma tarefa</b>. Clique para ver as subtarefas e editar.${modo} Em <b>Sem responsável</b> ficam os pedidos do formulário que esperam você alocar.`;
    const vs = VERSIONS.filter(v => MATRIX[v.key].geral === p).map(v => v.name);
    return `<span class="t">Visão de ${P.first}</span>${vs.length ? `Responsável geral das etiquetas <b>${vs.join(' e ')}</b>: nelas vê todas as subtarefas.` : ''} No resto, vê só o que está no nome de ${P.first}.${modo} Clique em qualquer cartão para ler a demanda inteira.`;
  }

  function legendHtml() {
    return state.tab === 'planner'
      ? '<span><i class="lg-green" style="background:var(--accent)"></i>Folga</span><span><i class="lg-amber"></i>Acima de 85%</span><span><i class="lg-red"></i>Acima da capacidade</span>'
      : '<span><i class="lg-red"></i>Em aberto até hoje</span><span><i class="lg-green"></i>Em dia</span><span><i class="lg-late"></i>Semana atrasada</span><span><i class="lg-now"></i>Esta semana</span>';
  }

  function weekHeaders(f, withBands) {
    let h = '', lastM = -1;
    COLS.forEach((w, i) => {
      const late = f && isLate(f, w), now = w.n === curW();
      const m = new Date(w.start).getUTCMonth(), mo = m !== lastM ? MONTHS[m] : ''; lastM = m;
      if (withBands && (late || now)) h += `<div class="abs band ${late ? 'late' : 'now'}" data-full style="left:${colX(i) + 4}px;top:${HY - 16}px;width:${COLW - 8}px"></div>`;
      h += `<div class="abs vdiv" data-full style="left:${colX(i)}px;top:${HY - 16}px"></div>`;
      h += `<div class="abs colhead ${late ? 'late' : ''} ${now ? 'now' : ''}" style="left:${colX(i) + SPX}px;top:${HY}px"><i class="mo">${mo}</i><b>Semana ${w.n}</b><span>${fmt(w.start)} – ${fmt(w.end)}</span>${now ? '<em>Esta semana</em>' : late ? '<em>Atrasada</em>' : ''}</div>`;
    });
    h += `<div class="abs vdiv" data-full style="left:${colX(COLS.length)}px;top:${HY - 16}px"></div>`;
    return h;
  }
  const yearHtml = () => `<div class="abs yr" style="left:${BX}px;top:34px"><b>2027</b><span>Marketing · ${state.tab === 'planner' ? 'carga horária' : 'linha do tempo'}</span><em>Dados de exemplo</em></div>`;

  function render() {
    renderBar();
    if (state.tab === 'planner') renderPlanner(); else renderLine();
    save();
  }

  // ---------- linha do tempo ----------
  function renderLine() {
    const LL = lanesList();
    if (state.open === 'sem' && !isLider()) state.open = null;
    const openLane = LL.find(l => l.key === state.open);
    X0 = state.open === 'ins' ? SBX + SBW + 80 : BX + BW + 100;
    const f = inLanes(openLane ? [openLane.key] : LL.map(l => l.key));
    COLS = columns(f);
    CW = colX(COLS.length) + 160;

    // grupos: Institucionais abre em CBRio · AMI · Kids; as outras frentes têm um grupo só
    // Por série: um quadrado por série, as pendências mais próximas em cima
    let groups = [];
    if (openLane) {
      if (openLane.key !== 'ins') groups = [{}];
      else if (state.insMode === 'versao') groups = VERSIONS.filter(v => TASKS.some(t => t.lane === 'ins' && t.ver === v.key && view(t, state.profile))).map(v => ({ ver: v }));
      else groups = SERIES.map(se => {
        let first = Infinity, any = false;
        TASKS.forEach(t => { if (t.lane !== 'ins' || t.serie !== se.code) return; const v = view(t, state.profile); if (!v) return; any = true; if (v.open.length) first = Math.min(first, t.week); });
        return { serie: se, first, any };
      }).filter(g => g.any && (g.first < Infinity || !state.hideDone)).sort((a, b) => a.first - b.first || D(a.serie.date) - D(b.serie.date));
    }
    let h = '<svg class="fx-edges" id="edges"></svg>' + yearHtml() + weekHeaders(f, true);
    LL.forEach((l, i) => {
      const st = status(inLanes([l.key]), l.key === 'sem');
      const exp = state.open === l.key;
      let stTxt = st.red ? [st.late ? `${st.late} atrasada${st.late > 1 ? 's' : ''}` : '', st.now ? `${st.now} nesta semana` : ''].filter(Boolean).join(' · ') : '';
      if (l.key === 'sem') { const n = TASKS.filter(t => t.lane === 'sem').length; stTxt = n ? `${n} aguardando${st.late ? ` · ${st.late} com data vencida` : ''}` : ''; }
      h += `<button type="button" class="abs blk ${st.red ? 'red' : 'green'} ${exp ? 'exp' : ''} ${l.key === 'sem' ? 'sem' : ''}" data-lane="${l.key}" aria-expanded="${exp}" style="left:${BX}px;top:${TOPY + i * (BH + BGAP)}px;width:${BW}px;height:${BH}px">
        <span class="ar">→</span><span class="k">${l.key === 'sem' ? 'Caixa de entrada' : 'Frente ' + (i + 1)}</span><span class="nm">${l.name}</span><span class="ds">${l.desc}</span><span class="st">${stTxt}</span></button>`;
    });
    h += `<div class="abs note" style="left:${BX}px;top:${TOPY + LL.length * (BH + BGAP) + 6}px;width:${BW}px">${lensText()}</div>`;

    groups.forEach((g, gi) => {
      if (g.serie) {
        h += serieBlock(g.serie, gi);
        COLS.forEach((w, i) => PHASES.forEach((ph, pi) => {
          const strands = VERSIONS.map(V => {
            const t = BY_ID[`${g.serie.code}-${V.V}-0${pi + 1}`];
            if (!t || t.week !== w.n) return null;
            const v = view(t, state.profile); return v ? { V, t, v } : null;
          }).filter(Boolean);
          if (strands.some(s => s.v.open.length)) h += etapaNode(g.serie, pi, strands, colX(i) + NX, i, gi, w.n > curW());
        }));
        return;
      }
      if (g.ver) {
        const vf = t => t.lane === 'ins' && t.ver === g.ver.key;
        const st = status(vf);
        let dn = 0, tot = 0;
        TASKS.forEach(t => { if (!vf(t) || t.week > curW()) return; const v = view(t, state.profile); if (!v) return; tot += unitTotal(v); dn += unitTotal(v) - unitOpen(v); });
        const nxt = TASKS.filter(t => vf(t) && t.week >= curW() && view(t, state.profile) && view(t, state.profile).open.length).sort((a, b) => a.week - b.week)[0];
        const stTxt = st.red ? [st.late ? `${st.late} atrasada${st.late > 1 ? 's' : ''}` : '', st.now ? `${st.now} nesta semana` : ''].filter(Boolean).join(' · ') : '';
        h += `<button type="button" class="abs blk vb ${st.red ? 'red' : 'green'}" data-ver="${g.ver.key}" data-sub="${gi}" style="left:${SBX}px;top:0;width:${SBW}px;min-height:${SBH}px">
          <span class="k">${g.ver.desc} · resp. ${PEOPLE[MATRIX[g.ver.key].geral].first}</span><span class="nm">${g.ver.name}</span>
          <span class="pg"><i style="width:${tot ? Math.round(dn / tot * 100) : 100}%"></i></span>
          <span class="nx">${tot ? Math.round(dn / tot * 100) + '% do que vencia até hoje está feito' : ''}</span>
          ${nxt ? `<span class="nx">Próximo: ${esc(nxt.ctx.split(' · ')[0])} · ${nxt.title} · sem ${nxt.week}</span>` : ''}
          <span class="st">${stTxt}</span></button>`;
      }
      COLS.forEach((w, i) => {
        TASKS.filter(t => t.lane === openLane.key && t.week === w.n && (!g.ver || t.ver === g.ver.key)).forEach(t => {
          const v = view(t, state.profile);
          if (v && v.open.length) h += nodeHtml(t, v, colX(i) + NX, i, gi, w.n > curW() && t.lane !== 'sem');
        });
      });
    });
    canvas.innerHTML = h;

    // posiciona: cada grupo ganha uma faixa com a altura da maior pilha de cards
    CH = TOPY + LL.length * (BH + BGAP) + 300;
    const edges = [], spines = [];
    if (openLane) {
      const li = LL.indexOf(openLane);
      const byG = groups.map(() => ({}));
      canvas.querySelectorAll('[data-node]').forEach(el => (byG[+el.dataset.g][el.dataset.col] ||= []).push(el));
      const GAP = 18;
      const stackH = els => els.reduce((a, e) => a + e.offsetHeight, 0) + GAP * (els.length - 1);
      const bands = byG.map((cols, gi) => {
        let m = 0; Object.values(cols).forEach(els => m = Math.max(m, stackH(els)));
        const sub = canvas.querySelector(`[data-sub="${gi}"]`);
        return Math.max(m, sub ? sub.offsetHeight : 0, 60);
      });
      const GG = 56, totalH = bands.reduce((a, b) => a + b, 0) + GG * (bands.length - 1);
      let top = Math.max(HY + 100, laneY(li) - totalH / 2);
      byG.forEach((cols, gi) => {
        const yc = groups[0].ver || groups[0].serie ? top + bands[gi] / 2 : laneY(li);
        const sub = canvas.querySelector(`[data-sub="${gi}"]`);
        if (sub) sub.style.top = (yc - sub.offsetHeight / 2) + 'px';
        spines.push({ yc, x0: sub ? SBX + SBW : BX + BW });
        Object.entries(cols).forEach(([ci, els]) => {
          let y = Math.max(HY + 100, yc - stackH(els) / 2);
          els.forEach(el => {
            el.style.top = y + 'px';
            edges.push({ ci: +ci, gi, id: el.dataset.node, ty: y + 30, fut: el.classList.contains('fut') });
            y += el.offsetHeight + GAP; CH = Math.max(CH, y + 120);
          });
        });
        top += bands[gi] + GG; CH = Math.max(CH, top + 80);
      });
      drawEdges(li, spines, edges, groups);
    } else drawEdges(-1);
    canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
    canvas.querySelectorAll('[data-full]').forEach(el => el.style.height = (CH - HY - 10) + 'px');
    const svg = document.getElementById('edges'); svg.setAttribute('width', CW); svg.setAttribute('height', CH);
  }

  const orth = (sx, sy, tx, ty, mx, r = 10) => {
    if (Math.abs(ty - sy) < 2) return `M${sx},${sy} L${tx},${ty}`;
    const d = ty > sy ? 1 : -1;
    return `M${sx},${sy} L${mx - r},${sy} Q${mx},${sy} ${mx},${sy + d * r} L${mx},${ty - d * r} Q${mx},${ty} ${mx + r},${ty} L${tx},${ty}`;
  };

  function drawEdges(li, spines, edges, groups) {
    const svg = document.getElementById('edges');
    if (li < 0 || !spines.length) { svg.innerHTML = ''; return; }
    const lk = 'l-' + state.open;
    const xNow = COLS.findIndex(w => w.n > curW());
    const splitX = xNow < 0 ? colX(COLS.length) : colX(xNow) + SPX;
    const xEnd = colX(COLS.length) - 20;
    let s = '';
    const multi = groups[0] && (groups[0].ver || groups[0].serie);
    spines.forEach((sp, gi) => {
      if (multi) s += `<path class="${lk} spine" d="${orth(BX + BW, laneY(li), SBX, sp.yc, BX + BW + 34)}"/>`;
      s += `<path class="${lk} spine" d="M${sp.x0},${sp.yc} L${Math.min(splitX, xEnd)},${sp.yc}"/>`;
      if (splitX < xEnd && state.open !== 'sem') s += `<path class="${lk} spine fut" d="M${splitX},${sp.yc} L${xEnd},${sp.yc}"/>`;
      else if (splitX < xEnd) s += `<path class="${lk} spine" d="M${splitX},${sp.yc} L${xEnd},${sp.yc}"/>`;
    });
    edges.forEach(e => {
      const yc = spines[e.gi].yc, sx = colX(e.ci) + SPX, tx = colX(e.ci) + NX, ty = e.ty, r = 9;
      let d;
      if (Math.abs(ty - yc) < 2) d = `M${sx},${yc} L${tx},${ty}`;
      else { const dir = ty > yc ? 1 : -1; d = `M${sx},${yc} L${sx},${ty - dir * r} Q${sx},${ty} ${sx + r},${ty} L${tx},${ty}`; }
      s += `<path class="${lk} br ${e.fut ? 'fut' : ''}" data-n="${e.id}" d="${d}"/>`;
    });
    spines.forEach((sp, gi) => {
      const g = groups[gi];
      const f = t => t.lane === state.open && (!g.ver || t.ver === g.ver.key) && (!g.serie || t.serie === g.serie.code);
      COLS.forEach((w, i) => {
        const cls = w.n > curW() && state.open !== 'sem' ? 'fut' : isLate(f, w) ? 'late' : '';
        s += `<circle class="${lk} ${cls}" cx="${colX(i) + SPX}" cy="${sp.yc}" r="${w.n === curW() ? 7 : 5}"/>`;
      });
    });
    svg.innerHTML = s;
  }

  // ---------- planner ----------
  function renderPlanner() {
    X0 = BX + BW + 100;
    COLS = WEEKS.slice();
    CW = colX(COLS.length) + 160;
    const rows = isLider() ? TEAM : [state.profile];
    const PH = 112, PG = 22;
    let h = '<svg class="fx-edges" id="edges"></svg>' + yearHtml() + weekHeaders(null, true);
    rows.forEach((p, ri) => {
      const top = TOPY + ri * (PH + PG), cap = PEOPLE[p].cap;
      const now = load(p, curW());
      h += `<div class="abs pp ld ${loadCls(now, cap)}" style="left:${BX}px;top:${top}px;width:${BW}px;height:${PH}px">${av(p, true)}<span class="nm">${PEOPLE[p].name}</span><span class="rl">${PEOPLE[p].role} · ${cap}h/sem</span>
        <span class="wk"><span>Esta semana</span><span>${hrs(now)} de ${cap}h</span></span><span class="bar"><i style="width:${Math.min(100, now / cap * 100)}%"></i></span></div>`;
      COLS.forEach((w, i) => {
        const hh = load(p, w.n);
        if (!hh) return;   // semana sem horas fica em branco
        const n = TASKS.filter(t => t.lane !== 'sem' && t.week === w.n && t.subs.some(s => s.who === p)).length;
        h += `<button type="button" class="abs pc ld ${loadCls(hh, cap)}" data-cell="${p}|${w.n}" style="left:${colX(i) + 14}px;top:${top + 6}px;width:${COLW - 28}px;height:${PH - 12}px">
          <span class="n"><b>${hrs(hh)}</b><span>de ${cap}h</span></span><span class="tr"><i style="width:${Math.min(100, hh / cap * 100)}%"></i></span>
          <span class="it">${n} demanda${n > 1 ? 's' : ''}${hh > cap ? ` · ${hrs(hh - cap)} acima` : ''}</span></button>`;
      });
    });
    const bottom = TOPY + rows.length * (PH + PG);
    h += `<div class="abs note" style="left:${BX}px;top:${bottom + 6}px;width:${BW}px">${lensText()}</div>`;
    canvas.innerHTML = h;
    CH = bottom + 320;
    canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
    canvas.querySelectorAll('[data-full]').forEach(el => el.style.height = (CH - HY - 10) + 'px');
  }

  // destaque ao passar o mouse, como no fluxograma do atlas
  canvas.addEventListener('mouseover', e => {
    const n = e.target.closest('[data-node]'); if (!n) return;
    const id = n.dataset.node;
    canvas.querySelectorAll('[data-node]').forEach(o => o.classList.toggle('dim', o !== n));
    canvas.querySelectorAll('.fx-edges .br').forEach(p => { p.classList.toggle('hot', p.dataset.n === id); p.classList.toggle('dim', p.dataset.n !== id); });
  });
  canvas.addEventListener('mouseout', e => {
    const n = e.target.closest('[data-node]'); if (!n || n.contains(e.relatedTarget)) return;
    canvas.querySelectorAll('.dim, .hot').forEach(o => o.classList.remove('dim', 'hot'));
  });

  // ---------- barra ----------
  function renderBar() {
    document.getElementById('who').innerHTML = PROFILES.map(p =>
      `<button type="button" data-p="${p}" aria-pressed="${state.profile === p}" title="${PEOPLE[p].role}">${PEOPLE[p].name}</button>`).join('');
    document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === state.tab));
    document.getElementById('todayOut').textContent = fmt(todayTs()) + ' · sem ' + state.todayW;
    document.getElementById('today').value = state.todayW;
    document.getElementById('hideDone').checked = state.hideDone;
    document.getElementById('hideWrap').hidden = state.tab === 'planner';
    document.getElementById('imWrap').hidden = state.tab === 'planner';
    document.querySelectorAll('#insMode [data-im]').forEach(b => b.setAttribute('aria-pressed', b.dataset.im === state.insMode));
    document.getElementById('btnNova').hidden = !isLider();
    document.getElementById('legend').innerHTML = legendHtml();
    document.getElementById('hint').textContent = state.tab === 'planner'
      ? 'Arraste o fundo pra mover · scroll pra zoom · clique numa semana pra ver de onde vêm as horas'
      : 'Arraste o fundo pra mover · scroll pra zoom · clique num quadrado pra abrir a linha do tempo';
  }

  // ---------- pan / zoom (mesma mecânica do /atlas/fluxograma) ----------
  let zoom = 1, panX = 0, panY = 0;
  const zoomLbl = document.getElementById('zoomLbl');
  const clampZ = z => Math.max(0.2, Math.min(2, z));
  function applyT() { canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; zoomLbl.textContent = Math.round(zoom * 100) + '%'; }
  function zoomAt(nz, cx, cy) { nz = clampZ(nz); panX = cx - (cx - panX) * (nz / zoom); panY = cy - (cy - panY) * (nz / zoom); zoom = nz; applyT(); }
  function fit() { const vw = viewport.clientWidth - 40, vh = viewport.clientHeight - 40; zoom = clampZ(Math.min(1, vw / CW, vh / CH)); panX = 20; panY = 20; applyT(); }
  function start() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    zoom = clampZ(Math.min(0.9, vw / (BX + BW + 100 + 4 * COLW + 40), vh / (TOPY + 5 * (BH + BGAP) + 160)));
    panX = 16 - 20 * zoom; panY = 12; applyT();
  }
  function goToday() { const i = COLS.findIndex(w => w.n === curW()); if (i < 0) return; panX = viewport.clientWidth / 2 - (colX(i) + COLW / 2) * zoom; applyT(); }
  viewport.addEventListener('wheel', e => { e.preventDefault(); const r = viewport.getBoundingClientRect(); zoomAt(zoom * (1 - e.deltaY * 0.0014), e.clientX - r.left, e.clientY - r.top); }, { passive: false });

  const pts = new Map(); let panStart = null, pinch = null, moved = false;
  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('input, label, .fx-hint')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (pts.size === 1) panStart = { x: e.clientX - panX, y: e.clientY - panY, ox: e.clientX, oy: e.clientY };
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()], r = viewport.getBoundingClientRect();
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom, cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top }; panStart = null;
    }
  });
  window.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, pinch.cx, pinch.cy); moved = true; }
    else if (panStart) {
      if (!moved && Math.hypot(e.clientX - panStart.ox, e.clientY - panStart.oy) < 5) return;
      moved = true; viewport.classList.add('panning'); panX = e.clientX - panStart.x; panY = e.clientY - panStart.y; applyT();
    }
  });
  function endPtr(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { panStart = null; viewport.classList.remove('panning'); } }
  window.addEventListener('pointerup', endPtr);
  window.addEventListener('pointercancel', endPtr);
  viewport.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);

  // ---------- modais ----------
  const scrim = document.getElementById('scrim'), modal = document.getElementById('modal');
  let modalKind = null, modalArg = null, lastFocus = null;
  function showModal(kind, arg) {
    if (scrim.hidden) lastFocus = document.activeElement;
    modalKind = kind; modalArg = arg; paintModal(); scrim.hidden = false;
    const f = modal.querySelector('[data-autofocus]') || modal.querySelector('[data-close]'); if (f) f.focus();
  }
  function paintModal() {
    if (modalKind === 'task') taskModal(BY_ID[modalArg]);
    else if (modalKind === 'ver') verModal(modalArg);
    else if (modalKind === 'serie') serieModal(modalArg);
    else if (modalKind === 'etapa') etapaModal(modalArg);
    else if (modalKind === 'cell') cellModal(modalArg);
    else if (modalKind === 'matriz') matrixModal();
    else if (modalKind === 'edit') editorModal();
  }
  function closeModal() { scrim.hidden = true; modalKind = null; ed = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
  const weekTxt = w => `Semana ${w.n} · ${fmt(w.start)} – ${fmt(w.end)}`;

  function taskModal(t) {
    const p = state.profile, v = view(t, p) || { mode: 'task', subs: t.subs };
    const w = WEEKS[t.week - 1], done = t.subs.filter(s => s.done).length, total = t.subs.reduce((a, s) => a + (+s.h || 0), 0);
    const tag = s => s.done ? '' : t.week < curW() ? '<span class="pill lt">Atrasada</span>' : t.week === curW() ? '<span class="pill op">Esta semana</span>' : '';
    const list = v.subs;
    const mineH = v.mode === 'mine' ? list.reduce((a, s) => a + (+s.h || 0), 0) : 0;
    const req = t.req ? `<div class="m-sec"><h3>Pedido original</h3><p class="quote">${esc(t.req)}<small>${esc(t.reqBy || '')} · pelo formulário</small></p></div>` : '';
    const brief = t.brief ? `<div class="m-sec"><h3>${t.lane === 'ins' ? 'O que esta etapa entrega' : 'O que o Pedro espera'}</h3><p>${esc(t.brief)}</p></div>` : '';
    const mine = v.mode === 'mine' ? `<div class="m-sec"><div class="mine-h"><b>${hrs(mineH)}</b> previstas para você nesta demanda</div></div>` : '';
    modal.className = 'modal l-' + t.lane;
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">${t.id} · ${LANE_NAME[t.lane]}</span><h2 id="mTitle">${esc(t.title)}</h2><span class="ctx">${esc(t.ctx)} · ${esc(t.when)}</span>
      <div class="m-facts"><span><b>Semana</b>${weekTxt(w)}</span><span><b>Entrega</b>${fmt(t.due)}</span><span><b>Responsável</b>${t.resp ? PEOPLE[t.resp].name : 'ninguém ainda'}</span>${isLider() || v.mode === 'branch' ? `<span><b>Horas</b>${hrs(total)}</span><span><b>Feito</b>${done} de ${t.subs.length}</span>` : ''}</div></div>
      ${mine}${brief}${req}
      <div class="m-sec"><h3>${v.mode === 'mine' ? 'Suas subtarefas' : 'Subtarefas'}</h3></div>
      <ul class="m-list">${list.map(s => `<li class="${s.done ? 'is-done' : ''}"><label><input type="checkbox" data-t="${t.id}" data-s="${s.id}" ${s.done ? 'checked' : ''}><span class="sn">${esc(s.t)}</span></label><span class="h">${hrs(+s.h || 0)}</span><span class="who-n">${s.who ? PEOPLE[s.who].first : ''}</span>${tag(s)}</li>`).join('')}</ul>
      <div class="m-ft"><span>${isLider() ? 'No quadro você vê só a tarefa. As subtarefas ficam aqui.' : 'O que você marca sai do quadro e continua listado aqui.'}</span>
      <span class="acts">${isLider() && t.lane !== 'rot' ? `<button type="button" class="fx-btn" data-edit="${t.id}">Editar</button>` : ''}<button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  function chipHtml(t, ph) {
    if (!t) return `<span class="chip fut">${ph.short}<small>em 2026</small></span>`;
    const v = view(t, state.profile);
    if (!v) return '<span class="chip none"></span>';
    const open = v.open.length;
    const cls = !open ? 'ok' : t.week < curW() ? 'late' : t.week === curW() ? 'now' : 'fut';
    return `<button type="button" class="chip ${cls}" data-open="${t.id}">${ph.short}<small>sem ${t.week}${open && cls !== 'fut' ? ` · ${open} aberta${open > 1 ? 's' : ''}` : ''}</small></button>`;
  }

  function serieModal(code) {
    const se = SERIE_BY[code];
    const rows = VERSIONS.map(V => {
      const ts = PHASES.map((ph, i) => BY_ID[`${code}-${V.V}-0${i + 1}`]);
      if (!ts.some(t => t && view(t, state.profile))) return '';
      return `<div class="srow"><div class="hd"><b><span class="tag t-${V.key}">${V.name}</span> ${PEOPLE[MATRIX[V.key].geral].name}</b><span>${V.desc}</span></div><div class="chips">${PHASES.map((ph, i) => chipHtml(ts[i], ph)).join('')}</div></div>`;
    }).join('');
    modal.className = 'modal wide l-ins';
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">Institucionais · série de ${MONTHS[new Date(D(se.date)).getUTCMonth()].toLowerCase()}</span><h2 id="mTitle">${esc(se.name)}: como está indo</h2>
      <span class="ctx">Lançamento ${fmt(D(se.date))}. O ciclo é o mesmo para os três cultos; cada etapa tem uma tarefa por etiqueta.</span></div>
      <div class="m-sec">${rows}</div>
      <div class="m-ft"><span>Verde feito · vermelho atrasado · contorno esta semana · tracejado previsto. Clique numa etapa para abrir.</span><span class="acts"><button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  function etapaModal(arg) {
    const [code, pis] = arg.split('|'), pi = +pis, se = SERIE_BY[code], ph = PHASES[pi];
    const cols = VERSIONS.map(V => {
      const t = BY_ID[`${code}-${V.V}-0${pi + 1}`];
      const hd = `<div class="ch"><span class="tag t-${V.key}">${V.name}</span>`;
      if (!t) return `<div class="c">${hd}</div><span class="off">Aconteceu em 2026</span></div>`;
      const v = view(t, state.profile);
      if (!v) return `<div class="c">${hd}</div><span class="off">Fora da sua etiqueta</span></div>`;
      const done = t.subs.filter(s => s.done).length;
      return `<div class="c">${hd}<span>${av(t.resp)} ${PEOPLE[t.resp].first} · ${done}/${t.subs.length}</span></div>
        <div class="ch"><span>Semana ${t.week} · entrega ${fmt(t.due)}</span></div>
        <ul>${v.subs.map(s => `<li class="${s.done ? 'is-done' : ''}"><label><input type="checkbox" data-t="${t.id}" data-s="${s.id}" ${s.done ? 'checked' : ''}><span class="sn">${esc(s.t)}</span></label><span class="h">${hrs(+s.h || 0)}</span>${av(s.who)}</li>`).join('')}</ul>
        <button type="button" class="fx-btn" data-open="${t.id}">Abrir tarefa ${V.name}</button></div>`;
    }).join('');
    modal.className = 'modal wide l-ins';
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">${code}-0${pi + 1} · Institucionais · ${esc(se.name)}</span><h2 id="mTitle">${ph.t}</h2><span class="ctx">${esc(ph.brief)}</span></div>
      <div class="cols3">${cols}</div>
      <div class="m-ft"><span>Mesma etapa, uma tarefa por culto. Cada pessoa vê a tarefa da sua etiqueta.</span><span class="acts"><button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  function verModal(vk) {
    const V = VERSIONS.find(v => v.key === vk), M = MATRIX[vk];
    const rows = SERIES.map(se => `<div class="srow"><div class="hd"><b>${esc(se.name)}</b><span>lançamento ${fmt(D(se.date))}</span></div><div class="chips">${PHASES.map((ph, i) => chipHtml(BY_ID[`${se.code}-${V.V}-0${i + 1}`], ph)).join('')}</div></div>`).join('');
    modal.className = 'modal wide l-ins';
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">Institucionais · ${V.desc}</span><h2 id="mTitle">${V.name}: como está indo</h2>
      <div class="m-facts"><span><b>Responsável geral</b>${PEOPLE[M.geral].name}</span><span><b>Roteiro</b>${PEOPLE[M.roteiro].name}</span><span><b>Post nas redes</b>${PEOPLE[M.post].name}</span></div></div>
      <div class="m-sec">${rows}</div>
      <div class="m-ft"><span>Verde feito · vermelho atrasado · contorno esta semana · tracejado previsto. Clique numa etapa para abrir.</span><span class="acts"><button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  function cellModal(arg) {
    const [p, wn] = arg.split('|'), w = WEEKS[+wn - 1], cap = PEOPLE[p].cap;
    const items = TASKS.filter(t => t.lane !== 'sem' && t.week === +wn && t.subs.some(s => s.who === p))
      .map(t => ({ t, h: t.subs.filter(s => s.who === p).reduce((a, s) => a + (+s.h || 0), 0) })).sort((a, b) => b.h - a.h);
    const tot = items.reduce((a, x) => a + x.h, 0);
    modal.className = 'modal';
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">Planner · ${weekTxt(w)}</span><h2 id="mTitle">${PEOPLE[p].name}: ${hrs(tot)} de ${cap}h</h2>
      <span class="ctx">${tot > cap ? `${hrs(tot - cap)} acima da capacidade. Vale mover alguma demanda de semana ou trocar o responsável.` : `${hrs(cap - tot)} livres nesta semana.`}</span></div>
      <ul class="m-list" style="padding-top:12px">${items.map(x => `<li class="row-btn l-${x.t.lane}" data-open="${x.t.id}"><span class="ro"><b>${esc(x.t.title)}</b><br><span class="who-n">${x.t.id} · ${LANE_NAME[x.t.lane]} · ${esc(x.t.ctx)}</span></span><span class="h">${hrs(x.h)}</span></li>`).join('')}</ul>
      <div class="m-ft"><span>Clique numa demanda para abrir${isLider() ? ' e editar' : ''}.</span><span class="acts"><button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  function matrixModal() {
    const who = p => `<span class="p">${av(p)}${PEOPLE[p].first}</span>`;
    let rows = `<tr class="geral"><td>Responsável geral</td>${VERSIONS.map(v => `<td>${who(MATRIX[v.key].geral)}</td>`).join('')}</tr>`;
    PHASES.forEach(ph => {
      rows += `<tr><td class="ph" colspan="4">${ph.t}</td></tr>`;
      ph.subs.forEach(([k, t]) => rows += `<tr><td>${t}</td>${VERSIONS.map(v => `<td>${who(MATRIX[v.key][k])}</td>`).join('')}</tr>`);
    });
    const none = TEAM.map(p => ({ p, vs: VERSIONS.filter(v => !Object.entries(MATRIX[v.key]).some(([k, x]) => k !== 'geral' && x === p)).map(v => v.name) })).filter(x => x.vs.length && x.vs.length < 3);
    modal.className = 'modal wide l-ins';
    modal.innerHTML = `<div class="nd-bar"></div><div class="m-hd"><span class="id">Institucionais · toda série tem versão CBRio, AMI e Kids</span><h2 id="mTitle">Quem faz o quê no ciclo criativo</h2>
      <span class="ctx">${none.map(x => `${PEOPLE[x.p].first} não tem tarefa em ${x.vs.join(' e ')}.`).join(' ')}</span></div>
      <div class="mtx-wrap"><table class="mtx"><thead><tr><th>Item</th>${VERSIONS.map(v => `<th>${v.name}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="m-ft"><span>Cada série nova nasce nas 3 versões com estas pessoas. No sistema, esta tabela vira configuração do Pedro.</span><span class="acts"><button type="button" class="fx-btn" data-close>Fechar</button></span></div>`;
  }

  // ---------- editor do Pedro: alocar, criar e editar ----------
  let ed = null;
  function openEditor(mode, id) {
    const t = id ? BY_ID[id] : null;
    const draft = t
      ? { title: t.title, lane: mode === 'alloc' ? 'sis' : t.lane, due: t.due, resp: t.resp || t.sug || '', brief: t.brief || '',
          items: t.subs.map(s => ({ id: s.id, t: s.t, who: s.who || '', h: +s.h || 0, done: s.done })) }
      : { title: '', lane: 'int', due: wEnd(Math.min(53, curW() + 1)), resp: '', brief: '', items: [{ t: '', who: '', h: 2, done: false }] };
    ed = { mode, id, draft, err: '' };
    showModal('edit');
  }
  const opts = (sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + TEAM.map(p => `<option value="${p}" ${sel === p ? 'selected' : ''}>${PEOPLE[p].name}</option>`).join('');
  function editorModal() {
    const t = ed.id ? BY_ID[ed.id] : null, d = ed.draft;
    const head = { alloc: 'Alocar demanda', new: 'Nova tarefa', edit: 'Editar tarefa' }[ed.mode];
    const laneFld = ed.mode === 'new'
      ? `<select id="ed-lane"><option value="int" ${d.lane === 'int' ? 'selected' : ''}>Interno</option><option value="sis" ${d.lane === 'sis' ? 'selected' : ''}>Sistema</option></select>`
      : `<div class="ro">${LANE_NAME[d.lane]}</div>`;
    modal.className = 'modal wide l-' + (ed.mode === 'alloc' ? 'sem' : d.lane);
    modal.innerHTML = `<div class="nd-bar"></div><form id="ed" novalidate><div class="m-hd"><span class="id">${t ? t.id + ' · ' + esc(t.ctx) : 'Criada pelo Pedro'}</span><h2 id="mTitle">${head}</h2></div>
      ${t && t.req ? `<div class="req"><b>Pedido original</b>${esc(t.req)}<small>${esc(t.reqBy || '')} · pediu para ${fmt(t.due)}</small></div>` : ''}
      <div class="ed-body">
        <label class="fld"><span>Título</span><input id="ed-title" value="${esc(d.title)}" data-autofocus></label>
        <div class="row2"><div class="fld"><span>Frente</span>${laneFld}</div>
          <label class="fld"><span>Entrega</span><input type="date" id="ed-due" min="2027-01-01" max="2027-12-31" value="${iso(d.due)}"></label></div>
        <div class="wkinfo" id="ed-wk"></div>
        <label class="fld"><span>Responsável</span><select id="ed-resp">${opts(d.resp, 'Escolha quem vai tocar')}</select></label>
        <label class="fld"><span>O que você espera de quem vai fazer</span><textarea id="ed-brief" rows="3" placeholder="Ex.: seguir a identidade da série, mandar primeira versão na quarta">${esc(d.brief)}</textarea></label>
        <div class="fld"><span>Checklist · quem faz · horas na semana</span><div class="items" id="ed-items"></div><div><button type="button" class="fx-btn" data-ed="add">+ Adicionar item</button></div></div>
        <div class="fld"><span>Carga da semana com esta demanda</span><div class="loads" id="ed-load"></div></div>
        <p class="ed-err" id="ed-err" ${ed.err ? '' : 'hidden'}>${esc(ed.err)}</p>
      </div>
      <div class="m-ft"><span></span><span class="acts"><button type="button" class="fx-btn" data-close>Cancelar</button><button type="submit" class="fx-btn primary" id="ed-submit"></button></span></div></form>`;
    paintItems(); paintLoad();
  }
  function paintItems() {
    document.getElementById('ed-items').innerHTML = ed.draft.items.map((it, i) => `<div class="it" data-i="${i}">
      <input class="it-t" aria-label="Item ${i + 1}" placeholder="O que precisa ser feito" value="${esc(it.t)}">
      <select class="it-w" aria-label="Quem faz o item ${i + 1}">${opts(it.who, 'Quem faz')}</select>
      <input class="it-h" type="number" min="0" max="60" step="0.5" aria-label="Horas do item ${i + 1}" value="${it.h}">
      <button type="button" class="x" data-ed="rm" data-i="${i}" aria-label="Remover item ${i + 1}">×</button></div>`).join('') || '<span class="ed-empty">Nenhum item. Adicione pelo menos um.</span>';
  }
  function readForm() {
    const d = ed.draft, g = id => document.getElementById(id);
    d.title = g('ed-title').value; d.brief = g('ed-brief').value; d.resp = g('ed-resp').value;
    if (g('ed-lane')) d.lane = g('ed-lane').value;
    const dv = g('ed-due').value; if (dv) d.due = D(dv);
    document.querySelectorAll('#ed-items .it').forEach(row => {
      const it = d.items[+row.dataset.i];
      it.t = row.querySelector('.it-t').value; it.who = row.querySelector('.it-w').value; it.h = Math.max(0, parseFloat(row.querySelector('.it-h').value) || 0);
    });
  }
  function paintLoad() {
    const d = ed.draft, wn = weekOf(d.due), w = WEEKS[wn - 1];
    document.getElementById('ed-wk').textContent = weekTxt(w) + (wn < curW() ? ' · já passou' : wn === curW() ? ' · esta semana' : '');
    const ppl = [...new Set([d.resp, ...d.items.map(i => i.who)].filter(Boolean))];
    document.getElementById('ed-load').innerHTML = ppl.length ? ppl.map(p => {
      const cap = PEOPLE[p].cap, base = load(p, wn, ed.mode === 'new' ? null : ed.id), add = d.items.filter(i => i.who === p).reduce((a, i) => a + i.h, 0), tot = base + add;
      const bw = Math.min(100, base / cap * 100), aw = Math.max(0, Math.min(100, tot / cap * 100) - bw);
      return `<div class="lrow ld ${loadCls(tot, cap)}">${av(p)}<span>${PEOPLE[p].first}</span><span class="tr"><i style="left:0;width:${bw}%"></i><i class="add" style="left:${bw}%;width:${aw}%"></i></span>
        <span class="v">${hrs(base)} + ${hrs(add)} = ${hrs(tot)} de ${cap}h</span></div>`;
    }).join('') : '<span class="ed-empty">Escolha o responsável e quem faz cada item para ver a carga.</span>';
    const btn = document.getElementById('ed-submit');
    btn.textContent = ed.mode === 'alloc' ? (d.resp ? `Alocar para ${PEOPLE[d.resp].first}` : 'Alocar') : ed.mode === 'new' ? 'Criar tarefa' : 'Salvar';
  }
  function submitEditor() {
    readForm();
    const d = ed.draft, bad = m => { ed.err = m; const e = document.getElementById('ed-err'); e.textContent = m; e.hidden = false; };
    const items = d.items.filter(i => i.t.trim());
    if (!d.title.trim()) return bad('Dê um título para a demanda.');
    if (!(d.due >= START && d.due <= END)) return bad('Escolha uma data de entrega dentro de 2027.');
    if (!d.resp) return bad('Escolha quem é o responsável.');
    if (!items.length) return bad('Adicione pelo menos um item no checklist.');
    if (items.some(i => !i.who)) return bad('Todo item do checklist precisa de alguém para fazer.');
    let t = ed.id ? BY_ID[ed.id] : null;
    if (!t) {
      const pre = d.lane === 'int' ? 'INT-' : 'SOL-';
      const next = TASKS.filter(x => x.id.startsWith(pre)).reduce((m, x) => Math.max(m, parseInt(x.id.slice(4), 10) || 0), 0) + 1;
      t = { id: pre + (pre === 'INT-' ? pad(next) : String(next).padStart(3, '0')), lane: d.lane, ctx: d.lane === 'int' ? 'Demanda do Pedro' : 'Pedido do Pedro', when: 'Registrada pelo Pedro', subs: [] };
      TASKS.push(t); BY_ID[t.id] = t;
    }
    t.title = d.title.trim(); t.brief = d.brief.trim(); t.resp = d.resp; t.due = d.due; t.week = weekOf(d.due);
    if (ed.mode === 'alloc') { t.lane = 'sis'; delete t.sug; }
    t.subs = items.map(i => ({ id: i.id || 's' + (subSeq++), t: i.t.trim(), who: i.who, h: i.h, done: !!i.done }));
    saveTasks();
    const msg = ed.mode === 'alloc' ? `${t.id} alocada para ${PEOPLE[t.resp].first} · semana ${t.week}` : ed.mode === 'new' ? `${t.id} criada para ${PEOPLE[t.resp].first} · semana ${t.week}` : `${t.id} salva`;
    closeModal(); render(); toast(msg);
  }

  let toastT;
  function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

  function toggle(tid, sid, checked, li) {
    BY_ID[tid].subs.find(x => x.id === sid).done = checked; saveTasks();
    if (modalKind) { paintModal(); render(); return; }
    if (li && checked) { li.classList.add('leaving'); setTimeout(render, 320); } else render();
  }

  // ---------- eventos ----------
  document.getElementById('who').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { state.profile = b.dataset.p; render(); } });
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b && b.dataset.tab !== state.tab) { state.tab = b.dataset.tab; render(); goToday(); } });
  document.getElementById('insMode').addEventListener('click', e => { const b = e.target.closest('[data-im]'); if (b) { state.insMode = b.dataset.im; state.open = 'ins'; render(); } });
  document.getElementById('hideDone').addEventListener('change', e => { state.hideDone = e.target.checked; render(); });
  document.getElementById('today').addEventListener('input', e => { state.todayW = +e.target.value; render(); });
  document.querySelector('.fx-bar').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2;
    if (a === 'zin') zoomAt(zoom * 1.2, cx, cy);
    else if (a === 'zout') zoomAt(zoom / 1.2, cx, cy);
    else if (a === 'fit') fit();
    else if (a === 'hoje') goToday();
    else if (a === 'nova') openEditor('new');
    else if (a === 'matriz') showModal('matriz');
    else if (a === 'reset') { try { localStorage.removeItem(TKEY); } catch (err) {} loadTasks(); render(); toast('Dados de exemplo restaurados'); }
  });
  canvas.addEventListener('click', e => {
    if (e.target.closest('input, label')) return;
    const al = e.target.closest('[data-alloc]'); if (al) { openEditor('alloc', al.dataset.alloc); return; }
    const op = e.target.closest('[data-open]'); if (op) { showModal('task', op.dataset.open); return; }
    const vb = e.target.closest('[data-ver]'); if (vb) { showModal('ver', vb.dataset.ver); return; }
    const sb = e.target.closest('[data-serie]'); if (sb) { showModal('serie', sb.dataset.serie); return; }
    const et = e.target.closest('[data-etapa]'); if (et) { if (isLider()) showModal('etapa', et.dataset.etapa); else { const o = et.querySelector('[data-open]'); if (o) showModal(et.querySelectorAll('[data-open]').length > 1 ? 'etapa' : 'task', et.querySelectorAll('[data-open]').length > 1 ? et.dataset.etapa : o.dataset.open); } return; }
    const ce = e.target.closest('[data-cell]'); if (ce) { showModal('cell', ce.dataset.cell); return; }
    const ln = e.target.closest('[data-lane]'); if (ln) { const k = ln.dataset.lane; state.open = state.open === k ? null : k; render(); }
  });
  canvas.addEventListener('change', e => { const c = e.target.closest('input[data-s]'); if (c) toggle(c.dataset.t, c.dataset.s, c.checked, c.closest('li')); });
  modal.addEventListener('change', e => {
    const c = e.target.closest('input[data-s]'); if (c) { toggle(c.dataset.t, c.dataset.s, c.checked); return; }
    if (modalKind === 'edit') { readForm(); paintLoad(); }
  });
  modal.addEventListener('input', e => { if (modalKind === 'edit' && e.target.closest('.it-h, #ed-due')) { readForm(); paintLoad(); } });
  modal.addEventListener('submit', e => { e.preventDefault(); submitEditor(); });
  modal.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeModal(); return; }
    const edb = e.target.closest('[data-ed]');
    if (edb) {
      readForm();
      if (edb.dataset.ed === 'add') ed.draft.items.push({ t: '', who: ed.draft.resp || '', h: 1, done: false });
      else ed.draft.items.splice(+edb.dataset.i, 1);
      paintItems(); paintLoad();
      if (edb.dataset.ed === 'add') { const last = document.querySelector('#ed-items .it:last-child .it-t'); if (last) last.focus(); }
      return;
    }
    const edt = e.target.closest('[data-edit]'); if (edt) { openEditor('edit', edt.dataset.edit); return; }
    if (e.target.closest('input, label')) return;
    const op = e.target.closest('[data-open]'); if (op) showModal('task', op.dataset.open);
  });
  scrim.addEventListener('click', e => { if (e.target === scrim) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden) closeModal(); });

  render();
  start();
})();
</script>
