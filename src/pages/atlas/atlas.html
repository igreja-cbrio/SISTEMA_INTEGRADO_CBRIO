a pergunta NPS e as extras","Usar como referência do que está sendo medido"],"estado":"viva","evidencia":"src/pages/Nps.jsx render do modal por tab; perguntas vêm de pesquisa.perguntas (pergunta_nps + perguntas_extras) carregadas via api.get(id) (Nps.jsx:509)","recomendacao":""},{"nome":"Detalhe — Análise IA","funcao":"Mostra a análise gerada por IA (resumo, sentimento, temas recorrentes, ações sugeridas). Vazia até alguém clicar 'Analisar com IA'.","passo_a_passo":["No modal, clicar em 'Analisar com IA' (exige ≥1 resposta)","Aguardar o Haiku processar","Abrir a aba 'Análise IA' para ler resumo/temas/ações"],"estado":"viva","evidencia":"src/pages/Nps.jsx:542-553 analisar() → POST /:id/analisar (nps.js:294) salva analise_ia e seta tab='analise'","recomendacao":"Depende de chamada manual e de ANTHROPIC_API_KEY; sem respostas o botão fica desabilitado (esperado)."}],"achados_auditoria":[{"severidade":"alto","descricao":"Respostas via LINK PÚBLICO não atualizam o KPI. O responder logado (nps.js:282) chama sincronizarKpi(), mas o responder público (publicNps.js:69-88) só insere em nps_respostas e NÃO sincroniza com dados_brutos. Se uma pesquisa for respondida apenas pelo público (caso comum de NPS de culto/visitante), o KPI fica vazio/desatualizado mesmo havendo respostas. Agrava: sincronizarKpi é função privada de nps.js (não exportada · module.exports = router na linha 400), então publicNps.js não pode reusá-la sem refatorar.","evidencia":"backend/routes/publicNps.js:69-88 (insert sem qualquer sincronização); contraste com backend/routes/nps.js:282 sincronizarKpi(pesquisa.id); helper privado em nps.js:357 não exportado","recomendacao":"Extrair sincronizarKpi para npsService (compartilhável) e chamá-lo também no POST /api/public/nps/:token/responder, em fire-and-forget como no fluxo logado."},{"severidade":"medio","descricao":"Canal duplicado para nps_culto sem colisão de linha (o que é pior que sobrescrever): além do NPS automático (sincronizarKpi → dados_brutos), há um canal MANUAL paralelo em painelArea.js (POST /:area/nps) que faz UPSERT em dados_brutos com tipo_id='nps_culto' e mesma data canônica. Como ambos usam onConflict 'tipo_id,area,data,contexto' MAS gravam contexto diferente (NPS: {pesquisa_id,total_respostas,nps_score}; painel-area: {qtd_respostas} ou {}), eles NÃO se sobrescrevem — geram DUAS linhas para o mesmo (tipo,area,data). Qual número vira o KPI vigente depende da agregação do tipo, gerando ambiguidade silenciosa.","evidencia":"backend/routes/nps.js:380-397 upsert contexto {pesquisa_id,...} onConflict 'tipo_id,area,data,contexto'; backend/routes/painelArea.js:369-383 upsert tipo_id:'nps_culto' contexto {qtd_respostas}|{}","recomendacao":"Definir um único canal-fonte por tipo (ex.: NPS de culto sempre pelo módulo NPS) e desativar/documentar o input manual de painelArea; ou padronizar o contexto pra que um sobrescreva o outro intencionalmente."},{"severidade":"medio","descricao":"A sincronização carimba o dado na data_inicio da pesquisa (sempre o mesmo dia), não na data da resposta. Para pesquisas longas isso concentra todas as respostas num único ponto temporal do KPI, distorcendo a série mensal/semestral.","evidencia":"backend/routes/nps.js:387 data: pesquisa.data_inicio (no UPSERT de dados_brutos)","recomendacao":"Avaliar usar o mês corrente da última resposta (ou snapshot por período) em vez de data_inicio fixa, alinhando com a periodicidade do tipo (nps_lideres/voluntarios são semestrais)."},{"severidade":"baixo","descricao":"Permissão de criação inconsistente entre camadas: o backend permite criar com nível 3 no módulo 'nps' (authorizeModule('nps',3) · nps.js:105), mas o frontend gateia o botão 'Nova NPS' apenas por role (isAdmin||isDiretor · Nps.jsx:156,203). Um líder de área com nível 3 em 'nps' (ex.: via boost) passa no backend mas não vê o botão no frontend. A leitura de respostas (GET /:id/respostas · nps.js:229) também é por role admin/diretor || criador, não pelo nível de módulo.","evidencia":"src/pages/Nps.jsx:156 canWrite=isAdmin||isDiretor + :203 botão gateado; backend/routes/nps.js:105 authorizeModule('nps',3); :229-231 isPrivileged=['admin','diretor'].includes(role) || isOwner","recomendacao":"Alinhar o gating do frontend ao authorizeModule('nps',3) (usar getAccessLevel(['nps'])>=3) e padronizar a leitura de respostas pelo mesmo nível de módulo, não só por role."},{"severidade":"baixo","descricao":"sincronizarKpi sai silenciosamente se o tipo_dado_bruto não estiver seedado (nps.js:378 'return; // tipo NPS ainda não seedado — ignora silenciosamente'). Os 5 tipos existem em prod, mas qualquer contexto_kpi futuro sem seed faria o NPS coletar respostas sem nunca alimentar KPI, sem erro visível (o early-return não loga; só o catch externo do chamador em :283 loga).","evidencia":"backend/routes/nps.js:373-378 maybeSingle em tipos_dado_bruto + return silencioso sem log","recomendacao":"Logar aviso explícito no early-return ou validar contexto_kpi contra tipos seedados na criação da pesquisa. Obs: contexto_kpi já é validado contra TIPOS_KPI_VALIDOS na criação (nps.js:117), então o risco real hoje é baixo."}],"verificacao_notas":"Reabri nps.js (400 linhas), publicNps.js (97 linhas), Nps.jsx (linhas 140-230 e 495-554) e api.js (~2163-2190). Mudanças vs ficha original: (1) REMOVIDO o achado baixo do 'typo \\\\nps' no api client — o código real é get('/nps' + ...) com barra normal correta (api.js:2166); o auditor confundiu '/nps' com '\\\\nps'. (2) Achado do canal duplicado nps_culto (medio) REFINADO e ELEVADO em precisão: como os dois UPSERTs gravam contexto DIFERENTE e contexto faz parte do onConflict, eles NÃO se sobrescrevem — criam duas linhas, o que muda a recomendação. (3) Achado #1 (alto, KPI público não sincroniza) CONFIRMADO e reforçado: sincronizarKpi é privada e não exportada, então o fix exige refatorar para npsService. (4) Achados de data_inicio fixa e early-return silencioso CONFIRMADOS com linhas exatas; ajustei o early-return p/ notar que contexto_kpi já é validado na criação (risco real baixo) e re-elevei data_inicio a medio (distorce série temporal real). (5) Achado de permissão CONFIRMADO; estendido para cobrir também a leitura de respostas por role. Evidências de linha das abas conferidas e ajustadas (tab default :501, tabs da lista :211, filtros :183-186). Todas as 6 abas são vivas e descritas corretamente. Confiança: alta — todos os vereditos verificados contra o código-fonte real.","rota":"/nps","pageFile":"src/pages/Nps.jsx","backendRouteFile":"backend/routes/nps.js","apiNamespace":"nps"},{"slug":"gestao","nome":"Gestão (PMO)","categoria":"Estratégica","quem_usa":"PMO — exclusivo para perfis admin/diretor (Marcos, Matheus, Eduardo). O frontend bloqueia o acesso com tela \"Acesso restrito\" para quem não for admin/diretor (Gestao.jsx:56 isAdmin = ['admin','diretor'].includes(profile?.role); Gestao.jsx:76-82 early-return) e o backend reforça com authorize('admin','diretor') no topo do router (gestao.js:14-15).","para_que_serve":"Painel de comando do PMO sobre o sistema OKR/KPI da igreja. Reúne em uma só tela: (1) diagnóstico operacional — quem está atrasado com seus KPIs, quais indicadores estão cronicamente vermelhos, saúde por área e qualidade do cadastro de KPIs (sem meta/dono/objetivo/valores/registro 60d); (2) edição da estrutura OKR (Direcionador → Objetivo → KR → KPI), via componente embutido EstruturaOkr; (3) monitoramento operacional das 8 áreas administrativas (SLA e NPS interno das solicitações do mês); (4) configuração — atalhos para cruzamentos e regras de notificação + edição das metas institucionais e específicas. É um painel de meta-monitoramento (mede a saúde do próprio sistema de gestão), não um módulo que coleta dado de campo.","entrada":["Configurar > Metas Institucionais: descrição/valor/unidade/observações da meta global do ano por tipo (quantitativo/qualitativo) — AbaMetasInstitucionais.salvarMeta -> estrategiaApi.metasInstitucionais.upsert (Gestao.jsx:799-814)","Configurar > Metas Institucionais: classificação de cada OKR em quantitativo/qualitativo via botão ⇄ (trocarTipoOkr -> estrategiaApi.setOkrTipo, Gestao.jsx:816-822)","Configurar > Metas específicas: meta_valor + meta_descricao por OKR Geral (estrategiaApi.objetivos.update) ou KPI Tático (kpisApi.v2.taticoUpdate) como override da institucional — MetasEspecificas.salvar (Gestao.jsx:1079-1095) + limparOverride (Gestao.jsx:1097-1105)","Diagnóstico: ação 'cobrar' um líder (botão de sino) — NÃO lança dado, dispara notificação via gestaoApi.cobrar (Gestao.jsx:153-161)","Estrutura OKR: edição da hierarquia Direcionador/Objetivo/KR/KPI delegada ao componente EstruturaOkr embutido (Gestao.jsx:119)","Operacional: NÃO recebe lançamento manual — só lê e oferece o botão 'Recalcular KPIs' (gestaoApi.recalcularAdm, Gestao.jsx:517-526)"],"processamento":["AUTOMÁTICO — Diagnóstico/Pulso: GET /gestao/pulso (gestao.js:20-114) cruza kpi_indicadores_taticos (ativos) com a view vw_kpi_trajetoria_atual e agrega por líder (rh_funcionarios via lider_funcionario_id), por status (no_alvo/atras/critico/sem_dado) e por área; ranqueia líderes por score = criticos*3 + atrasados*2 + sem_dado (gestao.js:68)","AUTOMÁTICO — Diagnóstico/Saúde: GET /gestao/saude (gestao.js:119-232) calcula em JS sem_meta, sem_dono, sem_objetivo, sem_valores, sem_registro_60d, matriz de cobertura Valor×Área (areas_kpi, só as 6 oficiais kids/ami/bridge/sede/online/cba) e objetivos_sem_kpis (kpi_objetivos_gerais). sem_objetivo e sem_valores só avaliam KPIs das 6 áreas oficiais (gestao.js:132-143)","AUTOMÁTICO — Operacional: GET /gestao/painel-adm (gestao.js:285-375) lê os KPIs tipo_kpi='operacional', pega o último kpi_valores_calculados por KPI (ordenado por calculado_em desc), e conta solicitacoes por area_responsavel: total/urgentes do mês corrente (created_at no intervalo) + pendentes 'agora' (status em pendente/em_analise/aguardando_aprovacao_financeira/em_atendimento/aguardando_entrega, sem filtro de mês). O cálculo do SLA/NPS em si é externo (RPC recalcular_todos_kpis_adm sobre vw_solicitacoes_sla)","AUTOMÁTICO — botão 'Recalcular KPIs' (Operacional): POST /gestao/painel-adm/recalcular chama supabase.rpc('recalcular_todos_kpis_adm') (gestao.js:378-386)","MANUAL/AUTOMÁTICO híbrido — 'Recalcular metas' (Metas Institucionais): estrategiaApi.metasInstitucionais.aplicar() chama aplicar_meta_institucional, que materializa meta_valor_absoluto a partir do baseline do ano anterior × 1.30 (Gestao.jsx:824-831)","AUTOMÁTICO — 'cobrar' líder: POST /gestao/pulso/cobrar/:lider_id (gestao.js:237-279) resolve o profile do líder pelo e-mail (rh_funcionarios.email -> profiles.email) e insere uma notificacao tipo 'cobranca_kpi' apontando para /meus-kpis. Retorna 404 se o líder não tiver profile vinculado"],"saida":["Tela Diagnóstico: 6 stats globais (KPIs ativos, criticos, líderes com pendência, sem registro 60d, sem meta, sem dono), lista de líderes com pendências (com botão cobrar), KPIs cronicamente criticos (abrem KpiDetalheModal), saúde por área (% em dia) e a seção Qualidade do cadastro (5 listas + matriz de cobertura Valor×Área + objetivos sem KPIs)","Tela Operacional: 8 cards de área administrativa com Resposta no SLA (%), Conclusão no SLA (%), NPS interno, % urgentes e pendentes agora","Tela Estrutura OKR: hierarquia editável (renderizada pelo componente EstruturaOkr)","Tela Configurar: 2 atalhos (Cruzamentos -> /admin/cruzamentos, Regras de Notificação -> /admin/notificacao-regras) + editor de Metas Institucionais (2 tipos) e Metas específicas (OKRs/KPIs)","Notificação in-app 'cobranca_kpi' enviada ao líder cobrado (tabela notificacoes, link /meus-kpis)","Sem export de arquivo/CSV — não há rota nem botão de exportação no módulo"],"integracoes":{"alimenta":["notificacoes — insere alerta 'cobranca_kpi' para o líder (POST /gestao/pulso/cobrar, gestao.js:263-272)","kpi_indicadores_taticos.meta_valor / kpi_objetivos_gerais.meta_valor — sobrescritos pelas Metas específicas (estrategiaApi.objetivos.update / kpisApi.v2.taticoUpdate, Gestao.jsx:1085-1089)","metas_institucionais + kpi_objetivos_gerais.meta_valor_absoluto — via 'Recalcular metas' (aplicar_meta_institucional) que cascateia a meta global para todos os OKRs do tipo (Gestao.jsx:827)","kpi_valores_calculados — via 'Recalcular KPIs' da aba Operacional (RPC recalcular_todos_kpis_adm, gestao.js:380)","kpi_indicadores_taticos.tipo_kpi (quantitativo/qualitativo) — via botão ⇄ (estrategiaApi.setOkrTipo, Gestao.jsx:818)"],"alimentado_por":["kpi_indicadores_taticos + vw_kpi_trajetoria_atual — base do Pulso/Diagnóstico (status por KPI)","rh_funcionarios — nomes/cargos/áreas dos líderes (lider_funcionario_id) e e-mail para resolver o profile na cobrança","kpi_registros — para o check 'sem registro 60d' (data_preenchimento, gestao.js:150-153)","areas_kpi e kpi_objetivos_gerais — matriz de cobertura e objetivos sem KPI","solicitacoes + vw_solicitacoes_sla — base da aba Operacional (SLA, NPS via nps_nota, urgência, pendentes)","estrategia (/api/estrategia/*) e kpis.v2 (/api/kpis/v2/*) — OKRs por tipo, metas institucionais e KPIs táticos editados em Configurar","EstruturaOkr (componente do módulo Estratégia, import de ./admin/EstruturaOkr) — embutido na aba Estrutura OKR"]},"abas":[{"nome":"Diagnóstico","funcao":"Fusão das antigas abas Pulso + Saúde: cobre líderes atrasados, KPIs críticos, saúde por área e qualidade do cadastro de KPIs.","passo_a_passo":["Abrir /gestao (cai em Diagnóstico por padrão)","Ler stats e a lista de líderes com pendência","Clicar no sino para enviar lembrete a um líder atrasado","Clicar num KPI crítico/de qualidade para abrir o modal de detalhe e corrigir meta/dono"],"estado":"viva","evidencia":"Gestao.jsx:118 renderiza \u003cAbaDiagnostico/>, que chama gestaoApi.pulso() e gestaoApi.saude() em paralelo (Gestao.jsx:139-142); backend gestao.js:20 (/pulso) e :119 (/saude)"},{"nome":"Estrutura OKR","funcao":"Edição da hierarquia Direcionador → Objetivo Geral → KR → KPI.","passo_a_passo":["Abrir aba Estrutura OKR","Navegar pela árvore de objetivos/KRs","Editar/ligar KPIs aos KRs no componente embutido"],"estado":"viva","evidencia":"Gestao.jsx:119 renderiza \u003cEstruturaOkr embedded /> (import em Gestao.jsx:26) — a lógica vive em outro componente; aqui é só host"},{"nome":"Operacional","funcao":"Monitora SLA e NPS interno das 8 áreas administrativas com base nas solicitações.","passo_a_passo":["Abrir aba Operacional","Ler os cards de cada área (Resposta/Conclusão no SLA, NPS, % urgentes, pendentes)","Opcionalmente clicar em 'Recalcular KPIs' para forçar o recálculo"],"estado":"viva","evidencia":"Gestao.jsx:120 -> \u003cAbaPainelAdm/> (def Gestao.jsx:500) consome gestaoApi.painelAdm() -> GET /gestao/painel-adm (gestao.js:285); botão Recalcular -> POST /gestao/painel-adm/recalcular (gestao.js:378)"},{"nome":"Configurar","funcao":"Atalhos (Cruzamentos, Regras de Notificação) e edição de Metas Institucionais + Metas específicas.","passo_a_passo":["Abrir aba Configurar","Editar a meta global do ano por tipo (quantitativo/qualitativo) e classificar OKRs","Usar 'Recalcular metas' para cascatear a meta institucional","Definir override de meta por OKR/KPI em 'Metas específicas'"],"estado":"viva","evidencia":"Gestao.jsx:121 -> \u003cAbaConfigurar/> (def Gestao.jsx:612) -> embute \u003cAbaMetasInstitucionais/> (def Gestao.jsx:775) + \u003cMetasEspecificas/> (def Gestao.jsx:1031)"},{"nome":"(interno) AbaPulso — código morto","funcao":"Versão antiga e standalone do Pulso (líderes, KPIs vermelhos, saúde por área).","passo_a_passo":["Não há caminho de UI: a aba 'pulso' é redirecionada para 'diagnostico' (TABS_ANTIGAS, Gestao.jsx:48) e o router de abas nunca renderiza \u003cAbaPulso/>"],"estado":"legada","evidencia":"AbaPulso definida em Gestao.jsx:341 mas nenhum JSX a renderiza — grep só achou \u003cAbaDiagnostico/>(118), \u003cAbaPainelAdm/>(120), \u003cAbaConfigurar/>(121). Resíduo da consolidação de maio/2026; lógica absorvida por AbaDiagnostico"},{"nome":"(interno) AbaSaude — código morto","funcao":"Versão antiga e standalone da Saúde do sistema (KPIs sem meta/dono/registro + matriz).","passo_a_passo":["Não há caminho de UI: a aba 'saude' é redirecionada para 'diagnostico' (TABS_ANTIGAS, Gestao.jsx:49) e AbaSaude nunca é renderizada"],"estado":"legada","evidencia":"AbaSaude definida em Gestao.jsx:680, duplicando o conteúdo já embutido em AbaDiagnostico (seção Qualidade do cadastro, Gestao.jsx:279-320). Nunca chamada no JSX"}],"achados_auditoria":[{"severidade":"baixo","descricao":"Dois componentes inteiros são código morto: AbaPulso (Gestao.jsx:341) e AbaSaude (Gestao.jsx:680). São versões pré-consolidação (maio/2026) cujas lógicas foram fundidas em AbaDiagnostico. O router de abas só renderiza diagnostico/estrutura/operacional/configurar (Gestao.jsx:118-121), então esses componentes nunca aparecem.","evidencia":"Gestao.jsx:341 (function AbaPulso) e :680 (function AbaSaude) sem nenhum render (grep confirmou só \u003cAbaDiagnostico/>/\u003cAbaPainelAdm/>/\u003cAbaConfigurar/> renderizados); cabeçalho do backend ainda descreve '3 abas: Pulso/Configurar/Saúde' (gestao.js:4-7), desalinhado do frontend de 4 abas","recomendacao":"Remover AbaPulso e AbaSaude (~270 linhas) e atualizar o comentário em gestao.js:4-7. Reduz manutenção e elimina o risco de editar o componente errado."},{"severidade":"medio","descricao":"NPS interno na aba Operacional fica '—' (sem fonte real) enquanto as solicitações não forem avaliadas pelo solicitante. O indicador depende de solicitacoes.nps_nota agregado por agg_solicitacoes_kpi; sem avaliação pós-conclusão preenchida, o valor vem null e o card mostra traço — não distingue 'sem avaliação no mês' de 'zero'.","evidencia":"AreaAdmCard lê metrica 'nps_medio' (Gestao.jsx:554); Indicador renderiza '—' quando valor==null (Gestao.jsx:595, 599-600)","recomendacao":"Mostrar 'sem avaliações no mês' em vez de '—' para distinguir 'sem dado' de 'zero'. O canal de avaliação já existe (badge 'Avalie' em Solicitações)."},{"severidade":"baixo","descricao":"A aba Operacional dá falso negativo quando um KPI operacional não tem formula_config.area_responsavel batendo exatamente com a key da área (matching estrito). Áreas sem KPI cadastrado com a key idêntica mostram os 3 indicadores em '—' mesmo havendo solicitações no mês.","evidencia":"gestao.js:346 filtra kpisArea por k.formula_config?.area_responsavel === area.key (igualdade estrita). Se a chave divergir (ex.: 'manutencao' vs slug diferente), o indicador some silenciosamente","recomendacao":"Validar que cada uma das 8 áreas (incl. manutencao, logistica_estoque, logistica_compras) tem KPIs operacionais seedados com area_responsavel idêntico à key."},{"severidade":"baixo","descricao":"O check 'sem registro 60d' marca como ausente todo KPI cuja fonte é trigger/coletor automático que grava em kpi_valores_calculados (não em kpi_registros). Pode listar KPIs operacionais/automáticos como 'ninguém preenche' mesmo estando vivos, gerando ruído no diagnóstico.","evidencia":"gestao.js:150-155 consulta apenas kpi_registros.data_preenchimento; KPIs operacionais alimentam kpi_valores_calculados (gestao.js:311-315), não kpi_registros","recomendacao":"Excluir do check os KPIs com tipo_calculo != 'manual' (ou tipo_kpi='operacional'), ou unir kpi_registros + kpi_valores_calculados como 'último preenchimento' antes de classificar."},{"severidade":"baixo","descricao":"Acesso é checado por profile.role (admin/diretor) no front e por authorize('admin','diretor') no back, ignorando a matriz granular de permissões do módulo 'gestao'. Coerente com a decisão de manter /gestao restrito ao PMO, mas significa que conceder nível na matriz para 'gestao' não dá acesso — só o role legado dá.","evidencia":"Gestao.jsx:56 isAdmin = ['admin','diretor'].includes(profile?.role); gestao.js:15 router.use(authorize('admin','diretor'))","recomendacao":"Manter se a intenção é PMO-only; se quiser conceder via matriz, trocar para authorizeModule('gestao', N). Documentar para evitar confusão futura."}],"verificacao_notas":"Verificação adversarial concluída com alta confiança — reabri Gestao.jsx (1344 linhas, li 1-1105 + grep), gestao.js (completo, 389 linhas) e api.js (namespaces gestao 2068-2074 e ritual 2077-2087). MUDANÇAS: (1) REMOVIDO o achado médio 'ritual.historico monta URL com barras invertidas' — é FALSO. api.js:2085 lê literalmente `'/ritual/historico'` com barras NORMAIS (forward slashes); não há nenhum `'\\\\ritual\\\\historico'`. O auditor inventou/confundiu esse defeito. (2) Mantidos os 6 demais achados (1 médio + 5 baixos), todos confirmados no código real com linha precisa. As 6 abas (4 vivas + AbaPulso/AbaSaude legadas) confirmadas: grep provou que AbaPulso(341) e AbaSaude(680) jamais são renderizadas — só AbaDiagnostico/EstruturaOkr/AbaPainelAdm/AbaConfigurar. Entrada/processamento/saída/integrações batem com o código; refinei detalhes (pendentes_agora não filtra mês; sem_objetivo/sem_valores só avaliam as 6 áreas oficiais — gestao.js:132-143; resolução de profile por e-mail na cobrança). Namespace gestaoApi (pulso/saude/cobrar/painelAdm/recalcularAdm) confere 1:1 com o backend.","rota":"/gestao","pageFile":"src/pages/Gestao.jsx","backendRouteFile":"backend/routes/gestao.js","apiNamespace":"gestao"},{"slug":"assistente-ia","nome":"Assistente IA","categoria":"Dados / IA / Admin","para_que_serve":"Centraliza os recursos de IA do ERP em uma só tela (/assistente-ia), em três abas: (1) Chat IA conversacional com agentes especialistas por módulo via Anthropic Sessions API (managed-agents-2026-04-01), que respondem com base nos dados reais do banco (contexto montado por buildContext/serializeContext, filtrado pela permissão do usuário) e têm fallback para a Messages API com claude-haiku-4-5-20251001 quando o stream não produz texto; (2) Agentes de Auditoria = fila de aprovação humana (human-in-the-loop) das propostas geradas por 14 watchers/executores que rodam num worker externo no Railway — nada é aplicado sem um humano clicar \"Aprovar e aplicar\"; (3) Legacy = painel antigo de auditorias automáticas com score 0-10 e findings por módulo. É a interface de operação dos agentes de IA do sistema.","quem_usa":"Chat: qualquer usuário autenticado que tenha permissão em pelo menos um módulo de agente — o seletor é populado por GET /agents/modules (listModulesForUser), e POST /chat bloqueia com 403 se canUseAgent for falso para aquele agente (managedAgents + getEffectiveLevel). Agentes de Auditoria (fila) e Legacy: o backend exige authorize('admin','diretor') em /worker/trigger, /queue, /queue/:id/apply, /queue/:id/reject e /run. Na prática Marcos/Matheus e diretores operam fila/auditoria; líderes de área usam o chat do próprio módulo. Observação: as rotas de leitura de auditoria (/runs, /stats, /scores) NÃO têm authorize — só authenticate (router.use(authenticate) no topo), então qualquer autenticado consegue ler runs/stats/scores, embora a aba só seja útil pra quem pode disparar.","entrada":["Chat IA: o usuário escolhe um agente no dropdown (Supervisor por padrão · lista carregada de agents.modules(), com fallback estático de 15 opções em MODULE_OPTIONS) e digita uma pergunta em linguagem natural (Enter envia); pode retomar/excluir sessões anteriores na barra lateral","Agentes de Auditoria (aba Fila): clica 'Rodar agora' em um dos 14 cards de watcher/executor para disparar o worker; depois aprova ('Aprovar e aplicar') ou rejeita cada proposta da fila","Legacy (Auditorias): clica 'Executar' em um dos 20 cards de auditor (ou '🚀 Executar Todos os Agentes', que dispara os 20 em sequência) para rodar auditoria em background"],"processamento":["AUTOMÁTICO (chat) — POST /api/agents/chat (rate limit 30/min · chatLimiter): cria ou retoma uma Sessão na Anthropic Sessions API (headers anthropic-beta managed-agents-2026-04-01); monta contexto via buildContext()/serializeContext() (dados do banco filtrados pela permissão + busca no Cérebro/vault com vaultLimit:5, truncado em 24000 chars); injeta regra anti-alucinação; faz streaming SSE. Se o stream não produzir texto, FALLBACK para a Messages API com model claude-haiku-4-5-20251001 (agents.js:302). Sessões/mensagens persistidas em agent_sessions/agent_messages; uso logado em agent_log","AUTOMÁTICO (worker) — POST /api/agents/worker/trigger: assina o corpo com HMAC (workerHmac.sign) e chama {AGENT_WORKER_URL}/run/{agentType} no Railway (default agentType='financeiro_executor'). Os watchers/executores vivem em agent-worker/ e usam tools read/propose; cada proposta vira linha em agent_queue (status pending). Há cron no scheduler.ts do worker. EXIGE AGENT_WORKER_URL + AGENT_WORKER_HMAC_SECRET no Vercel — sem isso retorna 503 (agents.js:574-578)","MANUAL (aprovação) — POST /api/agents/queue/:id/apply: valida UUID, carrega a proposta, marca 'approved' (anti-race), chama applyQueueAction() que roteia por prefixo do action_type (fin./kpis./rh./cui./eventos./vol./log./mem./pat./cerebro./next./grupos./nps./proj.) para o handler em backend/agents/apply/*. Em sucesso marca 'applied' (applied_at); em erro marca 'failed' (apply_error). Só aqui a mudança é efetivada. Rejeição via PATCH /queue/:id/reject (grava motivo em apply_error)","AUTOMÁTICO (auditoria legacy) — POST /api/agents/run (rate limit 10/15min · aiLimiter): cria agent_runs e dispara em background (setImmediate) runSystemAudit/runDesignAudit/runModuleAudit conforme o agentType. Resultado (summary, findings[], config.score, tokens, custo) gravado em agent_runs/agent_steps. Frontend faz polling a cada 5s enquanto status=running (AssistenteIA.jsx:610)"],"saida":["Chat: respostas em markdown em tempo real (ReactMarkdown, streaming com cursor) + barra lateral de sessões salvas (título, módulo, data, remover)","Fila de Aprovação: cards de proposta agrupados por action_type, com ícone/label (ACTION_META), 'Por que o agente propôs' (reasoning), payload técnico expansível, badge de erro anterior, botões Aprovar e aplicar / Rejeitar; auto-refetch a cada 30s (refetchInterval)","Auditorias NFIRMADOS (mantidos com evidência precisa): resumoUso sem consumidor (grep em src/ só achou api.js:2309); endpoints de vault sem UI (legada); promessa 'Opus' vs Sonnet real (MODEL_PREMIUM='claude-opus-4-7' inalcançável pela UI); hard delete; geração síncrona no request.\n\nCORRIGIDO/REFUTADO — achado de 'timeout 60s vs 5min': o vercel.json tem maxDuration=300, então a função realmente roda até 5min e o limiar do /reset (300_000ms) e as mensagens '5min' estão CORRETOS. A premissa do achado original ('UI manda esperar 5min por algo morto em 60s') NÃO procede. Reescrito para baixo: o único resíduo real é um comentário de cabeçalho stale ('60s Hobby' em apresentacoes.js:5).\n\nREBAIXADO — geração síncrona de 'medio' para 'baixo': com orçamento de 300s a geração típica (1-3min) cabe; risco é marginal (cold start + contexto Cérebro), não estrutural.\n\nAbas: nenhuma reclassificada para cima — a lista e o detalhe seguem 'viva'; /uso/resumo segue 'sem_fonte' (populado mas sem leitor); endpoints de vault seguem 'legada' (sem consumidor, só diagnóstico). Entrada/processamento/saida/integracoes batem com o código; ajustei referências de linha imprecisas (ex.: o detalhe e suas métricas vêm de GET /:id em apresentacoes.js:189 e api.fetchHtml em api.js:2303, não de linhas específicas do ApresentacaoDetalhe que não reabri). Não reabri ApresentacaoDetalhe.jsx — as afirmações que dependiam dele foram reancoradas no backend/api.js onde a evidência é verificável.","rota":"/admin/apresentacoes","pageFile":"src/pages/apresentacoes/Apresentacoes.jsx","backendRouteFile":"backend/routes/apresentacoes.js","apiNamespace":"apresentacoes"},{"slug":"eventos","nome":"Eventos","categoria":"Operacional","para_que_serve":"Gestão de eventos da igreja (cultos especiais, conferências, séries, retiros) como um PMO: cadastro do evento, calendário, lista/Kanban/Gantt de acompanhamento, tarefas e subtarefas, reuniões com pendências, riscos, retrospectiva, histórico (audit log), relatórios gerados por IA e um sistema de score (KPI) de performance operacional das áreas que entregam documentos no ciclo criativo. Eventos com \"ciclo criativo\" ativado ganham fases pré-definidas (ex.: Pré-Briefing → Dia D → Debrief) com tarefas por área, e seu desempenho é metrificado por documento (prazo/aprovação/qualidade/arquivo) em rollup documento→área→evento→institucional.","quem_usa":"PMO/admin/diretor: acesso completo (criar/editar/excluir eventos via authorize('diretor','admin') no backend; templates e KPIs no frontend exigem accessLevel>=5). Líderes de área com escopo_proprio em eventos (ex.: coordenador-marketing/Pedro Paiva, líder-produção/Pedro Fernandes) ou nível>=3 (isLider, Eventos.jsx:693-698) veem o Kanban filtrado pela própria área (userAreas) e atualizam status de tarefas. Demais autenticados têm leitura. Áreas operacionais que entregam no ciclo: produção, marketing, compras, financeiro, manutenção, limpeza, cozinha, adm.","entrada":["Evento (modal Novo/Editar): nome, data, categoria, local, responsável, público esperado, orçamento previsto/gasto, descrição, observações, recorrência (unico/semanal/mensal/anual) + datas das ocorrências, opção 'ativar ciclo criativo'","Tarefas do evento (aba Detalhes>Tarefas): nome, responsável, área, data início, prazo, status, prioridade, marco (★), descrição","Subtarefas e comentários por tarefa (aba Detalhes>Tarefas, inline)","Riscos (aba Detalhes>Riscos): título, descrição, categoria, probabilidade 1-5, impacto 1-5, responsável, mitigação, data alvo","Retrospectiva (aba Detalhes>Retrospectiva, só evento concluído): avaliação 1-5, o que foi bem, o que melhorar, ações, feedback","Status do evento (Finalizar/Reabrir) e status das ocorrências recorrentes (Finalizar/Reabrir cada data)","Reuniões + pendências apenas no nível da OCORRÊNCIA recorrente (occApi.createMeeting); no nível do evento o botão '+ Reunião' está quebrado (ver achados)","Templates (aba Templates, nível 5): templates de ciclo criativo (área/etapa/título/offset de dias) e 'eventos simples' (título de tarefa avulsa, com/sem vínculo a evento)","Anexos/documentos por tarefa do ciclo (upload SharePoint/Supabase) + marcação de aprovação/qualidade, que alimentam card_completions e o KPI"],"processamento":["AUTOMÁTICO — Recálculo de datas do ciclo ao mudar a data do evento: PUT /api/events/:id desloca data_inicio_prevista/data_fim_prevista de event_cycle_phases e o prazo de cycle_phase_tasks pelo diffDays (events.js:207-222); o frontend pede confirmação antes","AUTOMÁTICO — Finalizar/Reabrir evento: PATCH /api/events/:id/status encerra/reativa o event_cycle e carimba/limpa closed_with_event_at das tarefas em aberto (event_tasks e cycle_phase_tasks) para os relatórios saberem que o responsável não terminou; preserva o status real da tarefa, só marca o timestamp (events.js:265-311). Reabrir recalcula o status (no-prazo/em-risco/atrasado) pela próxima ocorrência pendente (events.js:246-262)","AUTOMÁTICO — Recálculo de status na ocorrência: PATCH /api/events/:id/occurrences/:occId chama recalcEventStatus() que define o status do evento pela próxima ocorrência pendente; sem pendentes em recorrente => 'concluido' (events.js:411-447)","AUTOMÁTICO — KPI/score: views vw_event_kpi e vw_event_area_kpi agregam card_completions por documento (prazo 40 + aprovado 30 + qualidade 20 + arquivo 10, críticos pesam 2x) em rollup; lidas por GET /cycles/kpis/cross (cycles.js:654-704) e /cycles/kpis/evento/:id (cycles.js:602-651). card_completions é populado por upload de anexo + PATCH approve/quality (cycles.js:558-600)","AUTOMÁTICO — KPIs do dashboard PMO: vw_pmo_kpis (GET /dashboard/pmo, dashboard.js:10) e vw_workload (GET /dashboard/workload, dashboard.js:19) entregam tarefas abertas/atrasadas, riscos, próximos 7d, sem dono, orçamento, carga por responsável","AUTOMÁTICO — Notificação 'evento_criado' (notificar, modulo eventos, events.js:160-168) e sync com o Cérebro (enqueueSync 'evento' upsert) no POST (events.js:170) e PUT (events.js:224) do evento","AUTOMÁTICO — Audit log: criação/edição/mudança de status de evento e tarefa gravam em audit_log com event_id (lido na aba Histórico)","AUTOMÁTICO — Templates: ao criar/aplicar templates simples cria event_tasks no(s) evento(s); templates de ciclo (adm-templates) propagam tarefas ao ativar o ciclo (cycles.js, events.js)","MANUAL — Cadastro do evento, tarefas/subtarefas/comentários, riscos, retrospectiva, status das tarefas, reuniões/pendências (no nível da ocorrência), upload de documentos + marcação de aprovação/qualidade, geração de relatório IA"],"saida":["Calendário mensal interativo (Home) com eventos por dia coloridos por categoria/status","Barra de KPIs (Home) e grade de KPIs clicáveis (drill-down para Lista filtrada): Eventos, No Prazo, Em Risco, Atrasados, Concluídos, Próx.7d, Tarefas abertas/atrasadas, Riscos, Sem dono","Lista de eventos filtrável (status/categoria/ano) com ordenação","Kanban por fases do ciclo criativo (todas as ocorrências ativas) e Gantt mensal das fases por evento","Score/KPI do ciclo (aba KPIs): kpi médio cross-eventos, ranking de áreas, score por evento e breakdown por área (prazo/aprovação/qualidade/arquivo)","Relatórios gerados por IA por evento/escopo/fase (aba Detalhes>Relatórios), com resumo por e-mail","Retrospectiva e histórico (audit log) por evento","Painel de orçamento (BudgetPanel) e carga de trabalho por responsável (link para /planejamento)"],"integracoes":{"alimenta":["Cérebro CBRio — via enqueueSync('evento', id, 'upsert') no POST (events.js:170) e PUT (events.js:224)","Notificações — via notificar({modulo:'eventos', tipo:'evento_criado'}) no POST (events.js:160-168)","cycle_phase_tasks / event_cycle_phases — datas recalculadas pelo PUT do evento; é a mesma cycle_phase_tasks que o módulo Marketing materializa em cards (área='marketing')","audit_log — alimentado por POST/PUT/PATCH-status do evento e operações de tarefa","Storage SharePoint/Supabase — anexos de documentos por tarefa do ciclo (storageService) que viram card_completions"],"alimentado_por":["events / event_categories / event_occurrences / event_tasks(+subtasks/comments) / meetings(+pendencies) / event_risks / event_retrospectives — tabelas próprias lidas por GET /api/events/:id","card_completions + vw_event_kpi + vw_event_area_kpi — fonte do score (cycles.js)","vw_pmo_kpis + vw_workload — KPIs do dashboard (dashboard.js)","event_cycles / event_cycle_phases / cycle_phase_tasks — ciclo criativo (cycles.js, partilhado com Marketing)","simple_event_task_templates / templates de ciclo (adm-templates) — geram tarefas","users (usersApi.list) — picker de responsável","reports (reportsApi) — geração de relatórios por IA"]},"abas":[{"nome":"Home","funcao":"Visão geral: barra de KPIs, orçamento global, carga de trabalho e calendário mensal interativo com drill-down do dia.","estado":"viva","evidencia":"Eventos.jsx:3475 (tab 0); barra/grade de KPIs em 667-681 (counts por status)","passo_a_passo":["Abrir /eventos (cai na Home)","Ler os KPIs e clicar num número para ir à Lista filtrada","Clicar num dia do calendário para ver/abrir os eventos daquele dia"],"recomendacao":"OK."},{"nome":"Lista","funcao":"Lista filtrável de eventos (status/categoria/ano) com ordenação; entrada para o detalhe e para criar evento.","estado":"viva","evidencia":"Eventos.jsx:3476 (tab 1); GET /api/events com filtros status/category_id/year (events.js:48-82)","passo_a_passo":["Selecionar filtros (ano padrão = ano atual)","Clicar num evento para abrir Detalhes","Usar 'Novo Evento' para cadastrar"],"recomendacao":"OK."},{"nome":"Kanban","funcao":"Kanban das tarefas do ciclo criativo, navegável por fase, agregando todas as ocorrências ativas; líder vê filtrado pela própria área.","estado":"viva","evidencia":"Eventos.jsx:3477 (tab 2) chama loadKanban() → cyclesApi.kanbanAll() → GET /cycles/kanban/all","passo_a_passo":["Abrir a aba Kanban","Escolher a fase do ciclo","Arrastar/atualizar status das tarefas (PMO) ou da própria área (líder)"],"recomendacao":"Depende de 'Atenção/Em Risco' em vez do texto bruto."},{"severidade":"baixo","descricao":"DELETE de evento faz hard-delete em cascata em várias tabelas (event_tasks, cycle_phase_tasks, meetings, card_completions, event_risks, event_retrospectives, audit_log, etc.) sem soft-delete, contrariando a política de soft-delete do projeto; apaga inclusive o audit_log do evento (perde a trilha de auditoria). 'events' não está na whitelist de soft-delete.","evidencia":"backend/routes/events.js:362-408 (Promise.all de deletes incl. audit_log; events.delete no fim)","recomendacao":"Avaliar soft-delete (deleted_at) ao menos para events e preservar o audit_log; hoje a exclusão é irreversível."},{"severidade":"baixo","descricao":"Sub-aba Tarefas some da barra quando o evento tem ciclo criativo (barra mostra só Reuniões/Riscos/Histórico/Relatórios/Retro), embora o bloco de Tarefas ainda renderize se detailTab==='tarefas'. Em evento com ciclo, o usuário cai em 'reunioes' por padrão e não há botão para voltar à aba Tarefas — as event_tasks 'soltas' ficam sem aba visível.","evidencia":"src/pages/eventos/Eventos.jsx:2816-2828 (lista de sub-abas com hasCycle não inclui 'tarefas') + default detailTab='reunioes' quando hasCycle (Eventos.jsx:441); render do bloco em 2837","recomendacao":"Incluir explicitamente a sub-aba 'Tarefas' também para eventos com ciclo, ou documentar que tarefas do evento com ciclo são geridas no Kanban."}],"verificacao_notas":"Verificação adversarial concluída contra os arquivos reais (Eventos.jsx 3886 linhas, events.js 785, cycles.js 966, api.js, dashboard.js). Confiança ALTA. Mudanças: (1) Aba KPIs reclassificada de 'sem_fonte' → 'viva' — a fonte (vw_event_kpi/vw_event_area_kpi sobre card_completions) e seus write paths (getOrCreateCompletion + PATCH approve/quality, cycles.js:558-600) são vivos; o {kpi_medio:0} em cycles.js:673 só dispara quando não há evento de ciclo ativo, não por plumbing ausente. O score zerado é dependência de ADOÇÃO, capturada corretamente no achado alto (mantido com evidência precisa). (2) Os 5 achados foram TODOS confirmados no código com linhas precisas; o achado médio do '+ Reunião' é real (setModalTask(null) não abre o modal, que depende de !!modalTask em 3394). (3) Aba Reuniões mantida 'incerta' (leitura/pendências OK, criação quebrada). (4) Correções de imprecisão no processamento: as colunas recalculadas são data_inicio_prevista/data_fim_prevista (não data_inicio/fim) e o números de linha foram realinhados ao arquivo atual (POST notify 160-170, PUT recalc 207-222, PATCH status 246-311, recalcEventStatus 411-447, DELETE cascade 362-408). Demais campos (entrada/saída/integrações/quem_usa) batem com o código.","rota":"/eventos","pageFile":"src/pages/eventos/Eventos.jsx","backendRouteFile":"backend/routes/events.js","apiNamespace":"events"},{"slug":"projetos","nome":"Projetos (PMO)","categoria":"Operacional","para_que_serve":"Escritório de projetos (PMO) do ERP: cadastrar e acompanhar projetos estratégicos da igreja com ciclo de vida em 7 fases (Concepção → Encerramento), tarefas/subtarefas, marcos, KPIs próprios do projeto, riscos (matriz 5x5), orçamento e retrospectiva. Oferece visões Home (dashboard), Lista, Kanban de tarefas por fase e Gantt temporal.","quem_usa":"PMO / Marcos Paulo (admin) e diretores (role admin/diretor = canEdit · únicos que criam/editam projetos via authorize('admin','diretor') no backend). Líderes ministeriais com escopo_proprio em \"projetos\" têm acesso restrito: só a aba Lista, filtrada pela própria área (loadList:348-353). Demais usuários autenticados têm leitura.","entrada":["Novo Projeto (botão no header, ProjectFormModal): nome, ano, categoria, líder/responsável (texto + UUID FK), área, datas início/fim, prioridade, status, Teste do Ouriço, orçamento planejado, descrição, notas, SWOT (4 campos). Backend POST aceita os campos (projects.js:122-133)","Aba Detalhe › Fases: botão 'Iniciar Fases (7 fases)' cria as 7 fases padrão (initPhases:484); por fase edita status/notas","Aba D thorize (:334)."},{"nome":"Detalhe › Fases","funcao":"Stepper das 7 fases; cria as fases padrão, edita status/notas e lista tarefas da fase.","passo_a_passo":["Clicar 'Iniciar Fases (7 fases)' se vazio","Selecionar uma fase no stepper","Mudar status/notas; ver tarefas da fase"],"estado":"incerta","evidencia":"initPhases() :484 cria 7 fases mas chama createPhase com {name, order_index, status} (:497) — NÃO envia phase_order; o backend default phase_order=0 (projects.js:182). O stepper local ordena por order_index (:1562, que É enviado), mas o GET ordena por phase_order=0 (projects.js:83). getTasksForPhase casa por 'Fase: {nome}' OU datas (:1567)."},{"nome":"Detalhe › Tarefas","funcao":"Lista/Kanban de tarefas do projeto com subtarefas e comentários inline.","passo_a_passo":["Adicionar tarefa (+ Tarefa)","Adicionar subtarefas e mudar status","Comentar na tarefa"],"estado":"viva","evidencia":"detailTab==='tarefas' (~:1762); subtarefas e comentários têm endpoints (projects.js:252,278). Ressalva: comentários gravam mas o GET /:id nunca os relê → t.comments sempre vazio (ver achados)."},{"nome":"Detalhe › Riscos","funcao":"Matriz de risco 5x5 + lista de riscos com score probabilidade×impacto e mitigação.","passo_a_passo":["+ Risco com probabilidade/impacto","Ver posição na matriz 5x5","Editar status (identificado/mitigado/...)"],"estado":"viva","evidencia":"detailTab==='riscos' (~:1914); score calculado no backend :358 (insert) e :369 (patch). PATCH de risco sem authorize (:366)."},{"nome":"Detalhe › Orçamento","funcao":"Resumo financeiro (investimento/arrecadação/custo) + tabela de itens planejado vs real.","passo_a_passo":["Ver cards de resumo do projeto","+ Item com categoria e valores","Acompanhar barra gasto vs planejado"],"estado":"viva","evidencia":"detailTab==='orcamento' (~:1998); itens em project_budget_items (projects.js:386). budget_spent não é somado dos itens — é campo editável do projeto (Projetos.jsx:2019; salvo em projects.js:153). PATCH de item sem autho os.jsx:1783","recomendacao":"Carregar project_task_comments no GET /:id (como já faz com subtasks) e anexar em cada tarefa."},{"severidade":"medio","descricao":"Kanban (aba principal) associa tarefa↔fase pela convenção de texto 'Fase: {nome}' dentro da descrição. Nenhum fluxo do módulo grava esse marcador — o modal de tarefa não tem seletor de fase. Tarefas criadas normalmente nunca aparecem em fase alguma do Kanban. (No Gantt/Detalhe›Fases há fallback por sobreposição de datas, então lá não fica totalmente inerte.)","evidencia":"Projetos.jsx:960, :977 (includes(`Fase: ${name}`)); TaskFormModal :2291-2331 sem campo de fase. Fallback por datas só existe em getTasksForPhase :1576-1579 (Fases/Gantt), não em renderKanban.","recomendacao":"Adicionar phase_id às tarefas e casar por FK, ou incluir seletor de fase no modal que injete o marcador."},{"severidade":"medio","descricao":"loadKanbanData faz fetch de /api/projects/all-phases, endpoint que NÃO existe no backend (404 → []). Além disso a função está definida mas nunca é chamada por nenhum useEffect — código morto. kanbanPhases (setado só dentro dela) fica sempre [].","evidencia":"Projetos.jsx:383-400 (fetch all-phases); projects.js não tem rota /all-phases; loadKanbanData não referenciado em useEffect (:402-411) nem em outro lugar. kanbanPhases só recebe valor em :392/:397 (dentro da função morta).","recomendacao":"Remover loadKanbanData/kanbanPhases (o Kanban usa PHASE_NAMES e kanbanTasks via tasksApi.all, não kanbanPhases)."},{"severidade":"medio","descricao":"O /dashboard retorna um ARRAY (v_projects_dashboard, uma linha por projeto/ano) mas o front trata dash como OBJETO agregado (d.total, d.by_status, d.budget_planned, d.budget_spent). Esses campos são undefined → a KpiBar cai sempre no fallback de contagem client-side (counts, só da página filtrada) e o card Orçamento Global mostra sempre R$ 0.","evidencia":"projects.js:20-25 (.select('*') de view → array); Projetos.jsx:417 (const d = dash || {} · array é truthy), :428-432 (d.total/d.by_status), :671-672 (d.budget_planned/d.budget_spent)","recomendacao":"Criar endpoint que agregue (objeto) ou assumir explicitamente a contagem client-side e somar orçamento da lista."},{"severidade":"medio","descricao":"Exclusão de TAREFA é HARD delete (DELETE direto em project_task_subtasks + project_tasks), enquanto o projeto usa soft-delete. Tarefa apagada é irreversível e foge do padrão de auditoria do sistema.","evidencia":"projects.js:243-249 (.delete() em subtasks e tasks) vs :163-172 (app_soft_delete no projeto)","recomendacao":"Avaliar soft-delete em project_tasks se houver valor histórico; senão documentar a exceção."},{"severidade":"baixo","descricao":"initPhases não envia phase_order coerente: monta defaultPhases com phase_order 1..7 mas chama createPhase com {name, order_index: i, status} — sem phase_order. O backend default phase_order=0 para as 7 fases. O stepper só ordena certo porque o front usa order_index localmente; o GET ordena por phase_order (todas 0).","evidencia":"Projetos.jsx:488-497 (order_index: i; phase_order só no array local, nunca enviado) vs projects.js:182 (phase_order: d.phase_order||0) e :83 (.order('phase_order'))","recomendacao":"Enviar phase_order: i+1 em initPhases e unificar order_index/phase_order."},{"severidade":"baixo","descricao":"budget_spent (barras de orçamento do projeto e global) não é derivado dos itens — é campo editável separado do projeto. Pode divergir da soma de actual_amount dos itens.","evidencia":"Projetos.jsx:2019-2026 usa p.budget_spent; salvo como campo do projeto em projects.js:153; itens em project_budget_items são independentes (projects.js:386-396)","recomendacao":"Calcular budget_spent como SUM(actual_amount) dos itens ou deixar claro na UI que é entrada manual independente."},{"severidade":"baixo","descricao":"PATCH de status de tarefa/marco/KPI/risco/orçamento, POST de subtask e POST de comentário NÃO têm authorize('admin','diretor') — qualquer usuário autenticado pode alterar via API direta (a UI esconde os botões para não-editores, mas não há guarda no backend; o backend usa service_role e bypassa RLS).","evidencia":"projects.js:235 (patch tasks/:id/status), :252 (post subtasks), :262 (patch subtasks), :278 (post comments), :311 (patch milestones status), :334 (patch kpis), :366 (patch risks), :399 (patch budget) — todos sem authorize; só router.use(authenticate) no topo (:6)","recomendacao":"Aplicar authorize/authorizeModule consistente nos PATCH/POST de sub-recurso, ou confirmar que edição colaborativa é intencional."}],"verificacao_notas":"Verificação adversarial completa contra os 3 arquivos reais (backend/routes/projects.js 1-448, src/api.js projects namespace :97-128, src/pages/Projetos.jsx). Nível de confiança ALTO — todos os 9 achados foram confirmados com evidência precisa no código; nenhum foi removido. Correções/refinamentos feitos: (1) Retrospectiva reclassificada de 'sem_fonte' para 'incerta' — ela TEM backend (GET/POST :417-446) e 2 dos 4 campos (what_went_well/what_to_improve) persistem corretamente; só rating/actions quebram o round-trip, então 'sem_fonte' superestimava. (2) Achado da Retrospectiva: evidência corrigida — o problema não é só o saveRetrospective, é que tanto o load (:369/:635) quanto a UI (:2086/:2110) usam chaves rating/actions ausentes no payload do GET. (3) Kanban: confirmado que kanbanTasks SIM é populado (tasksApi.all em :405/:526), só a associação por fase é inerte; loadKanbanData é código morto (nunca chamado) e /all-phases não existe — ambos confirmados. (4) Detalhe›Fases: nuance adicionada — o stepper local funciona apesar de phase_order=0 porque ordena por order_index (que É enviado); fallback por datas em getTasksForPhase. (5) Dashboard: confirmado que 'const d = dash || {}' com array truthy deixa d.* undefined → KpiBar e Orçamento Global sempre no fallback/zero. (6) initPhases (baixo): confirmado que createPhase é chamado com order_index e SEM phase_order. (7) Hard-delete de tarefa, budget ntos guarda PII de contato pastoral; qualquer logado que alcance o endpoint destrói o registro permanentemente.","evidencia":"backend/routes/integracao.js:223-232 supabase.from('int_acompanhamentos').delete() sem guard — contraste direto com integracao.js:134-147 (DELETE /visitantes já com authorizeModule('integracao',4) + app_soft_delete)","recomendacao":"Adicionar authorizeModule('integracao',4) e converter para app_soft_delete se int_acompanhamentos estiver na whitelist; senão exigir nível 3+ e logar."},{"severidade":"medio","descricao":"Card 'Decisões neste mês' soma decisões importadas filtrando por ILIKE observacoes '%importacao%' — heurística frágil de texto: depende da palavra exata gravada na importação e muda silenciosamente o número se a convenção variar.","evidencia":"backend/routes/integracao.js:273-281 (.ilike('observacoes','%importacao%'))","recomendacao":"Marcar origem com coluna/flag estruturada (ex.: fonte='importacao') em vez de texto livre, ou documentar a convenção como contrato."},{"severidade":"medio","descricao":"Colunas 'Views D+1'/'Views D+7' no Histórico dependem do coletor YouTube Analytics, cujo OAuth do canal expira a cada 7 dias (app em modo Testing). Quando o token cai, online_ds_total/online_ddus_total ficam zerados no período recente — a aba mostra branco sem explicar.","evidencia":"HistoricoCultos.tsx (colunas Views D+1/D+7) + memória youtube-engajamento-oauth (OAuth do canal caiu 08/06, cap de 7 dias do app em Testing)","recomendacao":"Tratar como sem_fonte intermitente: avisar quando a coleta YouTube estiver desconectada e/ou publicar o app OAuth para estabilizar o token."},{"severidade":"baixo","descricao":"Capacidades de assento são constantes hardcoded no frontend (Templo 1050, Kids 250) para o % de ocupação. Mudança física exige editar código; o CLAUDE.md histórico cita 1200 — divergência indica que o valor já mudou sem fonte única.","evidencia":"VisualizacaoFrequencia.tsx:16-17 const CAP_TEMPLO=1050 / CAP_KIDS=250","recomendacao":"Mover a capacidade para configuração (por tipo em vol_service_types ou tabela de config)."},{"severidade":"baixo","descricao":"A aba Next é alimentada por endpoint de OUTRO módulo (Cuidados: /cuidados/jornada-convertidos) e a cobertura de batismo lê cui_convertidos (Cuidados). Funcional, mas a fronteira Integração↔Cuidados é difusa e a aba pode parecer vazia se o pipeline de convertidos (Cuidados) não estiver populado.","evidencia":"Integracao.tsx:149 \u003cJornadaConvertidos view='next'/> → cuidadosApi.jornadaConvertidos; kpis.js:550 /batismos/cobertura-convertidos cruza cui_convertidos","recomendacao":"Documentar a dependência cross-módulo e, se possível, unificar a fonte canônica de 'convertido' (alinha com o brief de unificação da jornada)."}],"verificacao_notas":"Verificação adversarial concluída reabrindo Integracao.tsx, integracao.js, kpis.js, api.js e VisualizacaoFrequencia.tsx. Confiança ALTA. Resultado: a ficha original estava substancialmente correta — nenhum achado foi refutado/removido e nenhuma aba foi reclassificada. As 7 abas continuam 'viva' (todas montadas e com fonte/endpoint vivo confirmado). Achados confirmados com evidência precisa: (1) ALTO — DELETE /acompanhamentos/:id (integracao.js:223-232) é hard-delete .delete() SEM guard, em contraste direto com DELETE /visitantes (l.134) que JÁ tem authorizeModule('integracao',4)+app_soft_delete; achado real e sério. (2) MEDIO visitantes órfãos — confirmado: api.js:197-209 expõe os namespaces, mas Integracao.tsx não os importa; comentário 'descontinuados (PR #399)' em integracao.js:235. (3) MEDIO heurística ILIKE '%importacao%' — confirmado l.280. (4)(5)(6) confirmados. Ajustes/correções de precisão: corrigi 'quem_usa' e a entrada para refletir que POST /coleta tem só authenticate (qualquer logado submete) e que cadastro de pessoas exige authorizeIntegracao; adicionei refs arquivo:linha em processamento/saída/integrações. Observação: as evidências de linha do auditor para VisualizacaoDecisoes/Batismos/HistoricoCultos não foram reabertas linha-a-linha (substituí por evidência do montador em Integracao.tsx, que é suficiente para confirmar 'viva'); o restante foi verificado diretamente no código.","rota":"/ministerial/integracao","pageFile":"src/pages/ministerial/Integracao.tsx","backendRouteFile":"backend/routes/integracao.js","apiNamespace":"integracao"},{"slug":"membresia","nome":"Membresia","categoria":"ministerial","para_que_serve":"Cadastro central de pessoas da igreja (mem_membros) e tudo que orbita a identidade do membro: dados pessoais/PII, família, trilha dos valores, generosidade (dízimos/ofertas), voluntariado/serviço, inscrições NEXT, batismos, decisões de culto e histórico pastoral. É a \"ficha\" canônica da pessoa — concentra a visão 360º (lida de várias tabelas) e oferece a fila de aprovação de cadastros vindos do formulário público + ferramenta de fusão de duplicatas. Também expõe os endpoints de identidade (qr-lookup/cpf-lookup, lidos de mem_qrcodes) e os endpoints de Totem (NEXT, apresentação de bebês, self-update).","quem_usa":"Staff de Membresia/Secretaria (admin e diretor, ou nível >=3 no módulo via boost). A escrita real (criar/editar membro, contribuição, voluntário, check-in, aprovar cadastro, merge, delete) exige role admin/diretor — todas as rotas de mutação usam authorize('admin','diretor'), não authorizeModule. Leitura por qualquer autenticado (router não impõe nível mínimo nos GETs de KPI/lista). A aba de aprovação de cadastros pendentes só aparece pra isDiretor no frontend.","entrada":["Aba Membros: cadastro de membro via modal de 3 passos (Dados pessoais com nome/sobrenome/CPF/nascimento obrigatórios + foto opcional; Endereço com auto-preenchimento por CEP/ViaCEP; Vínculo/Status + família + parentesco)","Aba Membros > modal do membro: contribuição (tipo/valor/data/forma), vínculo a voluntariado (ministério/papel · grava em mem_voluntarios), check-in manual de serviço (mem_checkins), vínculo/troca de família, entrada/saída de grupo, registro de histórico livre, toggle das etapas da Trilha (só diretor)","Aba Cadastros pendentes (TabCadastros): aprovar (vira mem_membros) / rejeitar (com motivo) / atualizar membro existente quando marcado como duplicado","Aba Duplicados (MembrosDuplicadosPanel): escolher o cadastro a manter e fundir (merge) ou marcar 'não é duplicata'","Aba Jornada (MembersJornadaPanel): leitura/cruzamento dos 5 valores (sem entrada de dado próprio aqui)","Totem/identidade (não na UI desta página): inscrição no NEXT, apresentação de bebês, self-update de PII; lookup de passe por token (qr-lookup) ou CPF (cpf-lookup)"],"processamento":["AUTOMÁTICO · papéis na lista: GET /membresia/membros anota cada membro com papéis (is_voluntario/is_visitante/in_grupo_ativo/is_contribuinte/is_inscrito_next) lendo a view vw_pessoas_papeis em batch (membresia.js:349)","AUTOMÁTICO · KPIs do cabeçalho: GET /membresia/kpis calcula total/byStatus/famílias/contribuintes_ativos em JS no backend (membresia.js:2079) — não usa coletor de KPI nem cron","AUTOMÁTICO · níveis de generosidade e serviço: calcularNivelGenerosidade (última contribuição: \u003c=30d ativo, \u003c=150d irregular, senão inativo) e calcularNivelServico computados sob demanda no GET /membros/:id e qr/cpf-lookup","AUTOMÁTICO · detalhe 360º: GET /membros/:id roda ~11 queries paralelas (trilha, histórico, grupos, contribuições, vol_profiles, next_inscricoes, cui_jornada180, batismo_inscricoes, cultos_decisoes_pessoas) e deriva grupo_atual, totais do ano, ministérios ativos/históricos, checkins, escalas futuras (membresia.js:389)","AUTOMÁTICO · serviço lido de vol_profiles/vol_team_members/vol_check_ins/vol_schedules (módulo Voluntariado é a fonte única do DETALHE) — não de mem_voluntarios neste detalhe (membresia.js:481-553)","AUTOMÁTICO · sync Cérebro: criar/editar membro chama enqueueSync('membro', id) (membresia.js:662,680); inserir contribuição chama enqueueSync('contribuicao-mes', yyyymm) (membresia.js:1452); foto é copiada pro SharePoint (módulo 'membresia', pasta Fotos) em background","AUTOMÁTICO · detecção de duplicados: GET /duplicados lê a view vw_membros_duplicados (membresia.js:2136); merge chama a RPC merge_membros (membresia.js:2209)","MANUAL · aprovar cadastro pendente: POST /cadastros/:id/aprovar cria/atualiza mem_membros campo a campo, com fallback de coluna ausente (membresia.js:1848)","MANUAL · trilha, contribuição, voluntário, check-in, família, histórico, escala: todos inseridos manualmente por staff"],"saida":["Tela de lista de membros com badges de papéis (VOL/VIS/GRP/CTB/NXT) + filtros por status e papel","4 cards KPI: Total Membros, Membros Ativos, Famílias, Contribuintes Ativos (GET /membresia/kpis)","Modal de detalhe 360º do membro (8 abas: Informações, Família, Grupo, Generosidade, Serviço, NEXT, Trilha, Histórico) com totais de contribuição do ano e nível de generosidade/serviço","KPIs de contribuição (GET /contribuicoes/kpis): totais por tipo no ano, classificação de membros por nível, contribuintes únicos","Export LGPD por membro (GET /lgpd/membro/:id/exportar — endpoint fora deste arquivo; ação auditada com motivo obrigatório)","Painel de duplicados + log de merge (GET /merge-log)","Fila de cadastros pendentes com contadores por status","orfaos-stats (vw_membros_orfaos_stats): voluntários/batismos sem vínculo a mem_membros (endpoint sem UI nesta página)"],"integracoes":{"alimenta":["Cérebro CBRio — via enqueueSync('membro') no create/update de membro (membresia.js:662,680) e enqueueSync('contribuicao-mes') ao lançar contribuição (membresia.js:1452)","SharePoint — foto do membro copiada via uploadModuleFile('membresia','Fotos',...) em background (membresia.js:723)","mem_trilha_valores — etapas da trilha alimentam o cálculo dos 5 valores / NSM (jornada)","mem_contribuicoes — alimenta KPIs de generosidade e o valor Generosidade da Jornada","next_inscricoes — inscrição NEXT pelo totem (notifica módulo next)","apresentacao_bebes / notificação módulo integracao — agendame e sobre vol_profiles/vol_check_ins."},{"severidade":"medio","descricao":"KPI 'voluntariado.funil' não mede funil de voluntariado: conta novos mem_membros no período, com observação que admite 'aprox. funil'. O número não reflete inscrições→alocações de voluntário (que existem em vol_inscricoes e em /inscricoes-summary).","evidencia":"kpiAutoCollector.js:477-481 (count mem_membros por created_at; observacao 'Novos membros (aprox. funil)')","recomendacao":"Religar a fonte do KPI a vol_inscricoes (recebidas/alocadas) ou aposentar o coletor para não exibir número enganoso no painel."},{"severidade":"medio","descricao":"Relatórios calculados 100% no cliente sobre listas não paginadas: o backend não usa .range() em GET /schedules e GET /check-ins, e useVolReports consome services.list/schedules.list/checkIns.list sem filtro de período no servidor. Com o histórico crescendo, o cap de 1000 linhas do PostgREST trunca silenciosamente schedules/check-ins e degrada taxa/inativos/termômetro.","evidencia":"voluntariado.js:918-936 (/schedules sem range) e :942-953 (/check-ins sem range); useVolReports.ts consome as listas globais","recomendacao":"Expor agregação no backend (RPC paginado por período) ou paginar + filtrar por data no servidor, como já alertado para outras telas (cap-1000)."},{"severidade":"medio","descricao":"Endpoints de gestão sem checagem de nível além do gate base 'membresia≥1': criação/edição/remoção de equipes (teams-manage), posições, profiles, roles, schedules, services e check-ins não chamam authorizeModule mais alto. Só /form-opcoes e a triagem de inscrição validam ≥3. Qualquer usuário com membresia≥1 pode mutar a operação do voluntariado.","evidencia":"voluntariado.js:9 router.use(authorizeModule('membresia',1)); POST /profiles (518), POST /roles (651), POST/PUT/DELETE /teams-manage (1656,1667,1678), POST /positions (1700) sem gate adicional — vs form-opcoes (576,608,632) e PATCH /inscricoes (2253-2257) que checam ≥3","recomendacao":"Aplicar authorizeModule('voluntariado',3) (ou similar) nas escritas operacionais, mantendo o portal self-service nos /me*."},{"severidade":"baixo","descricao":"Taxonomia de status da triagem desalinhada (DEGRADADO de 'alto' após verificação): o frontend expõe status extras 'kids', 'nao_responde' e 'nao_pode_ou_duplicata' em STATUS_LABELS/COLORS e no dropdown de FILTRO, mas o backend PATCH /inscricoes/:id só aceita ['inscrito','enviado_ministerio','integrado']. NÃO existe botão que GRAVE os status extras — os botões de ação só enviam os 3 válidos —, então não há ação visível que quebre (a afirmação original do 400 ao usar era incorreta). O efeito real é cosmético/confuso: o filtro oferece status que nunca serão gravados pela UI (só apareceriam se vierem da fonte externa).","evidencia":"VolInscricoes.tsx:17-33 (STATUS_LABELS/COLORS + filtro linha 444) vs botões linhas 591-614 (só enviado_ministerio/integrado/inscrito); voluntariado.js:2246 VOL_INSCRICAO_STATUS; api.js:1653 atualizarInscricao envia só {status}","recomendacao":"Decidir a taxonomia única: ou ampliar VOL_INSCRICAO_STATUS no backend + CHECK da tabela e adicionar ações para os status extras, ou remover os status órfãos do frontend (labels/cores/filtro)."},{"severidade":"baixo","descricao":"Inconsistência da regra 'alocada' nas inscrições: o comentário diz considerar 'integrado ou enviado_ministerio', mas isAlocada só conta 'integrado'. A taxa de alocação do funil ignora os encaminhados ao ministério.","evidencia":"voluntariado.js:2149 (comentário) vs :2150 (const isAlocada = (s) => s === 'integrado')","recomendacao":"Alinhar comentário e regra; confirmar com a coordenação se 'enviado_ministerio' deve entrar no numerador."},{"severidade":"baixo","descricao":"porArea do funil cobre apenas 'kids' e 'sede' hardcoded; inscrições de ami/bridge/online entram no total mas somem do recorte por área (porArea[row.area] indefinido). Note que o cadastro de opções do formulário já aceita as 5 áreas canônicas (form-opcoes valida kids/sede/ami/bridge/online), então a agregação está mais estreita que a entrada.","evidencia":"voluntariado.js:2155-2158 (porArea só kids/sede) e :2168 (if (porArea[row.area])); contraste com voluntariado.js:580,614 (areas = kids/sede/ami/bridge/online)","recomendacao":"Generalizar porArea para as 5 áreas canônicas (kids/sede/ami/bridge/online)."},{"severidade":"baixo","descricao":"Risco de inconsistência de identidade no QR/check-in legado: existem dois trilhos (vol_profiles.qr_code e vol_volunteer_qrcodes via planning_center_person_id) e o check-in 'sem escala' grava volunteer_id null quando o QR/PCO não resolve um vol_profile — pessoas podem não aparecer corretamente nos relatórios por volunteer_id.","evidencia":"voluntariado.js:1133-1138 qr-lookup (sem identidade resolvível → isUnscheduled, id null); :1287-1294 self-checkin grava volunteer_id null quando planning_center_id não mapeia vol_profile","recomendacao":"Consolidar identidade no vol_profiles/mem_membros (já em curso na unificação por CPF) e backfillar volunteer_id nos check-ins órfãos."}],"verificacao_notas":"Verificação adversarial contra o código vivo (index.tsx, VolInscricoes.tsx, voluntariado.js, kpiAutoCollector.js, api.js). Confiança ALTA. Todas as 13 abas confirmadas VIVAS (rotas + endpoints/fontes reais) — nenhuma reclassificação. Dos 8 achados: 6 SUSTENTADOS com evidência precisa (desaparecidos chaves incompatíveis kpiAutoCollector.js:663/666/668; funil=novos membros :477-481; cap-1000 em /schedules :918 e /check-ins :942; gate só membresia≥1 nas escritas :9 vs form-opcoes/inscrições ≥3; isAlocada só 'integrado' :2150 vs comentário :2149; porArea só kids/sede :2155 enquanto form aceita 5 áreas :580; QR/identity null :1133/:1287). 1 achado CORRIGIDO E DEGRADADO de alto→baixo: o mismatch de status NÃO quebra ação nenhuma — os botões da triagem (VolInscricoes.tsx:591-614) só enviam enviado_ministerio/integrado/inscrito (todos válidos em VOL_INSCRICAO_STATUS); os status extras (kids/nao_responde/nao_pode_ou_duplicata) são puramente de exibição/filtro, sem botão que os grave, logo a afirmação 'retorna 400 ao usar' era falsa; o problema remanescente é cosmético (filtro oferece status órfãos). O achado 'desaparecidos' foi reordenado para o topo como único 'alto'. para_que_serve/entrada/processamento/saida/integracoes ajustados para refletir gates reais e citações de linha.","rota":"/ministerial/voluntariado","pageFile":"src/pages/ministerial/voluntariado/index.tsx","backendRouteFile":"backend/routes/voluntariado.js","apiNamespace":"voluntariado"},{"slug":"next","nome":"NEXT — Porta de entrada da CBRio","categoria":"ministerial","para_que_serve":"Operar o evento NEXT (encontro nos 3 primeiros domingos do mês), porta de entrada de novos para a igreja. Centraliza: inscrição (pública por link/QR ou manual), controle de presença (check-in) por evento, e o encaminhamento de cada inscrito para os próximos passos da jornada (batismo, servir, grupo, dízimo) via \"indicações\" que notificam as áreas responsáveis. Toda pessoa que se inscreve vira automaticamente um registro em mem_membros (status visitante) via findOrCreateMembro.","quem_usa":"Equipe do NEXT / Integração (coordenador e voluntários do evento) para gerar eventos, cadastrar inscritos, fazer check-in e marcar indicações. As áreas de destino (Integração, Voluntariado, Grupos, Generosidade) recebem as indicações via notificação. O público em geral usa apenas o formulário público de inscrição (/next/inscrever).","entrada":["Eventos: gera os 3 domingos do mês com 1 clique (aba Eventos > 'Gerar eventos do mês'); a UI lê o detalhe do evento mas NÃO expõe formulário de edição — alterar data/status/observações/totais só via API (PUT /eventos/:id).","Inscrições manuais (aba Inscritos > 'Cadastrar inscrição'): evento, nome, sobrenome, email* (obrigatório), telefone* (obrigatório, >=10 dígitos), CPF (opcional, validado), data de nascimento (opcional), origem da lista (impressa/manuscrito), observações.","Inscrição pública (form /next/inscrever, fora do AppShell): nome*, email*, telefone*, CPF opcional, nascimento, observações + honeypot (campo website).","Check-in: toggle presente/ausente por inscrito (aba Inscritos e dentro do modal de detalhe do evento).","Indicações (modal/card do inscrito, aba Inscritos): marca batismo/servir/grupo/dízimo + anotações.","Status de indicação (aba Indicações): pendente → em_andamento → concluído.","Tarefas (aba Tarefas): tarefas operacionais da área NEXT via componente genérico ProcessosTarefas (area='NEXT')."],"processamento":["AUTOMÁTICO — criação de membro: tanto POST /next/inscricoes (next.js, bloco findOrCreateMembro antes do insert) quanto POST /public/next/inscrever (publicNext.js) chamam findOrCreateMembro (de routes/pessoas) e gravam membro_id na inscrição, criando mem_membros status='visitante' se não existir. Se findOrCreateMembro falha, a inscrição é criada mesmo assim (membro_id null) pra não perder dado.","AUTOMÁTICO — geração de eventos: POST /eventos/auto-create-mes calcula os 3 primeiros domingos do mês e faz upsert idempotente (onConflict 'data', ignoreDuplicates), titulo='NEXT \u003cdata>'.","AUTOMÁTICO — contagem de inscritos/check-ins: GET /eventos lê a view vw_next_eventos_counts (1 row/evento) para evitar o cap de 1000 do PostgREST ao agregar.","AUTOMÁTICO — indicações: POST /inscricoes/:id/indicacoes seta as flags indicou_* na inscrição, faz upsert em next_indicacoes (1 por tipo, onConflict 'inscricao_id,tipo', status='pendente'), e dispara notificar() para o módulo de destino (integracao/voluntariado/grupos/generosidade) — mapa TIPOS_AREA.","AUTOMÁTICO — recálculo de KPIs: após indicações, recalcularKpisNext() roda coletarTodos({fontes:['next.']}) em setImmediate (background). Botão 'Recalcular KPIs' no header dispara kpis.v2.coletarAuto({fontes:['next.']}).","AUTOMÁTICO — snapshot pré-NEXT (SÓ no form público): publicNext.js grava ja_batizado (de mem_membros.batizado) e ja_voluntario (de vol_profiles ativo por CPF); ja_doador é sempre
