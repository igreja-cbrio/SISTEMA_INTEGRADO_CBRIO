ulo_id) e chama bustPermissionCaches() — invalida o cache de 5 min do middleware imediatamente","AUTOMÁTICO: setCargo (:465), setRole (:502), setAreas (:524), setModulo (:553) e removerOverride (:615) todos chamam bustPermissionCaches() ao final; efeito imediato no banco (mas a pessoa afetada precisa logout/login pra renovar o JWT)","AUTOMÁTICO: resolverUsuarioId() (:32) faz a ponte profile(UUID)↔usuarios(INTEGER legado) por e-mail e cria registro em usuarios sob demanda (lazy-create) no primeiro write; fallback para rh_funcionarios quando o id é de funcionário sem profile (:46-52)","AUTOMÁTICO: PUT /usuario/:id/modulo (:553) compara o override com a célula default do cargo; se for idêntico (níveis + E/A/* iguais E sem expira_em) DELETA o override em vez de gravar (:581-591, volta ao default)","AUTOMÁTICO: bloqueiaAutoEdicao() (:11) barra (403) qualquer admin de editar o PRÓPRIO cargo/áreas/role/overrides (anti-autoescalação) — aplicado em cargo/areas/role/modulo (NÃO em DELETE override)","AUTOMÁTICO: GET /matriz (:327) e GET /diagnostico (:195) paginam via .range() pra contornar o cap de 1000 linhas do PostgREST (matriz ~1073 linhas)","MANUAL: botão Forçar bust de cache (POST /cache/bust, :184) — usado depois de rodar UPDATE direto no SQL Editor, já que esse caminho não dispara o bust automático"],"saida":["Tela da matriz cargo×módulo agrupada por categoria (Estratégica/Ministerial/Operacional/Dados-IA-Admin) com badges de nível e legenda","Tela de Usuários: lista de colaboradores com cargo atual, destaque âmbar e filtro para 'Sem cargo', contador de pendentes","Diálogo de edição por pessoa mostrando cargo, acesso base, áreas e overrides ativos (com aviso de expiração)","Endpoint de diagnóstico GET /permissoes/diagnostico/:email (:195, JSON detalhado da computação de permissão) — sem tela própria nem método no api.js, só via chamada direta/debug","Não há export de arquivo nem KPI; a saída real é a permissão efetiva consumida pelo middleware (req.user.granular.modulePerms) e pela view vw_permissao_efetiva"],"integracoes":{"alimenta":["Middleware backend/middleware/auth.js (authorizeModule) — lê cargo_modulo_permissao + permissoes_modulo + usuario_areas (boost por área) pra montar req.user.granular.modulePerms","Frontend AuthContext / menuAccess.navItemAllowed — visibilidade de menu, ⌘K e ModuleGuard das rotas via modulePerms","RLS do banco — funções current_user_module_level(slug) replicam a matriz no Postgres pras policies","View vw_permissao_efetiva — consolida override → default do cargo → 0","Cache em memória do middleware — invalidado por bustPermissionCaches() a cada write","Aba de permissões do módulo RH (RH.jsx:2257-2274) — reusa este backend via permissoes.usuarioPorEmail/criarUsuario/usuario/setModulo pra editar permissão direto na ficha do funcionário"],"alimentado_por":["Tabelas cargos, modulos, setores, areas (catálogos) via GET /estrutura (:305) e GET /matriz (:327)","Tabela usuarios (vínculo e-mail↔cargo, id INTEGER legado) — lazy-create por resolverUsuarioId","Tabela profiles (role/acesso base e lista de colaboradores) + rh_funcionarios (funcionário sem profile ainda, status='ativo') + vol_profiles e mem_cadastros_pendentes (para EXCLUIR membros/voluntários da lista de colaboradores) — GET /colaboradores (:83)","usuario_areas (áreas que dão boost), permissoes_modulo (overrides), permissoes_escopo_extra (escopos extras, só leitura no diagnóstico/usuario)"]},"abas":[{"nome":"Matriz cargo × módulo","funcao":"Edita o nível padrão de acesso (0-5) e os modificadores E/A/* de cada cargo em cada módulo. É a base que todo usuário daquele cargo herda.","passo_a_passo":["Escolher um cargo no select","Opcional: filtrar módulo por nome/slug","Ajustar o nível pelo select e marcar/desmarcar E/A/* (salva por célula, sem botão)","Se editou via SQL direto, clicar em Forçar bust de cache"],"estado":"viva","evidencia":"Permissoes.jsx:83 MatrizTab + api.matriz()/api.setCelula() → backend permissoes.js:327 GET /matriz e :363 PUT /matriz/celula (upsert + bustPermissionCaches)","recomendacao":"Manter. Os checkboxes E/A/* salvam por célula corretamente; sem ressalvas."},{"nome":"Usuários","funcao":"Exceções por pessoa: trocar cargo, definir acesso base (role), atribuir áreas (boost) e criar/remover overrides individuais por módulo com motivo e expiração.","passo_a_passo":["Buscar a pessoa por nome/e-mail ou filtrar por cargo (inclui filtro 'Sem cargo')","Clicar em Editar para abrir o diálogo","Ajustar Cargo / Acesso base (salvam no change) e marcar Áreas (botão 'Salvar áreas')","Adicionar override (módulo + nível + E/A/* + motivo + expira em) ou remover um existente"],"estado":"viva","evidencia":"Permissoes.jsx:76 importa ./Usuarios; Usuarios.jsx:33 componente; salvarCargo/salvarRole/salvarAreas/setModulo → permissoes.js:465/:502/:524/:553","recomendacao":"Manter. Notar que o override grava nivel_leitura = nivel_escrita (Usuarios.jsx:510-511); a própria UI comenta que 'UI futuramente pode diferenciar' — não há entrada separada de leitura vs escrita."}],"achados_auditoria":[{"severidade":"medio","descricao":"A matriz não tem nenhum cap de nível por módulo sensível: a tela permite setar qualquer cargo em nível 4/5 em módulos com PII/financeiro (rh, financeiro, membresia). O PUT /matriz/celula valida APENAS 0\u003c=nivel\u003c=5, sem allowlist por módulo. A única salvaguarda é o bloqueiaAutoEdicao (não pode editar a si mesmo). A memória de auditoria 2026-06-15 lista 'matriz/celula nível 4' como ponto ainda aberto.","evidencia":"permissoes.js:367 valida só (typeof nivel==='number' && 0\u003c=nivel\u003c=5), sem allowlist por módulo; bloqueiaAutoEdicao só barra auto-edição (:11). MEMORY.md auditoria-seguranca-2026-06-15: 'Aberto: ... matriz/celula nível 4'","recomendacao":"Avaliar exigir confirmação extra (ou restringir a super-admin) ao conceder nível >=4 em módulos com PII/financeiro, ou ao menos registrar em audit log (CLAUDE.md indica que cargo_modulo_permissao já tem trigger trg_audit_... sobre nivel/pode_exportar/pode_aprovar/escopo_proprio)."},{"severidade":"baixo","descricao":"O override individual só permite UM nível (a UI manda nivel_leitura = nivel_escrita). O backend suporta leitura e escrita separadas, mas não há campo na tela — quem precisar de 'lê mas não escreve via override' não consegue expressar isso, fica idêntico nos dois.","evidencia":"Usuarios.jsx:508-511 comentário 'Backend espera leitura + escrita separados ... Usamos o mesmo valor pros 2'; backend permissoes.js:556 aceita nivel_leitura/nivel_escrita distintos","recomendacao":"Se o caso de uso existir, adicionar dois selects no NovoOverrideForm. Caso contrário, documentar que override é nível único por design."},{"severidade":"baixo","descricao":"GET /permissoes/diagnostico/:email é uma ferramenta de debug rica (mostra tipos int vs uuid, contagem de linhas da matriz, áreas, overrides) mas não tem nenhuma tela nem método no api.js — só é acessível chamando a URL na mão. Diretores/admins não-técnicos não conseguem usar.","evidencia":"permissoes.js:195 GET /diagnostico/:email; o namespace permissoes do api.js (:1075-1090) não tem método 'diagnostico'; nenhum botão na UI","recomendacao":"Opcional: expor um botão 'Diagnosticar acesso' no diálogo de Usuários que renderize o JSON de forma legível, para auto-suporte sem SQL."},{"severidade":"baixo","descricao":"Mudar cargo/áreas tem efeito imediato no banco e faz bust de cache, mas a pessoa afetada SÓ vê a mudança após logout/login (o JWT carrega o granular). O aviso de 'precisa relogar' aparece apenas no toast do role; em salvarCargo e salvarAreas o toast não menciona relogin, o que gera a percepção de 'mudei e não pegou'.","evidencia":"Usuarios.jsx:258 toast 'Cargo atualizado' (sem aviso) e :292 toast 'Áreas atualizadas' (sem aviso) vs :273 toast do role 'Acesso base atualizado · a pessoa precisa sair e entrar de novo'","recomendacao":"Padronizar o aviso de 'a pessoa precisa sair e entrar' nos saves de cargo e áreas, como já é feito no role."},{"severidade":"baixo","descricao":"GET /cargo/:id (api.permissoes.cargo) consulta cargo_modulo_permissao sem a paginação que o GET /matriz tem; se um cargo tiver >1000 células truncaria silenciosamente. Hoje é seguro pelo volume (~37 módulos por cargo). O método api.cargo está exposto mas não é chamado por nenhuma tela.","evidencia":"permissoes.js:384 GET /cargo/:id usa select('*').eq('cargo_id') sem loop de .range(); api.js:1081 cargo() sem consumidor de UI (grep em src/ não acha api.cargo/permissoes.cargo fora da definição)","recomendacao":"Sem ação urgente (37 módulos \u003c\u003c 1000). Avaliar remover api.cargo se confirmado sem uso."}],"verificacao_notas":"Refutei e reabri os 3 arquivos (Permissoes.jsx, Usuarios.jsx, permissoes.js + api.js). Correções: (1) REMOVI o achado low 'criarUsuario/usuarioPorEmail são lógica morta sem consumidor' — é FALSO: RH.jsx:2264-2266 (aba de permissões dentro do módulo RH) chama as DUAS (usuarioPorEmail pra achar e criarUsuario com cargo_id:2 quando não existe). Não é resíduo; é backend vivo consumido por outra tela. Adicionei essa integração ('alimenta' → RH.jsx). (2) Ajustei a evidência do achado de relogin pra incluir tanto salvarCargo (:258) quanto salvarAreas (:292) sem aviso — antes citava só cargo. (3) Confirmei e mantive os outros 4 achados com linha precisa: nível-único do override (Usuarios.jsx:508-511 + backend :556), sem cap por módulo na matriz (validação só :367), diagnostico sem método no api.js, /cargo/:id sem paginação e sem consumidor. (4) bloqueiaAutoEdicao: notei que NÃO é aplicado no DELETE override (:615), só nos PUTs — refinamento no processamento. Ambas as abas confirmadas VIVAS. Confiança alta — todos os endpoints, linhas e consumidores foram verificados contra o código real.","rota":"/admin/permissoes","pageFile":"src/pages/admin/Permissoes.jsx","backendRouteFile":"backend/routes/permissoes.js","apiNamespace":"permissoes"},{"slug":"whatsapp-admin","nome":"Bot WhatsApp","categoria":"Administrativo / Configurações (ministerial — Integração + Grupos)","para_que_serve":"Canal de coleta passiva de dados ministeriais pelo WhatsApp. Líderes/assistentes cadastrados mandam os números da semana (frequência, decisões, visitantes, kids) por texto livre ou por formulário nativo (WhatsApp Flows); o bot interpreta com IA (Claude Haiku) ou pelo Flow e gera uma \"coleta\" pendente que o coordenador revisa e aplica — nada entra no banco automaticamente (revisão-antes-de-aplicar). Números desconhecidos recebem respostas institucionais (missão/visão/horários/endereço) sem coletar dado. A tela /admin/whatsapp é o painel de gestão: revisar/aplicar/rejeitar coletas, vincular telefones a pessoas e configurar o conteúdo institucional + o liga/desliga do bot.","quem_usa":"Coordenadores de Integração ou de Grupos (nível 3+ em integracao OU grupos · authorizeModule('whatsapp-admin', 3) em backend/routes/whatsapp.js:13). Os líderes/assistentes de campo são os REMETENTES das mensagens (no WhatsApp), não operam a tela.","entrada":["Aba Coletas: o coordenador não lança dado — apenas revisa o que o bot já capturou e clica Aplicar/Rejeitar (Whatsapp.jsx:74-214).","Aba Líderes vinculados: vincula um telefone (DDI+DDD+número) a um profile, define papel (líder/assistente/coordenador/outro), escopo (Grupos e/ou Cultos-Integração) e grupo opcional (Whatsapp.jsx:314-433).","Aba Configuração: liga/desliga o bot (ia_ativa) e preenche o conteúdo institucional (sobre, missão, visão, valores, horários, endereço, instruções extras) (Whatsapp.jsx:436-517).","A ENTRADA de dados ministeriais em si acontece FORA da tela: o líder envia texto ou responde o formulário no WhatsApp (webhook backend/routes/publicWhatsapp.js)."],"processamento":["AUTOMÁTICO · Recebimento: webhook público POST /api/whatsapp/webhook (backend/routes/publicWhatsapp.js) responde 200 imediato e processa async; valida HMAC (fail-closed em produção), respeita o toggle whatsapp_config.ia_ativa, dedup por whatsapp_message_id e cap de msgs/evento.","AUTOMÁTICO · Roteamento de persona: telefone não cadastrado em whatsapp_lideres → responderInstitucional (services/whatsappParser.js · Haiku) e grava coleta status='ignorado'/modulo_destino='institucional'. Cadastrado sem números e sem sessão → envia o formulário (Flow) na hora se flowsConfigurados() e escopo inclui integracao; só de grupos → orientação por texto (publicWhatsapp.js:233 tratarFlowReply).","AUTOMÁTICO · Coleta conversacional (LLM): com números soltos ou sessão aberta, parseConversa (Haiku · whatsappParser.js) faz merge multi-turno e define status parseado (completo) / aguardando_info (falta dado) / recebido (saudação). O parser emite parsed.dados com as chaves presentes/presencial/visitantes/decisoes/kids (whatsappParser.js:37,85-89); estado vive em whatsapp_coletas.parsed por 7 dias.","AUTOMÁTICO · Coleta por formulário (Flows): resposta nfm_reply roteada por flowColeta.tratarFlowReply (services/whatsappFlowColeta.js); estado fica em parsed (fonte:'flow', culto_id, freq:{presencial,kids}, dec:{presencial,online,kids}, a_cadastrar:N). O Flow coleta SÓ as contagens — NÃO cria pessoas (whatsappFlowColeta.js não tem nenhum insert em cultos_decisoes_pessoas; comentário linha 125 'decisões a virar pessoas no /integracao desktop').","AUTOMÁTICO · Sync de líderes: criar/editar grupo dispara syncWhatsappLideres (backend/routes/grupos.js, fire-and-forget) que reflete líder/supervisor em whatsapp_lideres.","MANUAL · Aplicar coleta: POST /api/whatsapp/coletas/:id/aplicar (whatsapp.js:195). Integração → cria cultos_dados_submissoes status='pendente' (no culto do Flow se fonte='flow' via aplicarColetaFlow whatsapp.js:156-188, senão no culto mais recente ≤7 dias whatsapp.js:214-227); cai na fila /integracao?tab=pendentes. Grupos → só marca 'aplicado' (whatsapp.js:255-259 · encontro exige lista nominal de presenças, não fornecida pelo WhatsApp).","MANUAL · Rejeitar coleta: POST /coletas/:id/rejeitar grava status='rejeitado' (whatsapp.js:267-278).","MANUAL · Config/Líderes: CRUD em whatsapp_config (id=1, whatsapp.js:285-313) e whatsapp_lideres (soft-delete via app_soft_delete, whatsapp.js:109-122)."],"saida":["Lista de coletas filtrável por status (Aguardando confirmação/Aplicadas/Rejeitadas/Ignoradas/Todas), com mensagem original, resumo do que a IA entendeu e chips de Presentes/Presencial/Visitantes/Decisões/Kids (Whatsapp.jsx:118-213).","Submissões pendentes de frequência/decisões na fila da Integração (cultos_dados_submissoes), que ao serem confirmadas lá alimentam os KPIs de culto.","Lista de líderes vinculados (nome, papel, escopo, grupo, telefone, ativo/inativo) (Whatsapp.jsx:257-307).","NÃO produz KPI próprio, relatório nem export — é um canal de entrada; o valor analítico aparece depois na Integração/Grupos."],"integracoes":{"alimenta":["Integração (módulo integracao) · via INSERT em cultos_dados_submissoes status='pendente' ao aplicar coleta de integração (whatsapp.js:230-242 conversacional / :171-179 flow) — cai em /integracao?tab=pendentes e, após confirmação manual lá, vira frequência/decisões nos KPIs de culto.","Grupos · indireto/manual: aplicar coleta de grupos só marca 'aplicado' (whatsapp.js:255-259); o encontro real é lançado à mão no módulo Grupos. NÃO escreve em mem_grupo_encontros/presenças.","OBS (correção da auditoria): no fluxo de FORMULÁRIO o bot NÃO cria pessoas em cultos_decisoes_pessoas — o serviço whatsappFlowColeta.js só grava contagens em parsed e aplicarColetaFlow só cria submissões templo/kids; o campo a_cadastrar apenas sinaliza quantas decisões aguardam cadastro NOMINAL no /integracao aba Decisões (desktop)."],"alimentado_por":["WhatsApp Cloud API (Meta) · via webhook público /api/whatsapp/webhook (mensagens de texto e respostas de Flow).","Cadastro de líderes · whatsapp_lideres, preenchido manualmente nesta tela e auto-sincronizado pelo módulo Grupos (grupos.js syncWhatsappLideres).","Config institucional · whatsapp_config (id=1), preenchida na aba Configuração.","profiles e mem_grupos · para vincular pessoa e grupo ao telefone (whatsapp.js:24-28 join · DialogVincular usa users.list + grupos.list)."]},"abas":[{"nome":"Coletas","funcao":"Revisar o que o bot capturou e aplicar (enviar pra fila da Integração) ou rejeitar.","estado":"viva","evidencia":"Whatsapp.jsx:65 \u003cAbaColetas/> + :74-214; backend whatsapp.js:129 GET /coletas, :195 aplicar, :267 rejeitar — tudo implementado e batendo com api.js:306-308 (listColetas/aplicarColeta/rejeitarColeta).","passo_a_passo":["Escolher o filtro (default 'Aguardando confirmação').","Ler a mensagem original + o resumo entendido + os chips de números.","Clicar 'Enviar pra Pendentes' (integração) ou 'Marcar lançado' (grupos), ou 'Rejeitar'.","Para integração, confirmar depois na fila /integracao?tab=pendentes pra entrar nos KPIs."],"recomendacao":"Manter. Observar o descasamento de chaves dos chips (ver achados): 'presentes'/'visitantes' aparecem mas nunca viram número aplicado."},{"nome":"Líderes vinculados","funcao":"Cadastrar/editar/ativar/remover os telefones autorizados a reportar pelo bot, com papel, escopo e grupo.","estado":"viva","evidencia":"Whatsapp.jsx:66 \u003cAbaLideres/> :225-312 + DialogVincular :314-433; backend whatsapp.js:20 (GET), :40 (POST), :88 (PUT), :109 (DELETE soft-delete via app_soft_delete) — CRUD completo, bate com api.js:301-304.","passo_a_passo":["Clicar 'Vincular líder' e escolher a pessoa (profile) e o papel.","Digitar o telefone com DDI 55 (só dígitos · validação 12-13 dígitos).","Marcar o escopo (Grupos e/ou Cultos/Integração) e, se grupos, o grupo opcional.","Salvar; depois pode ativar/desativar (Power) ou remover (lixeira)."],"recomendacao":"Manter. O PUT aceita papel (whatsapp.js:95), mas a lista só edita ativo via toggle — papel/escopo só no cadastro; aceitável."},{"nome":"Configuração","funcao":"Liga/desliga global do bot e edição do conteúdo institucional usado nas respostas a desconhecidos.","estado":"viva","evidencia":"Whatsapp.jsx:67 \u003cAbaConfig/> :436-517; backend whatsapp.js:285 GET /config e :298 PUT /config sobre whatsapp_config id=1; o webhook lê ia_ativa e institucional em publicWhatsapp.js.","passo_a_passo":["Ligar/desligar 'Bot ativo' (pausa sem mexer no webhook).","Preencher Sobre/Missão/Visão/Valores/Horários/Endereço.","(Opcional) Instruções extras pra IA.","Clicar Salvar."],"recomendacao":"Manter. Conteúdo institucional só tem efeito real se a integração Meta estiver ativa e o bot recebendo mensagens de desconhecidos."}],"achados_auditoria":[{"severidade":"medio","descricao":"Descasamento entre as chaves de dados exibidas na aba Coletas e as que o backend realmente aplica. A UI mostra chips para d.presentes, d.presencial, d.visitantes, d.decisoes, d.kids (Whatsapp.jsx:180-184) e o parser emite exatamente essas 5 chaves (whatsappParser.js:37,45,85-89), mas o aplicar de integração conversacional só usa dados.presencial / dados.kids / dados.decisoes (whatsapp.js:228-236). Coletas de grupos (parser emite presentes/decisoes/visitantes) não têm aplicação de dado nenhuma — só marcam 'aplicado'. Resultado: 'presentes'/'visitantes' aparecem na tela mas nunca viram número no sistema.","evidencia":"Whatsapp.jsx:180-184 + whatsappParser.js:85-89 vs backend/routes/whatsapp.js:228-236 e :255-259","recomendacao":"Alinhar o contrato do parsed.dados: documentar quais chaves o parser emite por módulo e exibir/aplicar coerente. Para grupos, deixar claro na UI que 'presentes/visitantes' são apenas registro visual (lançamento manual no módulo Grupos)."},{"severidade":"medio","descricao":"Coleta de grupos é estrutural-incompleta por design: aplicar só muda status para 'aplicado', sem criar encontro nem presença. Para o coordenador, 'Marcar lançado' pode dar falsa sensação de que o dado entrou no sistema; ele ainda precisa lançar à mão no módulo Grupos.","evidencia":"backend/routes/whatsapp.js:255-259 e aviso Whatsapp.jsx:203-207","recomendacao":"Manter o comportamento (limitação real: encontro exige lista nominal), mas reforçar o copy do botão (ex.: 'Marcar como lido — lance no módulo Grupos') para reduzir ambiguidade."},{"severidade":"medio","descricao":"Aplicação conversacional de integração associa a submissão ao culto mais recente dos últimos 7 dias (whatsapp.js:214-227), não ao culto que o líder tinha em mente. Em semanas com vários cultos no período, o dado pode cair no culto errado silenciosamente.","evidencia":"backend/routes/whatsapp.js:214-227","recomendacao":"Para coletas conversacionais, oferecer ao coordenador a escolha do culto antes de aplicar (o fluxo Flow já resolve isso ao carregar culto_id; o texto livre não)."},{"severidade":"baixo","descricao":"Decisões online no fluxo Flow não viram submissão — só vão como observação textual pro coordenador lançar na aba Online (aplicarColetaFlow, whatsapp.js:163-167). Comportamento intencional, mas é um ponto de perda de dado se o coordenador não ler a observação.","evidencia":"backend/routes/whatsapp.js:163-167","recomendacao":"Surfacear a contagem online como alerta visível na própria coleta aplicada (hoje vai só dentro de observacao da submissão)."},{"severidade":"baixo","descricao":"O módulo depende inteiramente da integração Meta (envs WHATSAPP_*, Flow IDs). Sem elas, a tela funciona mas o canal fica inerte e as coletas nunca aparecem — não há indicador de saúde/configuração da conexão na própria tela (AbaConfig só mostra toggle + institucional, sem status de conexão).","evidencia":"Whatsapp.jsx:436-517 (AbaConfig sem health); publicWhatsapp.js (envs WHATSAPP_VERIFY_TOKEN/WHATSAPP_APP_SECRET)","recomendacao":"Adicionar na aba Configuração um status simples (bot conectado? flows configurados? última mensagem recebida) para diagnóstico sem precisar abrir o banco."}],"verificacao_notas":"Verificação adversarial concluída contra os 3 arquivos vivos (src/pages/admin/Whatsapp.jsx, backend/routes/whatsapp.js, src/api.js) + serviços de apoio (whatsappParser.js, whatsappFlowColeta.js, publicWhatsapp.js). As 3 abas confirmadas VIVAS — todos os endpoints existem e batem com o api.js. Os 5 achados SUSTENTAM com evidência verificada; refinei as referências de linha (chips Whatsapp.jsx:180-184; aplicar conversacional whatsapp.js:228-236; grupos whatsapp.js:255-259; culto-7d whatsapp.js:214-227; online whatsapp.js:163-167) e adicionei a evidência cruzada do parser (whatsappParser.js:85-89) que reforça o achado #1. UMA CORREÇÃO MATERIAL na seção integracoes.alimenta: o auditor afirmou que o fluxo de FORMULÁRIO cria pessoas em cultos_decisoes_pessoas — isso é FALSO no código atual. whatsappFlowColeta.js não tem nenhum insert nessa tabela (grep zerado) e aplicarColetaFlow (whatsapp.js:156-188) só cria submissões templo/kids; o campo a_cadastrar apenas conta decisões a serem cadastradas nominalmente no /integracao (desktop). Essa era a arquitetura antiga descrita no CLAUDE.md (loop de Flow pessoa), mas a implementação viva foi simplificada para coletar só contagens. Confiança ALTA.","rota":"/admin/whatsapp","pageFile":"src/pages/admin/Whatsapp.jsx","backendRouteFile":"backend/routes/whatsapp.js","apiNamespace":"whatsapp"},{"slug":"feedback","nome":"Feedback do piloto","para_que_serve":"Painel interno onde o time vê tudo que os testadores reportaram durante a fase de piloto (bugs, confusões, ideias, elogios) somado aos erros 500 capturados no backend, e onde acompanha o relatório diário que um agente Haiku (piloto_triage_watcher) gera resumindo os reportes + erros das últimas 24h. É a fonte única para triar o que apareceu no piloto: marca status (novo → triado → em andamento → resolvido/descartado) e severidade de cada reporte.","categoria":"Administração / Qualidade (telemetria de piloto)","quem_usa":"Dois públicos distintos. ENVIO: qualquer usuário autenticado (os testadores do piloto) via botão flutuante \"Reportar\" (FeedbackButton.jsx; só exige profile logado, FeedbackButton.jsx:28). LEITURA/TRIAGEM: a tela /admin/feedback é gateada por `isAdmin` no componente (Feedback.jsx:83 `if (!isAdmin) return \u003cNavigate to=\"/dashboard\">`) e o backend restringe GET/PATCH a role admin/diretor (feedback.js:53 `router.use(authorize('admin','diretor'))`). Na prática: Marcos/Matheus (admin) e diretores. O agente Haiku também pinga os destinatários do módulo de notificação 'piloto' (ou fallback admin/diretor).","entrada":["Reporte do testador (tipo + texto livre) — NÃO é lançado na tela /admin/feedback, e sim no botão flutuante 'Reportar' (FeedbackButton.jsx) presente em qualquer página logada. O tipo 'elogio' existe no backend/migration mas o botão só oferece bug/confusão/ideia (FeedbackButton.jsx:15-19)","Na aba Feedback: o admin altera o STATUS de cada reporte via \u003cselect> inline (Feedback.jsx:160-163 → feedbackApi.atualizar → PATCH /feedback/:id)","Não há entrada manual de erros nem de relatórios — ambos são gerados automaticamente (erros pelo backend, relatórios pelo agente)"],"processamento":["AUTOMÁTICO · captura do reporte: FeedbackButton chama feedbackApi.enviar → POST /api/feedback (feedback.js:24-50) que carimba user_id/user_email/user_nome(=cargoNome)/user_role + rota + contexto (user_agent, viewport) e insere em public.app_feedback com status='novo' (severidade derivada do tipo no front: bug→'alta', resto→'media', FeedbackButton.jsx:41)","AUTOMÁTICO · captura de erros 500: error handler global em backend/server.js (app.use((err,req,res,next)=>...)) faz insert fire-and-forget em public.app_erros_servidor (user_id/email, método, rota, mensagem, stack, status; sem body/query pra evitar PII). ATENÇÃO: só captura erros que chegam ao middleware de erro via next(err)/crash não tratado; handlers que fazem try/catch + res.status(500).json(...) — o padrão de quase todo o backend, inclusive o próprio feedback.js (linhas 47-48, 65-66, 83-84, 95-96, 111-112, 133-134) — NÃO passam por aqui, então a tab tende a ficar vazia mesmo havendo 500s","AUTOMÁTICO · relatório diário: agente piloto_triage_watcher (agent-worker/src/agents/pilotoTriageWatcher.ts) roda 1x/dia às 07:00 SP via node-cron (scheduler.ts:23 SCHEDULE_DIARIO='0 7 * * *') no worker do Railway — só se SCHEDULER_ENABLED=1 (scheduler.ts:48-51). Lê app_feedback + app_erros_servidor das últimas 24h, agrupa, faz 1 chamada Haiku (maxTurns=1, allowedTools=[]) e grava o resumo em agent_runs (agent_type='piloto_triage_watcher'); pinga os admins via tabela notificacoes (link /admin/feedback), destinatários das regras do módulo 'piloto' ou fallback (pilotoTriageWatcher.ts:46-76)","AUTOMÁTICO · resumo dos cards de topo: GET /api/feedback/resumo (feedback.js:70-86) conta total/novos/críticos-abertos varrendo app_feedback no backend (contagem ad-hoc, não é coletor de KPI)","MANUAL · triagem: PATCH /api/feedback/:id (feedback.js:116-136) grava status e/ou severidade; ao marcar 'resolvido' carimba resolvido_em/resolvido_por"],"saida":["Cards de resumo no topo: Total, Novos, Críticos abertos, Erros 500 (Feedback.jsx:101-108)","Aba Feedback: lista de reportes com tipo/ícone/cor, autor (user_email + user_role), rota, data, severidade (borda colorida) e \u003cselect> de status (Feedback.jsx:125-172)","Aba Erros do servidor: lista de erros 500 (status, método+rota, usuário, mensagem) — contador no rótulo da aba (Feedback.jsx:174-194)","Aba Relatório do agente: cartões com os relatórios diários do Haiku (texto markdown em summary + métricas feedbacks/erros/críticos de actions_taken) (Feedback.jsx:196-222)","Notificação in-app (sino) para admins quando o relatório diário é gerado (link /admin/feedback · pilotoTriageWatcher.ts:70-76)","Sem export (sem CSV/PDF) e sem KPI na matriz/NSM — é telemetria operacional de piloto"],"integracoes":{"alimenta":["public.app_feedback (via POST /api/feedback, originado do FeedbackButton)","public.app_erros_servidor (via error handler global de backend/server.js — captura parcial, ver achados)","public.notificacoes (via agente piloto_triage_watcher → sino dos admins)","agent_runs (o agente grava o relatório diário lá com agent_type='piloto_triage_watcher')"],"alimentado_por":["FeedbackButton.jsx (botão flutuante 'Reportar' em qualquer tela logada) → app_feedback","Error handler do Express (backend/server.js) → app_erros_servidor","Agente Haiku piloto_triage_watcher (agent-worker, Railway, cron 07:00) → lê app_feedback + app_erros_servidor e escreve agent_runs/notificacoes; a aba Relatório lê de volta via GET /feedback/relatorios","notificacao_regras (módulo 'piloto') → define quem o agente pinga; sem regra cai no fallback admin/diretor"]},"abas":[{"nome":"Feedback","funcao":"Listar e triar os reportes dos testadores (bug/confusão/ideia/elogio), com filtro por status e mudança de status inline.","passo_a_passo":["Abrir /admin/feedback (aba default, Feedback.jsx:43 useState('feedback'))","Filtrar por status (Todos/Novo/Triado/Em andamento/Resolvido)","Ler o card do reporte (autor, rota, mensagem, severidade pela borda)","Mudar o status no \u003cselect> inline → PATCH /feedback/:id"],"estado":"viva","evidencia":"Feedback.jsx:125-172; backend GET /feedback (feedback.js:55-68) + PATCH (feedback.js:116-136); tabela app_feedback existe (migration 20260609120000_feedback_erros_telemetria.sql:19)","recomendacao":"Manter. Pequeno gap de coerência: o PATCH aceita severidade (feedback.js:126) mas a tela só expõe troca de status — a severidade só é definida pelo dado inicial. Opcional expor edição de severidade na UI."},{"nome":"Erros do servidor","funcao":"Mostrar os erros 500 capturados no backend (status, método+rota, usuário, mensagem) das últimas 300 ocorrências.","passo_a_passo":["Clicar na aba 'Erros do servidor (N)'","Ler a lista de erros 500 ordenada por data (mais recente primeiro)"],"estado":"sem_fonte","evidencia":"Feedback.jsx:174-194 + GET /feedback/erros (feedback.js:88-98, limit 300) leem app_erros_servidor; o ÚNICO produtor é o error handler em backend/server.js (app.use de 4 args, insert fire-and-forget), que só dispara em erros não-tratados/next(err). Como praticamente todos os handlers (inclusive os 6 catch do próprio feedback.js) fazem try/catch + res.status(500).json(...) sem next(err), a maioria dos 500 reais nunca chega a essa tabela.","recomendacao":"A captura é estruturalmente incompleta. Para a aba refletir a realidade, instrumentar os 500 na própria resposta (asyncHandler que chame next(err), interceptor de res.status(500), ou logar dentro dos catch dos handlers). Hoje a aba pode mostrar 'Nenhum erro 500 capturado 🎉' (Feedback.jsx:178) enganosamente."},{"nome":"Relatório do agente","funcao":"Exibir os relatórios diários gerados pelo agente Haiku de triagem (resumo dos reportes + erros do dia, ranqueado por impacto).","passo_a_passo":["Clicar na aba 'Relatório do agente'","Ler os cartões com o resumo do dia (métricas de actions_taken + texto markdown de summary)"],"estado":"incerta","evidencia":"Feedback.jsx:196-222 + GET /feedback/relatorios (feedback.js:101-114) leem agent_runs WHERE agent_type='piloto_triage_watcher'. O produtor (agent-worker/src/agents/pilotoTriageWatcher.ts) existe e está no scheduler diário 07:00 (scheduler.ts:22-26), MAS só roda se o worker Railway estiver no ar com SCHEDULER_ENABLED=1 (scheduler.ts:48-51). A própria UI admite que pode estar vazia (Feedback.jsx:200-201 'Pra ver agora, dispare uma vez no worker').","recomendacao":"Depende de o worker Railway estar provisionado e agendado. Confirmar em prod se o piloto_triage_watcher está rodando (checar agent_runs); se o worker não estiver ativo, a aba fica permanentemente vazia. Não há trigger manual exposto na tela — considerar um botão 'Gerar agora' ou exibir aviso quando não há run nas últimas 24h."}],"achados_auditoria":[{"severidade":"alto","descricao":"A aba 'Erros do servidor' tem fonte estruturalmente incompleta. O único produtor de app_erros_servidor é o error handler global do Express, que só é acionado por erros não-tratados ou next(err). O padrão do codebase (e do próprio feedback.js) é try/catch + res.status(500).json(...) direto, que NÃO passa pelo error handler. Logo, a maioria dos 500 reais não é registrada e a aba pode exibir 'Nenhum erro 500 capturado 🎉' falsamente — o oposto do que se espera de um painel de telemetria de piloto.","evidencia":"backend/server.js (app.use((err,req,res,next)=>...) insert em app_erros_servidor só no error handler) vs. backend/routes/feedback.js:47-48,65-66,83-84,95-96,111-112,133-134 (todos respondem 500 com res.status(500).json, sem next(err))","recomendacao":"Instrumentar a captura no ponto certo: asyncHandler que encaminhe erros via next(err), logar dentro dos catch dos handlers (chamada ao mesmo insert), ou middleware que intercepte respostas 500. Sem isso a aba não cumpre o objetivo."},{"severidade":"medio","descricao":"A aba 'Relatório do agente' depende inteiramente de um worker externo (Railway) estar ativo e agendado (SCHEDULER_ENABLED=1). Não há gatilho manual na tela; o usuário é instruído a 'disparar uma vez no worker' (fora do alcance do admin comum). Se o worker não estiver provisionado, a aba fica vazia indefinidamente sem sinal claro de 'agente desligado' vs. 'dia tranquilo'.","evidencia":"Feedback.jsx:196-202; agent-worker/src/scheduler.ts:22-26 (SCHEDULE_DIARIO='0 7 * * *', piloto_triage_watcher) e 48-51 (guard SCHEDULER_ENABLED); pilotoTriageWatcher.ts (síntese 1x/dia)","recomendacao":"Confirmar o estado do worker em prod (consultar agent_runs por agent_type='piloto_triage_watcher'). Opcional: botão 'Gerar relatório agora' que chame o trigger do worker, ou aviso quando não há nenhuma run nas últimas 24h."},{"severidade":"baixo","descricao":"Inconsistência entre as superfícies de envio: o backend e a migration aceitam o tipo 'elogio' (TIPOS/CHECK), mas o botão de captura só oferece bug/confusão/ideia. Elogios só entrariam por chamada direta à API.","evidencia":"feedback.js:19 TIPOS inclui 'elogio'; migration 20260609120000_feedback_erros_telemetria.sql:26 CHECK inclui 'elogio'; Feedback.jsx:24 TIPO_META.elogio existe; mas FeedbackButton.jsx:15-19 só lista bug/confusao/sugestao","recomendacao":"Adicionar a opção 'Elogio' ao FeedbackButton (alinha com o 'tom geral do dia' do agente) ou remover 'elogio' dos enums se foi descartado intencionalmente."},{"severidade":"baixo","descricao":"O campo user_nome é preenchido com req.user.granular.cargoNome (o nome do CARGO, não o nome da pessoa), o que pode confundir quem lê os reportes — mas a UI exibe apenas user_email e user_role, então o dado fica latente.","evidencia":"feedback.js:33 (user_nome = req.user?.granular?.cargoNome); Feedback.jsx:157 só renderiza it.user_email e it.user_role","recomendacao":"Se o nome da pessoa for desejado, usar o display name correto (profile.name); caso contrário, remover o campo para não induzir a erro futuro."},{"severidade":"baixo","descricao":"Acesso à tela é controlado apenas por isAdmin dentro do componente (sem ModuleGuard na rota em App.tsx). Funciona porque o backend também restringe a admin/diretor, mas a rota /admin/feedback não declara um módulo no sistema de permissões — não há slug 'feedback' em modulos/matriz, é uma tela admin-only fora do esquema granular. Além disso, o gate do front (isAdmin) é mais estrito que o do back (authorize admin/diretor): um diretor que não seja isAdmin no front bate na API mas é redirecionado na tela.","evidencia":"App.tsx:518 (rota sem ModuleGuard, só Suspense); Feedback.jsx:83 (gate por isAdmin); feedback.js:53 (authorize('admin','diretor'))","recomendacao":"Aceitável para uma tela de piloto. Se quiser que diretores (role diretor, não isAdmin no front) vejam, alinhar o gate do front com o do back."}],"verificacao_notas":"Verificação adversarial completa contra os arquivos reais (backend/routes/feedback.js, src/pages/admin/Feedback.jsx, src/components/FeedbackButton.jsx, src/api.js, backend/server.js, agent-worker/src/scheduler.ts, agent-worker/src/agents/pilotoTriageWatcher.ts, supabase/migrations/20260609120000, App.tsx). NENHUM veredito foi refutado — a ficha original estava correta em todos os pontos. Confirmados: (1) aba 'Erros do servidor' sem_fonte na prática — o único produtor é o error handler global do Express; feedback.js tem 6 catches que respondem 500 via res.status(500).json sem next(err), provando o padrão; (2) aba 'Relatório do agente' incerta — depende do worker Railway com SCHEDULER_ENABLED=1; scheduler.ts:48-51 confirma o guard; (3) elogio no CHECK da migration (linha 26) e nos TIPOS (feedback.js:19) mas ausente do FeedbackButton; (4) user_nome=cargoNome (feedback.js:33); (5) rota sem ModuleGuard (App.tsx:518) e gate front isAdmin mais estrito que back admin/diretor — adicionei à descrição do achado a nuance de que diretor-não-admin passa no back mas é bloqueado no front. Ajustes feitos: precisão de linhas (PATCH 116-136, resumo 70-86, error handler descrito como app.use de 4 args em vez de 199-216 numérico), severidade derivada no front documentada em processamento, FeedbackButton:28 (gate por profile) em quem_usa. Nível de confiança: ALTO.","rota":"/admin/feedback","pageFile":"src/pages/admin/Feedback.jsx","backendRouteFile":"backend/routes/feedback.js","apiNamespace":"feedback"},{"slug":"painel-cbrio","nome":"Painel CBRio","categoria":"Estratégica / Inteligência","quem_usa":"Diretoria geral, pastores e qualquer autenticado (leitura macro · router.use(authenticate) sem authorizeModule). Só admin/diretor (profile.role) veem os botões \"Ritual Mensal\" e \"Recalcular NSM\" e podem disparar /nsm/recalcular e /painel/cache/bust. Não tem escrita própria de dado.","para_que_serve":"Painel central de inteligência da CBRio: mostra a North Star Metric (NSM = % de novos convertidos engajados em ao menos 1 dos 5 valores em até 60 dias da decisão), as 6 mandalas (1 geral dos 5 valores + 5 focadas por valor com as áreas), o carrossel de tendências temporais por valor, a matriz Valor × Área (5×5), as matrizes de SLA Gestão × Área e Criativo × Área, e os top 3 KPIs em alerta. É a tela de leitura macro do sistema OKR/NSM — não se lança dado aqui.","entrada":["Não há lançamento de dado na própria tela — é read-only. Os números vêm dos módulos operacionais (Integração/Cultos, Grupos, Devocionais, Voluntariado, Financeiro, Cuidados, Batismo, Next, Solicitações).","Admin/diretor: botão 'Recalcular NSM' (POST /nsm/recalcular dispara a RPC recalcular_nsm) e 'Ritual Mensal' (navega para /ritual). Há também POST /painel/cache/bust (admin/diretor) para invalidar o cache em memória.","Filtros do carrossel de tendências (valor, dado, culto, período, granularidade mês/semana) e do drilldown de pessoas (ano, janela 30/60/90/acumulado, status, valores/atividades, segmento central/online) são parâmetros de leitura, não entrada de dado."],"processamento":["AUTOMÁTICO · NSM central/segmentos: o card lê a view vw_nsm_painel (Painel.jsx:77 nsmApi.painel → backend/routes/nsm.js:20 GET /nsm/painel), populada pela RPC recalcular_nsm() (cron horário + botão Recalcular). VERIFICADO: a versão vigente de recalcular_nsm (migration 20260515400000) NÃO lê nsm_eventos — denominador = SUM(cultos.decisoes_presenciais+decisoes_online) no período; numerador = COUNT(DISTINCT cultos_decisoes_pessoas.membro_id) que tem mem_trilha_valores concluída em ≤60d da decisão.","AUTOMÁTICO · Mandalas (GET /painel/mandalas, painel.js:210): número headline por valor vem de indicadorPrincipalMes()→calcularSerie() do mês corrente (painel.js:89,239); 'Seguir' é recalculado e cascateado por área via decisoesPorAreaMes() lendo vw_culto_stats (painel.js:134,248). Cor/status das pétalas vem de vw_kpi_trajetoria_atual.status_trajetoria (painel.js:223). Cache 5min (painelCache).","AUTOMÁTICO · Matriz Valor×Área (GET /painel/matriz, painel.js:329): cruza kpi_indicadores_taticos × vw_kpi_trajetoria_atual; pior status por célula (piorStatus, painel.js:199). 5 áreas fixas kids/bridge/ami/sede/online (painel.js:350 · CBA removido).","AUTOMÁTICO · Matriz Gestão×Área (GET /matriz-adm, painel.js:448) e Criativo×Área (GET /matriz-criativo, painel.js:572): % concluído no SLA dos últimos 30d a partir de vw_solicitacoes_sla + contagem de OKRs distintos via kpi_indicadores_taticos (tipo_kpi='operacional', formula_config.area_responsavel).","AUTOMÁTICO · Alertas (GET /painel/alertas, painel.js:1233): KPIs com status_trajetoria 'critico'/'atras' em vw_kpi_trajetoria_atual, ordenados crítico>atras, OKR>não-OKR, menor percentual_meta.","AUTOMÁTICO · Drilldown de pessoas (GET /painel/nsm/pessoas, painel.js:1085): ancorado em cultos_decisoes_pessoas (quem decidiu, paginado de 1000 em 1000) e cruza ao vivo a janela com mem_trilha_valores/batismo_inscricoes/next_inscricoes/mem_grupo_membros/mem_devocionais/cui_jornada180/cui_acompanhamentos/mem_voluntarios/mem_contribuicoes (nsmAtividades, painel.js:1021). Mesma fonte-âncora do card (cultos_decisoes_pessoas); a diferença é a definição de engajamento (card = só trilha; drilldown = cruzamento de 9 tabelas).","AUTOMÁTICO · Série temporal (GET /painel/serie-temporal, painel.js:1621 · calcularSerie painel.js:1439): agrega cultos/grupos/devocionais/voluntários/contribuições por mês ou semana. Catálogo de dados por valor em SERIE_DADOS (painel.js:1366), exposto por GET /serie-temporal/dados (painel.js:1601).","MANUAL · nenhum fluxo de escrita de dado; só o disparo manual de recalcular_nsm() e o bust de cache."],"saida":["NSM central (% + engajados/total + delta vs período anterior + barra de meta) e cards segmentados Sede/Online (CBA oculto · Painel.jsx:111)","Carrossel de 6 mandalas (geral + 5 por valor, número absoluto no centro + áreas)","Carrossel de tendências por valor (gráfico de linha mensal/semanal com filtros dado/culto/período)","Matriz Valor × Área (5×5 colorida, modal de drilldown por célula → KPIs · GET /celula/:area/:valor)","Matriz Gestão × Área (Hospitalidade=Reserva+Cozinha+Manutenção · Logística=Estoque+Compras · TI · RH · Financeiro) e Matriz Criativo × Área (Produção, Adoração, Marketing) — % SLA no prazo, modal por célula → solicitações + KPIs","Top 3 alertas críticos (modal KpiDetalheModal por KPI)","Drilldown de pessoas (/painel/nsm/pessoas) e cultos sem dados (/painel/nsm/sem-dados)","Detalhe de 1 KPI (GET /painel/kpi/:id: trajetória, histórico, líder via rh_funcionarios)","Sem export nativo nesta tela"],"integracoes":{"alimentado_por":["Integração/Cultos → cultos / vw_culto_stats / cultos_decisoes_pessoas (NSM card+drilldown, mandala Seguir, série)","kpi_indicadores_taticos + vw_kpi_trajetoria_atual (cor/status de mandalas, matriz Valor×Área, alertas, OKRs das matrizes ADM/Criativo; alimentados por kpiAutoCollector.js + triggers SQL)","mem_trilha_valores (define quem é 'engajado' no numerador do NSM card; e atividade Seguir no drilldown)","Grupos → mem_grupo_membros; Devocionais → mem_devocionais; Voluntariado → mem_voluntarios; Financeiro → mem_contribuicoes; Cuidados → cui_jornada180/cui_acompanhamentos; Batismo → batismo_inscricoes; Next → next_inscricoes (atividades do drilldown e séries)","Solicitações → vw_solicitacoes_sla (matrizes Gestão/Criativo)","RH → rh_funcionarios (nome do líder no detalhe do KPI); areas_kpi (rótulos/ordem das áreas)"],"alimenta":["Não grava em nenhuma tabela de dado — módulo read-only. Navega para /ritual (Ritual Mensal), /painel/kpi/:id, /painel/nsm/pessoas.","Dispara recalcular_nsm() (RPC) que escreve em nsm_estado, e bust do painelCache (cache em memória)."]},"abas":[{"nome":"NSM (topo)","funcao":"Card central da North Star Metric + cards segmentados (Sede/Online · CBA oculto).","passo_a_passo":["Abrir /painel","Ler % NSM, engajados/total e delta","Clicar 'Ver pessoas' para o drilldown"],"estado":"viva","evidencia":"Painel.jsx:77 nsmApi.painel→vw_nsm_painel. A view é populada por recalcular_nsm() cuja versão vigente (migration 20260515400000:84-113) deriva de cultos / cultos_decisoes_pessoas / mem_trilha_valores — NÃO de nsm_eventos (o nsm_eventos sobrevive só como comentário legado na função). Card e drilldown compartilham a fonte-âncora cultos_decisoes_pessoas; diferem só na definição de engajamento.","recomendacao":"Diferença real (não-bloqueante): o card solicitacoes_sla."},{"nome":"Matriz Criativo × Área","funcao":"Mesma lógica da Gestão para 3 grupos criativos: Produção, Adoração, Marketing.","passo_a_passo":["Ler a célula por grupo criativo","Clicar para solicitações + KPIs"],"estado":"incerta","evidencia":"GET /matriz-criativo (painel.js:572) + /celula-criativo (painel.js:679). A coluna Adoração TEM KPIs vivos (ADM-C-G-ADORACAO e ADM-C-Q-ADORACAO com formula_config.area_responsavel='adoracao', seed 20260512280000:107-111,195-199) → total_kpis não fica zero. Mas Solicitações NÃO roteia 'adoracao' (nenhuma categoria mapeia para area_responsavel='adoracao' em solicitacoes.js) → o lado do % SLA da coluna Adoração fica sempre sem dado.","recomendacao":"Coluna meio-viva: KPIs de OKR contam, mas o SLA de Adoração não recebe solicitações. Decidir se Adoração deve gerar solicitações (criar categoria/roteamento) ou rotular a coluna como 'só OKR · sem SLA' para não parecer erro."},{"nome":"Alertas Críticos","funcao":"Top 3 KPIs em alerta (crítico/atrasado), com modal de detalhe.","passo_a_passo":["Ler os 3 alertas priorizados","Clicar num alerta para abrir o detalhe do KPI"],"estado":"viva","evidencia":"Painel.jsx:229 AlertasCriticos; GET /painel/alertas (painel.js:1233) sobre vw_kpi_trajetoria_atual."}],"achados_auditoria":[{"severidade":"medio","descricao":"O card NSM e o drilldown 'Ver pessoas' compartilham a fonte-âncora (cultos_decisoes_pessoas), mas usam definições DIFERENTES de 'engajado': o card (recalcular_nsm) conta só quem tem mem_trilha_valores concluída em ≤60d; o drilldown conta o cruzamento de 9 atividades (grupos, devocional, voluntário, dízimo, etc.). Os números podem não bater (o drilldown tende a mostrar mais engajados), mas NÃO é a 'dupla fonte de verdade / nsm_eventos zumbi' descrita na auditoria original.","evidencia":"recalcular_nsm vigente (migration 20260515400000:84-113) deriva de cultos + cultos_decisoes_pessoas + mem_trilha_valores; vs /nsm/pessoas (painel.js:1021-1067,1166-1187) que cruza 9 tabelas. nsm_eventos só aparece em comentário legado da função.","recomendacao":"Alinhar a definição de engajamento entre card e drilldown (ou o card passa a usar o cruzamento amplo, ou o drilldown destaca a coluna 'só trilha' usada no headline) e explicitar na UI."},{"severidade":"medio","descricao":"Cascata por área das mandalas só existe para 'Seguir' (decisões por culto). Conectar/Investir/Servir/Generosidade mostram '—' nas pétalas de área porque a fonte não tem recorte por área de culto.","evidencia":"painel.js:154 AREAS_DECISOES=['sede','ami','bridge','online']; painel.js:286 numero_area=null para v!=='seguir'","recomendacao":"Documentar na UI (já há comentário no código) e, quando grupos/voluntários/dízimo ganharem dimensão de área, ligar a cascata; senão o usuário interpreta '—' como erro."},{"severidade":"baixo","descricao":"Matriz Criativo × Área: a coluna 'Adoração' tem KPIs de OKR (ADM-C-*-ADORACAO) mas NÃO recebe solicitações roteadas, então o lado do % SLA fica sempre sem dado. Coluna meio-viva (não totalmente vazia, como sugeria a auditoria original).","evidencia":"KPIs vivos: seed 20260512280000:107-111/195-199 (formula_config.area_responsavel='adoracao'); roteamento ausente: solicitacoes.js não tem CATEGORIA_TO_AREA_RESP→'adoracao'.","recomendacao":"Confirmar com o time se Adoração deve gerar solicitações; se não, rotular a coluna como 'só OKR' para não parecer célula em erro."},{"severidade":"baixo","descricao":"Constantes/comentários legados de CBA e AREAS_ADM (não usado pela matriz agrupada) ficam espalhados no código, criando ruído de manutenção. Não afeta o usuário.","evidencia":"Painel.jsx:111 filtra 'cba'; painel.js:429-438 AREAS_ADM ('Legado mantido'); painel.js:350 'CBA removido'; AREAS_CLIENTE 439-446 com comentário CBA.","recomendacao":"Remover a constante AREAS_ADM e comentários legados de CBA num passe de limpeza."},{"severidade":"baixo","descricao":"Drilldown /nsm/pessoas pagina cultos_decisoes_pessoas de 1000 em 1000 (correto) e faz chunk de 150 ids nas atividades (correto), mas o limite final (default 300, máx 1000) trunca a lista de pessoas enquanto total_convertidos/total_match consideram o conjunto inteiro, gerando um corte silencioso.","evidencia":"painel.js:1091 limit; 1216 pessoas.slice(0, limit); total_match=lista.length (1215)","recomendacao":"Exibir 'mostrando X de Y' no frontend do drilldown quando total_match > limit, para o corte ficar explícito."}],"verificacao_notas":"Reabri Painel.jsx, painel.js, nsm.js, api.js e a migration vigente de recalcular_nsm (20260515400000) + o seed criativo (20260512280000). MUDANÇAS vs ficha original: (1) REFUTEI o achado ALTO de 'dupla fonte de verdade / nsm_eventos zumbi'. A versão vigente de recalcular_nsm NÃO lê nsm_eventos — deriva de cultos/cultos_decisoes_pessoas/mem_trilha_valores, MESMA fonte-âncora do drilldown. A auditoria confiou num comentário de código legado. Rebaixei para MEDIO 'definição de engajado diverge' e reclassifiquei a aba NSM de 'incerta' para 'viva'. (2) REBAIXEI o achado de Adoração de MEDIO 'sem_fonte' para BAIXO: os KPIs ADM-C-*-ADORACAO existem e contam (total_kpis>0); só o lado SLA fica vazio porque Solicitações não roteia adoracao. Reclassifiquei a aba de 'sem_fonte' para 'incerta'. (3) CONFIRMEI os achados de cascata só-Seguir, legado CBA/AREAS_ADM e truncamento silencioso do drilldown (com evidência arquivo:linha precisa). (4) Corrigi a matriz Valor×Área de '6×5' para '5×5' (CBA removido, painel.js:350). Confiança ALTA — todas as linhas citadas foram lidas diretamente. Única limitação: não consultei o banco vivo, então não verifiquei se a migration 20260515400000 está de fato aplicada em prod nem o estado real de vw_nsm_painel; a memória do projeto registra 'NSM≈0' e 'nsm_eventos zumbi', o que é consistente com denominador grande (decisões-fantasma de cultos sem pessoas registradas) e numerador pequeno — ou seja, o NSM baixo é esperado pela própria fórmula (accountability de captura), não um bug de fonte divergente.","rota":"/painel","pageFile":"src/pages/Painel.jsx","backendRouteFile":"backend/routes/painel.js","apiNamespace":"painel"},{"slug":"monitoramento-okr","nome":"Monitoramento OKR","categoria":"Estratégica / Inteligência","para_que_serve":"Painel estratégico read-only que reproduz fielmente a planilha \"CBRio_cabeça_Juninho\" (ótica enxuta do Pr. Juninho): 1 Métrica Estrela do Norte (NSM) → 9 OKRs distribuídos em 3 blocos de Área Responsável (Ministerial, Criativo, Operações) → ~25 indicadores táticos. Cada indicador mostra o número vivo (verde no alvo, vermelho fora) e, ao expandir, a evolução mensal em gráfico de barras (recharts); os que não têm fonte mostram \"—\" e o texto \"Para puxar automático, preciso de: ...\". É uma ótica PARALELA — não toca a lógica dos 25 OKRs / 150 KPIs do /painel (decisão explícita do Marcos). A estrutura fixa da planilha vive no frontend (consts NSM e BLOCOS em MonitoramentoOkr.jsx:59-182); o backend devolve só os valores vivos via 1 RPC.","quem_usa":"Pr. Juninho (presidente · acesso restrito a 3 telas, sendo esta uma), diretoria geral e demais lideranças com acesso ao menu Inteligência. A rota /monitoramento-okr é apenas authenticate, sem ModuleGuard (App.tsx:531, dentro de ProtectedRoute) — read-only macro, visível a qualquer usuário logado que tenha o item no menu. Conforme CLAUDE.md, o item de menu perdeu o module 'painel-cbrio' justamente para aparecer pro Juninho. Ninguém lança dado por esta tela.","entrada":["NENHUMA entrada direta — é 100% read-only (MonitoramentoOkr.jsx:12). O único controle é o botão 'Atualizar' (linha 226-237), que apenas re-busca o endpoint via painelApi.monitoramentoOkr() (api.js:2160).","Os números vivos são alimentados em OUTROS módulos: batismos/decisões em /integracao (modal de culto), grupos/voluntários/dízimos nos respectivos cadastros, convertidos atendidos em Cuidados, Q12 lançado em /dados-brutos (tipo_id='rh_q12_nota'), engajamento de conteúdo via coleta do YouTube em online_engajamento."],"processamento":["AUTOMÁTICO · 1 RPC única: GET /api/painel/monitoramento-okr chama supabase.rpc('fn_monitoramento_okr_raw') (painel.js:1681) que devolve ~15 métricas em JSONB numa só chamada REST. A função vigente é a CREATE OR REPLACE da migration 20260617120000_q12_gallup_monitoramento_okr.sql (que substitui a 20260603260000, que por sua vez substituiu a base 20260603220000) e inclui as chaves engajamento e q12.","AUTOMÁTICO · NSM central: lê vw_nsm_painel WHERE segmento='central' (migration q12:34-38; backend painel.js:1702-1711).","AUTOMÁTICO · derivados na RPC a partir de tabelas operacionais: batRatio/batMes/tempoBat/batSerie (batismo_inscricoes + mem_trilha_valores), dsOnline/dsSerie/assentos/assentosSerie (cultos + vol_service_types, base 1050), rotativ (rh_funcionarios), freqGrupos (mem_grupo_membros), voluntAtivos (mem_voluntarios), dizimistas (mem_contribuicoes 3+ meses em 6m), cafeAtend (cui_convertidos.atendido_apos_culto), engajamento (online_engajamento, COALESCE 0), q12 (dados_brutos tipo_id='rh_q12_nota', sem COALESCE → null vira '—').","AUTOMÁTICO · cache de 5 min no backend (cacheGet/cacheSet chave 'monitoramento-okr', painel.js:1671-1673,1782) compartilhado com o resto do /painel.","MANUAL · ~13 dos ~25 táticos NÃO têm fonte e nunca renderizam número: têm campo 'precisa' no BLOCOS e mostram só '—' + o que falta ao expandir (ex.: prazo 1º contato, Next pós-acompanhamento, follow-up online, NPS online/presencial, pontualidade, eficiência financeira/fundo/prazos pagamento, treinamentos, cronogramas/orçamentos de expansão)."],"saida":["Tela única /monitoramento-okr: legenda das 3 camadas (NSM/OKR/Metas), hero da NSM (% engajados ≤60d vs meta 50%), 3 blocos de área (Ministerial/Criativo/Operações), cards de OKR com número grande 'automático', linhas de indicador tático clicáveis (accordion).","Por indicador com série: gráfico de barras mensal (recharts · MiniBars, linha 441) com linha tracejada no alvo (ReferenceLine).","Rodapé com contagem de indicadores 'já 506 PreviewChartIA tipoGrafico/semente; :507-509 'Preview · dados de exemplo · implementar fórmula pra ativar com dados reais'; DashIaAba.jsx:112,140,220 onSave/onPromote só setam status='ativo'","recomendacao":"Renomear a ação para 'Marcar como aprovado (a implementar)' deixando explícito que é backlog de implementação manual no banco; ou esconder o gráfico placeholder dos cards 'ativos' no painel de acompanhamento. Evitar gráfico com dados fictícios em tela de diretoria."},{"severidade":"medio","descricao":"Indicador 'Voluntariado' depende de cultos.voluntarios, coluna preenchida manualmente no modal de culto e tipicamente esparsa/vazia. A view usa COALESCE(SUM(c.voluntarios),0), então culto sem preenchimento vira 0 — a aba Semanal/Mensal/Metas mostra 0 sem distinguir de 'sem dado', podendo passar a impressão de que houve 0 voluntários.","evidencia":"migration 20260520150000: 'COALESCE(SUM(c.voluntarios), 0)::int AS voluntariado'; coluna voluntarios sem coletor (preenchimento manual no modal de culto)","recomendacao":"Confirmar com o Marcos se 'voluntarios' está sendo preenchido; senão, puxar de mem_voluntarios/escalas ou ocultar o indicador até ter fonte confiável."},{"severidade":"baixo","descricao":"A aba KPIs duplica o módulo Painel CBRio/OKR: não usa nada do backend dashboard-semanal, apenas reembrulha GET /kpis/v2/taticos e GET /painel/kpi/:id. Funciona, mas é conteúdo redundante com /painel e /minha-area, podendo confundir sobre 'onde é a fonte de verdade dos KPIs'.","evidencia":"DashKpisAba.jsx:59,213; api.js:243-249 (kpisTaticos→/kpis/v2/taticos, kpiDetalhe→/painel/kpi/:id)","recomendacao":"Manter como conveniência de apresentação, mas documentar que é espelho read-only do OKR; não evoluir lógica de KPI aqui."},{"severidade":"baixo","descricao":"CAPACIDADE_TEMPLO está hardcoded em dois lugares e diverge da regra usada na Integração: 1050 no backend (dashboardSemanal.js:25, usado no /semanal) e 1050 no cálculo client-side de ocupação (DashSemanalAba.jsx:135-136), enquanto a Integração usa 1200 (registrado no CLAUDE.md). Curiosamente a própria seed de meta de frequência neste módulo é 1200 (migration 20260520150000), reforçando a inconsistência.","evidencia":"dashboardSemanal.js:25 CAPACIDADE_TEMPLO=1050 e :198,231-232; DashSemanalAba.jsx:135-136 '/1050'; migration 20260520150000 seed meta frequencia=1200; CLAUDE.md registra 1200 como capacidade do Templo na Integração","recomendacao":"Centralizar a capacidade do templo numa única constante/config e alinhar com a regra da Integração (1200 vs 1050)."},{"severidade":"baixo","descricao":"O backend dashboardSemanal.js só aplica authenticate (sem authorizeModule). A proteção da tela depende do menu/ModuleGuard no frontend; qualquer usuário autenticado que chame os endpoints recebe os números agregados de culto, metas e até dispara o endpoint de IA (custo de token).","evidencia":"dashboardSemanal.js:23 router.use(authenticate) — sem authorizeModule, ao contrário de módulos que usam authorizeModule(slug,nivel)","recomendacao":"Avaliar se os dados (agregados de culto, pouco sensíveis) justificam authorizeModule; no mínimo gatear /ia/sugerir-indicador por nível para não expor chamada paga ao Haiku a qualquer autenticado."}],"verificacao_notas":"Verificação adversarial completa contra os arquivos reais (DashboardSemanal.jsx, backend/routes/dashboardSemanal.js, src/api.js, DashIaAba.jsx, DashMetasAba.jsx, DashKpisAba.jsx, DashSemanalAba.jsx, migration 20260520150000). TODOS os 5 achados se sustentam com evidência precisa — nenhum removido. Ajustes: (1) achado ALTO 'Criar com IA' confirmado integralmente — onSave/onPromote só fazem status='ativo' (DashIaAba.jsx:112,140,220) e o card ativo renderiza PreviewChartIA com placeholder (DashMetasAba.jsx:506-509). (2) achado BAIXO de capacidade ganhou nuance reforçadora: a própria seed de meta de frequência deste módulo é 1200, mas a ocupação calcula com 1050. (3) achado de auth refinado: o ponto mais sensível é /ia/sugerir-indicador (chamada paga ao Haiku) exposto a qualquer autenticado. Reclassifiquei a aba 'KPIs' mantendo 'redundante' (label arquitetural correto: é espelho read-only do Painel/OKR via api.js:243-249), mas deixando claro na evidência que funciona. Aba 'Criar com IA' mantida como 'incerta' (o fluxo de criação roda, mas não fecha — promover não implementa). Demais abas confirmadas 'viva'. Entrada/processamento/saída/integrações ajustados com nº de linha. Alta confiança.","rota":"/dashboard-semanal","pageFile":"src/pages/DashboardSemanal.jsx","backendRouteFile":"backend/routes/dashboardSemanal.js","apiNamespace":"dashboardSemanal"},{"slug":"minha-area","nome":"Minha Área","categoria":"Estratégica / Inteligência","quem_usa":"Líderes de área de culto e de valor da Jornada (ex.: líder de Integração com kpi_valores=['seguir'], líderes de Kids/AMI/Bridge/Online), além de admin/diretor (que veem todos os KPIs táticos). É o hub pessoal do líder para acompanhar a saúde dos seus indicadores. A visibilidade é governada por profile.role + profile.kpi_areas + profile.kpi_valores (useMyKpiAreas.js).","para_que_serve":"Tela read-only de VISUALIZAÇÃO dos KPIs táticos que o usuário \"responde por\". Mostra valor atual, sparkline de até 12 períodos, % da meta, delta vs período anterior e status (verde/amarelo/vermelho/sem dado), com filtros e agrupamento. Não edita meta nem estrutura (refator 2026-05-14 moveu isso para /gestao). A única ação operacional persistida aqui é registrar revisão de OKR quando o KPI é is_okr e está amarelo/vermelho.","entrada":["Esta página NÃO tem aba de lançamento de dados — é só visualização (refator 2026-05-14: edição de KPI/meta removida e movida para /gestao · ver cabeçalho MinhaArea.jsx:1-14).","Inputs de UI (não persistem): filtros (busca, Pilar, Valor, Área, Status, checkbox Só OKR) e toggle de AGRUPAMENTO (Pilar | Valor | Área | Lista) — MinhaArea.jsx:119-126.","Único dado persistido a partir desta tela: a revisão de OKR via OkrRevisaoModal, aberta pelo botão 'Registrar revisão OKR' no drilldown, só quando is_okr e status amarelo/vermelho (MinhaArea.jsx:383-389, 632-636, podeRevisar :492).","O preenchimento real dos números é feito em OUTROS módulos — a tela só linka para eles via bloco 'Onde preencher' (Integração/Batismos/Grupos/Cuidados/NEXT/Voluntariado/Financeiro/NPS/Dados Brutos · mapa MODULO_POR_DADO_TIPO MinhaArea.jsx:52-80, render :595-603)."],"processamento":["AUTOMÁTICO — Carga dos KPIs: kpisApi.v2.taticos() → GET /api/kpis/v2/taticos, que lê a view SQL vw_kpi_taticos_status (kpisV2.js:197-208). Daí vêm status, ultimo_valor, ultimo_periodo, meta_valor, unidade, apuracao, pilar, valores, is_okr, lider_nome/cargo. O endpoint enriquece com formula_config/tipo_calculo de kpi_indicadores_taticos (kpisV2.js:211-221). Cabeçalho do arquivo cita a view (MinhaArea.jsx:10).","AUTOMÁTICO — Histórico/sparkline: kpisApi.v2.registros.list({limit:5000}) → GET /api/kpis/v2/registros; o front agrupa por indicador_id e fica com os 12 últimos períodos em ordem cronológica (MinhaArea.jsx:139-158).","AUTOMÁTICO — Os valores dos KPIs em si são calculados FORA desta tela: coletores em backend/services/kpiAutoCollector.js + triggers SQL (cultos_recalc_kpis, batismos_recalc_kpis) + dados_brutos. A view vw_kpi_taticos_status ainda IGNORA zeros (valor_realizado>0 · migration 20260515200000:46), então KPI com valor 0 ou nulo cai como status 'pendente'.","MANUAL (client-side) — Filtro de permissão (MinhaArea.jsx:167-178 via useMyKpiAreas): admin/diretor (role∈{admin,diretor}) vê tudo; perfil SEM kpi_areas E SEM kpi_valores vê tudo (fallback MVP legado :172); perfil com kpi_areas OU kpi_valores vê só KPIs cuja área OU algum valor batem.","MANUAL (client-side) — Filtragem por busca/pilar/valor/área/status/OKR (MinhaArea.jsx:197-211), agrupamento (:226-258), % da meta (ultimo_valor/metaEfetiva :486-490), delta vs penúltimo registro do sparkline (:483-484) — tudo em memória.","MANUAL (persistência) — Revisão OKR gravada pelo OkrRevisaoModal (componente separado), não por painelArea (que não é usado por esta tela)."],"saida":["Stats no topo: contadores Total / No alvo / Atrás / Crítico / Sem dado (MinhaArea.jsx:292-298, calc :213-223). 'pendente' da view cai no balde 'sem_dado' (:217-220).","Lista agrupada de KPIs (por Pilar/Valor/Área/Lista), cada linha com valor grande, meta, sparkline de até 12 períodos, badges (área/pilar/valores/OKR), delta % e % da meta (MinhaArea.jsx:478-555).","Drilldown inline por KPI: gráfico de área grande, bloco 'Como mede' (apuracao/descricao/meta_descricao), bloco 'Onde preencher' (link para o módulo de origem) + líder responsável (lider_nome/lider_cargo), e histórico tabular de até 12 períodos (MinhaArea.jsx:558-628).","Ação: botão 'Registrar revisão OKR' (só quando is_okr e status amarelo/vermelho) → abre OkrRevisaoModal (MinhaArea.jsx:631-636).","Sem export próprio. Sem KPI novo gerado — só exibe os existentes."],"integracoes":{"alimenta":["NÃO alimenta nenhuma tabela com dado de KPI — é read-only.","OkrRevisaoModal → grava revisão de OKR (componente próprio · okr_revisoes), único efeito de escrita disparável daqui."],"alimentado_por":["vw_kpi_taticos_status (status + ultimo_valor + meta_valor + metadados) via GET /api/kpis/v2/taticos (kpisV2.js:197-208)","kpi_registros via GET /api/kpis/v2/registros (histórico/sparkline)","kpi_indicadores_taticos.formula_config/tipo_calculo (enriquecimento no endpoint kpisV2.js:211-221)","Upstream dos valores: kpiAutoCollector.js + triggers cultos_recalc_kpis/batismos_recalc_kpis + dados_brutos","profile.role / profile.kpi_areas / profile.kpi_valores (via useMyKpiAreas) governam quais KPIs aparecem"]},"abas":[{"nome":"(sem abas — página única com filtros + toggle de agrupamento)","funcao":"MinhaArea.jsx não usa componente Tabs. A navegação é por chips de filtro (Pilar/Valor/Área/Status/Só OKR) e um toggle de AGRUPAMENTO (Pilar | Valor | Área | Lista) que reorganiza a MESMA lista, sem trocar de conteúdo.","passo_a_passo":["Usuário escolhe o agrupamento (Pilar/Valor/Área/Lista) e/ou aplica filtros.","Clica num KPI para expandir o drilldown inline (gráfico + como mede + onde preencher + histórico).","Se for OKR fora do alvo (amarelo/vermelho), clica 'Registrar revisão OKR'.","Para preencher o número, segue o link 'Abrir [módulo]' que leva ao módulo de origem."],"estado":"viva","evidencia":"MinhaArea.jsx:314-331 (toggle de agrupamento, não Tabs); :347-359 (chips de filtro)","recomendacao":"Documentar que 'abas' aqui = modos de agrupamento, não navegação por conteúdo. Nenhuma ação necessária."}],"achados_auditoria":[{"severidade":"medio","descricao":"Confusão de identidade entre dois módulos parecidos: /minha-area (este) é servido por kpis.v2.taticos() + kpis.v2.registros.list() (MinhaArea.jsx:19,133-143), NÃO por backend/routes/painelArea.js. O namespace painelArea da api.js (GET /api/painel-area/:area + registrarNps · api.js:960-971) é consumido por OUTRO módulo: src/pages/ministerial/PainelArea.jsx (telas /kids, /ami, /bridge, /online). São dois módulos distintos com escopos parecidos (KPIs por área).","evidencia":"Grep 'painelArea' em src/ → só api.js e src/pages/ministerial/PainelArea.jsx; MinhaArea.jsx:19 importa { kpis as kpisApi }","recomendacao":"Tratar como dois módulos: /minha-area (kpis.v2) e painel-area/PainelArea (kids/ami/bridge/online). Auditar painelArea.js no contexto do PainelArea.jsx, não do MinhaArea."},{"severidade":"medio","descricao":"Fallback de permissão 'MVP legado': qualquer usuário SEM kpi_areas E SEM kpi_valores vê TODOS os KPIs táticos do sistema. Como muitos perfis provavelmente não têm esses campos preenchidos, /minha-area tende a mostrar a base inteira em vez da área da pessoa — o oposto do nome do módulo. (Admin/diretor veem tudo por design.)","evidencia":"MinhaArea.jsx:171-172 'if (kpiAreas.length === 0 && kpiValores.length === 0) return true;' + comentário :171; useMyKpiAreas.js:22-30 (origem de kpiAreas/kpiValores/isAdmin)","recomendacao":"Definir default mais restritivo (ou derivar área pelo cargo/usuario_areas), marcar o fallback amplo como dívida, e confirmar com Marcos quem deve ver tudo."},{"severidade":"medio","descricao":"Mismatch de status confirmado na fonte SQL: a view vw_kpi_taticos_status emite 'pendente' quando não há registro do período (valor_realizado nulo, e ela ainda ignora zeros: valor_realizado>0). Mas MinhaArea só conhece verde/amarelo/vermelho e joga todo o resto em 'sem_dado' (STATUS_OPTS :42-47; contagem :217-220; filtro :207). KPIs 'pendente' (aguardando cálculo/checkpoint ou valor=0) são mascarados como 'sem dado'.","evidencia":"migration 20260515200000_unificar_status_kpi_views.sql:66 ('WHEN ur.valor_realizado IS NULL THEN pendente') + :46 (ignora zeros); MinhaArea.jsx:46 (só sem_dado) e :207/:217-220","recomendacao":"Mapear 'pendente' explicitamente (rótulo/cor próprios) ou alinhar a normalização com os status reais da view; considerar que valor 0 vira pendente."},{"severidade":"baixo","descricao":"Vários destinos de 'Onde preencher' apontam para módulos cujas fontes podem estar vazias/sem coletor real, fazendo o KPI aparecer permanentemente como 'pendente/sem dado'. Ex.: nps_* → /nps; frequencia_grupos/lideres_* → Grupos; doacoes_*/doadores_* → Financeiro; voluntarios_* → Voluntariado; capelania/aconselhamento → Cuidados. O histórico do projeto registra que várias dessas fontes nasceram vazias em prod.","evidencia":"Mapa MODULO_POR_DADO_TIPO MinhaArea.jsx:52-80 + bloco 'Onde preencher' :595-603","recomendacao":"Distinguir 'sem coletor' de 'coletor existe mas sem dado' no drilldown, em vez de só linkar um módulo que talvez não capture aquele tipo."},{"severidade":"baixo","descricao":"% da meta enganoso para KPIs de percentual: pctMeta = round(ultimo_valor / metaEfetiva * 100) (MinhaArea.jsx:486-490). Para KPIs com unidade '%' (coorte BAT90/NEXT90/reunião) isso compara o valor-percentual contra o alvo-percentual como razão, distorcendo. Obs. de precisão: ao contrário do que a ficha original assumia, a view vw_kpi_taticos_status NÃO expõe meta_valor_absoluto — o '?? kpi.meta_valor' sempre cai no meta_valor (a parte sobre cascata/normalização de meta absoluta não se aplica a esta tela).","evidencia":"MinhaArea.jsx:486 metaEfetiva=kpi.meta_valor_absoluto ?? kpi.meta_valor (mas a view só seleciona t.meta_valor · migration 20260515200000:53) e :488-490 pctMeta","recomendacao":"Tratar unidade '%' à parte (comparar valor direto vs alvo, não razão valor/alvo)."}],"verificacao_notas":"Verificação adversarial contra código vivo (MinhaArea.jsx, api.js, kpisV2.js, useMyKpiAreas.js, App.tsx, migration 20260515200000). MUDANÇAS: (1) REMOVIDO o achado 'baixo' sobre o path do Financeiro (#5 original) — REFUTADO: a rota canônica É /admin/financeiro (App.tsx:455), então o mapa MinhaArea.jsx:59-62 está CORRETO. (2) CORRIGIDO o achado #6 (meta_valor_absoluto) — a view vw_kpi_taticos_status NEM expõe meta_valor_absoluto (só meta_valor, migration:53), então a premissa de cascata/normalização não se aplica; mantido reduzido a 'baixo' focando só no problema real de % da meta para KPIs de unidade '%'. (3) Achado #3 (pendente) FORTALECIDO com a evidência SQL exata (migration:66 + ignora zeros :46). (4) Achados #1 (dois módulos), #2 (fallback MVP) e #4 (fontes vazias) SUSTENTADOS com evidência precisa. Demais campos (entrada/processamento/saída/integrações/abas) batem com o código e foram refinados com referências de linha. Nível de confiança: ALTO para tudo verificável no front+endpoint+view; o achado #4 (fontes vazias) depende do estado real de dados em prod, não confirmável só pelo código — marcado como baixo.","rota":"/minha-area","pageFile":"src/pages/MinhaArea.jsx","backendRouteFile":"backend/routes/painelArea.js","apiNamespace":"painelArea"},{"slug":"nps","nome":"NPS — Pesquisas com IA","categoria":"Dados / IA / Admin","para_que_serve":"Módulo de pesquisas de satisfação (Net Promoter Score) com apoio de IA. Permite criar pesquisas por valor da CBRio ou por área, gerar as perguntas automaticamente com Claude Haiku, coletar respostas (de colaboradores logados e do público via link), analisar os comentários com IA e alimentar automaticamente os KPIs de satisfação (nps_geral, nps_next, nps_lideres, nps_voluntarios, nps_culto) que entram no painel/NSM por área.","quem_usa":"Criação/gestão/análise: admin e diretor (frontend gateia por isAdmin||isDiretor em Nps.jsx:156; backend exige nível 3 no módulo 'nps' via authorizeModule). Resposta logada: qualquer colaborador autenticado (tela /nps/:id/responder). Resposta pública: qualquer pessoa com o link (tela /nps/publica/:token, sem login). Líderes de área com nível 3 em 'nps' (ex.: via boost) passam no backend authorizeModule e podem criar/analisar pela API, mas o botão 'Nova NPS' não aparece pra eles no frontend (que só checa role admin/diretor).","entrada":["Criação (modal Nova NPS, passo 1): valor da CBRio OU área específica + objetivo (o que medir) + contexto/KPI (nps_geral|nps_next|nps_lideres|nps_voluntarios|nps_culto) + data de encerramento opcional + toggle de link público.","Revisão (modal passo 2): título + revisão das perguntas geradas pela IA (pergunta NPS principal + perguntas qualitativas).","Resposta logada (/nps/:id/responder): nota 0-10 + respostas das perguntas extras + comentário.","Resposta pública (/nps/publica/:token): nome + e-mail (obrigatórios) + nota 0-10 + perguntas extras + comentário."],"processamento":["AUTOMÁTICO · Geração de perguntas: POST /api/nps/gerar-perguntas (nps.js:27) → npsService.gerarPerguntas() chama Claude Haiku para montar pergunta_nps + perguntas_extras a partir do objetivo/valor/área. Rate-limit iaLimiter (30/h, admin isento).","AUTOMÁTICO · Notificação: POST /api/nps (nps.js:105) cria a pesquisa e dispara notificar({modulo:'nps', tipo:'pesquisa_aberta'}) para todos os profiles active=true; POST /api/nps/:id/notificar (nps.js:326) reenvia lembrete.","AUTOMÁTICO · Estatísticas: a view vw_nps_pesquisa_stats agrega total_respostas, score_medio, nps_score, promoters/passives/detractors por pesquisa (lida em GET /, GET /:id, /analisar e sincronizarKpi).","AUTOMÁTICO · Análise IA: POST /api/nps/:id/analisar (nps.js:294) → npsService.analisarRespostas() (Haiku) gera resumo/sentimento/temas/ações; salvo em nps_pesquisas.analise_ia. Sob iaLimiter.","AUTOMÁTICO (PARCIAL) · Sincronização de KPI: só no responder LOGADO (POST /:id/responder · nps.js:282) chama sincronizarKpi() que faz UPSERT em dados_brutos (tipo_id=contexto_kpi, area, data=data_inicio, valor=score_medio). O responder PÚBLICO (publicNps.js:69) NÃO sincroniza.","MANUAL · Encerrar pesquisa (PUT /:id status, nps.js:180) e arquivar (DELETE /:id status=arquivada, nps.js:206). MANUAL · clicar 'Analisar com IA' e 'Reenviar lembrete'."],"saida":["Lista de pesquisas em cards com badge de status e ScoreCard (NPS, nº respostas, média).","Modal de detalhe: stats (NPS / Respostas / Média / Promoters-Detractors), lista de respostas individuais, perguntas, e Análise IA (resumo, sentimento, temas, ações sugeridas).","Link público copiável (/nps/publica/:token).","KPIs de satisfação alimentados em dados_brutos (nps_geral, nps_next, nps_lideres, nps_voluntarios, nps_culto) → consumidos pelo Painel/NSM e por /minha-area; em particular nps_culto alimenta os 5 KPIs CULTO-NPS-*.","Sem export dedicado (não há endpoint/botão de exportação de CSV)."],"integracoes":{"alimenta":["dados_brutos (tipo_id = contexto_kpi da pesquisa, area) via sincronizarKpi() no UPSERT da rota POST /api/nps/:id/responder (logado apenas)","KPIs de satisfação (kpi_indicadores_taticos com fonte em tipos_dado_bruto nps_*) → Painel CBRio / NSM por área e /minha-area; nps_culto → 5 KPIs CULTO-NPS-* exibidos no PainelArea","Notificações (sino in-app) via services/notificar.js, módulo 'nps'"],"alimentado_por":["Claude Haiku (npsService.gerarPerguntas / analisarRespostas) para perguntas e análise","profiles (lista de destinatários active=true para notificação)","Respostas dos próprios colaboradores e do público (nps_respo
