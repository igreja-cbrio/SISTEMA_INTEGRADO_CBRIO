<title>Atlas operacional · ERP CBRio</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --ground: #eef2f1;
  --paper: #ffffff;
  --paper-2: #f6faf9;
  --ink: #102a28;
  --ink-2: #3d5450;
  --ink-3: #74908b;
  --line: #d6e1dd;
  --line-2: #e7eeec;
  --accent: #00a693;
  --accent-deep: #00766a;
  --accent-soft: #d6ebe6;
  --slate: #2f5d74;
  --slate-soft: #dde7ec;
  --st-viva: #1f9d6b;
  --st-legada: #909691;
  --st-semfonte: #bd861c;
  --st-redundante: #7a6fb0;
  --st-incerta: #4f7d92;
  --sev-alto: #c4453b;
  --sev-medio: #bd861c;
  --sev-baixo: #6b7a86;
  --grid: rgba(16,42,40,0.05);
  --shadow: 0 1px 2px rgba(16,42,40,.04), 0 8px 24px -16px rgba(16,42,40,.18);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --sidebar-w: 312px;
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background-color: var(--ground);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  line-height: 1.5;
  font-size: 15px;
}
a { color: inherit; }
::selection { background: var(--accent-soft); }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.side {
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.6));
  backdrop-filter: blur(2px);
  position: sticky; top: 0; align-self: start;
  height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--line-2); }
.brand-mark { display: flex; align-items: center; gap: 10px; }
.brand-dot { width: 13px; height: 13px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.brand-name { font-weight: 750; letter-spacing: -.01em; font-size: 15px; }
.brand-sub { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); margin-top: 7px; }

.search { padding: 12px 14px; position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--line-2); z-index: 2; }
.search input {
  width: 100%; padding: 9px 11px; font: inherit; font-size: 13.5px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--paper-2); color: var(--ink);
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

.nav-top { padding: 10px 10px 4px; display: flex; flex-direction: column; gap: 2px; }
.nav-top a {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  padding: 9px 11px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2);
}
.nav-top a:hover { background: var(--paper-2); color: var(--ink); }
.nav-top a.active { background: var(--accent-soft); color: var(--accent-deep); }
.nav-top a .ic { font-family: var(--mono); font-size: 12px; color: var(--accent-deep); }

.cat-group { padding: 6px 10px 2px; }
.cat-head { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .15em; color: var(--ink-3); padding: 12px 11px 6px; display: flex; justify-content: space-between; }
.cat-head span:last-child { opacity: .7; }
.mod-link {
  display: flex; align-items: center; gap: 9px; text-decoration: none;
  padding: 7px 11px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer;
}
.mod-link:hover { background: var(--paper-2); color: var(--ink); }
.mod-link.active { background: var(--ink); color: #fff; }
.mod-link.active .hdot { box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.hdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hdot.g { background: var(--st-viva); }
.hdot.a { background: var(--st-semfonte); }
.hdot.r { background: var(--sev-alto); }
.mod-link .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin-top: auto; padding: 14px 20px 20px; font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--line-2); }

/* ---------- Main ---------- */
.main { min-width: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 40px 96px; }

.eyebrow { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .2em; color: var(--accent-deep); margin: 0 0 14px; }
h1.title { font-size: clamp(2rem, 1.2rem + 2.6vw, 3.1rem); line-height: 1.02; letter-spacing: -.025em; font-weight: 800; margin: 0 0 18px; max-width: 18ch; }
.lede { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 70ch; margin: 0 0 26px; }

/* hero stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 28px 0 14px; }
.stat { background: var(--paper); padding: 18px 16px; }
.stat .n { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.stat .l { font-size: 12px; color: var(--ink-3); margin-top: 8px; line-height: 1.3; }
.stat .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin-top: 5px; }

/* spine */
.spine-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 12px; margin: 30px 0; box-shadow: var(--shadow);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 18px 18px; }
.spine-card h2 { margin: 0 0 4px; }
.spine-wrap { width: 100%; overflow-x: auto; }
.spine { width: 100%; min-width: 720px; height: auto; display: block; }
.sp-node rect { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; transition: transform .5s ease, opacity .5s ease; transform-origin: center; }
.sp-node text { font-family: var(--sans); font-size: 13px; font-weight: 650; fill: var(--ink); }
.sp-node .sub { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); font-weight: 400; }
.sp-node.j rect { stroke: var(--accent); stroke-width: 2; }
.sp-node.b rect { fill: var(--paper-2); stroke: var(--slate); }
.sp-node.star rect { fill: var(--ink); stroke: var(--ink); }
.sp-node.star text { fill: #fff; }
.sp-node.star .sub { fill: rgba(255,255,255,.7); }
.sp-node a { cursor: pointer; }
.sp-node a:hover rect { stroke-width: 2.5; filter: brightness(.99); }
.sp-link { fill: none; stroke: var(--accent); stroke-width: 2; }
.sp-link.s { stroke: var(--slate); }
.sp-link.dash { stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 4 4; }
.rail { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 2px 10px; }
.rail .rl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin-right: 4px; }
.rail a { text-decoration: none; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--ink-2); }
.rail a:hover { border-color: var(--slate); color: var(--slate); }

/* generic section */
section.blk { margin: 38px 0; }
h2 { font-size: 21px; letter-spacing: -.015em; font-weight: 750; margin: 0 0 16px; }
h2 .cnt { font-family: var(--mono); font-size: 13px; color: var(--ink-3); font-weight: 400; }
.note { background: var(--paper-2); border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 14px 16px; color: var(--ink-2); font-size: 14px; margin: 16px 0; }
.note.warn { border-left-color: var(--sev-medio); }

/* module header */
.mod-head { border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: 8px; }
.mod-bc { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mod-bc a { color: var(--accent-deep); text-decoration: none; }
.mod-bc .slug { color: var(--ink-2); }
.mod-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mod-title h1 { font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.4rem); margin: 0; letter-spacing: -.02em; font-weight: 800; }
.mod-purpose { font-size: 16.5px; color: var(--ink-2); line-height: 1.55; max-width: 74ch; margin: 16px 0 0; }
.mod-who { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.mod-who b { font-family: var(--mono); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); display: block; margin-bottom: 4px; }

.altitude-tag { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent-deep); background: var(--accent-soft); padding: 4px 9px; border-radius: 99px; display: inline-block; margin-bottom: 16px; }
.altitude-tag.op { color: var(--slate); background: var(--slate-soft); }
.altitude-tag.au { color: var(--sev-alto); background: #f6e0de; }

/* flow entrada/proc/saida */
.flow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin: 8px 0; }
.flow-col { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; }
.flow-col h3 { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 12px; color: var(--ink-3); display: flex; align-items: center; gap: 7px; }
.flow-col h3::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.flow-col.proc h3::before { background: var(--slate); }
.flow-col.out h3::before { background: var(--st-viva); }
.flow-col ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.flow-col li { font-size: 13px; line-height: 1.45; color: var(--ink-2); padding-left: 14px; position: relative; }
.flow-col li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.flow-col.proc li.auto::before { background: var(--slate); }
.tag-auto, .tag-man { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; margin-right: 5px; vertical-align: 1px; }
.tag-auto { background: var(--slate-soft); color: var(--slate); }
.tag-man { background: #efe7d6; color: #8a6a1c; }

/* integrações */
.integ { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.integ .box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.integ h3 { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 12px; color: var(--ink-3); }
.integ ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.integ li { font-size: 13px; line-height: 1.45; color: var(--ink-2); display: flex; gap: 8px; }
.integ li .ar { color: var(--accent-deep); font-family: var(--mono); flex: none; }
.integ .in li .ar { color: var(--slate); }

/* abas (cards) */
.abas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.aba { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 14px; display: flex; flex-direction: column; }
.aba.x-legada, .aba.x-sem_fonte, .aba.x-redundante { background: var(--paper-2); }
.aba-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.aba-nm { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.aba-fn { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-bottom: 10px; }
.steps { margin: 0 0 4px; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 5px; }
.steps li { font-size: 12.5px; color: var(--ink-2); padding-left: 24px; position: relative; line-height: 1.4; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 17px; height: 17px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); font-family: var(--mono); font-size: 10px; font-weight: 600; display: grid; place-items: center; }
.aba-rec { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--ink-2); }
.aba-rec b { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.ev { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 8px; word-break: break-word; }

/* chips */
.chip { font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px; border-radius: 99px; white-space: nowrap; flex: none; border: 1px solid transparent; }
.chip.viva { color: var(--st-viva); background: #e2f3ea; }
.chip.legada { color: var(--st-legada); background: #ededec; }
.chip.sem_fonte { color: var(--st-semfonte); background: #f6ecd6; }
.chip.redundante { color: var(--st-redundante); background: #ece9f5; }
.chip.incerta { color: var(--st-incerta); background: #e1edf1; }
.chip.alto { color: #fff; background: var(--sev-alto); }
.chip.medio { color: #6e4f10; background: #f1e2c2; }
.chip.baixo { color: var(--sev-baixo); background: #e7ecee; }

/* achados */
.achados { display: flex; flex-direction: column; gap: 10px; }
.achado { background: var(--paper); border: 1px solid var(--line); border-left-width: 3px; border-radius: 0 11px 11px 0; padding: 13px 16px; }
.achado.alto { border-left-color: var(--sev-alto); }
.achado.medio { border-left-color: var(--sev-medio); }
.achado.baixo { border-left-color: var(--sev-baixo); }
.achado-top { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.achado-mod { font-family: var(--mono); font-size: 11px; color: var(--accent-deep); text-decoration: none; }
.achado-desc { font-size: 13.5px; color: var(--ink); line-height: 1.45; }
.achado-rec { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.achado-rec b { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }

/* filter bar */
.filters { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 18px; align-items: center; }
.filters .fl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin-right: 4px; }
.fbtn { font: inherit; font-size: 12.5px; padding: 5px 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); border-radius: 99px; cursor: pointer; }
.fbtn:hover { border-color: var(--accent); color: var(--accent-deep); }
.fbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.fbtn .c { font-family: var(--mono); opacity: .65; margin-left: 5px; }

/* mapa edges */
.edge-group { margin-bottom: 22px; }
.edge-group h3 { font-size: 14.5px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.edge-group h3 a { text-decoration: none; }
.edge-group h3 .slug { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.edge { display: grid; grid-template-columns: 200px 1fr; gap: 12px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--paper); margin-bottom: 6px; align-items: baseline; }
.edge .to { font-weight: 600; font-size: 13px; }
.edge .via { font-family: var(--mono); font-size: 11.5px; color: var(--slate); line-height: 1.4; }
.edge .via::before { content: "via "; color: var(--ink-3); }

.silo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.silo .s { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
.silo .s b { color: var(--ink); }

/* transversais */
.tx { display: flex; flex-direction: column; gap: 12px; }
.tx .t { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.tx .t h3 { margin: 0 0 8px; font-size: 15.5px; }
.tx .t p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.tx .t .rec { margin-top: 10px; font-size: 12.5px; color: var(--accent-deep); }
.tx .t .rec b { font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }

/* mobile topbar */
.topbar { display: none; position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 14px; align-items: center; gap: 12px; }
.topbar .mb { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; font-size: 18px; line-height: 1; }
.topbar .tt { font-weight: 700; }
.scrim { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .topbar { display: flex; }
  .side { position: fixed; left: 0; top: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%); transition: transform .26s ease; box-shadow: 0 0 60px rgba(0,0,0,.2); background: var(--paper); }
  .side.open { transform: none; }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(16,42,40,.35); z-index: 40; }
  .wrap { padding: 26px 18px 80px; }
  .flow, .integ, .abas, .silo { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .edge { grid-template-columns: 1fr; gap: 3px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.fade { animation: fade .4s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.empty { color: var(--ink-3); font-size: 14px; padding: 30px 0; text-align: center; }

/* ===== Fluxograma (canvas tipo Miro) ===== */
.fx-root { position: absolute; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(var(--grid) 1px, transparent 1px); background-size: 26px 26px; background-color: var(--ground); }
.fx-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.82); backdrop-filter: blur(3px); flex-wrap: wrap; z-index: 6; }
.fx-bar .fx-title { font-weight: 750; letter-spacing: -.01em; margin-right: 6px; }
.fx-bar .fx-title b { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; color: var(--accent-deep); font-weight: 600; display: block; }
.fx-btn { font: inherit; font-size: 12.5px; padding: 5px 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); border-radius: 8px; cursor: pointer; }
.fx-btn:hover { border-color: var(--accent); color: var(--accent-deep); }
.fx-zoom { font-family: var(--mono); font-size: 12px; color: var(--ink-3); min-width: 46px; text-align: center; }
.fx-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.fx-legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
.fx-legend i { width: 18px; height: 0; border-top-width: 2.5px; border-top-style: solid; display: inline-block; }
.lg-flow { border-top-color: var(--accent); }
.lg-entrada { border-top-color: var(--slate); }
.lg-gate { border-top-color: #c4453b; }
.lg-naoconta { border-top-color: #9aa3a0; border-top-style: dashed; }

.fx-viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; }
.fx-viewport.panning { cursor: grabbing; }
.fx-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
.fx-edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
.fx-edge { fill: none; }
.fx-edge.e-solid { stroke: var(--accent); stroke-width: 2; }
.fx-edge.e-principal { stroke: var(--accent); stroke-width: 3.6; }
.fx-edge.e-aux { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 5; opacity: .7; }
.fx-edge.e-entrada { stroke: var(--slate); stroke-width: 2; }
.fx-edge.e-gate { stroke: #c4453b; stroke-width: 2.6; }
.fx-edge.e-feeder { stroke: #b9c4c0; stroke-width: 1.3; }
.fx-edge.e-naoconta { stroke: #9aa3a0; stroke-width: 1.8; stroke-dasharray: 6 5; }
.fx-edge.e-apoio { stroke: #c2ccc8; stroke-width: 1.2; stroke-dasharray: 3 4; }
.fx-edge.dim { opacity: .12 !important; }
.fx-edge.hot { stroke-width: 3.4; }
.fx-elabel { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-2); }

rificacao_notas":"Confiança ALTA. Reabri Financeiro.jsx, financeiro.js, financeiroV2.js, api.js, solicitacoes.js, os componentes Santander e a migration da view. Mudanças relevantes: (1) O achado mais grave (severidade 'alto' = dois ledgers divergentes) foi REFUTADO e REBAIXADO para 'medio' + reframing: v1 e v2 escrevem na MESMA fin_transacoes (financeiroV2.js:611 INSERT; financeiro.js:171 INSERT) e vw_fin_transacoes_completa é 'FROM fin_transacoes' (migration 20260528160000:46), logo lançamento manual aparece no dashboard/DRE Auto. O risco real, mais estreito, é que o POST manual não grava plano_contas_id/centro_custo_id → transação manual fica sem classificação na DRE Auto. (2) Todos os demais achados SUSTENTADOS com evidência precisa: DRE legacy efêmera (Map+res.json, sem INSERT — verificado), reembolso dual-path (financeiro.js:265 vs solicitacoes.js:62/1106), renderDashboard morto (grep: só a definição na :453, render real na :1286), vencido derivado+manual (modal :980 vs dashboard financeiro.js:49), Santander gated, generosidade dependente de views. (3) Estados das abas mantidos: DRE legacy=legada ✓, Reembolsos=redundante ✓, Banco sub-tabs=incerta ✓ — todos confirmados no código. entrada/processamento/saida/integracoes ajustados com referências arquivo:linha verificadas.","rota":"/admin/financeiro","pageFile":"src/pages/admin/financeiro/Financeiro.jsx","backendRouteFile":"backend/routes/financeiroV2.js","apiNamespace":"financeiroV2"},{"slug":"logistica","nome":"Logística","categoria":"Operacional","para_que_serve":"Central de compras, suprimentos e ESTOQUE da igreja. Hoje (origin/main) tem 9 abas: cadastro de fornecedores; pedidos de compra (com itens e recebimento); arquivo de notas fiscais (manual, importadas do Mercado Livre e do Arquivei); painel/lista de Compras (manuais + ML, aba LogisticaCompras); acompanhamento das compras do Mercado Livre com rastreio; CONTROLE DE ESTOQUE com saldo derivado, validade/FEFO, consumo por área e ponte estoque→compras (aba LogisticaEstoque, PR #1031 — substitui o Power App + listas do SharePoint GestaodeEstoque); e a fila de Solicitações da própria área (aba LogisticaSolicitacoes, reusa o backbone /solicitacoes com o fluxo de cotação). A entrada genérica de novas solicitações de compra continua em /solicitacoes (categoria=compras) desde 19/05/2026.","quem_usa":"Área de Logística/Compras (Amaury é responsável de logistica_compras/manutencao/reserva conforme CLAUDE.md). Acesso por authorizeModule('logistica') no backend (logistica.js:6) — qualquer nível ≥1 entra; criar/editar/desativar fornecedor e pedido são gated no frontend por isDiretor. Importações de NF/ML e a aba Estoque ficam abertas a quem tem o módulo.","entrada":["Fornecedores (aba Fornecedores): razão social, nome fantasia, CNPJ, e-mail, telefone, contato, categoria, endereço, observações — modal Novo/Editar Fornecedor","Pedidos (aba Pedidos): descrição, valor total, data prevista, fornecedor, status, código de rastreio, transportadora","Itens do pedido (aba Pedidos → 📦): descrição, quantidade, unidade, valor unitário (ItensPedidoModal)","Recebimento (aba Pedidos → ✓): status (ok/com_avaria/incompleto) + observações","Notas fiscais (aba Notas Fiscais): número, série, valor, data de emissão, fornecedor, pedido, chave de acesso, upload de PDF","Estoque (aba Estoque/LogisticaEstoque): cadastro de produto (nome, categoria, unidade, valor unitário, quantidade mínima, controla validade) + movimentações (entrada/saída/ajuste com validade, área de destino, evento) — POST /logistica/estoque/produtos e /estoque/movimentacoes","Solicitações da área (aba Solicitações/LogisticaSolicitacoes): cotação/valor/fornecedor sobre solicitações de compra — via backbone /solicitacoes","Credenciais Arquivei (aba Notas Fiscais): API ID, API Key, CNPJ","Credenciais Mercado Livre (aba Compras ML): client_id, client_secret → OAuth"],"processamento":["MANUAL: CRUD de fornecedores, pedidos, itens, notas fiscais e produtos de estoque (POST/PUT/PATCH/DELETE em logistica.js)","AUTOMÁTICO (parcial): recebimento de pedido — POST /logistica/pedidos/:id/recebimento insere em log_recebimentos e seta log_pedidos.status='recebido' no mesmo handler","AUTOMÁTICO: saldo de estoque é DERIVADO da view vw_log_estoque_saldo (ledger log_estoque_movimentacoes); lotes de perecíveis ordenados por FEFO (validade asc) em /estoque/lotes; consumo por área com custo em /estoque/consumo (logistica.js ~967-1110)","AUTOMÁTICO (ponte): POST /logistica/estoque/gerar-compra cria UMA solicitação de compra dos itens 'a repor' (aprovação de origem dispensada) → cai na fila do Amaury/fluxo de compras","AUTOMÁTICO: upload de PDF da NF direto ao Storage do Supabase (bucket log-arquivos) pelo frontend, sem passar pelo backend","AUTOMÁTICO (integração externa): importar NFs do Mercado Livre via ml.syncNotas() e do Arquivei via arquivei.sync() — endpoints vivem em OUTROS routers (ml/arquivei)","AUTOMÁTICO (integração externa): abas Compras, Compras ML e Rastreio consomem a API do Mercado Livre via namespace ml; o dashboard busca compras do mês e envios em trânsito do ML server-side (logistica.js:13-113)","AUTOMÁTICO: cache de 30s do dashboard em memória do processo (logistica.js:9-10) — some entre cold starts serverless","SEM PROCESSAMENTO DE KPI: não há coletor kpiAutoCollector nem trigger SQL lendo log_*/log_estoque_* para alimentar a matriz NSM/painel; os números do Dashboard são contagens diretas. O KPI de SLA de compras vem de /solicitacoes (vw_solicitacoes_sla)"],"saida":["Dashboard com 5 cartões: Fornecedores Ativos, Ped. Aguardando, Ped. Em Trânsito, Ped. Recebidos, Compras do Mês (valor ML) — clicáveis (o cartão Compras do Mês navega para a aba Compras ML, índice 5)","Tabela de fornecedores filtrável por ativo/inativo","Tabela de pedidos com status, rastreio, seleção em massa e Exportar CSV","Tabela de notas fiscais com origem (manual/ML/Arquivei) e link para PDF/ML","Aba Compras (LogisticaCompras): KPIs de compras + lista consolidada de compras manuais + ML","Cards de compras do Mercado Livre com detalhe de pagamento/envio/endereço (ComprasMLTab)","Rastreio visual (timeline de envio) com auto-refresh (RastreioMLTab)","Estoque (LogisticaEstoque): catálogo com saldo derivado, itens 'a repor', lotes por validade (FEFO), consumo por área e relatório consolidado (/estoque/relatorio)","Fila de Solicitações da área (LogisticaSolicitacoes) com cotação e status","Export: CSV de pedidos (client-side)"],"integracoes":{"alimenta":["Supabase Storage bucket 'log-arquivos' — recebe os PDFs de NF (upload direto do frontend)","log_recebimentos / log_pedidos.status — recebimento muda o status do pedido","log_estoque_movimentacoes (ledger) → vw_log_estoque_saldo (saldo derivado)","solicitacoes (backbone) — /estoque/gerar-compra cria solicitação de compra dispensada de aprovação de origem; a aba Solicitações também lê/escreve a fila de compras da área","Não alimenta KPIs/NSM/painel (nenhuma fonte_auto 'logistica.*' nem trigger nas tabelas log_*); o KPI de SLA de compras vem de /solicitacoes (vw_solicitacoes_sla)"],"alimentado_por":["Mercado Livre API — via namespace 'ml' (config/orders/shipments/syncNotas) e via getMLConfig/searchOrders/mlFetch no backend; abas Compras, Compras ML e Rastreio dependem disso","Arquivei API — via namespace 'arquivei' (status/config/sync) para importar NFs emitidas contra o CNPJ na Sefaz","backbone /solicitacoes — a aba Solicitações reusa a API solicitacoes (não logistica.solicitacoes)","Tabelas Supabase: log_fornecedores, log_pedidos, log_pedido_itens, log_recebimentos, log_notas_fiscais, log_estoque_produtos, log_estoque_movimentacoes (+ view vw_log_estoque_saldo); log_solicitacoes_compra e log_movimentacoes existem mas estão órfãs (sem consumidor de UI)"]},"abas":[{"nome":"Dashboard","funcao":"Visão geral com 5 cartões operacionais de fornecedores/pedidos + valor de compras ML do mês.","passo_a_passo":["Abrir o módulo (cai na aba Dashboard)","Ler os cartões de fornecedores/pedidos/compras do mês","Clicar num cartão para ir à aba correspondente"],"estado":"viva","evidencia":"Logistica.jsx DashboardTab + kpis (cartão Compras do Mês → tab índice 5); backend logistica.js:13-113","recomendacao":"O cartão 'Compras do Mês' depende do ML estar conectado; sem conexão fica R$ 0,00 sem aviso explícito."},{"nome":"Fornecedores","funcao":"Cadastro/CRUD de fornecedores com filtro ativo/inativo.","passo_a_passo":["Filtrar por status (Todos/Ativos/Inativos)","Clicar '+ Novo Fornecedor' e preencher o modal","Editar (✏️), pausar/ativar (⏸/▶) ou excluir (🗑)"],"estado":"viva","evidencia":"Logistica.jsx FornecedoresTab + toggleFornecedorAtivo (:249-250); logistica.js:177 (PUT full update)","recomendacao":"Corrigir o PUT que faz update completo: ao só alternar 'ativo', os demais campos chegam undefined e o backend os grava como null — usar update parcial ou COALESCE. Bug confirmado em origin/main."},{"nome":"Pedidos","funcao":"Registro de pedidos de compra, itens, recebimento e export CSV.","passo_a_passo":["Filtrar por status; criar '+ Novo Pedido'","Abrir itens (📦) para adicionar produtos","Marcar recebimento (✓) com status; ou Exportar CSV"],"estado":"viva","evidencia":"Logistica.jsx ItensPedidoModal (form.valor_unit :1084,1149); logistica.js:852-855 (lê valor_unitario)","recomendacao":"Bug de itens CONFIRMADO em origin/main: o frontend envia 'valor_unit' mas o backend lê 'valor_unitario' → valor unitário descartado, item grava 0, total sai R$ 0,00. Renomear o campo no frontend para 'valor_unitario'."},{"nome":"Notas Fiscais","funcao":"Arquivo de NFs: cadastro manual com upload de PDF + importação automática de ML e Arquivei.","passo_a_passo":["Cadastrar NF manual ou importar do ML/Arquivei","Configurar credenciais do Arquivei se ainda não conectado","Ver/baixar o PDF na coluna PDF; excluir (🗑)"],"estado":"viva","evidencia":"Logistica.jsx NotaFiscalModal (getPublicUrl :963); logistica.js:252-280; sync via namespaces ml/arquivei","recomendacao":"PDF gravado com getPublicUrl (upload pela anon key do frontend) — confirmar se o bucket log-arquivos é privado; NF tem dado fiscal sensível. Preferir URL assinada/bucket privado, padrão Cérebro."},{"nome":"Compras","funcao":"Painel/lista consolidada de compras (manuais + Mercado Livre) com KPIs próprios.","passo_a_passo":["Abrir a aba Compras (LogisticaCompras)","Ler os KPIs e a lista de compras","Filtrar/ordenar conforme necessidade"],"estado":"viva","evidencia":"Logistica.jsx:386 (tab===4 → \u003cLogisticaCompras/>); src/pages/admin/logistica/LogisticaCompras.jsx (importa { logistica } da api)","recomendacao":"Aba presente em origin/main (a versão local de 6 abas estava desatualizada)."},{"nome":"Compras ML","funcao":"Lista as compras feitas na conta Mercado Livre da igreja (somente leitura, via API).","passo_a_passo":["Conectar a conta ML (client_id/secret → OAuth) na 1ª vez","Buscar/filtrar por status e expandir um card","Abrir a compra no site do ML"],"estado":"viva","evidencia":"Logistica.jsx:387 (tab===5 → \u003cComprasMLTab/>); namespace ml (status/config/orders/shipment)","recomendacao":"Depende de OAuth do ML ativo; tokens de marketplace expiram — prever reconexão/erro claro (monitorar como o caso do YouTube OAuth)."},{"nome":"Rastreio","funcao":"Timeline de rastreio dos envios do Mercado Livre, com auto-refresh.","passo_a_passo":["Abrir a aba (carrega envios do ML)","Separar em 'em andamento' e 'concluídos'","Expandir um card para ver a timeline e o endereço"],"estado":"viva","evidencia":"Logistica.jsx:388 (tab===6 → \u003cRastreioMLTab/>); ml.shipments/ml.shipment","recomendacao":"Só funciona com ML conectado; sem conexão mostra estado vazio orientando ir à aba Compras ML — comportamento correto."},{"nome":"Estoque","funcao":"Controle de estoque com saldo derivado (ledger), validade/FEFO, consumo por área e ponte estoque→compras. Substitui o Power App + listas do SharePoint.","passo_a_passo":["Abrir a aba Estoque (LogisticaEstoque)","Cadastrar produto e registrar entradas/saídas/ajustes","Ver itens 'a repor', lotes por validade e gerar solicitação de compra"],"estado":"viva","evidencia":"Logistica.jsx:7-8 import + :389 (tab===7 → \u003cLogisticaEstoque/>); backend /logistica/estoque/* (logistica.js:908-1110: produtos, movimentacoes, lotes/FEFO, consumo, gerar-compra, relatorio); vw_log_estoque_saldo + log_estoque_produtos/log_estoque_movimentacoes","recomendacao":"RECLASSIFICADO PARA VIVA: o agente original auditou um working tree desatualizado (6 abas, sem Estoque). Em origin/main a aba existe e está plenamente implementada (PR #1031). Usa log_estoque_movimentacoes (não log_movimentacoes)."},{"nome":"Solicitações","funcao":"Fila de solicitações de compra da própria área (Amaury) dentro do módulo, com cotação — reusa o backbone /solicitacoes.","passo_a_passo":["Abrir a aba Solicitações (LogisticaSolicitacoes)","Ver as solicitações por área (compras/manutenção/reserva/estoque) e status","Cotar valor/fornecedor e seguir o fluxo de aprovação"],"estado":"viva","evidencia":"Logistica.jsx:7 import + :390 (tab===8 → \u003cLogisticaSolicitacoes/>); o componente importa { solicitacoes as api } do backbone (NÃO logistica.solicitacoes)","recomendacao":"RECLASSIFICADO PARA VIVA: a aba NÃO foi removida — foi re-adicionada em origin/main reusando a API de Solicitações. A versão local de 6 abas (sem ela) estava desatualizada."},{"nome":"API legada · log_solicitacoes_compra + log_movimentacoes","funcao":"Endpoints antigos de 'solicitações de compra' (log_solicitacoes_compra) e de 'movimentações' (log_movimentacoes) sem consumidor de UI.","passo_a_passo":["N/A — nenhuma aba renderiza esses endpoints"],"estado":"legada","evidencia":"logistica.js:159-193 (/solicitacoes em log_solicitacoes_compra) e :314-349 (/movimentacoes em log_movimentacoes); api.js:776-780 (logistica.solicitacoes) e :796-800 (logistica.movimentacoes) sem chamador. A aba Solicitações usa o backbone solicitacoes; a aba Estoque usa log_estoque_movimentacoes (tabela diferente)","recomendacao":"Marcar como legado/remover: o dashboard ainda computa solicitacoesPendentes/Aprovadas (logistica.js:96-97) não exibidos; os endpoints de log_movimentacoes ficaram órfãos quando o estoque passou a usar log_estoque_movimentacoes."}],"achados_auditoria":[{"severidade":"alto","descricao":"Bug de gravação de itens do pedido: o frontend envia 'valor_unit', mas o backend lê 'valor_unitario'. O valor unitário digitado é descartado e o item é salvo com 0, fazendo o total do pedido aparecer sempre R$ 0,00. Confirmado em origin/main.","evidencia":"origin/main src/pages/admin/logistica/Logistica.jsx:1084 e :1149 (form/input valor_unit) vs backend/routes/logistica.js:852,855 (const { valor_unitario } = req.body; insert valor_unitario)","recomendacao":"Renomear no frontend para 'valor_unitario' ou aceitar ambos no backend; validar que log_pedido_itens.valor_total seja recomputado após o fix."},{"severidade":"alto","descricao":"Update de fornecedor pode apagar dados: o PUT atualiza todos os campos. Ao alternar apenas 'ativo' (toggleFornecedorAtivo envia só { ativo }), os demais campos chegam undefined no body e são gravados como null. Confirmado em origin/main.","evidencia":"origin/main Logistica.jsx:249-250 (update só com {ativo}); backend/routes/logistica.js:177-181 (update com razao_social, cnpj, endereco, etc. potencialmente undefined→null)","recomendacao":"No backend montar o update só com chaves presentes no body, ou usar COALESCE/patch parcial. O 'Salvar' do modal (objeto completo) não sofre; o toggle sim."},{"severidade":"medio","descricao":"Endpoints/namespace de 'Solicitações de compra' (log_solicitacoes_compra) e de 'Movimentações' (log_movimentacoes) seguem ativos no backend e no api.js SEM consumidor de UI. A aba Solicitações da Logística usa o backbone /solicitacoes (não logistica.solicitacoes); a aba Estoque usa log_estoque_movimentacoes (não log_movimentacoes). O dashboard ainda computa solicitacoesPendentes/Aprovadas, não exibidos.","evidencia":"backend/routes/logistica.js:159-193 (log_solicitacoes_compra), :314-349 (log_movimentacoes) e :96-97; api.js:776-780 e :796-800; aba Estoque usa /estoque/movimentacoes (logistica.js:967+)","recomendacao":"Marcar como legado/remover para evitar manutenção fantasma."},{"severidade":"baixo","descricao":"PDF da NF é salvo com getPublicUrl no bucket 'log-arquivos'. Se o bucket for público, qualquer um com a URL acessa documento fiscal (dado sensível). O upload ocorre pelo frontend com a anon key, sem passar pelo backend. Confirmado em origin/main.","evidencia":"origin/main Logistica.jsx:961-963 (storage.from('log-arquivos').upload + getPublicUrl)","recomendacao":"Usar URL assinada com expiração + bucket privado, e/ou rotear o upload pelo backend (service_role). Verificar a privacidade real do bucket no painel do Supabase."},{"severidade":"baixo","descricao":"Cache do dashboard fica em variável de módulo no processo (30s). No serverless do Vercel cada cold start zera o cache e instâncias não o compartilham; ao buscar envios do ML faz até 20 chamadas síncronas que podem deixar o /dashboard lento.","evidencia":"backend/routes/logistica.js:9-10 (dashboardCache em memória) e :78-84 (loop de mlFetch por shipment, slice(0,20))","recomendacao":"Aceitável para uso baixo; se crescer, mover a contagem de em-trânsito para um job/coletor e não bloquear o dashboard."}],"verificacao_notas":"Confiança ALTA. Achado central: o agente original auditou um working tree DESATUALIZADO (6 abas: Dashboard/Fornecedores/Pedidos/Notas/Compras ML/Rastreio). Reabri os arquivos reais via git show origin/main e o módulo tem 9 ABAS: + Compras (LogisticaCompras), + Estoque (LogisticaEstoque), + Solicitações (LogisticaSolicitacoes). REFUTEI duas reclassificações: (1) 'Estoque inexistente/sem_fonte' → VIVA — PR #1031 está em origin/main com backend /logistica/estoque/* (saldo derivado vw_log_estoque_saldo, FEFO em /estoque/lotes, consumo, gerar-compra, relatório); (2) 'Solicitações removida/legada' → VIVA, re-adicionada reusando o backbone /solicitacoes. CONFIRMEI os 2 bugs altos (valor_unit↔valor_unitario nos itens; PUT de fornecedor apaga campos no toggle) — ambos persistem no código vivo. O achado médio de API legada foi REFINADO: o que está realmente órfão são os endpoints log_solicitacoes_compra (logistica.js:159-193) e log_movimentacoes (logistica.js:314-349) + seus namespaces no api.js — porque a aba Solicitações usa o backbone solicitacoes e a aba Estoque usa log_estoque_movimentacoes (tabela diferente). Mantive os achados baixos (getPublicUrl/bucket e cache em memória), confirmados em origin/main. Ajustei o índice da navegação do cartão 'Compras do Mês' (tab 5, não 4). Lição: auditar sempre contra origin/main (memória 'check-origin-main-antes-de-implementar').","rota":"/admin/logistica","pageFile":"src/pages/admin/logistica/Logistica.jsx","backendRouteFile":"backend/routes/logistica.js","apiNamespace":"logistica"},{"slug":"patrimonio","nome":"Patrimônio","categoria":"Operacional","para_que_serve":"Controle do patrimônio físico da igreja: cadastro de bens (móveis, equipamentos), organização por categoria e localização, rastreio por código de barras/etiqueta (com normalização de zeros à esquerda no scanner), registro de movimentações de bens (entrada, saída, transferência, manutenção, baixa) e condução de inventários periódicos (apenas cabeçalho de campanha, sem contagem item-a-item). Inclui ainda uma aba que expõe e cria movimentações de ESTOQUE do módulo Logística (log_movimentacoes), um domínio diferente de \"bens patrimoniais\".","quem_usa":"Equipe administrativa/logística do patrimônio (Amaury/logística e manutenção). Leitura exige nível 2 no módulo (não nível 1: authorizeModule usa nivelMinimo=2 por padrão); escrita exige escrita >= 2. Admin/diretor sempre passam. As ações de escrita na UI aparecem só para isDiretor, mas o backend já gateia por nível 2 também.","entrada":["Bens: código de barras (obrigatório), nome (obrigatório), categoria, localização, marca, modelo, nº série, valor de aquisição, data de aquisição, status (só na edição), descrição, observações — aba Bens (modal Novo/Editar Bem)","Movimentações de bem: tipo (entrada/saída/transferência/manutenção/baixa), localização origem/destino, motivo — aba Bens (detalhe do bem, MovFormModal) e aba Scanner (form inline após escanear) · ambas as telas oferecem os 5 tipos","Categorias e Localizações: nome — aba Categorias / Localizações (campo + botão +)","Inventários: nome (obrigatório), data início (obrigatória), observações — aba Inventários (modal Novo Inventário)","Movimentações de ESTOQUE (logística): tipo, código de barras (obrigatório), descrição, quantidade, unidade, localização, observações — aba Movimentações (modal Nova Movimentação) · grava em log_movimentacoes via API logistica.movimentacoes.create"],"processamento":["AUTOMÁTICO · Dashboard via RPC pat_dashboard_stats (patrimonio.js:12) — SECURITY DEFINER, 1 chamada","AUTOMÁTICO · POST /bens/:id/movimentacoes muda o bem conforme o tipo: transferencia→atualiza localizacao_id, manutencao→status 'manutencao', baixa→status 'baixado' (patrimonio.js:192-200). entrada/saida NÃO alteram o bem","AUTOMÁTICO · GET /bens/barcode/:codigo gera variantes de etiqueta (zeros à esquerda, padding 6/8/10/12/13) e faz .in() para casar a leitura física (patrimonio.js:99-117)","MANUAL · CRUD de bens/categorias/localizações e transição de status de inventário","MANUAL · Inventário é só cabeçalho (nome/datas/status/responsável), sem contagem item-a-item"],"saida":["Dashboard com 6 KPIs (Total, Ativos, Manutenção, Baixados, Extraviados, Valor Total) clicáveis → aba Bens já filtrada por status","Quadros Por Categoria / Por Localização + aviso de inventários em andamento","Tabela de Bens filtrável (busca/status/categoria/localização) com detalhe + histórico de movimentações","Ficha de bem pelo Scanner + leituras recentes da sessão (estado local, não persiste)","Lista de Inventários e tabela de Movimentações de estoque (log_movimentacoes)","Sem export em nenhuma aba; não alimenta KPI/NSM/OKR/dados_brutos"],"integracoes":{"alimenta":["Tabelas próprias pat_bens / pat_categorias / pat_localizacoes / pat_movimentacoes / pat_inventarios (via REST service_role no backend)","NÃO alimenta KPIs, NSM, matriz OKR, dados_brutos nem nenhum outro módulo de inteligência — é um silo de dados patrimoniais","A aba Movimentações grava em log_movimentacoes (módulo Logística/Estoque) via logistica.movimentacoes.create (logistica.js:328-338) — ou seja, escreve no domínio de Estoque, não em pat_movimentacoes"],"alimentado_por":["Categorias e Localizações são cadastradas dentro do próprio módulo (não vêm de fora)","Movimentações de estoque exibidas na aba 6 vêm de log_movimentacoes (Logística) via logistica.movimentacoes.list/historico (logistica.js:315,340)","profiles (nome do responsável de movimentações/inventários) via join profiles!responsavel_id (patrimonio.js:129,146,208)"]},"abas":[{"nome":"Dashboard","funcao":"Visão geral: 6 KPIs de contagem/valor, distribuição por categoria e por localização, aviso de inventários abertos.","passo_a_passo":["Abrir o módulo (cai na aba Dashboard)","Ver os cards de total/ativos/manutenção/etc.","Clicar num card para ir à aba Bens já filtrada por status"],"estado":"viva","evidencia":"Patrimonio.jsx:261-308 (DashboardTab) + patrimonio.js:8-19 (RPC pat_dashboard_stats)","recomendacao":"Versionar a RPC pat_dashboard_stats numa migration (ausente do versionado) e, na UI, distinguir 'erro ao carregar' (dashError=true) de 'nenhum bem cadastrado' — hoje o catch zera tudo e parece sistema vazio."},{"nome":"Bens","funcao":"Inventário-mestre dos bens: listar/filtrar, cadastrar, editar, ver detalhe com histórico e remover.","passo_a_passo":["Filtrar por nome/status/categoria/localização","Clicar numa linha para abrir o detalhe + histórico de movimentações","Como diretor: + Novo Bem, ou editar/remover/registrar movimentação no detalhe"],"estado":"viva","evidencia":"Patrimonio.jsx:310-358 (BensTab), 443-543 (form/detalhe) + patrimonio.js:78-203"},{"nome":"Scanner","funcao":"Buscar bem por código de barras (câmera ou digitação, com normalização de variantes de etiqueta) e registrar movimentação inline.","passo_a_passo":["Digitar o código e Enter, ou clicar Escanear e apontar a câmera","Ver a ficha do bem encontrado + histórico","Clicar Registrar Movimentação, escolher o tipo (os 5: entrada/saída/transferência/manutenção/baixa) e confirmar"],"estado":"viva","evidencia":"Patrimonio.jsx:603-841 (ScannerTab) · MOV_TIPO_COLORS (595-601) e os botões de tipo (749-756) oferecem os 5 tipos + patrimonio.js:94-138 (lookup com variantes)"},{"nome":"Categorias / Localizações","funcao":"Gerenciar os catálogos de categoria e localização usados na classificação dos bens.","passo_a_passo":["Digitar o nome da nova categoria/localização","Pressionar Enter ou clicar +","Remover pelo ícone de lixeira (apenas diretor na UI)"],"estado":"viva","evidencia":"Patrimonio.jsx:360-401 (CatLocTab) + patrimonio.js:22-75","recomendacao":"DELETE de categoria/localização é hard-delete sem checar bens vinculados (patrimonio.js:41-47, 69-75) — bem pode ficar com FK órfã/erro. Validar uso antes de remover."},{"nome":"Inventários","funcao":"Registrar campanhas de inventário (só cabeçalho) e marcar como concluído/cancelado.","passo_a_passo":["Como diretor: + Novo Inventário (nome + data início)","Acompanhar na tabela com status","Clicar Concluir (carimba data_fim hoje) ou Cancelar"],"estado":"incerta","evidencia":"Patrimonio.jsx:403-441 (InventariosTab), 575-590 (InvFormModal) + patrimonio.js:206-238 (só pat_inventarios cabeçalho, sem linhas)","recomendacao":"O 'inventário' não tem itens, lista esperada/encontrada nem divergência — é só um marcador de status. Definir com o dono: virar contagem item-a-item (ligada ao Scanner) ou documentar que é apenas um marcador de campanha."},{"nome":"Movimentações","funcao":"Exibe e cria movimentações de ESTOQUE (consumíveis) do módulo Logística (log_movimentacoes) — não movimentações de bens patrimoniais (pat_movimentacoes).","passo_a_passo":["Filtrar por tipo ou escanear/digitar um código para ver histórico","Clicar + Nova Movimentação","Preencher tipo/código/qtd/local e Registrar (grava em log_movimentacoes via API logistica)"],"estado":"redundante","evidencia":"Patrimonio.jsx:854-951 (LogMovimentacoesTab) + 953-998 (modal) usam logistica.movimentacoes (api.js:796-800 → /logistica/movimentacoes; backend logistica.js:315,328,340)","recomendacao":"Esta aba pertence ao domínio Estoque/Logística (tabela log_movimentacoes), não ao Patrimônio (pat_movimentacoes). Renomear claramente para 'Estoque (Logística)' ou mover para o módulo Logística, evitando que o usuário acredite estar movimentando bens patrimoniais."}],"achados_auditoria":[{"severidade":"medio","descricao":"A aba 'Movimentações' opera sobre estoque de Logística (log_movimentacoes), não sobre bens patrimoniais (pat_movimentacoes). Dois fluxos de movimentação coexistem na mesma página com semânticas diferentes: o operador pode achar que registra entrada/saída/baixa de um BEM quando, na verdade, lança movimentação de consumível em outra tabela e outro domínio. É confusão conceitual/UX (não há perda de dado nem falha de segurança).","evidencia":"Patrimonio.jsx:204-210 e 854-951 (logistica.movimentacoes → log_movimentacoes) vs patrimonio.js:183-203 (pat_movimentacoes)","recomendacao":"Renomear a aba para 'Estoque (Logística)' ou removê-la daqui e mantê-la apenas no módulo Logística."},{"severidade":"medio","descricao":"Dashboard depende da RPC pat_dashboard_stats, ausente das migrations versionadas (grep não encontrou). Se a RPC não existir/for renomeada em produção, o endpoint cai no catch (500), a UI seta dashError e zera todos os KPIs — parecendo 'sistema vazio' em vez de erro.","evidencia":"patrimonio.js:12 (supabase.rpc('pat_dashboard_stats')); grep em supabase/migrations não encontrou a definição; UI: Patrimonio.jsx:130-131 (dashError + zera dash no catch)","recomendacao":"Versionar a definição da RPC numa migration (git↔prod) e distinguir, na UI, 'erro ao carregar' de 'nenhum bem cadastrado'."},{"severidade":"medio","descricao":"O conceito de 'Inventário' não tem itens nem conferência. Cria-se um cabeçalho (nome/datas/responsável) e só se altera o status — não há contagem por leitura de etiqueta, lista de bens esperados/encontrados nem relatório de divergência. Não entrega o que se espera de um inventário patrimonial.","evidencia":"patrimonio.js:206-238 (apenas pat_inventarios cabeçalho); Patrimonio.jsx:403-441 (sem itens)","recomendacao":"Definir com o dono do módulo: implementar contagem item-a-item (vinculada ao Scanner) ou rebaixar a expectativa e documentar que é só um marcador de campanha."},{"severidade":"medio","descricao":"DELETE de bem, categoria e localização é hard-delete direto (.delete()), sem soft-delete nem checagem de vínculos. Remover um bem apaga o rastro (e movimentações em CASCADE, se houver); remover categoria/localização em uso pode quebrar FK ou deixar bens sem classificação. As tabelas pat_* não estão na whitelist app_soft_deletable_tables().","evidencia":"patrimonio.js:43 (categorias), 71 (localizações), 176 (bens) — todos supabase.from(...).delete()","recomendacao":"Avaliar soft-delete (padrão deleted_at do projeto) ao menos para pat_bens, e bloquear remoção de categoria/localização com bens vinculados."},{"severidade":"baixo","descricao":"Inconsistência menor de gating de escrita: o backend usa authorizeModule('patrimonio') que aplica nivelMinimo=2 e distingue por método HTTP (escrita exige escrita>=2). Logo, qualquer usuário com escrita>=2 ('preencher dado') consegue criar/editar/REMOVER bem, mover, criar/concluir inventário, criar/remover categoria/localização — inclusive operações destrutivas (DELETE de bem) que a UI restringe a isDiretor. NÃO é bypass para usuário só-leitura (a auditoria anterior errou ao afirmar nível 1), mas o piso de escrita é mais baixo do que o esperado para deletes/baixas.","evidencia":"backend/routes/patrimonio.js:5 (router.use(authenticate, authorizeModule('patrimonio'))); auth.js:471 (nivelMinimo=2 default) e auth.js:499-510 (escrita>=nivelMinimo por método); gating de UI só por isDiretor (Patrimonio.jsx:327,406,524,535)","recomendacao":"Aplicar nível mínimo maior nos endpoints destrutivos/transição (ex.: authorizeModule('patrimonio', 3 ou 4) nos DELETE/baixa/PUT), em vez de confiar no isDiretor do frontend para essas ações."},{"severidade":"baixo","descricao":"Movimentação tipo 'entrada' e 'saida' não atualiza o bem (só transferencia/manutencao/baixa atualizam). 'extraviado' é status válido do bem (STATUS_BEM) mas nenhum tipo de movimentação o aplica automaticamente — só por edição manual do status. Possível incoerência entre o que o usuário registra e o estado final do bem.","evidencia":"patrimonio.js:192-200 (só 3 tipos mudam o bem); Patrimonio.jsx:20 (status 'extraviado' existe sem fluxo de movimentação)","recomendacao":"Documentar/ajustar: definir efeito de entrada/saída no bem e como um bem vira 'extraviado' (ex.: tipo de movimentação 'extravio')."}],"verificacao_notas":"Reabri Patrimonio.jsx (999 linhas), patrimonio.js, logistica.js, src/api.js e auth.js. PRINCIPAL CORREÇÃO: o achado ALTO #1 ('escrita não gateada, acessível a qualquer usuário com leitura nível 1') é FACTUALMENTE FALSO e foi rebaixado para BAIXO. authorizeModule tem nivelMinimo=2 por padrão (auth.js:471) E distingue por método HTTP — escrita exige perm.escrita>=2 (auth.js:499-510). Não há bypass para usuário só-leitura; o gating de UI por isDiretor não é a única barreira. O ponto legítimo remanescente é menor: o piso de escrita é 2 ('preencher dado'), então deletes/baixas de bem só exigem escrita>=2 enquanto a UI os restringe a isDiretor — vira achado baixo de inconsistência. Também CORRIGI a recomendação da aba Scanner: a auditoria dizia que o scanner só oferecia manutenção/baixa; na verdade oferece os 5 tipos (MOV_TIPO_COLORS + botões linhas 749-756), igual ao detalhe do bem — sem divergência, removi a observação. O achado #2-alto (Movimentações = log_movimentacoes/estoque) é REAL mas é confusão de domínio/UX, não falha de segurança nem perda de dado, então rebaixei de alto para médio. Confirmei: RPC pat_dashboard_stats ausente das migrations (médio mantido); inventário sem itens (mantido); hard-deletes em pat_bens/categorias/localizacoes (linhas 43/71/176, mantido — pat_* não está em app_soft_deletable_tables); entrada/saida não muda o bem e 'extraviado' sem fluxo (baixo mantido). Entrada/processamento/saída/integrações batem com o código (ajustei: entrada/saida não alteram bem; scanner com normalização de variantes; recentScans não persiste). Confiança ALTA — todas as evidências verificadas linha a linha; nenhuma aba é legada/sem-fonte (todas vivas, exceto Movimentações redundante por pertencer ao domínio Logística, e Inventários incerta por falta de itens).","rota":"/admin/patrimonio","pageFile":"src/pages/admin/patrimonio/Patrimonio.jsx","backendRouteFile":"backend/routes/patrimonio.js","apiNamespace":"patrimonio"},{"slug":"solicitacoes","nome":"Solicitações","categoria":"Operacional / Administrativo","para_que_serve":"Backbone administrativo de pedidos internos da igreja. Substitui o antigo Google Form/WhatsApp/planilha: qualquer funcionário abre uma solicitação (compra, serviço/manutenção, pagamento, reembolso, reserva de espaço, TI, marketing, produção de culto, férias, licença) que passa por aprovação hierárquica do diretor de origem, opcionalmente por aprovação financeira (alçada/Yago), cai na fila da área responsável e é atendida com SLA medido. Ao concluir, o solicitante avalia (NPS) — é a fonte única que alimenta os KPIs administrativos de SLA e satisfação.","quem_usa":"Todos os funcionários (abrem e acompanham \"Minhas\"). Diretores de setor (Eduardo/Gestão, Pedro Menezes/Criativo, Arthur/Ministerial) na aba \"Aprovar\". Responsáveis cadastrados por área (Amaury/logística+manutenção+reserva, Yago/financeiro, Pedro Paiva/marketing, Pedro Fernandes/produção, RH, TI) na aba \"Para Atender\". Financeiro (Yago) na fila de aprovação financeira (mas essa tela vive no módulo Financeiro, não nesta página). Admin/diretor configura responsáveis em página externa.","entrada":["Modal 'Nova Solicitação': tipo/categoria (Compras, Serviços=infraestrutura, Pagamento, Reembolso, Reserva de Espaço, TI, Marketing, Produção de Culto, Férias, Licença — CATEGORIAS Solicitacoes.jsx:18-29), título, descrição, justificativa, flag urgente + justificativa (>=5 chars), data necessária","Reembolso: valor EXATO da nota (valor_estimado) + data da compra + comprovante (upload Storage bucket 'solicitacoes' subpasta comprovantes/) + forma PIX/transferência (Solicitacoes.jsx:413-419)","Pagamento: favorecido + favorecido_documento (CNPJ/CPF) + documento (boleto/NF) + forma (boleto/PIX/transf) + vencimento (reusa data_necessaria) + recorrência (backend :402-413, frontend :425-430)","Compras: itens+quantidade (texto, min 3 chars), link de referência, fornecedor sugerido (favorecido_nome) (backend :395-399)","Reserva de espaço: espaco_solicitado + data_uso + horario_inicio/fim + qtde_pessoas + material (backend :376-382)","Marketing: só título+descrição (a dor) + publico/ideia opcionais; Pedro tria depois (backend :426-431)","Aba Aprovar: diretor decide Aprovar / Rejeitar (motivo obrigatório, imutável)","Aba Para Atender (kanban): arrasta card entre colunas / botões Analisar->Aprovar/Rejeitar->Concluir, observações; vincular pedido Mercado Livre (compras)","Aba Minhas: avalia NPS (0-10 + comentário) após conclusão (handleNpsSubmit :389); aprova/pede revisão de campanha Marketing"],"processamento":["AUTOMÁTICO: roteamento de origem no CREATE via supabase.rpc('fn_solicitacoes_rotear_origem', {p_solicitante_id}) — define aprovacao_origem_diretor_id, aprovacao_origem_status e status (aguardando_aprovacao_origem ou pendente se dispensada); o trigger SQL fn_solicitacoes_roteamento_aprovacao é rede de segurança (solicitacoes.js:337-370)","AUTOMÁTICO: trigger SQL tg_solicitacoes_calcula_sla calcula sla_resposta/resolucao_deadline e precisa_aprovacao_financeira (por alçada area_alcadas) a partir de area_responsavel/subcategoria (sla_definicoes); o backend só grava area_responsavel/subcategoria via CATEGORIA_TO_AREA_RESP (solicitacoes.js:57-72,315-318)","AUTOMÁTICO: bloqueio de não-funcionário — trigger BEFORE INSERT lança 42501; backend traduz para HTTP 403 (solicitacoes.js:489-493)","AUTOMÁTICO: auto-vínculo de responsavel_id quando a área tem exatamente 1 responsável cadastrado em area_solicitacoes_responsaveis (solicitacoes.js:439-454)","AUTOMÁTICO: cron POST /cron/atualizar-ml (auth via CRON_SECRET/isAuthorizedCron, montado ANTES do authenticate) chama mlTracker.processarUpdates — atualiza tracking de pedidos Mercado Livre vinculados (solicitacoes.js:13-24)","AUTOMÁTICO: notificações imediatas (notificar/resolverDestinatarios) em criar/aprovar-origem/rejeitar/mudança de status/aprovar-financeiro; lembretes diários em services/notificacaoGenerator.js (gerarNotificacoesSolicitacoes)","AUTOMÁTICO: bust do cache do painel (painelCache.bust('')) em res.on('finish') após qualquer mutação 2xx (solicitacoes.js:28-36)","MANUAL: aprovação de origem (PATCH /:id/aprovar-origem|rejeitar-origem), aprovação financeira (GET /pendentes-financeiro + POST /:id/aprovar-financeiro|reprovar-financeiro, gated por podeAprovarFinanceiro · solicitacoes.js:1064-1210), transições de status no kanban (PATCH /:id), vínculo/atualização ML, avaliação NPS, configuração de responsáveis por área (PUT /area-responsaveis)"],"saida":["Kanban 'Para Atender' com 5 colunas agrupando 10 status reais via match[] (KANBAN_COLUMNS Solicitacoes.jsx:57-63)","Lista 'Minhas Solicitações' com badge de status/urgência/ML + chamada para avaliar (NPS)","Aba 'Aprovar' do diretor de origem com contador de pendentes (AprovacaoOrigemCard :1038)","Badge de SLA em tempo real no card (getSlaBadge lê sla_resposta_deadline/sla_resolucao_deadline; Solicitacoes.jsx:1020-1036)","Detalhe com dados por categoria + timeline visual de tracking Mercado Livre","NPS interno por área gravado na própria row (nps_nota/nps_comentario via PATCH /:id, solicitacoes.js:718-720)","Endpoints backend existentes mas SEM UI nesta página: GET /dashboard/urgencia-frequente (top solicitantes urgentes 90d · gated admin/diretor ou financeiro>=3 · solicitacoes.js:1213) e GET /reservas-espaco (lê vw_reserva_espacos) — ainda 'pendente para Matheus' segundo o changelog; a página não os chama"],"integracoes":{"alimenta":["KPIs ADM-*-G (% no SLA) e ADM-*-Q (NPS interno) do painel/matriz NSM via view vw_solicitacoes_sla e coluna nps_nota — consumidas em backend/routes/painel.js (vw_solicitacoes_sla referenciada 4x)","Módulo Marketing: solicitação categoria=marketing aprovada vira marketing_campanhas (status=triagem) via trigger fn_marketing_cards_solicitacao_sync; solicitante acompanha campanha/entregáveis (enrich em GET / · marketing_campanha/marketing_card)","Sistema de notificações (notificar/resolverDestinatarios) -> sino in-app dos destinatários","Cache do painel CBRio (painelCache.bust após mutação 2xx)","Tracking Mercado Livre (solicitacao_ml_eventos + colunas ml_* via solicitacoesMlTracker)"],"alimentado_por":["sla_definicoes (catálogo de prazos · 24 SLAs seedados) e area_alcadas (limites de aprovação financeira) — lidos pelos triggers SQL","area_solicitacoes_responsaveis (quem atende/aprova cada área) — fila, auto-vínculo e permissões","setor_diretor (diretor de origem por setor) — roteamento de aprovação (fn_solicitacoes_rotear_origem)","profiles (nomes/avatar/email do solicitante/responsável/diretor · consultas separadas, sem JOIN PostgREST)","rh_funcionarios (gate: só funcionário ativo cria · trigger 42501)","Supabase Storage bucket 'solicitacoes' (comprovantes/documentos · subpasta comprovantes/)","marketing_etiquetas_tipo/destino, marketing_kanban_cards, marketing_campanhas, marketing_membros (enrich de etiquetas/ca dormente."},{"severidade":"baixo","descricao":"Componente MarketingCardBlock (fluxo LEGADO pré-redesenho, baseado em marketing_kanban_cards com solicitacao_id direto) ainda é renderizado como fallback (Solicitacoes.jsx:1689-1690) quando a solicitação tem marketing_card mas não marketing_campanha, e chama marketingApi.fila.posicao() / sugerirRevisao(). REFUTAÇÃO do achado original: esses endpoints NÃO foram removidos — GET /marketing/fila/posicao/:cardId (marketing.js:747) e PATCH /marketing/cards/:id/sugerir-revisao (marketing.js:592) seguem vivos no backend, e os métodos existem em api.js (fila.posicao :1138, sugerirRevisao :1106). Portanto o fallback funciona, não 'quebra silenciosamente'. É só código legado raramente exercido.","evidencia":"Solicitacoes.jsx:1689-1690 (fallback) e :1844-2005 (MarketingCardBlock); endpoints vivos marketing.js:592,747; api.js:1106,1138","recomendacao":"Confirmar se ainda existem solicitações com marketing_card sem campanha; se não, remover o fallback e o componente MarketingCardBlock para reduzir superfície morta. Sem urgência — não há bug."},{"severidade":"baixo","descricao":"Comprovantes de reembolso/pagamento são enviados ao bucket Storage 'solicitacoes' (subpasta comprovantes/) com getPublicUrl (URL pública) — documento_url fica acessível por link sem autenticação. Reembolso/pagamento podem conter dados bancários/NF (PII financeira).","evidencia":"Solicitacoes.jsx:348-356 (.storage.from('solicitacoes').upload + getPublicUrl)","recomendacao":"Avaliar bucket privado + signed URL com TTL (padrão usado no Marketing/SharePoint) para não expor comprovantes via link público."},{"severidade":"baixo","descricao":"O painel CBRio depende de vw_solicitacoes_sla e nps_nota para os KPIs ADM-*-G/ADM-*-Q. Como a maioria das áreas ainda recebe poucas solicitações com NPS preenchido, esses KPIs tendem a aparecer vazios/zerados — é falta de volume de dado, não falta de coletor. A fonte (view + coluna nps_nota) existe e funciona.","evidencia":"painel.js consome vw_solicitacoes_sla (4 ocorrências); nps_nota gravado em PATCH /:id solicitacoes.js:718-720","recomendacao":"Sem ação de código; é questão de adoção/volume. Reforçar a chamada-para-avaliar (já implementada via notificação 'solicitacao_avaliar')."},{"severidade":"baixo","descricao":"Imprecisão da ficha original (corrigida): 'Dashboard urgência frequente' e 'Calendário de reservas' foram listados como SAÍDAS desta página, mas os endpoints (GET /dashboard/urgencia-frequente :1213 e GET /reservas-espaco) não têm consumidor nesta tela — urgenciaFrequente sequer está no namespace api.js, e reservasEspaco/alcadas estão no api.js mas não são chamados na página (só slaDefs é usado, :227). São endpoints backend prontos aguardando UI ('pendente para Matheus' no changelog).","evidencia":"Grep em Solicitacoes.jsx: só slaDefs usado (:227); urgencia-frequente/reservasEspaco/alcadas sem chamada; api.js solicitacoes :1208-1227 não tem urgenciaFrequente","recomendacao":"Construir as telas que consomem esses endpoints (dashboard de urgência frequente + calendário de reservas) ou removê-los se descontinuados. Sem bug — apenas backend órfão de UI."}],"verificacao_notas":"Reabri src/pages/Solicitacoes.jsx, backend/routes/solicitacoes.js, src/api.js, backend/routes/marketing.js e fiz grep em painel.js. Resultados: (1) REMOVIDO o achado 'baixo' de barras invertidas no api.js membresia.duplicados — o código usa '/membresia/duplicados' e '/membresia/merge-log' corretos (api.js:1259,1265); foi alarme falso. (2) REBAIXADO de medio para baixo o achado do MarketingCardBlock: os endpoints supostamente 'removidos' (/marketing/fila/posicao/:cardId e /cards/:id/sugerir-revisao) seguem VIVOS no backend (marketing.js:747,592) e nos métodos do api.js (1138,1106) — o fallback funciona, não quebra. (3) REBAIXADO de medio para baixo o achado servico/outro (confirmado dormente, mas não causa bug). (4) CONFIRMADOS getPublicUrl e KPIs-por-volume. (5) CORRIGI a saida/abas: 'urgência frequente' e
