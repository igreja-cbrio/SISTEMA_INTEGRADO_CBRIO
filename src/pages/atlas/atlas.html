F NEW.fez_decisao_jesus = true AND OLD IS DISTINCT FROM NEW) sem ramo de remoção; TotemKidsDecisoes.tsx:181-185 removerDecisao só faz checkin.atualizar(fez_decisao_jesus:false)","recomendacao":"Adicionar ao trigger um ramo true→false que apaga o cultos_decisoes_pessoas correspondente (por culto_id+kids_crianca_id), ou ajustar o texto da UI pra refletir que só desmarca o check-in. Decisões removidas continuam contando no NSM e em decisoes_kids quando a sessão for (re)consolidada."},{"severidade":"medio","descricao":"KID-01 e decisoes_kids só são populados quando a sessão é ENCERRADA manualmente. presencial_kids/decisoes_kids ficam zerados durante todo o culto e permanecem zerados se a coordenadora esquecer de encerrar — o KPI não reflete a realidade.","evidencia":"trigger trg_kids_sessao_consolida dispara só em NEW.status='encerrada' (migration 20260521160000:326-348); TotemKidsPainel.tsx:140 é a única forma de encerrar (POST /sessoes/:id/encerrar)","recomendacao":"Considerar consolidação incremental (trigger em kids_checkins atualizando cultos.presencial_kids ao vivo) ou um cron de fechamento noturno (a fn_kids_checkout_forcado_pendentes citada nos docs já existe pra fechar checkouts) que também encerre sessões abertas antigas."},{"severidade":"baixo","descricao":"presencial_kids consolidado = COUNT(*) de TODOS os check-ins da sessão, incluindo crianças que já saíram (checkout_at preenchido). É frequência total do culto (não simultaneidade), o que é coerente com o KPI, mas pode confundir quem espera 'presentes agora'.","evidencia":"migration 20260521160000:329-333 (COUNT(*) FROM kids_checkins WHERE sessao_id = NEW.id, sem filtro de checkout_at)","recomendacao":"Comportamento correto para frequência; apenas documentar que presencial_kids = total de check-ins do culto, não pico simultâneo."},{"severidade":"baixo","descricao":"Tipo de estação 'roster' aparece no select de Estações mas não tem fluxo implementado (rotulado '(futuro)'). Resíduo de planejamento.","evidencia":"TotemKidsAdmin.tsx:661 \u003cSelectItem value='roster'>Roster · dentro da sala (futuro)\u003c/SelectItem>; nenhuma rota/tela consome tipo 'roster' (validarEstacaoToken só aceita self/manned/display/display_foyer)","recomendacao":"Manter como está (claramente marcado futuro) ou remover a opção até existir o fluxo, pra não criar estação inútil."},{"severidade":"baixo","descricao":"Função abrirSessao() no Check-in é um atalho morto: só mostra um toast pedindo pra criar a sessão na admin, sem criar nada.","evidencia":"TotemKidsCheckin.tsx:130-133 (toast.info, sem chamada de API) e não é referenciada por nenhum botão visível na tela","recomendacao":"Remover a função não usada ou ligá-la de fato ao POST /sessoes (com seleção de culto)."},{"severidade":"baixo","descricao":"Aba Pagers depende de hardware LRS + agente local + env PAGER_BRIDGE_TOKEN. Sem isso, kids_pager_envios acumula 'pendente' e o toque nunca acontece, sem feedback ao usuário no check-in.","evidencia":"totemKids.js:1855 bridgeAutorizado exige process.env.PAGER_BRIDGE_TOKEN; fila /pager/bridge/fila (totemKids.js:2024) só consumida pelo agente externo; POST /chamadas enfileira mas não verifica se o agente está vivo (totemKids.js:1704-1719)","recomendacao":"Exibir na aba Pagers/Painel se o agente está ativo (ex.: último heartbeat de consumo da fila) pra evitar a impressão de que o pager vai vibrar quando o agente não está rodando."}],"verificacao_notas":"Verificação adversarial completa contra o código vivo (TotemKidsCheckin.tsx, TotemKidsDecisoes.tsx, TotemKidsPainel.tsx, TotemKidsAdmin.tsx, backend/routes/totemKids.js, src/api.js e as migrations 20260521160000 / 20260521200000 / 20260521210000). Não consegui refutar nenhum veredito material — todos os 6 achados se sustentam com evidência precisa, e nenhuma aba 'incerta' tinha fonte viva escondida. Mudanças: (1) Corrigi a CITAÇÃO de migration dos achados de decisão — o auditor escreveu '20260521200000:48' sugerindo o arquivo de cutoff, mas o trigger fn_kids_decisao_para_culto vive em 20260521200000_totem_kids_decisoes_link.sql e foi RECRIADO (versão vigente) por 20260521210000_totem_kids_decisoes_link_fix.sql (a v1 referenciava a coluna inexistente data_decisao). O nome do trigger é trg_kids_decisao_para_culto, BEFORE UPDATE OF fez_decisao_jesus (20260521160000:405-409). (2) Confirmei linhas exatas: código RPC+fallback (690-704), consolidação status='encerrada' COUNT(*) sem filtro de checkout (326-348), override permissão+motivo (791-803), POST /chamadas + enfileira pager (1625/1704-1719), bridgeAutorizado/PAGER_BRIDGE_TOKEN (1855), displays via estacao_token (1751/1785), auditoria/overrides (1205), importar (1491). (3) Ajustei imprecisões menores em entrada/processamento/saída (método de checkout, dry_run, view vw_kids_sessao_ao_vivo confirmada na totemKids.js:871 e migration 441). Nível de confiança: ALTO — todas as evidências foram reabertas e batem.","rota":"","pageFile":"","backendRouteFile":"","apiNamespace":""},{"slug":"online","nome":"Online (Canal YouTube)","categoria":"ministerial","para_que_serve":"Painel somente leitura do desempenho do canal YouTube da CBRio. Mostra inscritos/views/vídeos do canal (com delta de 30 dias), top vídeos do mês, maiores hits de todos os tempos, séries de pregação (playlists via vw_online_series_kpi), métricas detalhadas por culto transmitido (pico ao vivo, DS, DDUS, watch time, curva de retenção, tráfego, inscritos x não-inscritos), os KPIs estratégicos de Online da matriz NSM (Valor x Área, espelho do /painel) e os 3 indicadores de \"Engajamento de conteúdo\" do Monitoramento OKR (Pr. Juninho). Inclui o acompanhamento dos novos convertidos online nos primeiros 90 dias (contato pastoral, batismo, Next) e os controles de coleta automática via OAuth do YouTube.\u003c/para_que_serve>\n\u003cparameter name=\"quem_usa\">Renata Martins (líder/coordenadora de Online · acompanha convertidos e desempenho), diretoria/pastores (visão macro, read-only nível 1), admin/diretor para operar a coleta (Sincronizar/Recoletar/OAuth/coletores manuais). A própria área Online recebe boost para nível 5. Quem tem nível \u003c 3 e não é admin vê tudo, mas sem os botões de coleta/OAuth (gate podeEditarOnline em Online.tsx:533); o painel de Diagnóstico só aparece pra admin (Online.tsx:874).","entrada":["Online é majoritariamente SEM ENTRADA MANUAL — é um painel de visualização. A frequência/decisões online dos cultos NÃO são lançadas aqui (são lançadas pela Integração no modal de culto).","Único 'lançamento' do usuário: marcar contato pastoral dos convertidos no card 'Novos convertidos · primeiros 90 dias' (componente JornadaConvertidos area='online', Online.tsx:684, via API de cuidados).","Ações de operação (admin/diretor, não são dados): 'Sincronizar agora' (online.sync), 'Recoletar tudo' (sync + loop catch-up), conectar/desconectar OAuth e botões manuais 'Coletar pico/DS/DDUS/catch-up/Engajamento (ano)' (api.js online.coletar.*)."],"processamento":["AUTOMÁTICO · cron 'GET /online/cron/sync' (online.js:20) → syncCanal() (youtubeCollector): popula online_canal_snapshot, online_videos, online_series via YouTube Data API (key).","AUTOMÁTICO · coletores OAuth (Analytics API) em onlineCollectors.js, expostos por GET /online/cron/* (online.js:31-92) e POST /online/coletar/* (online.js:206-257): liveMonitor (pico ao vivo), dsCollector (D+1), ddusCollector (D+7 − DS), subsCollector, traficoCollector, retencaoCurvaCollector, subStatusCollector, backfillCultoVideoIds (linka vídeo ao culto por proximidade temporal), catchUpMetricas (lote), engajamentoCollector (retenção/compartilhamento/cliques mensais → online_engajamento). 'GET /online/cron/verificar' (online.js:79) faz self-heal (catch-up) + verificarColetaOnline + gerarNotificacoesOnline.","AUTOMÁTICO · 'GET /online/engajamento' (online.js:266) lê a linha mais recente de online_engajamento; retorna 0 quando vazia + mes_label da referência.","AUTOMÁTICO · 'GET /online/dashboard' (online.js:294) monta canal+delta(30d), top vídeos do mês (views/engajamento), top all-time, séries (vw_online_series_kpi) e matriz_online: KPIs de kpi_indicadores_taticos (ativo, area='online') agrupados por 'valores' (online.js:362-372), cruzados com vw_kpi_trajetoria_atual.","AUTOMÁTICO · 'GET /online/cultos-metricas' junta cultos com youtube_video_id + online_video_trafico + online_video_retencao_curva + actual_start/end_time (lido por CultoYouTubePanel).","MANUAL · botões de coleta apenas DISPARAM os coletores acima sob demanda; OAuth (online.js:175-203 + /oauth/authorize/callback) gerencia o token em online_oauth_tokens. Marcar contato pastoral grava em cuidados. Nenhum dado de negócio é digitado na tela."],"saida":["Cards do canal: Inscritos, Views totais, Vídeos publicados (com delta vs 30 dias) — Online.tsx:709-715.","Card 'Engajamento de conteúdo': Retenção média (alvo ≥40%), Taxa de compartilhamento (alvo ≥5%), Cliques em séries (alvo ≥15%) — Online.tsx:717-737; mostra a referência do mês quando há dado.","Top vídeos do mês (toggle 'Por views' | 'Por engajamento'), Maiores hits de todos os tempos, grade de Séries de pregação.","'Indicadores estratégicos do Online': matriz Valor x Área=Online com KPIs, status (no_alvo/atrasado/crítico), % da meta — espelho do /painel (Online.tsx:831-868).","'Performance por Culto' (CultoYouTubePanel): por culto, curva de retenção, fontes de tráfego, split inscritos x não-inscritos, pico/DS/DDUS/subs.","'Novos convertidos · primeiros 90 dias' (JornadaConvertidos): semáforo dos 3 marcos.","Painel de Diagnóstico (só admin): listar canais OAuth + teste cru da Analytics. Não há export dedicado."],"integracoes":{"alimenta":["Monitoramento OKR (Pr. Juninho) · via tabela online_engajamento (retenção/compartilhamento/cliques) — engajamentoCollector faz UPSERT e a aba /monitoramento-okr lê a mesma tabela","KPIs Online da matriz NSM (ONL-*) · via cultos.online_* (pico/DS/DDUS/etc), que os coletores YouTube populam; kpiAutoCollector (cultos.online_*) e vw_kpi_trajetoria_atual derivam o status mostrado aqui","cultos.youtube_video_id e cultos.online_* · backfillCultoVideoIds liga o vídeo ao culto e os coletores gravam as métricas no registro do culto"],"alimentado_por":["YouTube Data API (key) · via syncCanal → online_canal_snapshot/online_videos/online_series","YouTube Analytics API (OAuth, token em online_oauth_tokens) · via onlineCollectors → cultos.online_*, online_video_trafico, online_video_retencao_curva, online_engajamento","Integração · frequência/decisões online dos cultos são lançadas lá (modal de culto), não aqui","Cuidados · API de jornada-convertidos alimenta o card de novos convertidos online (JornadaConvertidos)","kpi_indicadores_taticos + vw_kpi_trajetoria_atual + vw_online_series_kpi · fontes dos KPIs e séries exibidos"]},"abas":[{"nome":"(módulo sem abas) Página única em rolagem","funcao":"Online NÃO tem navegação por abas reais. É um dashboard de seções empilhadas (hero + cards). O único Tabs do componente é um toggle interno na seção Top vídeos.","passo_a_passo":["Abrir /online","Rolar pelas seções (cards do canal, engajamento, top vídeos, séries, matriz, performance por culto)"],"estado":"viva","evidencia":"Online.tsx:617-874 — não há TabsTrigger de navegação de página; só state topTab em Online.tsx:597"},{"nome":"Novos convertidos · primeiros 90 dias","funcao":"Acompanhar contato pastoral (≤3d), batismo e Next (≤90d) de quem decidiu no Online.","passo_a_passo":["Ver o semáforo dos 3 marcos por pessoa","Marcar 'contato' quando feito (grava em Cuidados)"],"estado":"viva","evidencia":"Online.tsx:674-684 \u003cJornadaConvertidos area=\"online\" />; dados de cuidadosApi"},{"nome":"Coleta automática YouTube (OAuth)","funcao":"Conectar/desconectar o canal e disparar coletores manualmente (pico/DS/DDUS/Engajamento).","passo_a_passo":["Admin/diretor clica 'Conectar canal YouTube' (OAuth)","Usar 'Coletar pico/DS/DDUS/Engajamento' sob demanda"],"estado":"viva","evidencia":"OAuthStatusCard em Online.tsx; backend /oauth/* (online.js:175-203) e /coletar/* (online.js:206-257). Obs: OAuth do app em modo Testing cai a cada 7 dias (memória youtube-engajamento-oauth)"},{"nome":"Engajamento de conteúdo","funcao":"Exibir os 3 indicadores do OKR do Juninho (retenção/compartilhamento/cliques em séries).","passo_a_passo":["Ler os 3 cards com alvo","Admin roda 'Engajamento (ano)' para popular o histórico"],"estado":"viva","evidencia":"Online.tsx:717-737 + GET /online/engajamento (online.js:266) lendo online_engajamento, alimentado por engajamentoCollector + cron /cron/engajamento-collect (online.js:71). A UI já mostra a referência do mês quando eng.mes_label existe (Online.tsx:726-728)"},{"nome":"Top vídeos do mês (toggle Por views | Por engajamento)","funcao":"Ranquear os melhores vídeos publicados no mês corrente.","passo_a_passo":["Alternar entre 'Por views' e 'Por engajamento'","Clicar num card abre o vídeo no YouTube"],"estado":"viva","evidencia":"Online.tsx:740-783 (único uso de Tabs como toggle, value topTab); dashboard top_views_mes/top_engajamento_mes (online.js:321-334)"},{"nome":"Maiores hits / Séries de pregação","funcao":"Top 5 de todos os tempos e grade de séries (playlists) com views/engajamento.","passo_a_passo":["Visualizar hits e séries ordenadas por views"],"estado":"viva","evidencia":"Online.tsx:785-829; series vem de vw_online_series_kpi (online.js:343)"},{"nome":"Indicadores estratégicos do Online (matriz Valor x Área)","funcao":"Espelhar os KPIs de área='online' agrupados por valor da Jornada, com status e % da meta.","passo_a_passo":["Expandir um grupo de valor","Ler status (no alvo/atrasado/crítico) de cada KPI"],"estado":"viva","evidencia":"Online.tsx:831-868 + online.js:349-372. Backend monta matriz_online a partir de KPIs ativos area='online' com 'valores' não-vazio, cruzados com vw_kpi_trajetoria_atual. Funcional; o que varia é a presença de dado (KPIs sem trajetória aparecem como 'aguardando dado'). A seção fica oculta quando matrizKeys vazio (Online.tsx:832)"},{"nome":  de estado normaliza legados :760); api.atualizarCard/entregaveis/checklist (api.js:1102,1111,1124)"}],"achados_auditoria":[{"severidade":"medio","descricao":"Coluna 'Pesquisa' sem fonte de entrada. Nenhum trigger, materialização ou ação de UI grava o estado 'pesquisa' — cards nascem em backlog (triagem) ou fila/em_producao/concluido (eventos). A coluna só fica populada se alguém arrastar manualmente um card para lá, e não há orientação. Tende a ficar sempre vazia.","evidencia":"MarketingKanban.jsx:32 aceita:['pesquisa']; POST /campanhas/:id/cards grava 'backlog' (marketing.js:1803); fn_marketing_cards_cycle_phase_sync (20260528360000:74-77) mapeia pendente→'fila', em-andamento→'em_producao', concluida→'concluido' — sem 'pesquisa'","recomendacao":"Confirmar com o Pedro se a etapa Pesquisa é usada. Se sim, dar um caminho para entrar (botão/estado inicial opcional); se não, remover a coluna para enxugar o board."},{"severidade":"medio","descricao":"KPI MKT-DEM-CAP (razao_demanda_capacidade) depende de campos pouco preenchidos. throughput/prazo/lead_time exigem entregue_em (ok, gravado pelo trigger ao concluir), mas razao_demanda_capacidade só conta cards com data_inicio E data_fim — campos preenchidos apenas na materialização via campanha (POST /campanhas/:id/cards) ou no Planner. Cards de evento e tasks internas (POST /cards) nascem SEM essas datas, então o KPI de demanda/capacidade tende a subcontar (mostra demanda baixa/zero) e o Analytics fica enganoso.","evidencia":"kpiAutoCollector.js:846-849 filtra .not('data_inicio','is',null).not('data_fim','is',null); POST /cards (marketing.js:310-322) não recebe data_inicio/data_fim; só /campanhas/:id/cards (marketing.js:1798-1799) e o PATCH do Planner setam datas","recomendacao":"Garantir data_inicio/data_fim em todo card produtivo (ou derivar do prazo) e documentar que DEM-CAP só é confiável após uso do Planner. Avaliar mostrar aviso no Analytics quando há cards ativos sem datas."},{"severidade":"baixo","descricao":"Endpoint /fila/posicao/:cardId ainda filtra estados legados 'fila'/'em_producao', mas o redesenho usa 'backlog'/'producao'. Card no estado canônico novo 'backlog' retorna posicao=null (cai no early-return), então o solicitante não vê mais 'Fila #N de M'.","evidencia":"marketing.js:763 if(!['fila','em_producao'].includes(card.estado)) return {posicao:null}; também :770 e :776 contam só ['fila','em_producao']; régua nova usa 'backlog'/'producao' (MarketingKanban.jsx:31,33)","recomendacao":"Atualizar a lista de estados para incluir 'backlog' e 'producao' (ou usar os aceita[] das colunas) para a posição da fila voltar a funcionar pós-redesenho."},{"severidade":"baixo","descricao":"Resíduos do redesenho convivem com o canônico. O Select de Estado no CardDrawer normaliza fila→backlog/em_producao→producao/aguardando_solicitante→revisao em mapa hardcoded; coletores ainda olham prazo_confirmado (legado) além de prazo_producao; aprovar-entrega aceita 'em_producao' (legado) e não 'producao'. Funciona por compatibilidade, mas é dívida técnica que pode divergir silenciosamente.","evidencia":"MarketingKanban.jsx:760 mapa de normalização {fila:'backlog',em_producao:'producao',aguardando_solicitante:'revisao'}; marketing.js:539 ['aguardando_solicitante','em_producao'] (sem 'producao'/'revisao'); kpiAutoCollector.js:791 prazo_producao||prazo_confirmado","recomendacao":"Após confirmar que não há cards em estados legados em prod, fazer migration de normalização e remover os mapas de compatibilidade."},{"severidade":"baixo","descricao":"Ciclo criativo / padrões por fase / capacidade-dia / recorrentes / overrides são endpoints e telas vivos, mas pressupõem o fluxo de eventos com area='marketing' e o cadastro de slots/recorrentes que pode estar pouco populado — risco de telas (Planner, Épicos por evento) aparecerem vazias se os eventos não roteiam tarefas para Marketing.","evidencia":"GET /ciclo-criativo (marketing.js:669) filtra origem='evento' + cycle_phase_task_id; MarketingEpicos.jsx:44 api.ciclo.list(); Planner depende de cards com data_inicio/data_fim + membros não-coordenador","recomendacao":"Verificar em prod se há cards origem='evento' e membros com slots_dia cadastrados; se zero, sinalizar nas telas o pré-requisito em vez de mostrar vazio sem explicação."}],"verificacao_notas":"Verificação adversarial concluída com ALTA CONFIANÇA — a ficha original estava substancialmente correta e nenhum achado foi refutado. Reabri MarketingKanban.jsx, backend/routes/marketing.js, src/api.js, src/pages/marketing/MarketingEpicos.jsx e as migrations de sync (20260528360000, 20260530160000). Todos os 5 achados confirmados com evidência precisa: (1) 'Pesquisa' sem fonte — o trigger de cycle_phase mapeia status só para fila/em_producao/concluido (20260528360000:74-77), nenhuma fonte grava 'pesquisa'; CONFIRMADO. (2) DEM-CAP subconta — POST /cards (marketing.js:310-322) não recebe data_inicio/data_fim, e o coletor exige ambos (kpiAutoCollector.js:846-849); CONFIRMADO. (3) /fila/posicao filtra legados 'fila'/'em_producao' (marketing.js:763,770,776), incompatível com 'backlog'/'producao'; CONFIRMADO. (4) Resíduos legados (mapa de normalização MarketingKanban.jsx:760, aprovar-entrega marketing.js:539, coletor prazo_confirmado fallback :791); CONFIRMADO. (5) Telas dependentes de eventos→marketing podem ficar vazias; plausível e bem fundamentado. Ajustes de precisão: corrigi números de linha dos coletores de KPI (777/798/817/828), confirmei que a aba 'Pesquisa' merece 'incerta' (existe na régua mas sem caminho de entrada), e refinei a evidência das abas com os números de linha reais (ESTADOS 29-36, realtime 121-122 escutando ambas as tabelas, Épicos 201/44-46). Mantive 'razao_demanda_capacidade' como o único KPI problemático no achado #2 (a ficha original generalizava 'throughput E dem-cap'; na verdade throughput depende de entregue_em, que É gravado — só DEM-CAP é vulnerável). Slug/categoria/integrações batem com o código.","rota":"/marketing","pageFile":"src/pages/marketing/MarketingKanban.jsx","backendRouteFile":"backend/routes/marketing.js","apiNamespace":"marketing"},{"slug":"producao","nome":"Produção de Culto","categoria":"Criativo / Ministerial (área de culto)","para_que_serve":"Registrar e acompanhar os indicadores técnicos da operação de cada culto: pontualidade (duração do culto vs. duração-alvo do tipo), ocorrências (falhas técnicas e de estabilidade de estrutura, com rastro/severidade) e execução do checklist técnico itemizado. Também expõe (read-only) o SLA das solicitações da Produção e o NPS interno da área comparado às outras áreas criativas (Adoração, Marketing). É o painel operacional, espelho da aba de Integração, voltado à equipe de Produção de Culto. NOTA: a versão no working tree é a PRÉ-redesenho; em produção (origin/main) o módulo já virou cronograma por etapas em mm:ss.","quem_usa":"Equipe de Produção de Culto (coordenador Pedro Fernandes, nível 5 via boost da área \"Produção\"; colaboradores como André Texeira e Gabriel Munck, admin só neste módulo). Admin/diretoria com nível ≥1 lê tudo. Preenchimento exige nível 2; admin do checklist e da duração-alvo exige nível 3.","entrada":["Aba Preenchimento: por culto da semana, lança a Duração do culto em minutos + observação de pontualidade (Producao.jsx:325-331; backend PUT /culto/:id producao.js:189-208)","Aba Preenchimento: registra Ocorrências (tipo tecnica|estrutura, severidade baixa/media/alta/critica, momento opcional, descrição obrigatória ≥3 chars) (Producao.jsx:352-367; backend POST /culto/:id/ocorrencias producao.js:216-265)","Aba Preenchimento: marca os itens do checklist técnico aplicáveis ao culto (Producao.jsx:377-388) e escreve Observações gerais (Producao.jsx:392)","Aba Checklists (nível 3): cadastra/edita/ativa/remove itens do checklist (geral ou por tipo de culto) e define a duração-alvo (meta_duracao_min) por tipo de culto (Producao.jsx:515-568; backend /checklist-itens producao.js:306-351 e /service-types/:id/meta producao.js:63-75)","Aba Solicitações: muda o status das solicitações roteadas à Produção via select (Producao.jsx:596-599 → solicApi.update)"],"processamento":["MANUAL: todo o preenchimento por culto (duração, ocorrências, checklist, observações) é digitado pela equipe. Duração e ocorrências/checklist não derivam de nenhuma fonte automática.","AUTOMÁTICO (derivado em request): /producao/semana e /producao/acumulado calculam preenchido?, pontualidade %, duração média, checklist % e contagens de falhas a partir de culto_producao, culto_producao_ocorrencias e culto_producao_checklist cruzadas com vw_culto_stats (producao.js:79-148 e :355-448). Pontualidade = duração ≤ meta_duracao_min do tipo (default 60) (producao.js:385-388).","AUTOMÁTICO (trigger SQL, segundo o cabeçalho producao.js:12-13 + CLAUDE.md): os KPIs PROD-CULTO-* (tipo_calculo='manual', fonte_auto='producao.*') recalculam por trigger da migration 20260602140000 quando culto_producao/ocorrencias/checklist mudam. O backend só LÊ o resultado em /desempenho (producao.js:463-481) — não recalcula nem escreve nesses KPIs.","AUTOMÁTICO (notificação): ocorrência com severidade='critica' dispara notificar() urgente para o módulo producao + responsáveis da área de area_solicitacoes_responsaveis (producao.js:239-258).","AUTOMÁTICO (cache): toda escrita de produção chama painelCache.bust('') para invalidar o cache do /painel (producao.js:207, 236, 271, 297)."],"saida":["Calendário semanal de cultos com semáforo preenchido/pendente, duração, contagem de checklist (feitos/total) e de ocorrências (MiniCard · Producao.jsx:211-236)","Aba Acumulado: 6 KPIs do período (cultos preenchidos, pontualidade %, duração média, checklist %, falhas técnicas, ocorrências de estrutura) (Producao.jsx:436-443; backend /acumulado totais producao.js:393-402)","Aba Detalhado: tabela por tipo de culto com os mesmos indicadores (Producao.jsx:445-468; backend monta detalhado producao.js:432-441)","Aba Desempenho: 4 KPIs próprios PROD-CULTO-* (pontualidade, checklist, falhas, estabilidade) + SLA ADM-C-G-PRODUCAO + NPS comparativo Produção/Adoração/Marketing (Producao.jsx:642-668; backend producao.js:451-502)","Sem export de dados (nenhum endpoint nem botão de exportação)"],"integracoes":{"alimenta":["Painel CBRio / KPIs: os KPIs PROD-CULTO-* recalculam por trigger nas tabelas culto_producao* (migration 20260602140000) — porém são is_okr=false / valores={} e NÃO entram na matriz NSM (separação intencional)","Cache do /painel: invalidado via painelCache.bust('') a cada escrita (producao.js:207, 236, 271, 297)","Sistema de notificações: ocorrência crítica → notificar() módulo producao + responsáveis (producao.js:245-254)"],"alimentado_por":["cultos / vw_culto_stats: fornece os cultos da semana/período, service_type, hora e meta_duracao_min (producao.js:84-90, 154-156, 362-365)","vol_service_types: tipos de culto ativos + meta_duracao_min (producao.js:51-60, 376)","solicitacoes (área producao): aba Solicitações lê via solicApi.list({aba:'atender'}) e filtra area_responsavel='producao' client-side (Producao.jsx:587-589)","kpi_indicadores_taticos + vw_kpi_trajetoria_atual: alimentam a aba Desempenho (producao.js:458-481)","area_solicitacoes_responsaveis: destinatários da notificação de ocorrência crítica (producao.js:26-32)"]},"abas":[{"nome":"Preenchimento (semana)","funcao":"Calendário semanal de cultos; abre o modal de produção para lançar duração, ocorrências, checklist e observações por culto.","passo_a_passo":["Navegar até a semana do culto (setas / botão Hoje)","Clicar no card do culto para abrir o modal","Preencher duração (alvo = meta do tipo, padrão 60), adicionar ocorrências e marcar o checklist","Salvar (PUT /culto/:id + PUT /culto/:id/checklist)"],"estado":"viva","evidencia":"AbaSemana + ModalProducao (Producao.jsx:112-405); backend producao.js:79, 189, 277"},{"nome":"Acumulado","funcao":"Totais agregados do período (30/90/180/365d): preenchidos, pontualidade %, duração média, checklist %, falhas técnicas e ocorrências de estrutura.","passo_a_passo":["Abrir a aba Acumulado","Escolher o período (chip 30/90/180/365d)","Ler os 6 cartões de KPI do período"],"estado":"viva","evidencia":"AbaAcumulado modo='acumulado' (Producao.jsx:436-443); backend /acumulado producao.js:355-443"},{"nome":"Detalhado","funcao":"Mesmos indicadores do Acumulado quebrados por tipo de culto, em tabela.","passo_a_passo":["Abrir a aba Detalhado","Escolher o período","Ler a tabela por tipo de culto"],"estado":"viva","evidencia":"AbaAcumulado modo='detalhado' (Producao.jsx:445-468); backend monta detalhado producao.js:432-441"},{"nome":"Checklists","funcao":"Admin (nível 3): cadastra/edita/ativa/remove itens do checklist (geral ou por tipo) e define a duração-alvo por tipo de culto.","passo_a_passo":["Abrir a aba Checklists","Ajustar a duração-alvo de cada tipo e clicar Salvar","Adicionar/ativar/remover itens do checklist"],"estado":"viva","evidencia":"AbaChecklists (Producao.jsx:475-571); backend /checklist-itens producao.js:306-351 + /service-types/:id/meta producao.js:63-75"},{"nome":"Solicitações","funcao":"Fila das solicitações roteadas à Produção; permite dar andamento mudando o status direto.","passo_a_passo":["Abrir a aba Solicitações","Ver as solicitações com area_responsavel='producao'","Mudar o status no seletor (solicApi.update → PATCH /solicitacoes/:id)"],"estado":"redundante","evidencia":"AbaSolicitacoes reusa solicApi do módulo Solicitações e filtra client-side por area_responsavel='producao' (Producao.jsx:580-628); a própria aba avisa 'Para o fluxo completo, use o módulo Solicitações' (Producao.jsx:604). Funciona, mas é uma visão parcial/atalho do módulo Solicitações."},{"nome":"Desempenho","funcao":"KPIs próprios PROD-CULTO-* + SLA das solicitações + NPS interno comparado às áreas criativas.","passo_a_passo":["Abrir a aba Desempenho","Ler os 4 KPIs técnicos, o SLA e o comparativo de NPS"],"estado":"viva","evidencia":"AbaDesempenho lê prodApi.desempenho() (Producao.jsx:631-668); backend SELECT em kpi_indicadores_taticos + vw_kpi_trajetoria_atual (producao.js:451-502). Endpoint e UI estão íntegros e wired; degradam corretamente para '—' quando o KPI não tem valor (depende do trigger da migration 20260602140000 estar aplicado e de haver duração lançada). Reclassificada de 'incerta' → 'viva': não há ambiguidade estrutural, apenas dependência de disponibilidade de dado."}],"achados_auditoria":[{"severidade":"alto","descricao":"O arquivo em disco (working tree, branch atual) é a versão PRÉ-redesenho do módulo (duração em minutos + ocorrências técnica/estrutura + checklist). origin/main já tem o redesenho amplo MERGEADO — cronograma por etapas em mm:ss, atividades especiais, roteiro de 60:00, aba Acumulado virou linha na Detalhado, paginação fetchAllPaged (PRs #1059–#1109). Em produção o módulo é OUTRO. Confirmado por git: origin/main tem commits e8c4f4d8/daec5809/665bf7c9/272e2805/1b8f8488 nesses arquivos, o diff working-tree↔main é 107 inserções vs 863 deleções, e producao.js de main tem 56 ocorrências de etapa/roteiro/fetchAllPaged (zero no working tree). Severidade ELEVADA de médio→alto: toda a ficha (abas, entradas, achados) descreve uma versão que não está em produção.","evidencia":"git log/diff origin/main -- backend/routes/producao.js src/pages/ministerial/Producao.jsx; working tree usa duracao_minutos (Producao.jsx:243,327) e api.js:1229-1247 sem etapas/roteiro. Conflita com MEMORY 'Produção · cronograma por etapas (mm:ss)'.","recomendacao":"Descartar/refazer esta auditoria a partir de origin/main antes de qualquer mudança (ver memória check-origin-main-antes-de-implementar). NÃO evoluir esta versão; auditar o módulo real (etapas/roteiro/especiais)."},{"severidade":"medio","descricao":"Na versão auditada (working tree), a aba Desempenho mostra '—' em tudo quando os KPIs PROD-CULTO-* não estão populados. O backend apenas LÊ vw_kpi_trajetoria_atual; a população depende do trigger da migration 20260602140000 estar aplicado e de haver duração lançada. Drift git↔prod é recorrente neste repo, então pode ficar vazio sem aviso.","evidencia":"producao.js:451-502 só faz SELECT em kpi_indicadores_taticos/vw_kpi_trajetoria_atual; valor=null → '—' (Producao.jsx:640).","recomendacao":"Validar em prod se PROD-CULTO-* existem e recalculam (migration aplicada + ≥1 culto com duração). Documentar a dependência do trigger na própria aba."},{"severidade":"baixo","descricao":"O NPS comparativo (ADM-C-Q-PRODUCAO/ADORACAO/MARKETING) depende de avaliações NPS em solicitações concluídas por área, historicamente quase sempre vazias — tende a exibir '—' permanentemente, dando impressão de aba quebrada.","evidencia":"producao.js:486-490 monta nps_comparativo a partir dos KPIs ADM-C-Q-*; Producao.jsx:659-665 renderiza '—' quando n.valor==null.","recomendacao":"Mostrar microcopy explicando que o NPS depende das avaliações das solicitações; ou esconder o bloco quando não houver dado."},{"severidade":"baixo","descricao":"Aba Solicitações duplica o módulo Solicitações: lista client-side filtrando area_responsavel='producao' e só permite trocar status, sem o fluxo completo (aprovação, SLA, anexos). Pode divergir da fila real e confundir o operador.","evidencia":"Producao.jsx:587-599; aviso na própria aba (Producao.jsx:604).","recomendacao":"Manter apenas como atalho/visão rápida e linkar para /solicitacoes, ou consolidar a operação no módulo Solicitações."},{"severidade":"baixo","descricao":"Modal de preenchimento usa window.confirm para remover ocorrência e não usa o hook useConfirmarSaida; fechar o modal com dados digitados (duração/checklist/observações ainda não salvos) descarta sem aviso.","evidencia":"Producao.jsx:282 (window.confirm); onClose direto sem guarda (Producao.jsx:308, 318, 397).","recomendacao":"Adotar src/hooks/useConfirmarSaida no ModalProducao (ver memória hook-confirmar-saida-modais)."},{"severidade":"baixo","descricao":"Na versão auditada, leituras por culto usam .in('culto_id', ids) sem paginação. Em /acumulado com 180–365d, culto_producao_ocorrencias e culto_producao_checklist (várias linhas por culto) podem ultrapassar o cap de 1000 do PostgREST e truncar silenciosamente os agregados. OBS: origin/main JÁ corrigiu isso com fetchAllPaged (commit e8c4f4d8) — o achado só vale para esta versão antiga em disco.","evidencia":"producao.js:107-108 e :373-376 usam .in(...) sem .range()/paginação; git mostra fix em origin/main (e8c4f4d8 'pagina as queries do /acumulado').","recomendacao":"Não aplicável a prod (já corrigido). Apenas mais um sinal de que esta cópia em disco está desatualizada — auditar origin/main."}],"verificacao_notas":"Reabri os 3 arquivos reais e cruzei com git. Mudanças vs ficha original: (1) Achado da DEFASAGEM git↔prod ELEVADO de médio→alto e movido pro topo — é o fato dominante: o working tree é a versão pré-redesenho e origin/main já tem o redesenho inteiro mergeado (confirmado por git log/diff: ~863 linhas deletadas no working tree vs main, 56 hits de etapa/roteiro/fetchAllPaged em main, commits #1059–#1109). A ficha auditada NÃO reflete produção. (2) Aba Desempenho reclassificada de 'incerta' → 'viva': endpoint e UI estão wired e degradam corretamente para '—'; a ressalva é disponibilidade de dado (trigger), não incerteza estrutural — virou achado médio separado. (3) Achado do cap-1000 mantido mas anotado que origin/main já corrigiu (e8c4f4d8) — vale só para a cópia antiga. (4) Demais achados (NPS '—', Solicitações redundante, window.confirm/useConfirmarSaida) CONFIRMADOS com linha exata; nenhum refutado/removido. (5) entrada/processamento/saida/integracoes ajustados com linhas precisas; trigger explicitado como leitura-só pelo backend. Confiança ALTA para a versão em disco; mas o leitor deve saber que esta versão está obsoleta em relação à produção.","rota":"/producao","pageFile":"src/pages/ministerial/Producao.jsx","backendRouteFile":"backend/routes/producao.js","apiNamespace":"producao"},{"slug":"dashboard","nome":"Dashboard do sistema","categoria":"Estratégica","quem_usa":"Todos os usuários autenticados (é o landing pós-login). Cada um vê os cards/KPIs dos módulos a que tem acesso. Diretoria e admin veem o conjunto completo; líderes de área veem o resumo dos KPIs da própria área via MeusKpisResumo.","para_que_serve":"Página inicial (landing) pós-login em /dashboard. Não coleta dado próprio: é uma vitrine agregadora que dá saudação, mostra a Mandala Cultura CBRio (5 valores), o resumo de pendência de KPIs da área do usuário, alguns KPIs operacionais de outros módulos (RH, Financeiro, Patrimônio, Logística, Cuidados), atalhos de acesso rápido e o feed de notificações recentes. Serve de hub de navegação e visão de relance.","entrada":["Nenhum lançamento de dado é feito nesta página — ela é somente leitura/navegação.","Único 'input' indireto: o seletor de mês dentro da Mandala Cultura (MandalaCultura.jsx:29 estado 'mes'), que troca o período consultado em kpis.cultura(mes) — não grava nada."],"processamento":["AUTOMÁTICO (agregação no carregamento): Dashboard.jsx useEffect (linhas 90-99) dispara em paralelo notifApi.list(), e — gateado por flag '!== false' — rh.dashboard(), financeiro.dashboard(), patrimonio.dashboard(), logistica.dashboard(), cuidados.dashboard(). Confirmado: as 5 chamadas de módulo usam o padrão 'canX !== false' (não a flag positiva).","AUTOMÁTICO: MandalaCultura.jsx:41 chama kpis.cultura(mes) e renderiza a mandala dos 5 valores; o cálculo vive no backend de KPIs/cultura, não aqui.","AUTOMÁTICO: MeusKpisResumo.jsx cruza useKpis() com kpisApi.v2.registros.list({area}) por área do usuário (linhas 54-60) e classifica cada KPI em em_dia / atrasado / pendente comparando reg.periodo_referencia com periodKey(k.periodicidade) (linhas 73-83). Dashboard só exibe; preenchimento real é em /minha-area.","MANUAL: a montagem dos KPI cards (Dashboard.jsx 106-138) e a filtragem dos atalhos por permissão (linha 72: !l.perm || isAdmin || permMap[l.perm]) são client-side a partir das respostas; não há trigger/coletor próprio do módulo dashboard.","ÓRFÃO (confirmado): o backend backend/routes/dashboard.js expõe /pmo (vw_pmo_kpis), /workload (vw_workload), /projects-kanban, /strategic-kanban e POST /sync-areas, mas NENHUM é consumido pela página /dashboard nem por qualquer arquivo em src/. grep confirma: só api.js (declaração) e o próprio backend referenciam esses paths."],"saida":["Saudação com data por extenso (pt-BR, capitalize) e primeiro nome do usuário (Dashboard.jsx:140-148).","Mandala Cultura CBRio (5 valores, com seletor de mês — últimos 12 meses — e drill-down por pétala via PetalDetailDialog).","Card de resumo dos KPIs da minha área (em dia / atrasado / sem registro) com link para /minha-area (MeusKpisResumo.jsx:92).","Seção 'Visão Geral': cards condicionais de Colaboradores Ativos, Em Férias, Saldo Total, Contas Vencendo, Bens Cadastrados, Pedidos Pendentes, Pessoas Acompanhadas e Notificações (cada um só aparece se o dado existir/for >0 e o módulo tiver respondido).","Seção 'Acesso Rápido': atalhos para RH, Financeiro, Eventos, Projetos, Logística, Patrimônio, Voluntariado, Membresia, Cuidados e Solicitações (filtrados por permissão; Voluntariado sempre aparece e roteia dinamicamente).","Seção 'Atividade Recente': feed das notificações recentes (até 12, slice(0,12)), clicáveis para o n.link da notificação.","Não há export nesta página."],"integracoes":{"alimenta":["Nada na UI — a página /dashboard não grava em tabela nem dispara processo; é puramente read-only/navegação.","Exceção fora da UI: POST /dashboard/sync-areas (backend, authorize admin/diretor) atualizaria profiles.area a partir de rh_funcionarios ativos, mas NÃO é chamado por nenhum front (endpoint órfão)."],"alimentado_por":["RH (GET /rh/dashboard) → cards Colaboradores Ativos / Em Férias","Financeiro (GET /financeiro/dashboard) → cards Saldo Total / Contas Vencendo","Patrimônio (GET /patrimonio/dashboard) → card Bens Cadastrados","Logística (GET /logistica/dashboard) → card Pedidos Pendentes","Cuidados (GET /cuidados/dashboard) → card Pessoas Acompanhadas (lê cuiData.atual.pessoas_acompanhadas)","Notificações (notificacoes.list) → KPI 'Notificações' (não-lidas) + feed Atividade Recente","KPIs/Cultura (kpis.cultura) → Mandala Cultura","KPIs v2 (kpis.v2.registros.list + useKpis) → MeusKpisResumo"]},"abas":[{"nome":"(sem abas) — landing de seção única","funcao":"A página é um hub vertical de seções, sem componente Tabs nem estado de tab. Seções: Saudação, Mandala Cultura, MeusKpisResumo, Visão Geral (KPI cards), Acesso Rápido, Atividade Recente.","passo_a_passo":["Usuário faz login e cai em /dashboard","Vê saudação, mandala, resumo de KPIs e cards de relance","Clica num card/atalho/notificação para navegar ao módulo correspondente"],"estado":"viva","evidencia":"src/pages/Dashboard.jsx:143-249 (JSX de seções empilhadas, sem Tabs nem useState de aba)"},{"nome":"Mandala Cultura CBRio (seção)","funcao":"Mostra os 5 valores da cultura no mês selecionado, com drill-down por pétala.","passo_a_passo":["Escolher o mês no seletor (últimos 12 meses)","Observar a mandala dos 5 valores","Clicar numa pétala para abrir o detalhe (PetalDetailDialog)"],"estado":"viva","evidencia":"src/components/cultura/MandalaCultura.jsx:41 kpis.cultura(mes); render em Dashboard.jsx:152"},{"nome":"Resumo dos meus KPIs (seção)","funcao":"Resume quantos KPIs da área do usuário estão em dia/atrasados/sem registro e linka para /minha-area.","passo_a_passo":["Ler o status agregado (em dia / faltam N)","Clicar para ir a /minha-area preencher"],"estado":"viva","evidencia":"src/components/MeusKpisResumo.jsx:42-136; classificação em 73-83; render em Dashboard.jsx:155"},{"nome":"Visão Geral — KPI cards (seção)","funcao":"Cartões de relance com números operacionais de RH, Financeiro, Patrimônio, Logística, Cuidados e Notificações.","passo_a_passo":["Aguardar o carregamento paralelo dos /dashboard de cada módulo","Ler os números","Clicar no card para abrir o módulo (path do card)"],"estado":"viva","evidencia":"src/pages/Dashboard.jsx:90-138,157-176"},{"nome":"Acesso Rápido (seção)","funcao":"Grade de atalhos para os módulos a que o usuário tem acesso.","passo_a_passo":["Localizar o módulo desejado","Clicar para navegar (Voluntariado roteia conforme isVoluntario)"],"estado":"viva","evidencia":"src/pages/Dashboard.jsx:19-30,72,74-80,184-204"},{"nome":"Atividade Recente — notificações (seção)","funcao":"Feed das notificações recentes do usuário (até 12), clicáveis pelo n.link.","passo_a_passo":["Ler as notificações (até 12)","Clicar para abrir o link associado (n.link)","'Ver todas' leva a /admin/notificacao-regras"],"estado":"incerta","evidencia":"src/pages/Dashboard.jsx:206-247: o item navega por n.link (243); 'Ver todas' aponta para /admin/notificacao-regras (220) — tela de CONFIGURAÇÃO de regras de notificação, não a lista de notificações do usuário → destino provavelmente errado"},{"nome":"Backend dashboard.js — /pmo, /workload, /projects-kanban, /strategic-kanban, /sync-areas","funcao":"Endpoints agregadores de PMO/carga/kanban de projetos e planos estratégicos + sync de áreas com RH.","passo_a_passo":["(Não há fluxo de usuário — nenhuma tela chama esses endpoints)"],"estado":"legada","evidencia":"backend/routes/dashboard.js:8-91 define os 5 endpoints; grep por projects-kanban/strategic-kanban/dashboard/pmo|workload/sync-areas → só api.js (343-347) e o próprio arquivo; grep dashboard.(pmo|workload|projectsKanban|strategicKanban|syncAreas) em src → ZERO matches. A página /dashboard nem importa o namespace 'dashboard' do api.js."}],"achados_auditoria":[{"severidade":"medio","descricao":"O backend backend/routes/dashboard.js (/pmo via vw_pmo_kpis, /workload via vw_workload, /projects-kanban, /strategic-kanban, POST /sync-areas) e o namespace 'dashboard' em api.js (linhas 343-347) não têm NENHUM consumidor no frontend. É código órfão, resíduo de uma versão anterior do dashboard (PMO/kanban) substituída pela landing atual.","evidencia":"grep 'projects-kanban|strategic-kanban|/dashboard/pmo|/dashboard/workload|sync-areas' → só api.js e backend/routes/dashboard.js; grep 'dashboard.(pmo|workload|projectsKanban|strategicKanban|syncAreas)' em src → nenhum match. Dashboard.jsx:5 importa de '../api' apenas notificacoes, rh, financeiro, patrimonio, logistica, cuidados — nunca 'dashboard'.","recomendacao":"Confirmar com o time se vw_pmo_kpis/vw_workload ainda têm uso; se não, remover os endpoints + o namespace 'dashboard' do api.js. POST /sync-areas duplica a sincronização profiles↔RH — avaliar consolidar no fluxo de RH."},{"severidade":"baixo","descricao":"O link 'Ver todas →' do feed de Atividade Recente leva a /admin/notificacao-regras (tela de configuração de quem recebe notificações), não a uma lista das notificações do próprio usuário. Para usuário comum é destino errado/confuso (e pode ser barrado por permissão de admin).","evidencia":"src/pages/Dashboard.jsx:220 navigate('/admin/notificacao-regras')","recomendacao":"Apontar 'Ver todas' para uma página de notificações do usuário (ou remover o link se não existir essa tela)."},{"severidade":"baixo","descricao":"Os gates das chamadas de módulo usam 'canX !== false' (Dashboard.jsx 93-97) + .catch(()=>{}) silencioso. Como os hooks de permissão retornam boolean no fluxo normal, na prática só pula a chamada quando a flag é explicitamente false; se a flag vier undefined em estado de carregamento do AuthContext, a chamada dispara mesmo sem acesso e depende do catch vazio + do guard do backend. Funciona, mas o padrão '!== false' é frágil e todos os catch são vazios, mascarando quebra de endpoint.","evidencia":"src/pages/Dashboard.jsx:93-98 (rh/financeiro/patrimonio/logistica/cuidados com '!== false' e .catch(()=>{}))","recomendacao":"Usar a flag positiva (if (canRH) ...) e logar falhas inesperadas em vez de engolir todos os erros."},{"severidade":"baixo","descricao":"A lista de atalhos mistura critérios: a maioria usa 'perm' string (canRH, canFinanceiro, isColaborador...), 'Voluntariado' não tem perm (sempre aparece) ackend/routes/dashboard.js","apiNamespace":"dashboard"},{"slug":"perfil","nome":"Perfil","categoria":"Dados / IA / Admin","para_que_serve":"Tela pessoal de autoatendimento de cada usuário autenticado. Permite ver os próprios dados de identidade (nome, e-mail, área, cargo), trocar a foto de perfil (avatar), cadastrar/atualizar o celular (WhatsApp), trocar a própria senha, refazer os tutoriais guiados dos módulos que usa e ler o aviso de direitos LGPD. É read-only para os campos de identidade (nome/e-mail/área/cargo vêm do perfil e da matriz de permissões, não são editáveis nesta tela).","quem_usa":"Qualquer usuário autenticado do ERP (todos os cargos), incluindo membros/voluntários. Não há gate de módulo específico — é a página pessoal de cada login.","entrada":["Foto de perfil — botão da câmera sobre o avatar (card de identidade no topo); aceita image/* + .heic/.heif até 25 MB no client (Perfil.jsx:52,126)","Celular (WhatsApp) — input com máscara (21) 99999-9999 no card de identidade (Perfil.jsx:166-175)","Troca de senha — senha atual + nova (mín. 6) + confirmação (card 'Alterar senha' · TrocarSenhaForm)","Refazer/iniciar tutorial — botão por tour no card 'Tutoriais guiados'"],"processamento":["AUTOMÁTICO (backend) — Foto: Perfil.jsx:66 chama auth.uploadFoto(); api.js:2277-2281 monta FormData e faz POST /auth/profile/foto (campo 'foto'); backend/routes/auth.js:47 valida que é image/*, sobe pro Storage bucket 'avatars' (path \u003cuserId>/avatar-\u003cts>.\u003cext>, upsert) e faz UPDATE profiles.avatar_url. Pré-processamento client-side (HEIC→JPEG + compressão) via processarImagemPerfil (Perfil.jsx:59). OBS: o multer do backend limita a 5 MB (auth.js:8) e o client a 25 MB — divergência benigna porque o client comprime antes de enviar.","MANUAL/DIRETO-SUPABASE — Telefone: Perfil.jsx:88-91 faz supabase.from('profiles').update({telefone}).eq('id', profile.id) direto pelo client (anon key + RLS), SEM passar pelo backend; grava o número já mascarado em profiles.telefone (digits → mascaraTelefone, ou null se vazio).","AUTOMÁTICO (Supabase Auth) — Senha: TrocarSenhaForm.jsx:27 chama updatePasswordWithCurrent (AuthContext.jsx:139-151): reautentica com signInWithPassword (valida senha atual sem invalidar a sessão), depois supabase.auth.updateUser({password}), chama RPC app_marcar_senha_trocada (AuthContext.jsx:148) para baixar a flag de primeiro acesso e refaz fetchProfile.","MANUAL (client) — Tutoriais: tutorial.restartTour(t.id) reinicia o tour e navega pra rota do módulo (Perfil.jsx:227-230); lista filtrada por getQualifyingTours(auth) (data/tutorials.js:280)."],"saida":["Card de identidade: nome, e-mail, área e cargo (cargoNome||role), avatar e badge de cargo (read-only · Perfil.jsx:131-159)","Confirmação (toast) de foto/telefone/senha atualizados","Lista de tutoriais com status concluído/pendente por módulo (Perfil.jsx:202-239)","Aviso informativo LGPD (Acesso/Correção/Exclusão de dados) — texto estático, sem ação no sistema (Perfil.jsx:258-308)"],"integracoes":{"alimenta":["profiles.avatar_url — via POST /auth/profile/foto (backend, service_role) → reflete no avatar de todo o ERP","profiles.telefone — via UPDATE direto do client Supabase (anon key + RLS) → consumido por notificações/bot WhatsApp","auth.users (senha) + flag de senha trocada — via Supabase Auth updateUser + RPC app_marcar_senha_trocada"],"alimentado_por":["AuthContext/profile (GET /auth/my-permissions e fetchProfile) — fornece name, email, area, role, avatar_url, cargoNome, telefone","tabela profiles (Supabase) — fonte dos campos de identidade exibidos","data/tutorials.js + TutorialContext — fornecem os tours qualificados (getQualifyingTours) e o estado completedTours"]},"abas":[{"nome":"(Página única — sem abas) Card Identidade + Foto","funcao":"Exibe dados de identidade (read-only) e permite trocar foto e salvar telefone.","passo_a_passo":["Clicar no ícone de câmera sobre o avatar e escolher uma imagem","Aguardar o upload automático para o bucket 'avatars'","Digi existe endpoint/botão de exportação, correção ou exclusão; o atendimento é manual/presencial. Risco de expectativa não atendida caso o usuário busque o relatório na própria tela.","evidencia":"src/pages/Perfil.jsx:258-308 (texto estático, nenhuma chamada de API)","recomendacao":"Manter como aviso, mas deixar explícito que a solicitação é offline; futuramente expor um endpoint real de direito de acesso (export) do próprio titular."},{"severidade":"baixo","descricao":"O namespace 'auth' do api.js expõe APENAS uploadFoto; os demais endpoints do backend/routes/auth.js (GET /me, PATCH /profile, GET /users, GET /my-permissions) são consumidos via AuthContext/outros helpers, não pelo namespace 'auth'. O PATCH /profile (nome/área/avatar_url) existe no backend mas a tela Perfil não o utiliza (nome/área são read-only aqui).","evidencia":"src/api.js:2276-2282 (só uploadFoto); backend/routes/auth.js:29 PATCH /profile sem chamador na tela Perfil","recomendacao":"Sem ação obrigatória; se um dia a edição de nome/área for liberada ao usuário, reaproveitar o PATCH /profile já existente."}],"verificacao_notas":"Verificação adversarial concluída reabrindo os 5 arquivos reais (src/pages/Perfil.jsx, backend/routes/auth.js, src/api.js, src/contexts/AuthContext.jsx, src/components/auth/TrocarSenhaForm.jsx, src/data/tutorials.js). TODOS os 5 achados foram SUSTENTADOS — nenhum removido. Linhas conferidas: hint Mercado Livre (Perfil.jsx:164) vs toast WhatsApp (:93); telefone direto no client (:88-91); máscara 11 dígitos (:17) vs gate \u003c10 (:83); LGPD estático (:258-308); namespace auth só uploadFoto (api.js:2276-2282). Reclassificações de aba: nenhuma — 3 abas confirmadas 'viva' (foto/tel, tutoriais, senha) e o card LGPD confirmado 'sem_fonte' (zero endpoint de export/exclusão). Correções/refinamentos feitos sobre a ficha original: (1) achado médio do telefone agora cita a linha exata do PATCH /profile (auth.js:31) provando que o endpoint NÃO inclui 'telefone' hoje — fortalece a recomend istrar=true (DadosBrutos.jsx:231). É a forma PRINCIPAL de lançar frequência/decisões — grava em `cultos`, não em dados_brutos.","Lançamento rápido (cards Quick Log): clicar num card chama quickLogClick (DadosBrutos.jsx:197) que pré-preenche tipo + área e abre o ModalRegistrar.","ModalRegistrar (Registrar/Editar dado): tipo de dado + área + data + valor (numérico) + observação. Tipo/área/data são a chave do registro e ficam disabled na edição (DadosBrutos.jsx:567,582,588) — só valor/observação editáveis depois.","Validação: líder de área (ou admin/diretor) marca o registro como validado ('OK final do ciclo') via botão CheckCircle2/ShieldCheck (DadosBrutos.jsx:389-394). Só aparece para origem != 'auto'."],"processamento":["AUTOMÁTICO · recálculo de KPI: trigger `tg_dados_brutos_recalc` em dados_brutos (migration 20260507260000:537-540 / consolidada 20260507280000:480-483) chama `recalcular_kpis_por_dado(tipo, area, data)` (20260507260000:472) em qualquer INSERT/UPDATE/DELETE; ela acha todo KPI cujo formula_config.dado_tipo == tipo_id e grava o valor em kpi_valores_calculados. Latência ~zero. Obs.: o trigger foi convertido de FOR EACH ROW para FOR EACH STATEMENT na escala-50k (20260511100000:147-149) para batches.","AUTOMÁTICO · bust de cache do painel: middleware em dadosBrutos.js:40-47 chama painelCache.bust('') em toda mutação 2xx (POST/PUT/PATCH/DELETE).","AUTOMÁTICO · upsert por chave: POST faz upsert onConflict 'tipo_id,area,data,contexto' (dadosBrutos.js:165) → relançar o mesmo dado sobrescreve em vez de duplicar.","MANUAL · o líder digita o número absoluto no ModalRegistrar (DadosBrutos.jsx:518); o cálculo do KPI NÃO é feito aqui, só o dado bruto.","MANUAL · CalendarioCultos grava direto na tabela `cultos`; os KPIs de culto vêm do auto-collector via vw_culto_stats, não desta tela.","AUTORIZAÇÃO · POST usa authorizeKpiArea(area, fallback por valor consultando kpi_indicadores_taticos por formula_config.dado_tipo) (dadosBrutos.js:132-146); PUT/DELETE/validar revalidam por kpi_areas OU temPermissaoPorValor() (dadosBrutos.js:188-191, 287-291)."],"saida":["Tabela (desktop ≥768px) / cards (mobile) de registros com data, tipo, área, valor, origem (manual/auto) e observação, filtrável por área/tipo/desde (DadosBrutos.jsx:306-465).","Alimenta os KPIs táticos (kpi_valores_calculados) → que aparecem no /painel (mandalas, matriz Valor×Área, alertas), /minha-area, /monitoramento-okr e /gestao.","Selo de validação por registro (origem do dado de validação está quebrada na leitura — ver achados).","Não há export próprio nesta tela."],"integracoes":{"alimenta":["dados_brutos (tabela) — via POST/PUT/DELETE upsert (dadosBrutos.js:163-165)","kpi_valores_calculados — via trigger tg_dados_brutos_recalc → recalcular_kpis_por_dado()","/painel, /minha-area, /monitoramento-okr, /gestao — leem os KPIs calculados a partir destes dados","tabela cultos — via CalendarioCultos embutido (não via dados_brutos)"],"alimentado_por":["tipos_dado_bruto (catálogo) — via GET /dados-brutos/tipos (dadosBrutos.js:52)","vw_dados_brutos_completo (view, migration 20260507230000:162) — fonte da listagem do GET /","Coletores AUTOMÁTICOS de OUTROS módulos populam dados_brutos com origem='auto' para os tipos entrada_manual=false (migration 20260513130000:32-60): NPS (módulo /nps via sincronizarKpi), Financeiro/Generosidade (mem_contribuicoes + conciliação), Voluntariado, Cultos (auto-collector via vw_culto_stats), Devocional, NEXT, Grupos/Membresia (mem_grupo_membros)"]},"abas":[{"nome":"Calendário de cultos (CalendarioCultos)","funcao":"Lançar frequência/decisões/online por culto da semana — forma principal de coleta. Renderizado só quando podeRegistrar é true.","passo_a_passo":["Navegar na semana e clicar no card do culto","Preencher presencial/decisões/online no modal nativo de cultos","Salvar — grava na tabela cultos"],"estado":"viva","evidencia":"DadosBrutos.jsx:231 `{podeRegistrar && \u003cCalendarioCultos />}`","recomendacao":"Mantém. É a entrada certa para dados de culto; estes não passam por dados_brutos."},{"nome":"Lançamento rápido (Quick Log)","funcao":"Cards grandes com os 4-6 tipos mais comuns por área para pré-preencher tipo+área no modal.","passo_a_passo":["Ver os cards sugeridos pela sua área","Clicar no card do tipo desejado","Preencher valor/data/observação no modal e salvar"],"estado":"redundante","evidencia":"DadosBrutos.jsx:35-45 QUICK_LOG_POR_AREA sugere 'conversoes','batismos','doacoes_valor','doadores_count','voluntarios_ativos','voluntarios_checkin','nps_next' — todos marcados entrada_manual=false na migration 20260513130000:32-60. quickLogClick (DadosBrutos.jsx:197-203) pré-seta o tipo_id automático no editando.","recomendacao":"Filtrar QUICK_LOG por tipos com entrada_manual=true (cruzar com `tipos` carregado), ou redefinir os arrays. Hoje induz o líder a lançar à mão dados que já vêm do módulo de origem (colide com origem='auto')."},{"nome":"Filtros + Lista de registros","funcao":"Filtrar por área/tipo/desde e ver/editar/remover/validar os registros lançados.","passo_a_passo":["Ajustar Área, Tipo de dado e Desde","Localizar o registro na tabela/cards","Editar valor/observação, remover, ou validar"],"estado":"viva","evidencia":"DadosBrutos.jsx:306-465 (filtros + tabela/cards)","recomendacao":"Mantém."},{"nome":"Validação de registro (selo)","funcao":"Líder de área dá o 'OK final do ciclo' marcando o registro como validado.","passo_a_passo":["Encontrar registro de origem manual da sua área","Clicar no botão de validar (CheckCircle2)","Confirmar — backend grava validado_em/validado_por_user_id"],"estado":"incerta","evidencia":"Frontend lê d.validado_em (DadosBrutos.jsx:383,389,439,442) e os endpoints existem (api.js:2063-2064 validar/desvalidar; dadosBrutos.js:217,251). Mas a view vw_dados_brutos_completo NÃO seleciona validado_em/validado_por_user_id (migration 20260507230000:162-181, única definição da view — confirmado por grep) — o GET / lê dessa view, então o campo não retorna.","recomendacao":"Adicionar d.validado_em e d.validado_por_user_id ao SELECT de vw_dados_brutos_completo; senão a validação nunca aparece como feita ao recarregar."}],"achados_auditoria":[{"severidade":"alto","descricao":"O selo de validação não funciona de ponta a ponta: o frontend mostra/alterna a validação por `d.validado_em`, o backend grava `validado_em`/`validado_por_user_id` na tabela, mas a view `vw_dados_brutos_completo` (fonte do GET /) não inclui essas colunas. Resultado: depois de validar e recarregar, o registro volta a aparecer como NÃO validado e o selo verde nunca persiste visualmente.","evidencia":"Leitura: DadosBrutos.jsx:383/389/439/442 usa d.validado_em. Escrita: dadosBrutos.js:236-238 grava validado_em/validado_por_user_id. View (única definição): supabase/migrations/20260507230000_fase6a_dados_brutos.sql:162-181 seleciona só id..updated_at, sem validado_em. Migration 20260507320000:90-94 adiciona as colunas à TABELA mas não redefine a view. Confirmado por grep: nenhuma outra migration faz CREATE [OR REPLACE] VIEW vw_dados_brutos_completo.","recomendacao":"Incluir validado_em e validado_por_user_id no SELECT da view vw_dados_brutos_completo (verificar também drift: a view em prod pode divergir das migrations)."},{"severidade":"alto","descricao":"Os cards de Lançamento rápido empurram o líder a digitar manualmente tipos que são explicitamente AUTOMÁTICOS (entrada_manual=false): conversões, batismos, doações (valor/doadores), voluntários (ativos/checkin) e NPS Next. Esses dados já vêm dos módulos de origem (Cultos via auto-collector, Generosidade/conciliação, Voluntariado, NPS). Lançar à mão gera dado concorrente/duplicado e pode contaminar o KPI.","evidencia":"QUICK_LOG_POR_AREA em DadosBrutos.jsx:35-45 vs. UPDATE entrada_manual=false na migration 20260513130000_tipos_entrada_manual.sql:32-60. Obs.: o ModalRegistrar filtra entrada_manual!=false no dropdown (DadosBrutos.jsx:500), mas quickLogClick (linha 197) pré-seta o tipo_id automático no editando — o select abre sem opção correspondente, e o backend POST não tem guarda de entrada_manual, então um save passaria.","recomendacao":"Filtrar QUICK_LOG por tipos com entrada_manual=true (cruzar com `tipos`), ou redefinir os arrays para conter só tipos realmente manuais; idealmente também barrar entrada_manual=false no POST do backend."},{"severidade":"medio","descricao":"A rota /dados-brutos não tem guarda de módulo no App.tsx (apenas Suspense), apesar do comentário 'dados-brutos so admin'. A página se autoprotege em modo leitura para quem não tem área/ministério, mas qualquer usuário autenticado abre a tela e vê o calendário de cultos e a lista. A escrita é barrada no backend (authorizeKpiArea / checagem por kpi_areas), então não é furo de gravação — é exposição de UI/leitura mais ampla que o pretendido.","evidencia":"App.tsx:528-529 (comentário 'so admin' + rota sem ModuleGuard); backend dadosBrutos.js GET '/' (linha 107) só após router.use(authenticate) (linha 37), sem authorize de área.","recomendacao":"Se a intenção é restringir, envolver a rota em ModuleGuard ou esconder do menu por perfil; alinhar o comentário com a realidade."},{"severidade":"baixo","descricao":"DELETE de dados_brutos é hard-delete (supabase.delete()), sem soft-delete. A remoção é irreversível e dispara recálculo imediato do KPI.","evidencia":"dadosBrutos.js:294 `supabase.from('dados_brutos').delete().eq('id', ...)`. Confirmado que dados_brutos NÃO está na whitelist app_soft_deletable_tables() (grep sem ocorrência nas migrations de soft-delete).","recomendacao":"Avaliar se dados_brutos deve entrar na política de soft-delete; no mínimo manter audit. Risco baixo porque o upsert por chave reconstrói o valor ao relançar."},{"severidade":"baixo","descricao":"Vários tipos seguem manuais (entrada_manual=true) mas dependem de módulos que ainda não existem/alimentam: lideres_acompanhados, lideres_treinados, solicitacoes_capelania/aconselhamento, novos_convertidos_atend, rh_q12_nota, rh_engajamento_treinamentos_pct, rh_rot e KPIs em prod podem ter sido ajustados fora do versionamento), mas pela evidência disponível ambos procedem.","rota":"/dados-brutos","pageFile":"src/pages/DadosBrutos.jsx","backendRouteFile":"backend/routes/dadosBrutos.js","apiNamespace":"dadosBrutos"},{"slug":"planejamento","nome":"Planejamento","categoria":"Estratégica","para_que_serve":"É a torre de controle (PMO) que consolida em UMA tela tudo que tem prazo na igreja — tarefas de Eventos (ciclo criativo), tarefas de Projetos (7 fases) e marcos do Planejamento Estratégico — para enxergar carga de trabalho por pessoa, itens atrasados e próximos prazos cruzando as três fontes. ATENÇÃO (confirmado no código): o slug \"planejamento\" abriga DOIS produtos distintos e desconexos. (1) A rota /planejamento (Planejamento.jsx) é um dashboard consolidado quase SOMENTE LEITURA — não tem tabela própria nem cria registros próprios; espelha dados de Eventos/Projetos/Estratégico. A única escrita que ele faz é mudar o STATUS de tarefas de outros módulos via drag-and-drop. (2) A rota /planejamento/anual (AnualCiclos/AnualCicloDetalhe, backend/routes/planejamento.js) é um workflow de aprovação em duas instâncias (diretor de setor → diretoria geral) para propostas de eventos/séries/projetos do ciclo anual + geração de calendário litúrgico — esse sim com tabelas próprias (planejamento_ciclos/propostas/setores/areas_setor/audit + event_liturgia_templates) e escrita real, que ao aprovar materializa registros oficiais em events/projects.","quem_usa":"PMO/Diretores e Admin (accessLevel >= 4 cai em modo \"pmo\" e vê tudo · Planejamento.jsx:64,67); líderes de área (nível 3 caem em viewMode \"area\", veem sua área); assistentes (nível \u003c=2 caem direto na aba Lista, só suas tarefas · Planejamento.jsx:66). No /planejamento/anual: líderes propõem itens do ciclo; diretores de setor (planejamento_setores.diretor_id) decidem o 1º estágio; diretoria geral (profiles.is_diretoria_geral) decide o 2º estágio e materializa; admin/diretor abre/fecha ciclos e gera litúrgicos (authorize('admin','diretor') no backend). O item de menu \"Planejamento\" no AppShell é apenas o rótulo da SEÇÃO (id:3) que agrupa Eventos/Projetos/Expansão — NÃO há item de menu apontando para /planejamento nem para /planejamento/anual.","entrada":["/planejamento (dashboard): o usuário NÃO lança dados — só lê. As únicas \"entradas\" são mudanças de status de tarefa via drag-and-drop no Kanban: tarefas de evento/ciclo via handleTaskStatus → cyclesApi.updateTask ou tasksApi.updateStatus('evento') quando event_phase_id==='simple' (Planejamento.jsx:143-151,759), e tarefas de projeto via handleProjTaskStatus → tasksApi.updateStatus('projeto') (Planejamento.jsx:138-141,919). Subtasks marcadas via checkbox no card expandido do Kanban Eventos → cyclesApi.updateSubtask (Planejamento.jsx:799)","/planejamento/anual (AnualCiclos): admin/diretor cria ciclo do ano (year + description → planejamento.createCiclo → POST /ciclos, planejamento.js:150)","/planejamento/anual/:id (AnualCicloDetalhe): líder cria PROPOSTA (tipo evento/serie/projeto + área + payload → planejamento.createProposta → POST /propostas, planejamento.js:269); diretor/diretoria decidem com comentário e podem editar payload (decidirDiretor / decidirDiretoria → PATCH .../decidir-diretor|decidir-diretoria, planejamento.js:469,540)"],"processamento":["AUTOMÁTICO — KPIs do header (Dashboard): GET /api/dashboard/pmo lê a VIEW vw_pmo_kpis (single row · dashboard.js:10); carga de trabalho lê a VIEW vw_workload (dashboard.js:19). Não há coletor; são views agregadas no banco","AUTOMÁTICO — cards Projetos/Estratégico: GET /api/dashboard/projects-kanban junta projects + project_tasks + project_milestones e agrupa por área via AREA_MAP hardcoded (dashboard.js:45-67); /strategic-kanban faz o mesmo com strategic_plans/strategic_tasks/strategic_milestones (dashboard.js:70-90)","AUTOMÁTICO — fonte unificada cross-fonte: tasksApi.all({finalized|source}) traz tarefas de várias fontes com campo source (evento/ciclo/projeto/planejamento); Itens Críticos, Próximos Prazos, swim lanes por pessoa e ordenação por urgência são computados no FRONTEND (sortByUrgency:45, filterByHorizon:35, agrupamento por t.responsible:620-627)","AUTOMÁTICO — roteamento de proposta (anual): POST /propostas resolve setor pela área via planejamento_areas_setor (getSetorIdByArea:45) e auto-decide o status inicial: se o propositor é diretor do setor ou diretoria geral, pula o 1º estágio (status pendente_diretoria, com decisão do diretor auto-registrada) (planejamento.js:288-301)","AUTOMÁTICO — materialização: ao aprovar na diretoria, materializarProposta() faz INSERT real em events ou projects com criacao_origem='ciclo_planejamento' (planejamento.js:428-464, chamado em :595-605)","AUTOMÁTICO — litúrgicos: POST /liturgia/gerar/:year expande padrões (1st_sunday..last_sunday, monthly_day_DD, weekly_dayN) em datas (expandPattern:652) e faz INSERT em batch em events (criacao_origem='liturgico'), idempotente por nome|date via Set pré-buscado (planejamento.js:709-761)","AUTOMÁTICO — devolutiva: quando diretor/diretoria editam o payload, diffPayload (:380) + logAuditChanges gravam planejamento_audit (:394-406) e notifyProponente dispara notificação módulo 'planejamento' ao propositor (:409-425, chamados em :525-527 e :610-611)","MANUAL — toda decisão de aprovar/rejeitar/editar proposta é ação humana; comentário é obrigatório ao rejeitar (planejamento.js:476,547)"],"saida":["Tela /planejamento aba Dashboard: barra de KPIs (Eventos, Projetos, Estratégico, separador, Tarefas abertas, Tarefas atrasadas, Riscos), clicáveis com drill-down para a Lista ou navegação a /eventos|/projetos (Planejamento.jsx:234-249)","Tela aba Kanban: 4 sub-visões alternadas por typeFilter — \"Todos\" (swim lanes por responsável ou kanban flat para assistente · :549-684), \"Eventos\" (fases do ciclo + 4 colunas com drag-and-drop · :686-814), \"Projetos\" (7 fases + 4 colunas com drag-and-drop · :816-963), \"estratégico\" (3 colunas usar o apiError já declarado para exibir estado de erro/empty visível em vez de 0 silencioso."},{"severidade":"baixo","descricao":"O Kanban\\Projetos infere a fase da tarefa fazendo string-match em t.description com 'Fase: \u003cnome>' (ex.: 'Fase: Execução'). É frágil: qualquer mudança de texto/idioma na descrição quebra a contagem por fase silenciosamente.","evidencia":"Planejamento.jsx:842 (phaseTaskCounts via (t.description||'').includes(`Fase: ${name}`)) e :852 (phaseTasks2 idem)","recomendacao":"Persistir a fase do projeto em coluna estruturada (ex.: phase_order) em vez de derivar do texto livre da descrição."},{"severidade":"baixo","descricao":"Agrupamentos e filtros 'minhas tarefas' comparam por t.responsible === profile.name (texto) em várias sub-visões — padrão que a regra global do projeto desaconselha (UUID FK). Renomeação/typo no nome quebra o filtro pessoal. (Observação: o Kanban Eventos já mitiga em parte usando responsavel_id primeiro na :183.)","evidencia":"Planejamento.jsx:566,568,573 (Kanban\\Todos), :622 (agrupa por t.responsible), :833,835 (Kanban\\Projetos), :1074 (Lista); contraexemplo parcial em :183 que usa t.responsavel_id !== userId antes do nome; CLAUDE.md regra 3 (responsável por UUID)","recomendacao":"Migrar a atribuição/filtragem para responsavel_id (UUID) onde o dado já existir, mantendo o nome só para exibição."},{"severidade":"baixo","descricao":"materializarProposta usa proposta.year_from_ciclo só em projetos (projects.year), mas o INSERT em events NÃO recebe ano; e ambos os INSERT (events/projects) são diretos com service_role sem validar campos obrigatórios do payload (ex.: events.date = p.data pode vir nulo se o payload não trouxer 'data').","evidencia":"planejamento.js:431-462 (projects.year=proposta.year_from_ciclo na :434; events sem year e date=p.data sem validação na :451)","recomendacao":"Validar campos mínimos do payload antes de materializar e padronizar o uso do ano entre event/project."}],"verificacao_notas":"Verificação adversarial completa: reabri Planejamento.jsx (todas as 4 abas + 4 sub-visões do Kanban), backend/routes/planejamento.js (arquivo inteiro), dashboard.js, api.js:2237 e AppShell.jsx. A ficha original é de ALTA qualidade — TODOS os 7 achados se sustentam contra o código real e nenhuma aba viva foi marcada como morta. Confirmações precisas: onDrop só em Eventos(:759)/Projetos(:919), ausente em Todos/estratégico; Lista monta de allTasks só ciclo/evento(:1059-1064) vs ganttTasks cross-fonte; string-match 'Fase: \u003cnome>'(:842,852); /planejamento/anual órfão (sem item de menu no AppShell id:3, que só tem Eventos/Projetos/Expansão; sem import do namespace em Planejamento.jsx); materializarProposta sem year em events e sem validação de p.data. Correções/refinamentos que fiz: (1) achado do .catch silencioso REFORÇADO — apiError existe como state (:113) mas é dead (nunca setado/renderizado); (2) achado do responsible-por-texto REFINADO — verdadeiro nas :566/568/573/622/833/835/1074, mas a :183 (Kanban Eventos viewMode minhas) já usa responsavel_id antes do nome (contraexemplo parcial documentado); (3) descobri que NÃO há item de menu sequer para a própria /planejamento (só o rótulo de seção), o que adicionei como nuance na aba de menu; (4) ajustei a categorização da aba 'Cobrança/Diretoria' para refletir que é gate de menu da seção. Nível de confiança: ALTO.","rota":"/planejamento","pageFile":"src/pages/Planejamento.jsx","backendRouteFile":"backend/routes/planejamento.js","apiNamespace":"planejamento"},{"slug":"ritual","nome":"Ritual Mensal (Revisão OKR)","categoria":"Estratégica · Governança","para_que_serve":"Ritual mensal de revisão dos KPIs/OKRs fora do alvo. Aplica a \"regra de ouro\": todo desvio gera registro de causa, decisão, responsável e próximo passo. O sistema lista automaticamente os KPIs em alerta (crítico ou atrasado) ainda não revisados no mês corrente e oferece um fluxo (1 a 1 ou guiado) para registrar a revisão de cada um. Serve como disciplina de governança: garantir que nenhum indicador em vermelho/amarelo passe o mês sem análise e decisão documentadas.","quem_usa":"Pensado para a diretoria geral (as 5 pessoas marcadas com is_diretoria_geral) e o time de gestão estratégica (Marcos/Matheus) — é uma tela executiva de revisão mensal. NÃO há gate de módulo: a rota /ritual em App.tsx:525 é Suspense puro (sem ModuleGuard, ao contrário das vizinhas como /admin/apresentacoes) e o backend routes/ritual.js só aplica authenticate (ritual.js:19), sem authorizeModule. Qualquer usuário autenticado consegue abrir a tela e registrar/editar revisões.","entrada":["Aba Pendentes: clicar 'Revisar agora' (ou via modo guiado) abre o OkrRevisaoModal para lançar a revisão de um KPI (Ritual.jsx:298-301)","No modal: Causa do desvio (obrigatório), Decisão tomada (obrigatório), Status no período (vermelho/amarelo/verde/pendente), Responsável (select de rh_funcionarios ativos via rhApi.funcionarios.list status=ativo), Próximo passo (texto) e Prazo do próximo passo (input type=date) (OkrRevisaoModal.jsx:126-165)","Período de referência: input de texto livre pré-preenchido com o mês atual 'AAAA-MM' (OkrRevisaoModal.jsx:128-131)"],"processamento":["AUTOMÁTICO · Detecção de KPIs em alerta: GET /api/ritual/pendentes (ritual.js:84-87) e /resumo (ritual.js:34-40) leem a view vw_kpi_trajetoria_atual filtrando status_trajetoria in ('critico','atras')","AUTOMÁTICO · Resumo (total_em_alerta, total_revisados, total_pendentes, percentual_concluido, dias_restantes_mes) calculado em JS no /resumo cruzando a view com okr_revisoes do período (ritual.js:55-70)","AUTOMÁTICO · Ordenação dos pendentes (crítico>atrasado, OKR>não-OKR, menor % da meta) + enriquecimento com líder (rh_funcionarios em batch) e trajetória (ritual.js:107-139)","AUTOMÁTICO · Auto-promoção a OKR: POST /:kpi_id/revisar seta kpi_indicadores_taticos.is_okr=true se ainda não for, antes do insert (ritual.js:187-189)","MANUAL · Registro da revisão (causa/decisão/responsável/próximo passo) digitado pelo usuário → INSERT em okr_revisoes (UNIQUE kpi_id+periodo → 409 se duplicado; ritual.js:204-214)","MANUAL · PATCH /revisao/:id (executar/cancelar/atualizar) existe no backend (ritual.js:225-251) e na api.js (ritual.atualizarRevisao, api.js:2082), mas NENHUMA tela do módulo o chama"],"saida":["Tela /ritual com 5 stat cards (Em alerta, Revisados, Pendentes, % Concluído, Dias até fim do mês) + barra de progresso (Ritual.jsx:116-131)","Lista de KPIs pendentes (cards com status, badge OKR/área, último valor vs meta, % da meta, líder) (Ritual.jsx:252-305)","Lista de Revisados no mês (causa / decisão / próximo passo / responsável / data / status_revisao) (Ritual.jsx:307-335)","Registros persistidos em okr_revisoes (audit de governança, consumível por /painel)","GET /api/ritual/historico — histórico filtrável de revisões (até 500), sem tela própria no módulo (ritual.js:256-269; api.js:2083-2085)"],"integracoes":{"alimenta":["okr_revisoes (via POST /:kpi_id/revisar) — consumida pelo /painel camada 3 (detalhe do KPI mostra 'revisões OKR · regra de ouro')","kpi_indicadores_taticos.is_okr=true (efeito colateral: revisar qualquer KPI em alerta o promove a OKR permanentemente — ritual.js:187-189 — refletindo em badges, filtros e /painel)"],"alimentado_por":["vw_kpi_trajetoria_atual (status_trajetoria, ultimo_valor, checkpoint_meta, percentual_meta) — populada por kpi_valores_calculados / kpi_registros via coletores e triggers de KPI","kpi_indicadores_taticos (indicador, area, valores, periodicidade, unidade, is_okr, lider_funcionario_id, objetivo_geral_id, meta_descricao)","rh_funcionarios (nome/cargo do líder e do responsável)"]},"abas":[{"nome":"Pendentes","funcao":"Lista os KPIs em alerta (crítico/atrasado) ainda não revisados no mês, ordenados por prioridade, com ações 'Ver detalhe' (KpiDetalheModal) e 'Revisar agora' (OkrRevisaoModal).","estado":"viva","evidencia":"Ritual.jsx:154-156 (Tab Pendentes) + 227-305 (ListaPendentes/cards); backend /pendentes lê vw_kpi_trajetoria_atual (ritual.js:84-87)","passo_a_passo":["Abrir /ritual no mês corrente","Ver a fila de KPIs pendentes ordenada por prioridade","Clicar 'Revisar agora' em um KPI","Preencher causa/decisão/próximo passo e registrar"],"recomendacao":"Manter. Funcional desde que a view de trajetória esteja populada."},{"nome":"Revisados","funcao":"Mostra as revisões já registradas no mês (causa, decisão, próximo passo, responsável, data e status_revisao).","estado":"viva","evidencia":"Ritual.jsx:157-159 (Tab) + 307-335 (ListaRevisados); backend /revisados lê okr_revisoes do período (ritual.js:151-166)","passo_a_passo":["Abrir /ritual","Clicar na aba 'Revisados'","Ler o histórico do mês com as decisões tomadas"],"recomendacao":"Manter. Falta apenas o botão de fechar o loop (marcar executada) — ver achado de PATCH órfão."},{"nome":"Modo guiado (overlay/wizard, não é aba)","funcao":"Wizard sequencial que percorre todos os pendentes um a um, abrindo o OkrRevisaoModal e avançando ao salvar; barra fixa no topo mostra progresso 'N de M'.","estado":"viva","evidencia":"Ritual.jsx:76-101 (iniciarGuiado/proximoGuiado/sairGuiado), 134-150 (botão), 181-217 (barra + OkrRevisaoModal encadeado)","passo_a_passo":["Clicar 'Iniciar revisão guiada (N)'","Revisar o KPI no modal e registrar","O sistema avança automaticamente para o próximo","Ao terminar, mostra 'Ritual concluído!'"],"recomendacao":"Manter; é o fluxo principal pensado para o dia 5 do mês."}],"achados_auditoria":[{"severidade":"alto","descricao":"Módulo sem controle de acesso. A rota /ritual em App.tsx:525 não tem ModuleGuard (diferente das vizinhas, ex. /admin/apresentacoes com ModuleGuard em App.tsx:520) e o backend routes/ritual.js só aplica authenticate (ritual.js:19; montado sem guard adicional em server.js:151), sem authorizeModule. Qualquer usuário autenticado pode abrir a tela e registrar/editar revisões de OKR, contradizendo a intenção ('diretoria geral') registrada no CLAUDE.md.","evidencia":"App.tsx:525 (Suspense puro, sem ModuleGuard); ritual.js:19 (router.use(authenticate) único guard); server.js:151 (mount sem authorizeModule)","recomendacao":"Adicionar ModuleGuard moduleSlug='ritual' na rota e authorizeModule('ritual', nível) nos endpoints de escrita (POST /:kpi_id/revisar e PATCH /revisao/:id). Confirmar se existe o módulo 'ritual' na matriz; se sim, gatear por ele."},{"severidade":"medio","descricao":"Tela sem ponto de entrada no menu. Não há item de nav com path '/ritual' em AppShell.jsx (Grep não encontrou nenhum); há apenas uma menção textual de 'ritual mensal' na descrição do item 'Painel CBRio' (AppShell.jsx:72). O acesso depende de URL direta ou de um botão externo (historicamente um botão 'Ritual Mensal' no /painel envolto em isAdmin, conforme CLAUDE.md). Para a maioria dos usuários o módulo é efetivamente invisível.","evidencia":"AppShell.jsx:72 (menção textual em description do Painel CBRio); ausência de qualquer nav item path:'/ritual' (Grep sem matches)","recomendacao":"Se o módulo é vivo, criar item de menu (Visão macro/Governança) visível à diretoria; caso contrário documentar que o acesso é só via botão do Painel."},{"severidade":"medio","descricao":"Efeito colateral oculto: revisar QUALQUER KPI em alerta o promove a is_okr=true permanentemente (auto-promoção), sem aviso na UI e sem caminho de reversão pelo módulo. Um KPI tático revisado uma vez no ritual passa a contar como OKR no resto do sistema (badges, filtros, /painel).","evidencia":"ritual.js:187-189 (if (!kpi.is_okr) update is_okr=true, sem flag de opt-in no payload do OkrRevisaoModal.jsx:83-91)","recomendacao":"Tornar explícito (checkbox 'tratar como OKR') ou remover a auto-promoção; no mínimo documentar para a diretoria."},{"severidade":"medio","descricao":"PATCH /api/ritual/revisao/:id (marcar revisão como 'executada' / atualizar próximo passo) é órfão: existe no backend (ritual.js:225-251) e na api.js (ritual.atualizarRevisao, api.js:2082), mas nenhuma tela do módulo o invoca. O ciclo de fechamento ('o
