Batismos: convertidos identificados nas decisões viram candidatos a inscrição de batismo"],"saida":["NSM/Jornada - decisões viram conversão (cultos_decisoes_pessoas → mem_trilha_valores etapa conversao + nsm_eventos)","cuidados - novo convertido entra no fluxo de acompanhamento pastoral (cui_convertidos)","membresia - check-in liga/cria mem_membros pelo CPF (membroMatch.acharOuCriarGuardado) {Gate de duplicata}","NSM/Jornada - batismo realizado marca o marco de batismo na trilha (Seguir)"],"kpis":[{"objetivo":"Aumentar Frequência","tipo":"preenche"},{"objetivo":"Aumentar Aceitações","tipo":"preenche"},{"objetivo":"Aumentar Batismos","tipo":"preenche"}],"camada":"captacao","classe":"main","titulo":"Integracao","sub":"porta de entrada do dado de culto","valor":"Seguir","src":"integracao"},"whatsapp":{"id":"whatsapp","abas":[{"nome":"Coletas","frase":"Aplica a coleta do líder → cria submissão pendente de frequência/decisões na fila da Integração (ou marca manual pro Grupos).","direcao":"sai"},{"nome":"Líderes vinculados","frase":"Lê profiles e mem_grupos pra ligar o telefone do líder a uma pessoa e definir escopo (integração/grupos).","direcao":"entra"}],"entrada":["Números da semana do líder via WhatsApp (texto livre ou formulário/Flow): frequência presencial/kids, decisões presenciais/online/kids","Telefone do líder (DDI+DDD+número) vinculado a um profile + escopo (integracao/grupos) + grupo opcional","Coleta parseada aguardando confirmação do coordenador (status 'parseado')"],"tratamento":["Líderes vinculados -> Coletas: o vínculo telefone→profile+escopo autoriza e roteia a coleta que chega (modulo_destino integracao/grupos)","Configuração -> Coletas: toggle ia_ativa liga/desliga o bot e o conteúdo institucional responde números não-cadastrados (não vira coleta)"],"saida":["integracao - cultos_dados_submissoes (ambiente templo/kids · presencial+decisoes · status pendente) na fila /integracao?tab=pendentes","integracao - coleta-formulário (Flow) indica decisões a cad <script>
/* Fluxograma do sistema — canvas tipo Miro (vanilla, sem libs).
   window.renderFluxograma(host, FLOW) onde FLOW = {layers, nodes, edges, vocab}. */
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function svg(tag, attrs) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  var STORE_KEY = "fx-pos-v1";

  window.renderFluxograma = function (host, FLOW) {
    var LAYERS = FLOW.layers || [];
    var NODES = Object.keys(FLOW.nodes || {}).map(function (id) { return FLOW.nodes[id]; });
    var BYID = FLOW.nodes || {};
    var EDGES = FLOW.edges || [];

    // ---- modelo de posição ----
    var COLX = { origem: 80, captacao: 500, cuidado: 900, valores: 1240, sink: 1640 };
    var SPINE = ["origem", "captacao", "cuidado", "valores", "sink"];
    var H0 = 84, GAP = 44, CY = 480;
    var W = (n) => n.classe.indexOf("sink") >= 0 ? 220 : n.classe.indexOf("apoio") >= 0 ? 178 : 196;
    var pos = {}; // id -> {x,y,w,h}

    function defaultLayout() {
      pos = {};
      SPINE.forEach(function (lk) {
        var ns = NODES.filter(function (n) { return n.camada === lk; });
        var total = ns.length * H0 + (ns.length - 1) * GAP;
        var startY = Math.max(34, CY - total / 2);
        ns.forEach(function (n, i) { pos[n.id] = { x: COLX[lk], y: startY + i * (H0 + GAP), w: W(n), h: H0 }; });
      });
      // banda apoio embaixo
      var spineBottom = 0;
      Object.keys(pos).forEach(function (id) { spineBottom = Math.max(spineBottom, pos[id].y + pos[id].h); });
      var ap = NODES.filter(function (n) { return n.camada === "apoio"; });
      var cols = 4, colW = 246, rowH = 156, ax0 = 80, ay0 = spineBottom + 150;
      ap.forEach(function (n, i) { pos[n.id] = { x: ax0 + (i % cols) * colW, y: ay0 + Math.floor(i / cols) * rowH, w: W(n), h: H0 }; });
    }
    function loadSaved() {
      try { var s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); Object.keys(s).forEach(function (id) { if (pos[id]) { pos[id].x = s[id].x; pos[id].y = s[id].y; } }); } catch (e) {}
    }
    function save() {
      try { var s = {}; Object.keys(pos).forEach(function (id) { s[id] = { x: Math.round(pos[id].x), y: Math.round(pos[id].y) }; }); localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
    }
    defaultLayout(); loadSaved();

    // ---- DOM ----
    host.innerHTML = "";
    var root = document.createElement("div"); root.className = "fx-root";
    root.innerHTML =
      '<div class="fx-bar">' +
        '<span class="fx-title"><b>Atlas · Fluxograma</b>Como o dado caminha até a NSM</span>' +
        '<button class="fx-btn" data-act="fit">Ajustar à tela</button>' +
        '<button class="fx-btn" data-act="reset">Resetar layout</button>' +
        '<button class="fx-btn" data-act="zin">+</button><span class="fx-zoom">100%</span><button class="fx-btn" data-act="zout">−</button>' +
        '<span class="fx-legend">' +
          '<span><i class="lg-flow"></i>fluxo</span>' +
          '<span><i class="lg-entrada"></i>Entradas</span>' +
          '<span><i class="lg-gate"></i>Gate de duplicata</span>' +
          '<span><i class="lg-naoconta"></i>não conta</span>' +
        '</span>' +
      '</div>' +
      '<div class="fx-viewport"><div class="fx-canvas"></div></div>' +
      '<div class="fx-hint">Arraste os cards · arraste o fundo pra mover · scroll pra zoom · clique no card pra abrir</div>';
    host.appendChild(root);
    var viewport = root.querySelector(".fx-viewport");
    var canvas = root.querySelector(".fx-canvas");
    var zoomLabel = root.querySelector(".fx-zoom");

    // canvas size
    var CW = COLX.sink + 240 + 110, CH = 100;
    Object.keys(pos).forEach(function (id) { CH = Math.max(CH, pos[id].y + 200); });
    canvas.style.width = CW + "px"; canvas.style.height = CH + "px";

    // edges svg
    var edgeSvg = svg("svg", { class: "fx-edges", width: CW, height: CH }); canvas.appendChild(edgeSvg);

    // column headers
    SPINE.forEach(function (lk) {
      var L = LAYERS.find(function (x) { return x.key === lk; }); if (!L) return;
      var h = document.createElement("div"); h.className = "fx-colhead"; h.textContent = L.nome;
      h.style.left = COLX[lk] + "px"; h.style.top = "8px"; canvas.appendChild(h);
    });
    // apoio band rect
    var apoioNodes = NODES.filter(function (n) { return n.camada === "apoio"; });
    if (apoioNodes.length) {
      var minY = 1e9, maxY = 0, minX = 1e9, maxX = 0;
      apoioNodes.forEach(function (n) { var p = pos[n.id]; minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y + p.h); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x + p.w); });
      var band = document.createElement("div"); band.className = "fx-band";
      band.style.left = (minX - 24) + "px"; band.style.top = (minY - 34) + "px"; band.style.width = (maxX - minX + 48) + "px"; band.style.height = (maxY - minY + 58) + "px";
      canvas.appendChild(band);
      var bl = document.createElement("div"); bl.className = "fx-band-label";
      var AL = LAYERS.find(function (x) { return x.key === "apoio"; });
      bl.textContent = AL ? AL.nome : "Apoio"; bl.style.left = (minX - 18) + "px"; bl.style.top = (minY - 30) + "px"; canvas.appendChild(bl);
    }

    // node cards
    var els = {};
    NODES.forEach(function (n) {
      var p = pos[n.id];
      var card = document.createElement("div");
      var cls = "fx-node c-" + (n.classe || "").split(" ").join(" c-");
      card.className = "fx-node " + (n.classe ? n.classe.split(" ").map(function (c) { return "c-" + c; }).join(" ") : "");
      card.setAttribute("data-id", n.id);
      card.style.left = p.x + "px"; card.style.top = p.y + "px"; card.style.width = p.w + "px";
      var abasN = (n.abas || []).length;
      card.innerHTML =
        '<div class="nd-bar"></div>' +
        '<div class="fx-nd-body">' +
          '<div class="fx-nd-top"><span class="fx-nd-title">' + esc(n.titulo) + "</span>" + (n.valor ? '<span class="fx-nd-val">' + esc(n.valor) + "</span>" : "") + "</div>" +
          '<div class="fx-nd-sub">' + esc(n.sub || "") + "</div>" +
          (abasN ? '<div class="fx-nd-foot"><span class="fx-nd-abas">' + abasN + ' aba' + (abasN > 1 ? "s" : "") + ' que engaja' + (abasN > 1 ? "m" : "") + '</span><button class="fx-nd-exp" data-exp="1">abas ▾</button></div>' : "") +
          (abasN ? '<div class="fx-nd-tabs">' + (n.abas || []).map(function (a) { return '<div class="fx-tab"><span class="dir ' + esc(a.direcao) + '">' + esc(a.direcao) + "</span><b>" + esc(a.nome) + "</b> — " + esc(a.frase) + "</div>"; }).join("") + "</div>" : "") +
          '<button class="fx-nd-open">abrir ficha</button>' +
        "</div>";
      canvas.appendChild(card); els[n.id] = card;
    });
    // medir alturas reais
    NODES.forEach(function (n) { pos[n.id].h = els[n.id].offsetHeight; });

    // ---- desenhar arestas ----
    var LBL = { entrada: 1, gate: 1, naoconta: 1, principal: 1, aux: 1, solid: 1 };
    function anchors(a, b) {
      var sCx = a.x + a.w / 2, tCx = b.x + b.w / 2, sx, sy = a.y + a.h / 2, tx, ty = b.y + b.h / 2;
      if (tCx >= sCx) { sx = a.x + a.w; tx = b.x; } else { sx = a.x; tx = b.x + b.w; }
      return [sx, sy, tx, ty];
    }
    function drawEdges() {
      while (edgeSvg.firstChild) edgeSvg.removeChild(edgeSvg.firstChild);
      EDGES.forEach(function (ed, idx) {
        var a = pos[ed.de], b = pos[ed.para]; if (!a || !b) return;
        var an = anchors(a, b), sx = an[0], sy = an[1], tx = an[2], ty = an[3];
        var dx = Math.max(40, Math.abs(tx - sx) * 0.45) * (tx >= sx ? 1 : -1);
        var d = "M" + sx + "," + sy + " C" + (sx + dx) + "," + sy + " " + (tx - dx) + "," + ty + " " + tx + "," + ty;
        var path = svg("path", { class: "fx-edge e-" + ed.estilo, d: d, "data-de": ed.de, "data-para": ed.para }); edgeSvg.appendChild(path);
        if (ed.label && LBL[ed.estilo] && ed.estilo !== "solid" || (ed.label && ed.estilo === "solid")) {
          var mx = (sx + tx) / 2, my = (sy + ty) / 2 - 3;
          var lc = ed.estilo === "entrada" ? "l-entrada" : ed.estilo === "gate" ? "l-gate" : ed.estilo === "naoconta" ? "l-naoconta" : "";
          var wlbl = ed.label.length * 5.5 + 8;
          edgeSvg.appendChild(svg("rect", { class: "fx-elabel-bg", x: mx - wlbl / 2, y: my - 9, width: wlbl, height: 13, rx: 3 }));
          var t = svg("text", { class: "fx-elabel " + lc, x: mx, y: my + 1, "text-anchor": "middle" }); t.textContent = ed.label; edgeSvg.appendChild(t);
        }
      });
    }
    drawEdges();

    // ---- pan / zoom ----
    var zoom = 1, panX = 0, panY = 0;
    function applyT() { canvas.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")"; zoomLabel.textContent = Math.round(zoom * 100) + "%"; }
    function fit() {
      var minX = 1e9, minY = 1e9, maxX = 0, maxY = 0;
      Object.keys(pos).forEach(function (id) { var p = pos[id]; minX = Math.min(minX, p.x); minY = Math.min(minY, p.y - 20); maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h); });
      var vw = viewport.clientWidth - 40, vh = viewport.clientHeight - 40;
      var gw = maxX - minX, gh = maxY - minY;
      zoom = Math.min(1, Math.min(vw / gw, vh / gh)); if (!isFinite(zoom) || zoom <= 0) zoom = 1;
      panX = 20 - minX * zoom + Math.max(0, (vw - gw * zoom) / 2);
      panY = 20 - minY * zoom;
      applyT();
    }
    fit();

    viewport.addEventListener("wheel", function (e) {
      e.preventDefault();
      var rect = viewport.getBoundingClientRect(), cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      var nz = Math.max(0.3, Math.min(2, zoom * (1 - e.deltaY * 0.0014)));
      panX = cx - (cx - panX) * (nz / zoom); panY = cy - (cy - panY) * (nz / zoom); zoom = nz; applyT();
    }, { passive: false });

    var dragNode = null, dragOff = null, panning = false, panStart = null;
    viewport.addEventListener("pointerdown", function (e) {
      var card = e.target.closest ? e.target.closest(".fx-node") : null;
      if (e.target.closest && (e.target.closest(".fx-nd-exp") || e.target.closest(".fx-nd-open"))) return; // botões
      if (card) {
        dragNode = card.getAttribute("data-id");
        var rect = viewport.getBoundingClientRect();
        var mxc = (e.clientX - rect.left - panX) / zoom, myc = (e.clientY - rect.top - panY) / zoom;
        dragOff = { dx: mxc - pos[dragNode].x, dy: myc - pos[dragNode].y, moved: false };
        card.classList.add("dragging"); card.setPointerCapture && card.setPointerCapture(e.pointerId);
      } else {
        panning = true; panStart = { x: e.clientX - panX, y: e.clientY - panY }; viewport.classList.add("panning");
      }
    });
    viewport.addEventListener("pointermove", function (e) {
      if (dragNode) {
        var rect = viewport.getBoundingClientRect();
        var mxc = (e.clientX - rect.left - panX) / zoom, myc = (e.clientY - rect.top - panY) / zoom;
        pos[dragNode].x = mxc - dragOff.dx; pos[dragNode].y = myc - dragOff.dy; dragOff.moved = true;
        els[dragNode].style.left = pos[dragNode].x + "px"; els[dragNode].style.top = pos[dragNode].y + "px";
        drawEdges();
      } else if (panning) { panX = e.clientX - panStart.x; panY = e.clientY - panStart.y; applyT(); }
    });
    function endDrag() {
      if (dragNode) { els[dragNode].classList.remove("dragging"); if (dragOff && dragOff.moved) save(); dragNode = null; }
      panning = false; viewport.classList.remove("panning");
    }
    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", endDrag);

    // ---- hover highlight ----
    Object.keys(els).forEach(function (id) {
      els[id].addEventListener("mouseenter", function () {
        var neigh = {}; neigh[id] = 1;
        edgeSvg.querySelectorAll(".fx-edge").forEach(function (p) {
          var de = p.getAttribute("data-de"), pa = p.getAttribute("data-para");
          if (de === id || pa === id) { p.classList.add("hot"); neigh[de] = 1; neigh[pa] = 1; } else p.classList.add("dim");
        });
        Object.keys(els).forEach(function (oid) { if (!neigh[oid]) els[oid].classList.add("dim"); });
      });
      els[id].addEventListener("mouseleave", function () {
        edgeSvg.querySelectorAll(".fx-edge").forEach(function (p) { p.classList.remove("hot"); p.classList.remove("dim"); });
        Object.keys(els).forEach(function (oid) { els[oid].classList.remove("dim"); });
      });
    });

    // ---- expand / open ----
    canvas.addEventListener("click", function (e) {
      var exp = e.target.closest ? e.target.closest(".fx-nd-exp") : null;

        card.classList.toggle("expanded");
        exp.textContent = card.classList.contains("expanded") ? "abas ▴" : "abas ▾";
        requestAnimationFrame(function () { pos[id].h = card.offsetHeight; drawEdges(); });
        return;
      }
      var open = e.target.closest ? e.target.closest(".fx-nd-open") : null;
      var card2 = e.target.closest ? e.target.closest(".fx-node") : null;
      if (open || (card2 && !dragOff)) { /* fallthrough handled below */ }
      if (open) { openModal(open.closest(".fx-node").getAttribute("data-id")); return; }
    });
    // clique no corpo do card (não arrastado) abre ficha
    Object.keys(els).forEach(function (id) {
      els[id].addEventListener("click", function (e) {
        if (e.target.closest(".fx-nd-exp") || e.target.closest(".fx-nd-open")) return;
        if (dragOff && dragOff.moved) return; // foi arraste
        openModal(id);
      });
    });

    // ---- toolbar ----
    root.querySelector(".fx-bar").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-act]") : null; if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "fit") fit();
      else if (act === "reset") { try { localStorage.removeItem(STORE_KEY); } catch (x) {} defaultLayout(); NODES.forEach(function (n) { els[n.id].classList.remove("expanded"); els[n.id].style.left = pos[n.id].x + "px"; els[n.id].style.top = pos[n.id].y + "px"; pos[n.id].h = els[n.id].offsetHeight; }); drawEdges(); fit(); }
      else if (act === "zin") { zoom = Math.min(2, zoom * 1.2); applyT(); }
      else if (act === "zout") { zoom = Math.max(0.3, zoom / 1.2); applyT(); }
    });

    // ---- modal ----
    function openModal(id) {
      var n = BYID[id]; if (!n) return;
      var scrim = document.createElement("div"); scrim.className = "fx-modal-scrim";

      var saidaH = (n.saida || []).length ? '<ul class="fx-list">' + n.saida.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "";
      var kpiH = (n.kpis || []).length ? '<div class="fx-kpi">' + n.kpis.map(function (k) { return '<span class="k ' + esc(k.tipo) + '">' + esc(k.objetivo) + '<b>' + (k.tipo === "conta" ? "conta" : "preenche") + "</b></span>"; }).join("") + "</div>" : "";
      scrim.innerHTML =
        '<div class="fx-modal" role="dialog" aria-modal="true">' +
          '<div class="fx-modal-head"><div><h2>' + esc(n.titulo) + "</h2><div class=\"sub\">" + esc(n.sub || "") + (n.valor ? " · " + esc(n.valor) : "") + "</div></div><button class=\"fx-modal-x\" aria-label=\"Fechar\">×</button></div>" +
          '<div class="fx-modal-body">' +
            sec("s-in", "Espera receber (entrada)", entradaH) +
            sec("s-proc", "Como trata o dado (abas + fluxo interno)", procH) +
            sec("s-out", "Saída · pra onde deságua", saidaH) +
            sec("s-kpi", "KPIs gerais que " + ((n.kpis || []).some(function (k) { return k.tipo === "conta"; }) ? "conta" : "preenche"), kpiH) +
          "</div>" +
        "</div>";
      document.body.appendChild(scrim);
      function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
      function onKey(ev) { if (ev.key === "Escape") close(); }
      scrim.addEventListener("click", function (ev) { if (ev.target === scrim) close(); });
      scrim.querySelector(".fx-modal-x").addEventListener("click", close);
      document.addEventListener("keydown", onKey);
    }
  };
})();

</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("atlas-data").textContent);
  var FLOW = null;
  try { var _fd = document.getElementById("fluxo-data"); if (_fd) FLOW = JSON.parse(_fd.textContent); } catch (e) { FLOW = null; }
  var MODS = DATA.modules || [];
  var MAPA = DATA.mapa || {};
  var CATS = DATA.categories || [];
  var BY = {}; MODS.forEach(function (m) { BY[m.slug] = m; });

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function arr(a) { return Array.isArray(a) ? a : []; }
  function el(id) { return document.getElementById(id); }
  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  // worst-case health for a module
  function health(m) {
    var hasAlto = arr(m.achados_auditoria).some(function (a) { return a.severidade === "alto"; });
    if (hasAlto) return "r";
    var attn = arr(m.achados_auditoria).some(function (a) { return a.severidade === "medio"; }) ||
      arr(m.abas).some(function (a) { return a.estado === "sem_fonte" || a.estado === "legada" || a.estado === "redundante"; });
    return attn ? "a" : "g";
  }
  var ESTADO_LABEL = { viva: "viva", legada: "legada", sem_fonte: "sem fonte", redundante: "redundante", incerta: "incerta" };
  function estadoLabel(e) { return ESTADO_LABEL[e] || e; }

  // resolve free-text edge endpoint -> module slug (best effort)
  var NAME2SLUG = {}; MODS.forEach(function (m) { NAME2SLUG[norm(m.nome)] = m.slug; NAME2SLUG[norm(m.slug)] = m.slug; });
  function endpointSlug(text) {
    var t = norm(text);
    if (NAME2SLUG[t]) return NAME2SLUG[t];
    // try leading token before separators
    var lead = t.split(/[—\-→:(]/)[0].trim();
    if (NAME2SLUG[lead]) return NAME2SLUG[lead];
    for (var k in NAME2SLUG) { if (k.length > 3 && t.indexOf(k) === 0) return NAME2SLUG[k]; }
    return null;
  }
  function linkEndpoint(text) {
    var slug = endpointSlug(text);
    if (slug) return '<a class="achado-mod" href="#mod/' + slug + '">' + esc(text) + "</a>";
    return esc(text);
  }

  // ---------- sidebar ----------
  function buildSidebar() {
    var html = '<div class="nav-top">' +
      navItem("geral", "Visão geral", "01") +
      navItem("fluxograma", "Fluxograma", "02") +
      navItem("mapa", "Mapa de integração", "03") +
      navItem("auditoria", "Auditoria", "04") +
      "</div>";
    CATS.forEach(function (c) {
      var mods = c.modules.map(function (s) { return BY[s]; }).filter(Boolean);
      if (!mods.length) return;
      html += '<div class="cat-group" data-cat="' + c.key + '"><div class="cat-head"><span>' + esc(c.label) + "</span><span>" + mods.length + "</span></div>";
      mods.forEach(function (m) {
        html += '<a class="mod-link" data-slug="' + m.slug + '" data-search="' + esc(norm(m.nome + " " + m.slug)) + '" href="#mod/' + m.slug + '">' +
          '<span class="hdot ' + health(m) + '"></span><span class="nm">' + esc(m.nome) + "</span></a>";
      });
      html += "</div>";
    });
    el("nav").innerHTML = html;
  }
  function navItem(route, label, ic) {
    return '<a data-route="' + route + '" href="#' + route + '"><span class="ic">' + ic + "</span>" + esc(label) + "</a>";
  }

  function filterSidebar(q) {
    q = norm(q.trim());
    var links = document.querySelectorAll(".mod-link");
    links.forEach(function (a) {
      var hit = !q || a.getAttribute("data-search").indexOf(q) !== -1;
      a.style.display = hit ? "" : "none";
    });
    document.querySelectorAll(".cat-group").forEach(function (g) {
      var any = g.querySelector('.mod-link:not([style*="display: none"])');
      g.style.display = any ? "" : "none";
    });
  }

  function markActive(route, slug) {
    document.querySelectorAll(".nav-top a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-route") === route);
    });
    document.querySelectorAll(".mod-link").forEach(function (a) {
      a.classList.toggle("active", slug && a.getAttribute("data-slug") === slug);
    });
  }

  // ---------- views ----------
  function viewGeral() {
    var c = DATA.counts;
    var h = '<p class="eyebrow">Atlas operacional · ERP CBRio</p>' +
      '<h1 class="title">Como cada módulo funciona — e o que esperamos dele</h1>' +
      '<p class="lede">' + esc(MAPA.resumo_executivo || "") + "</p>";

    h += '<div class="stats">' +
      stat(c.modules, "módulos mapeados", c.categorias + " categorias") +
      stat(c.abas, "abas / telas", c.abasVivas + " vivas · " + (c.abas - c.abasVivas) + " a revisar") +
      stat(c.arestas, "integrações entre módulos", c.silos + " módulos terminais") +
      stat(c.achados, "achados de auditoria", c.alto + " altos · " + c.medio + " médios") +
      "</div>";
    h += '<p class="note">Cada ficha tem dois níveis: <b>visão macro</b> (pra diretoria — pra que serve, entrada → processamento → saída, integrações) e <b>operacional por aba</b> (passo a passo pra quem opera). Os vereditos de auditoria passaram por uma verificação adversarial contra o código.</p>';

    h += '<div class="spine-card"><h2>A espinha do sistema</h2><p class="lede" style="font-size:14.5px;margin:6px 0 14px">' + esc(MAPA.espinha || "") + '</p>' +
      '<div class="spine-wrap"><div id="spine"></div></div>' +
      railRow() + "</div>";

    h += '<section class="blk"><h2>Comece por aqui</h2><div class="silo">' +
      pointer("Sou diretor(a)", "Leia o Mapa de integração pra ver o sistema como um todo, depois a Auditoria pros pontos de atenção.", "mapa") +
      pointer("Opero um módulo", "Procure seu módulo na lista à esquerda e vá direto pro nível operacional (passo a passo por aba).", null) +
      "</div></section>";
    setMain(h);
    drawSpine();
  }
  function stat(n, l, sub) {
    return '<div class="stat"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</div>";
  }
  function pointer(t, d, route) {
    var href = route ? "#" + route : "#geral";
    return '<a class="s" style="text-decoration:none;display:block" href="' + href + '"><b>' + esc(t) + "</b><br>" + esc(d) + "</a>";
  }
  function railRow() {
    var rails = ["solicitacoes", "producao", "financeiro", "rh", "marketing", "eventos"];
    var h = '<div class="rail"><span class="rl">Trilhos paralelos</span>';
    rails.forEach(function (s) { if (BY[s]) h += '<a href="#mod/' + s + '">' + esc(BY[s].nome) + "</a>"; });
    return h + "</div>";
  }

  // spine diagram (SVG built in JS)
  function drawSpine() {
    var host = el("spine"); if (!host) return;
    var W = 1040, H = 360;
    var nodes = [
      { id: "star", cls: "star", cx: 520, cy: 40, w: 440, h: 46, t: "NSM", sub: "convertido engajado em ≤60d", slug: "painel-cbrio" },
      { id: "n1", cls: "j", cx: 100, cy: 200, w: 150, h: 54, t: "Culto · Decisão", sub: "integracao", slug: "integracao" },
      { id: "n2", cls: "j", cx: 300, cy: 200, w: 150, h: 54, t: "Integração", sub: "primeiros dados", slug: "integracao" },
      { id: "n3", cls: "j", cx: 500, cy: 200, w: 158, h: 54, t: "Cuidados", sub: "1º contato", slug: "cuidados" },
      { id: "b1", cls: "b", cx: 770, cy: 122, w: 168, h: 46, t: "Grupos", sub: "conectar", slug: "grupos" },
      { id: "b2", cls: "b", cx: 770, cy: 200, w: 168, h: 46, t: "Voluntariado", sub: "servir", slug: "voluntariado" },
      { id: "b3", cls: "b", cx: 770, cy: 278, w: 168, h: 46, t: "Next · Batismo", sub: "seguir", slug: "next" },
      { id: "n4", cls: "j", cx: 970, cy: 200, w: 130, h: 54, t: "Membresia", sub: "membro", slug: "membresia" }
    ];
    var N = {}; nodes.forEach(function (n) { N[n.id] = n; });
    function rx(n) { return n.cx + n.w / 2; }
    function lx(n) { return n.cx - n.w / 2; }
    var links = [
      ["n1", "n2", ""], ["n2", "n3", ""],
      ["n3", "b1", ""], ["n3", "b2", ""], ["n3", "b3", ""],
      ["b1", "n4", "s"], ["b2", "n4", "s"], ["b3", "n4", "s"]
    ];
    var svg = '<svg class="spine" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Diagrama da jornada">';
    svg += '<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)"/></marker>' +
      '<marker id="ahs" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--slate)"/></marker></defs>';
    // connectors
    var li = 0;
    links.forEach(function (lk) {
      var a = N[lk[0]], b = N[lk[1]];
      var x1 = rx(a), y1 = a.cy, x2 = lx(b), y2 = b.cy;
      var mx = (x1 + x2) / 2;
      var d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
      svg += '<path class="sp-link ' + (lk[2] === "s" ? "s" : "") + ' c" data-i="' + (li++) + '" d="' + d + '" marker-end="url(#' + (lk[2] === "s" ? "ahs" : "ah") + ')"></path>';
    });
    // dashed NSM measure line: from star bottom to branch cluster
    svg += '<path class="sp-link dash" d="M520,63 C600,95 690,110 700,128" fill="none"></path>';
    // nodes
    nodes.forEach(function (n) {
      var x = lx(n), y = n.cy - n.h / 2;
      var inner = '<rect x="' + x + '" y="' + y + '" width="' + n.w + '" height="' + n.h + '" rx="11"></rect>' +
        '<text x="' + n.cx + '" y="' + (n.cy - (n.sub ? 4 : -4)) + '" text-anchor="middle">' + esc(n.t) + "</text>" +
        (n.sub ? '<text class="sub" x="' + n.cx + '" y="' + (n.cy + 13) + '" text-anchor="middle">' + esc(n.sub) + "</text>" : "");
      svg += '<g class="sp-node ' + n.cls + '">' + (n.slug && BY[n.slug] ? '<a href="#mod/' + n.slug + '">' + inner + "</a>" : inner) + "</g>";
    });
    svg += "</svg>";
    host.innerHTML = svg;

    // animate draw-in unless reduced motion
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var paths = host.querySelectorAll(".sp-link.c");
    var ns = host.querySelectorAll(".sp-node");
    if (reduce) return;
    paths.forEach(function (p) {
      var len = p.getTotalLength();
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.style.transition = "stroke-dashoffset .6s ease";
      p.style.transitionDelay = (0.15 + p.getAttribute("data-i") * 0.12) + "s";
    });
    ns.forEach(function (g, i) {
      var r = g.querySelector("rect"); var txts = g.querySelectorAll("text");
      g.style.opacity = 0; g.style.transition = "opacity .45s ease"; g.style.transitionDelay = (i * 0.07) + "s";
    });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        paths.forEach(function (p) { p.style.strokeDashoffset = 0; });
        ns.forEach(function (g) { g.style.opacity = 1; });
      });
    });
  }

  // ---------- module view ----------
  function viewModule(slug) {
    var m = BY[slug];
    if (!m) { setMain('<p class="empty">Módulo não encontrado.</p>'); return; }
    var cat = catOf(slug);
    var h = '<div class="mod-head"><div class="mod-bc">' +
      '<a href="#geral">Atlas</a><span>›</span><span>' + esc(cat ? cat.label : "") + '</span><span>›</span>' +
      '<span class="slug">' + esc(m.slug) + "</span>" +
      (m.rota ? '<span class="slug" style="margin-left:auto">' + esc(m.rota) + "</span>" : "") + "</div>";
    h += '<div class="mod-title"><span class="hdot ' + health(m) + '" style="width:12px;height:12px"></span><h1>' + esc(m.nome) + "</h1></div>";
    h += '<p class="mod-purpose">' + esc(m.para_que_serve) + "</p>";
    if (m.quem_usa) h += '<div class="mod-who"><b>Quem usa</b>' + esc(m.quem_usa) + "</div>";
    h += "</div>";

    // MACRO
    h += '<section class="blk"><span class="altitude-tag">Visão macro · diretoria</span>';
    h += '<div class="flow">' +
      flowCol("Entrada", "in", arr(m.entrada).map(liPlain)) +
      flowCol("Processamento", "proc", arr(m.processamento).map(liProc)) +
      flowCol("Saída", "out", arr(m.saida).map(liPlain)) + "</div>";
    var al = arr(m.integracoes && m.integracoes.alimenta), ap = arr(m.integracoes && m.integracoes.alimentado_por);
    if (al.length || ap.length) {
      h += '<div class="integ" style="margin-top:14px">' +
        '<div class="box in"><h3>É alimentado por</h3><ul>' + (ap.length ? ap.map(function (x) { return '<li><span class="ar">←</span><span>' + esc(x) + "</span></li>"; }).join("") : '<li style="color:var(--ink-3)">—</li>') + "</ul></div>" +
        '<div class="box"><h3>Alimenta</h3><ul>' + (al.length ? al.map(function (x) { return '<li><span class="ar">→</span><span>' + esc(x) + "</span></li>"; }).join("") : '<li style="color:var(--ink-3)">—</li>') + "</ul></div></div>";
    }
    h += "</section>";

    // OPERACIONAL
    var abas = arr(m.abas);
    h += '<section class="blk"><span class="altitude-tag op">Operacional · por aba</span>' +
      "<h2>Abas e telas <span class=\"cnt\">" + abas.length + "</span></h2>";
    h += '<div class="abas">';
    abas.forEach(function (a) {
      var steps = arr(a.passo_a_passo);
      h += '<div class="aba x-' + (a.estado || "viva") + '"><div class="aba-top"><span class="aba-nm">' + esc(a.nome) + '</span><span class="chip ' + (a.estado || "viva") + '">' + esc(estadoLabel(a.estado)) + "</span></div>" +
        '<div class="aba-fn">' + esc(a.funcao) + "</div>" +
        (steps.length ? '<ul class="steps">' + steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>" : "") +
        (a.recomendacao ? '<div class="aba-rec"><b>Recomendação</b><br>' + esc(a.recomendacao) + "</div>" : "") +
        (a.evidencia ? '<div class="ev">' + esc(a.evidencia) + "</div>" : "") +
        "</div>";
    });
    h += "</div></section>";

    // AUDITORIA
    var ach = arr(m.achados_auditoria).slice().sort(sevSort);
    h += '<section class="blk"><span class="altitude-tag au">Auditoria de propósito</span>' +
      "<h2>Achados <span class=\"cnt\">" + ach.length + "</span></h2>";
    if (ach.length) {
      h += '<div class="achados">';
      ach.forEach(function (a) {
        h += '<div class="achado ' + a.severidade + '"><div class="achado-top"><span class="chip ' + a.severidade + '">' + esc(a.severidade) + '</span><span class="achado-desc">' + esc(a.descricao) + "</span></div>" +
          (a.recomendacao ? '<div class="achado-rec"><b>Ação</b> ' + esc(a.recomendacao) + "</div>" : "") +
          (a.evidencia ? '<div class="ev">' + esc(a.evidencia) + "</div>" : "") + "</div>";
      });
      h += "</div>";
    } else h += '<p class="empty">Nenhum achado registrado.</p>';
    if (m.verificacao_notas) h += '<div class="note warn" style="margin-top:16px"><b>Nota de verificação:</b> ' + esc(m.verificacao_notas) + "</div>";
    // código
    var refs = [];
    if (m.pageFile) refs.push("front " + m.pageFile);
    if (m.backendRouteFile) refs.push("back " + m.backendRouteFile);
    if (m.apiNamespace) refs.push("api." + m.apiNamespace);
    if (refs.length) h += '<div class="ev" style="margin-top:16px">' + refs.map(esc).join("  ·  ") + "</div>";
    h += "</section>";

    setMain(h);
  }
  function flowCol(title, cls, items) {
    return '<div class="flow-col ' + cls + '"><h3>' + esc(title) + "</h3><ul>" + (items.length ? items.join("") : '<li style="color:var(--ink-3)">—</li>') + "</ul></div>";
  }
  function liPlain(x) { return "<li>" + esc(x) + "</li>"; }
  function liProc(x) {
    var s = String(x || ""); var low = norm(s);
    var auto = /\bauto/.test(low) || low.indexOf("automat") === 0 || /^auto/.test(low);
    // detect leading AUTOMÁTICO / MANUAL marker
    if (/^autom/.test(low)) return '<li class="auto"><span class="tag-auto">auto</span>' + esc(s.replace(/^autom[aá]tico\s*[—:\-]?\s*/i, "")) + "</li>";
    if (/^manual/.test(low)) return "<li><span class=\"tag-man\">manual</span>" + esc(s.replace(/^manual\s*[—:\-]?\s*/i, "")) + "</li>";
    return "<li>" + esc(s) + "</li>";
  }
  function sevSort(a, b) { var o = { alto: 0, medio: 1, baixo: 2 }; return (o[a.severidade] || 9) - (o[b.severidade] || 9); }
  function catOf(slug) { for (var i = 0; i < CATS.length; i++) if (CATS[i].modules.indexOf(slug) !== -1) return CATS[i]; return null; }

  // ---------- mapa view ----------
  var mapaFilter = "all";
  function viewMapa() {
    var edges = arr(MAPA.arestas);
    var h = '<p class="eyebrow">02 · Mapa de integração</p><h1 class="title" style="font-size:clamp(1.7rem,1.2rem+1.4vw,2.3rem)">Quem alimenta quem</h1>' +
      '<p class="lede">' + edges.length + " conexões reais entre módulos, extraídas do código (triggers, coletores, endpoints, tabelas compartilhadas). Filtre pela origem.</p>";
    // group by 'de'
    var groups = {};
    edges.forEach(function (e) { var k = e.de || "?"; (groups[k] = groups[k] || []).push(e); });
    var keys = Object.keys(groups).sort();
    // filter bar
    h += '<div class="filters"><span class="fl">Origem</span><button class="fbtn ' + (mapaFilter === "all" ? "on" : "") + '" data-mf="all">todas<span class="c">' + edges.length + "</span></button>";
    keys.forEach(function (k) {
      h += '<button class="fbtn ' + (mapaFilter === k ? "on" : "") + '" data-mf="' + esc(k) + '">' + esc(shorten(k, 22)) + '<span class="c">' + groups[k].length + "</span></button>";
    });
    h += "</div>";
    keys.forEach(function (k) {
      if (mapaFilter !== "all" && mapaFilter !== k) return;
      var slug = endpointSlug(k);
      h += '<div class="edge-group"><h3>' + (slug ? '<a href="#mod/' + slug + '">' + esc(k) + "</a>" : esc(k)) + '</h3>';
      groups[k].forEach(function (e) {
        h += '<div class="edge"><div class="to">' + linkEndpoint(e.para) + '</div><div class="via">' + esc(e.via) + "</div></div>";
      });
      h += "</div>";
    });
    // silos
    var silos = arr(MAPA.modulos_sem_consumidor);
    if (silos.length) {
      h += '<section class="blk"><h2>Módulos terminais <span class="cnt">' + silos.length + '</span></h2>' +
        '<p class="note warn">Ninguém consome a saída destes módulos hoje. Não é necessariamente problema (relatórios read-only são terminais por natureza), mas vale confirmar a intenção.</p><div class="silo">' +
        silos.map(function (s) { var parts = String(s).split(/\s*[—\-]\s*/); return '<div class="s"><b>' + esc(parts[0]) + "</b>" + (parts[1] ? " — " + esc(parts.slice(1).join(" — ")) : "") + "</div>"; }).join("") + "</div></section>";
    }
    setMain(h);
  }
  function shorten(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  // ---------- auditoria view ----------
  var sevFilter = "all", estFilter = "all";
  function viewAuditoria() {
    var c = DATA.counts;
    var h = '<p class="eyebrow">03 · Auditoria de propósito</p><h1 class="title" style="font-size:clamp(1.7rem,1.2rem+1.4vw,2.3rem)">Toda aba se justifica?</h1>' +
      '<p class="lede">Os vereditos abaixo passaram por uma verificação adversarial: cada aba marcada como morta/sem-fonte/redundante teve que sobreviver a uma tentativa de refutação contra o código real.</p>';

    h += '<div class="stats" style="margin-top:18px">' +
      stat(c.achados, "achados", c.alto + " altos") +
      stat(c.abas - c.abasVivas, "abas a revisar", "de " + c.abas) +
      stat(c.semFonte, "abas sem fonte de dados", "mostram vazio") +
      stat(c.silos, "módulos terminais", "ver Mapa") + "</div>";

    // transversais
    var tx = arr(MAPA.achados_transversais);
    if (tx.length) {
      h += '<section class="blk"><h2>Padrões que cruzam módulos <span class="cnt">' + tx.length + '</span></h2><div class="tx">' +
        tx.map(function (t) { return '<div class="t"><h3>' + esc(t.titulo) + "</h3><p>" + esc(t.descricao) + "</p>" + (t.recomendacao ? '<div class="rec"><b>Ação</b> ' + esc(t.recomendacao) + "</div>" : "") + "</div>"; }).join("") + "</div></section>";
    }

    // all achados flattened
    var all = [];
    MODS.forEach(function (m) { arr(m.achados_auditoria).forEach(function (a) { all.push({ slug: m.slug, nome: m.nome, a: a }); }); });
    all.sort(function (x, y) { return sevSort(x.a, y.a); });
    h += '<section class="blk"><h2>Todos os achados <span class="cnt">' + all.length + '</span></h2>';
    h += '<div class="filters"><span class="fl">Severidade</span>' +
      sevBtn("all", "todos", all.length) + sevBtn("alto", "altos", c.alto) + sevBtn("medio", "médios", c.medio) + sevBtn("baixo", "baixos", c.baixo) + "</div>";
    h += '<div class="achados">';
    all.forEach(function (it) {
      if (sevFilter !== "all" && it.a.severidade !== sevFilter) return;
      h += '<div class="achado ' + it.a.severidade + '"><div class="achado-top"><span class="chip ' + it.a.severidade + '">' + esc(it.a.severidade) + '</span><a class="achado-mod" href="#mod/' + it.slug + '">' + esc(it.nome) + '</a><span class="achado-desc">' + esc(it.a.descricao) + "</span></div>" +
        (it.a.recomendacao ? '<div class="achado-rec"><b>Ação</b> ' + esc(it.a.recomendacao) + "</div>" : "") +
        (it.a.evidencia ? '<div class="ev">' + esc(it.a.evidencia) + "</div>" : "") + "</div>";
    });
    h += "</div></section>";

    // non-viva abas
    var nv = [];
    MODS.forEach(function (m) { arr(m.abas).forEach(function (a) { if (a.estado && a.estado !== "viva") nv.push({ slug: m.slug, nome: m.nome, a: a }); }); });
    h += '<section class="blk"><h2>Abas a revisar <span class="cnt">' + nv.length + '</span></h2>';
    var ec = c.estados || {};
    h += '<div class="filters"><span class="fl">Estado</span>' +
      estBtn("all", "todas", nv.length) +
      estBtn("incerta", "incertas", ec.incerta || 0) +
      estBtn("sem_fonte", "sem fonte", ec.sem_fonte || 0) +
      estBtn("legada", "legadas", ec.legada || 0) +
      estBtn("redundante", "redundantes", ec.redundante || 0) + "</div>";
    h += '<div class="abas">';
    nv.forEach(function (it) {
      if (estFilter !== "all" && it.a.estado !== estFilter) return;
      h += '<div class="aba x-' + it.a.estado + '"><div class="aba-top"><span class="aba-nm">' + esc(it.a.nome) + '</span><span class="chip ' + it.a.estado + '">' + esc(estadoLabel(it.a.estado)) + "</span></div>" +
        '<div class="aba-fn"><a class="achado-mod" href="#mod/' + it.slug + '">' + esc(it.nome) + "</a> — " + esc(it.a.funcao) + "</div>" +
        (it.a.recomendacao ? '<div class="aba-rec"><b>Recomendação</b><br>' + esc(it.a.recomendacao) + "</div>" : "") +
        (it.a.evidencia ? '<div class="ev">' + esc(it.a.evidencia) + "</div>" : "") + "</div>";
    });
    h += "</div></section>";
    setMain(h);
  }
  function sevBtn(k, l, n) { return '<button class="fbtn ' + (sevFilter === k ? "on" : "") + '" data-sf="' + k + '">' + l + '<span class="c">' + n + "</span></button>"; }
  function estBtn(k, l, n) { return '<button class="fbtn ' + (estFilter === k ? "on" : "") + '" data-ef="' + k + '">' + l + '<span class="c">' + n + "</span></button>"; }

  // ---------- fluxograma ----------
  function viewFluxograma() {
    var mp = el("mainpane"); if (mp) { mp.style.height = "100vh"; mp.style.overflow = "hidden"; }
    var m = el("main"); m.style.position = "relative"; m.style.height = "100%"; m.innerHTML = "";
    if (FLOW && window.renderFluxograma) window.renderFluxograma(m, FLOW);
    else m.innerHTML = '<div class="wrap"><p class="empty">Dados do fluxograma indisponíveis.</p></div>';
  }

  // ---------- shell ----------
  function setMain(html) {
    var m = el("main"); m.innerHTML = '<div class="wrap fade">' + html + "</div>";
    m.scrollTop = 0; window.scrollTo(0, 0);
    el("mainpane").scrollTop = 0;
  }

  function route() {
    var hash = (location.hash || "#geral").slice(1);
    closeSidebar();
    var _mp = el("mainpane"), _m0 = el("main");
    if (_mp) { _mp.style.height = ""; _mp.style.overflow = ""; }
    if (_m0) { _m0.style.position = ""; _m0.style.height = ""; }
    if (hash === "fluxograma") { markActive("fluxograma", null); el("topTitle").textContent = "Fluxograma"; viewFluxograma(); return; }
    if (hash.indexOf("mod/") === 0) {
      var slug = hash.slice(4); markActive(null, slug); el("topTitle").textContent = (BY[slug] ? BY[slug].nome : "Módulo"); viewModule(slug); return;
    }
    markActive(hash, null);
    if (hash === "mapa") { el("topTitle").textContent = "Mapa"; viewMapa(); }
    else if (hash === "auditoria") { el("topTitle").textContent = "Auditoria"; viewAuditoria(); }
    else { el("topTitle").textContent = "Visão geral"; viewGeral(); }
  }

  function openSidebar() { el("side").classList.add("open"); el("scrim").classList.add("show"); }
  function closeSidebar() { el("side").classList.remove("open"); el("scrim").classList.remove("show"); }

  // delegated clicks for filter buttons
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-mf],[data-sf],[data-ef]") : null;
    if (!t) return;
    if (t.hasAttribute("data-mf")) { mapaFilter = t.getAttribute("data-mf"); viewMapa(); }
    else if (t.hasAttribute("data-sf")) { sevFilter = t.getAttribute("data-sf"); viewAuditoria(); }
    else if (t.hasAttribute("data-ef")) { estFilter = t.getAttribute("data-ef"); viewAuditoria(); }
  });

  // Navegação por hash robusta: alguns hosts (iframe srcdoc / about:srcdoc) não
  // executam a navegação de fragmento ao clicar num <a href="#...">, mas atribuir
  // location.hash funciona. Interceptamos o clique e setamos o hash na mão.
  // Cobre links HTML e âncoras SVG (nós da espinha) via closest('a[href^="#"]').
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || href.length < 2) return;
    e.preventDefault();
    if (location.hash === href) route(); else location.hash = href;
  });

  // ---------- init ----------
  buildSidebar();
  el("search").addEventListener("input", function (e) { filterSidebar(e.target.value); });
  el("menuBtn").addEventListener("click", openSidebar);
  el("scrim").addEventListener("click", closeSidebar);
  window.addEventListener("hashchange", route);
  route();
})();

</script>
