 + window.prompt('Motivo da exclusao (opcional)')."],"processamento":["AUTOMÁTICO — Diagnóstico: GET /api/revisoes/diagnostico lê projects (status != concluido/cancelado), expansion_milestones e expansion_milestone_dependencies; calcula atrasados (date_end \u003c hoje), impactados por transitive closure das dependências (revisoes.js:36-48) e orçamento em risco somando budget_planned dos atrasados+impactados (revisoes.js:51-52). Tudo via cliente supabase REST (service_role).","AUTOMÁTICO — Simulação de cascata: GET /api/revisoes/simular/:tipo/:id?nova_data= recalcula dependentes diretos + cascata (transitive closure) e projeta nova data de cada marco aplicando delta_dias (revisoes.js:92-122). Recalculado ao vivo conforme o usuário muda a Data fim no detalhe (recalcImpacto, RevisaoDetalhe.jsx:211-217, 300-303). Projeto não tem dependências formais → retorna dependentes vazio (revisoes.js:132-136).","AUTOMÁTICO — Log de auditoria: PUT /projeto/:id e PUT /expansao/:id buscam o registro antes, comparam campo a campo (String(antes) !== String(depois)) e inserem em revision_log só os que mudaram (revisoes.js:160-172 e 195-206). É feito no handler do backend, NÃO é trigger SQL.","MANUAL — Edição: o PMO digita os campos e clica 'Salvar alterações' (UPDATE direto em projects/expansion_milestones, sem aprovação; toast com nº de campos alterados — RevisaoDetalhe.jsx:219-231).","AUTOMÁTICO — Soft-delete de projeto: DELETE /projeto/:id chama RPC app_soft_delete('projects',...) (reversível) + grava no log (revisoes.js:242-253).","HARD-DELETE de marco: DELETE /expansao/:id apaga em cascata expansion_subtasks/expansion_tasks/expansion_milestone_dependencies/expansion_milestones com .delete() direto (irreversível) + grava no log (revisoes.js:266-273)."],"saida":["Painel de 6 KPIs no topo do radar: Projetos ativos, Proj. atrasados, Marcos expansão, Marcos atrasados, Deps. impactadas, Orçamento em risco (RevisaoEstrategica.jsx:68-74).","Lista unificada (projetos + marcos de expansão, expansão concluída/cancelada filtrada no front) ordenada por dias de atraso desc, com badge Proj/Exp, área, responsável, prazo e selo de atraso/restante/status (RevisaoEstrategica.jsx:41-44, 107-132).","Tela de detalhe: grafo SVG de dependências (item → diretos → cascata) com nós clicáveis e datas projetadas, formulário de edição e histórico de revisões (revision_log) do item.","Sem export de arquivo, sem relatório PDF/CSV — saída é só on-screen."],"integracoes":{"alimenta":["Tabela projects — UPDATE em PUT /api/revisoes/projeto/:id (mesma tabela do módulo Projetos)","Tabela expansion_milestones — UPDATE em PUT /api/revisoes/expansao/:id (mesma tabela do módulo Expansão)","Tabela revision_log — INSERT no backend a cada campo alterado e em cada exclusão (audit trail próprio do módulo)","Projetos e Expansão consomem indiretamente as mudanças (compartilham as mesmas tabelas)"],"alimentado_por":["projects (módulo Projetos) — fonte das linhas 'Proj'","expansion_milestones (módulo Expansão) — fonte das linhas 'Exp'","expansion_milestone_dependencies — define a cascata/grafo; se vazia, não há impacto a calcular","expansion_tasks / expansion_subtasks — só tocadas no DELETE de marco (hard-delete em cascata)"]},"abas":[{"nome":"Radar / Diagnóstico (página única /revisao)","funcao":"Lista e filtra todos os projetos e marcos de expansão que precisam de atenção, com 6 KPIs de atraso e orçamento em risco.","passo_a_passo":["Abre /revisao e vê os 6 KPIs + a lista ordenada por atraso","Aplica filtros (Área, Tipo, Status=Atrasados, Responsável)","Clica numa linha para abrir o detalhe e replanejar"],"estado":"viva","evidencia":"RevisaoEstrategica.jsx:41-56 (monta allItems) e :110 navigate(`/revisao/${item._tipo}/${item.id}`); endpoint revisoes.js:11-61","recomendacao":"OK."},{"nome":"Detalhe · Mapa de dependências (/revisao/:tipo/:id)","funcao":"Grafo SVG de dependentes diretos + cascata e simulação do efeito dominó ao mudar a data fim.","passo_a_passo":["Abre um marco de expansão","Altera a Data fim no formulário abaixo","Observa o grafo recalcular datas projetadas e orçamento afetado"],"estado":"incerta","evidencia":"Endpoint /simular e renderer SVG totalmente cabeados e vivos (revisoes.js:67-138; RevisaoDetalhe.jsx:24-173, 211-217). DependencyGraph mostra 'nao possui dependentes' quando dependentes.length===0 (:27-34). Projeto sempre cai aqui (revisoes.js:132-136). Marco só mostra grafo se expansion_milestone_dependencies tiver linhas.","recomendacao":"Código vivo — não é 'sem fonte'. Confirmar em prod se expansion_milestone_dependencies está populada; se vazia, o grafo nunca aparece (estado de dado, não bug). Para projeto, ocultar o card (sempre vazio por design)."},{"nome":"Detalhe · Editar (/revisao/:tipo/:id)","funcao":"Edição direta dos campos do projeto/marco com motivo; salva sem aprovação e loga as mudanças.","passo_a_passo":["Edita campos (status, datas, orçamento, responsável)","Preenche 'Motivo da revisão'","Clica 'Salvar alterações' (toast informa N campos atualizados)"],"estado":"viva","evidencia":"RevisaoDetalhe.jsx:219-231 (salvar) + revisoes.js:145-210 (whitelist + log diff). authorize('admin','diretor') por handler.","recomendacao":"A UI edita só os campos TEXT 'responsible'/'area'; projects tem responsible_id/leader_id (UUID FK) que ficam dessincronizados — ver achados."},{"nome":"Detalhe · Histórico de revisões (/revisao/:tipo/:id)","funcao":"Lista as alterações registradas em revision_log para aquele item (campo, de→para, autor, motivo).","passo_a_passo":["Rola até o fim do detalhe","Lê a linha do tempo de cada campo alterado","Usa o 'motivo' para entender a decisão"],"estado":"viva","evidencia":"RevisaoDetalhe.jsx:368-387 + GET /historico (revisoes.js:216-226). Só renderiza se historico.length>0.","recomendacao":"OK. Histórico é específico do módulo (revision_log), não o app_audit_log global."},{"nome":"Detalhe · Excluir (/revisao/:tipo/:id)","funcao":"Exclui o projeto (soft-delete reversível) ou o marco de expansão (hard  :122-123 trata 'concluido'.","recomendacao":"Cosmético; manter como defensivo ou remover o ramo Concluído."},{"severidade":"baixo","descricao":"Diagnóstico carrega a lista completa de projetos e marcos sem paginação e filtra/ordena client-side. Em escala pode bater no cap de 1000 linhas do PostgREST, truncando o radar silenciosamente.","evidencia":"revisoes.js:16-18 selects sem .range(); RevisaoEstrategica.jsx:49-56 filtra em JS.","recomendacao":"Volume atual baixo, tolerável; monitorar e paginar se crescer."}],"verificacao_notas":"Reabri backend/routes/revisoes.js, src/pages/RevisaoEstrategica.jsx, src/pages/RevisaoDetalhe.jsx e src/api.js (linhas 430-438). Todos os 6 achados têm evidência real no código — nenhum removido. Mudanças: (1) Achado #4 (PostgREST .or() injection) REBAIXADO de médio para baixo — o endpoint é DELETE admin/diretor-only via service_role e o id só flui para filtros .eq/.or, risco bounded; mantido por fugir do padrão escapePostgrestValue. (2) Aba 'Mapa de dependências' RECLASSIFICADA de 'sem_fonte' para 'incerta' — endpoint /simular e o renderer SVG estão totalmente cabeados e vivos (revisoes.js:67-138, RevisaoDetalhe.jsx:24-173); o grafo só fica vazio quando expansion_milestone_dependencies não tem linhas, o que é estado de dado, não código morto/sem fonte. (3) Aba 'Excluir' RECLASSIFICADA de 'incerta' para 'viva' — o fluxo funciona e está cabeado (RevisaoDetalhe.jsx:354-364); o ponto real (hard-delete de marco) já está coberto pelo achado alto, não justifica marcar a aba como incerta. (4) Acrescentei ao processamento a distinção explícita soft-delete projeto vs hard-delete marco. (5) Linhas citadas conferidas/ajustadas (closure de deps 36-48; simular 92-122; log 160-172/195-206; soft-delete 242-246). Confirmei a divergência TEXT vs UUID FK: o form edita só form.responsible (:292) e form.area (:311), nunca responsible_id/leader_id, embora a whitelist do PUT (:148) os aceite — achado #2 sólido. Confirmação alta para todos os achados verificáv api.governanca.salvarObservacoes existe em api.js:443 mas nenhuma tela o chama).","Parâmetro opcional ?mes=YYYY-MM no GET do relatório (governanca.js:365) — filtra DRE/KPI/CC por mês de competência. ⚠️ o cliente api.governanca.relatorio(sigla) (api.js:442) NÃO repassa o ?mes — só o backend o aceita; nenhum chamador passa mês hoje."],"processamento":["AUTOMÁTICO — GET /governanca/relatorio/:sigla (governanca.js:359) valida a sigla contra TIPOS (6 fixos no código) e roteia para um builder.","buildOKR (governanca.js:49): lê projects (não-concluído/cancelado), project_tasks, project_risks, project_kpis (tratados como Key Results) e expansion_milestones; classifica KR on_track(≥80%)/at_risk(50-79%)/off_track(\u003c50%)/sem_meta; gera alertas de atraso/sem responsável/KR off-track/risco alto (score≥12). Em tempo de request.","buildDRE (governanca.js:154): agrega fin_transacoes do mês x mês anterior por categoria (join fin_categorias), fin_contas (saldo), fin_contas_pagar (pendentes/vencidas) e fin_reembolsos pendentes. Respeita o filtro ?mes. AUTOMÁTICO.","buildKPI (governanca.js:217): Promise.allSettled (tolerante a falha por fonte) sobre cultos (atual+anterior), mem_grupo_membros (count ativos), pense_videos, RPC kpi_servir_comunidade, cultura_mensal, kpi_metas e a tabela 'membros' (INEXISTENTE na schema viva — ver achados). Monta a mandala dos 5 valores. AUTOMÁTICO.","buildCC (governanca.js:276): chama buildOKR+buildDRE+buildKPI em paralelo + top 5 project_risks (não-mitigados) + governance_tasks pendentes (try/catch silencioso na 290). Herda o bug do 'membros' via buildKPI. AUTOMÁTICO.","buildDE (governanca.js:308): acumulado anual — rh_funcionarios ativos, patrimonio_bens, fin_transacoes do ano. AUTOMÁTICO.","buildAG (governanca.js:331): semestral — projects (status final), fin_transacoes do ano, tabela 'membros' (INEXISTENTE) e cultos do ano. AUTOMÁTICO.","MANUAL — POST /relatorio/:sigla/observacoes (governanca.js:395): find-or-create governance_cycles → busca governance_meeting_types por sigla (404 se ausente) → find-or-create governance_meetings → grava observacoes.","AUTOMÁTICO (cron VIVO) — GET /cron/lembrete (governanca.js:431): agendado no vercel.json (0 10 * * 1, toda 2ª-feira 10h UTC). Só age se for a 2ª véspera da 1ª quarta do mês; monta o checklist OKR e dispara notificar() do módulo 'governanca'. Auth fail-closed via isAuthorizedCron + fallback admin/diretor."],"saida":["JSON por reunião via GET /governanca/relatorio/:sigla: { tipo, gerado_em, observacoes, checklist[], resumo{}, dados{} } (governanca.js:387). buildOKR ainda inclui bloco 'ourico'.","Checklists de preparo (item/ok/valor) por tipo de reunião.","Resumo executivo (KRs on/at/off-track, % conclusão média de projetos, resultado financeiro + variação, mandala dos 5 valores + tendência, totais anuais).","Lista estática de tipos de reunião: GET /governanca/tipos (6 tipos hardcoded em TIPOS, governanca.js:34-41).","Notificação in-app de lembrete OKR (via cron + notificar(), link aponta para /eventos — governanca.js:467).","NÃO produz tela/dashboard/export — sem renderização de frontend hoje."],"integracoes":{"alimenta":["governance_cycles / governance_meeting_types / governance_meetings — grava observações da reunião (POST observacoes · governanca.js:404-422; lê tipo por sigla, 404 se não seedado)","Sistema de notificações — notificar({modulo:'governanca'}) no cron de lembrete (governanca.js:462-470)"],"alimentado_por":["Projetos — projects, project_tasks, project_risks, project_kpis (governanca.js:51-55)","Expansão — expansion_milestones (governanca.js:56)","Financeiro — fin_transacoes, fin_contas, fin_contas_pagar, fin_reembolsos (+join fin_categorias) (governanca.js:158-164)","Cultos — cultos (presença/decisões/online_ds) (governanca.js:222-223, 337)","Grupos — mem_grupo_membros (count ativos) (governanca.js:224)","Conteúdo/PENSE — pense_videos (governanca.js:225)","Voluntariado — RPC kpi_servir_comunidade (governanca.js:226)","Cultura/Generosidade — cultura cultos, presença, generosidade, membresia)","Avaliar mandala e tendência","Registrar observações"],"estado":"sem_fonte","evidencia":"governanca.js:229 — supabase.from('membros').eq('status','ativo'). A tabela viva é mem_membros e o status é 'membro_ativo' (CLAUDE.md; membresia.js:1936 usa 'membro_ativo'; nenhuma migration cria 'membros'). Como roda dentro de Promise.allSettled, o erro de tabela inexistente é engolido e pick(7).count cai pra 0 → membrosAtivos sempre 0 e checklist 'Membresia atualizada' sempre falso. Demais fontes (cultos, pense_videos, kpi_servir_comunidade, cultura_mensal, mem_grupo_membros) são reais.","recomendacao":"Trocar 'membros'→'mem_membros' e status 'ativo'→'membro_ativo' (governanca.js:229)."},{"nome":"Conselho Consultivo / CC (relatório/CC)","funcao":"Síntese OKR+DRE+KPI + top 5 riscos + pendências de reuniões anteriores (governance_tasks).","passo_a_passo":["GET /governanca/relatorio/CC?mes=YYYY-MM","Revisar checklist consolidado dos 3 builders","Ver top riscos e pendências abertas","Registrar deliberações em observações"],"estado":"incerta","evidencia":"buildCC governanca.js:276-306 funcional; herda o bug de 'membros' via buildKPI (afeta só o resumo KPI). project_risks vivo; governance_tasks em try/catch silencioso (governanca.js:287-290).","recomendacao":"Reativar/aposentar junto com os demais; herda o fix de mem_membros no sub-resumo KPI."},{"nome":"Diretoria Estatutária / DE (relatório/DE)","funcao":"Relatório quadrimestral: quadro de funcionários ativos, patrimônio inventariado, financeiro acumulado do ano.","passo_a_passo":["GET /governanca/relatorio/DE","Conferir nº de funcionários/bens","Ver resultado anual","Registrar observações"],"estado":"incerta","evidencia":"buildDE governanca.js:308-329 íntegro; fontes rh_funcionarios/patrimonio_bens/fin_transacoes reais. Sem UI.","recomendacao":"Mesma decisão de produto. Não tem bug de fonte."},{"nome":"Assembleia Geral / AG (relatório/AG)","funcao":"Prestação de contas semestral: projetos concluídos, financeiro anual, membros ativos, cultos no ano.","passo_a_passo":["GET /governanca/relatorio/AG","Ler checklist anual","Conferir resultado e membresia","Registrar observações"],"estado":"sem_fonte","evidencia":"governanca.js:336 — supabase.from('membros').eq('status','ativo') (mesma tabela inexistente). Diferente do KPI, aqui é await direto dentro de Promise.all (governanca.js:333-338): a query a tabela inexistente provavelmente lança e cai no catch do endpoint (500), OU membrosRes.count fica null→0. Em qualquer caso o card de membros nunca é fiel.","recomendacao":"Trocar 'membros'→'mem_membros' e 'ativo'→'membro_ativo' (governanca.js:336)."},{"nome":"Observações da reunião (POST relatório/:sigla/observacoes)","funcao":"Persistir o texto/ata/deliberações da reunião por sigla e mês.","passo_a_passo":["Editar texto de observações na tela (inexistente hoje)","Chamar api.governanca.salvarObservacoes(sigla, texto)","Backend faz find-or-create do ciclo/tipo/meeting e grava"],"estado":"legada","evidencia":"api.js:443 expõe salvarObservacoes, mas nenhuma tela o invoca (grep em src: só api.js define). Único caminho de escrita do módulo, órfão de UI. Depende de governance_meeting_types ter a sigla seedada (governanca.js:411-412, 404 se ausente).","recomendacao":"Se o módulo for reativado, religar a essa função e garantir seed dos 6 tipos; caso contrário, marcar o endpoint como dormente. Funciona, mas é inalcançável pelo usuário."},{"nome":"Lembrete pré-reunião (cron/lembrete)","funcao":"Disparar notificação OKR na 2ª véspera da 1ª quarta do mês.","passo_a_passo":["Cron (vercel.json) chama GET /governanca/cron/lembrete toda 2ª-feira 10h UTC","Backend verifica dia da semana e 1ª-quarta","Monta checklist OKR e dispara notificar()"],"estado":"viva","evidencia":"governanca.js:431-474; CRON REGISTRADO em vercel.json:24-26 (schedule '0 10 * * 1'). Usa isAuthorizedCron + fallback admin/diretor, notificar() com chaveDedup, auth fail-closed. Link da notificação aponta /eventos (governanca.js:467).","recomendacao":"Cron confirmado/agendado (refuta a dúvida 'verificar se há cron'). Único nó vivo e alcançável do módulo. Se a tela mudar de lugar, atualizar o link '/eventos'."}],"achados_auditoria":[{"severidade":"alto","descricao":"Módulo sem frontend: não há rota /governanca em App.tsx, item de menu em AppShell.jsx nem página dedicada. O namespace api.governanca (api.js:440-444) não é importado/chamado por nenhuma tela. O backend está montado (server.js:136) e funcional, mas inalcançável pelo usuário final pela UI — só o cron de lembrete o aciona.","evidencia":"App.tsx sem rota 'governanca'; AppShell.jsx sem match; grep \"governanca.\" em src = 0 chamadas (só api.js:440 define o namespace).","recomendacao":"Decisão de produto: (a) reativar a tela de Governança (o cron ainda linka /eventos), ou (b) aposentar route+namespace. Hoje é lógica viva sem consumidor — risco de manutenção e de KPIs silenciosamente errados nunca percebidos. CORREÇÃO sobre a ficha original: o cron NÃO é órfão (está em vercel.json), então o módulo não está 100% morto."},{"severidade":"alto","descricao":"Schema-drift: buildKPI e buildAG consultam a tabela 'membros' com status='ativo'. A tabela viva é mem_membros e o status de membro ativo é 'membro_ativo'. Resultado: membros_ativos sempre 0, checklist 'Membresia atualizada' sempre falso, e card de membresia da AG sempre zerado (ou 500 na AG, ver abaixo).","evidencia":"governanca.js:229 (buildKPI) e :336 (buildAG) — supabase.from('membros').eq('status','ativo'). Nenhuma migration cria tabela/view 'membros' (grep em supabase/migrations = 0); CLAUDE.md define mem_membros/'membro_ativo'; membresia.js:1936 usa 'membro_ativo'. CORREÇÃO de evidência: a ficha original citou também :240, mas a linha 240 é 'const membrosAtivos = pick(7).count' (consumo do resultado), não um from('membros'). Os from('membros') reais são SÓ 229 e 336.","recomendacao":"Trocar 'membros'→'mem_membros' e 'ativo'→'membro_ativo' nas linhas 229 e 336. Atenção: em buildKPI o erro é engolido pelo allSettled (count→0); em buildAG está em Promise.all com await direto e pode lançar e zerar todo o relatório AG (500)."},{"severidade":"baixo","descricao":"buildKPI calcula presMediaAnt dividindo a presença anterior pelo nº de cultos (Math.ceil(cultosAnt.length)), enquanto presMedia divide pelo nº de semanas do mês (semanasNoMes). Bases de comparação inconsistentes distorcem trend/trend_pct.","evidencia":"governanca.js:247 (presMedia = presAtual/semanasNoMes) vs :248 (presMediaAnt = presAnt/Math.max(1,Math.ceil(cultosAnt.length))).","recomendacao":"Usar a mesma base (semanas do mês anterior) para a tendência ser fiel."},{"severidade":"baixo","descricao":"OKR usa project_kpis como Key Results. Se Projetos não popula project_kpis como KRs estratégicos, o checklist 'Key Results cadastrados' e os totais on/at/off-track ficam vazios/enganosos — depende de uso operacional que pode não existir.","evidencia":"governanca.js:55 (select project_kpis) e :130 (checklist 'Key Results cadastrados' ok: totalKRs>0).","recomendacao":"Confirmar com o dono de Projetos se project_kpis é a fonte de KR; senão ajustar a fonte ou rotular o indicador como dependente de cadastro."},{"severidade":"baixo","descricao":"Persistência de observações depende de governance_meeting_types ter as siglas seedadas (OKR/DRE/KPI/CC/DE/AG). Se a tabela não tem o tipo, o POST retorna 404 'Tipo não encontrado' — fluxo de escrita quebra (e sem UI hoje para perceber). Ao contrário de cycle/meeting (find-or-create), o tipo NÃO é criado on-the-fly.","evidencia":"governanca.js:411-412 — busca governance_meeting_types por sigla; retorna 404 (412) se ausente. cycle (404-408) e meeting (415-419) são find-or-create; o tipo não.","recomendacao":"Garantir seed dos 6 tipos em governance_meeting_types (ou criá-los on-the-fly como já é feito para cycle/meeting)."}],"verificacao_notas":"Reabri backend/routes/governanca.js (1-477), src/api.js (440-444), backend/server.js, vercel.json e fiz greps em src/ e supabase/migrations. Confiança ALTA. Veredictos confirmados: (1) ausência de frontend — confirmada (0 rotas/menu/chamadas a api.governanca em src); (2) schema-drift 'membros' — confirmado: from('membros') existe SÓ em governanca.js:229 e :336, e nenhuma migration cria 'membros' (todo o resto do sistema usa mem_membros/'membro_ativo'); (3) base inconsistente de tendência (247 vs 248), (4) dependência de project_kpis como KR, (5) dependência de seed em governance_meeting_types — todos confirmados com linha precisa. CORREÇÕES feitas na ficha: (a) o cron de lembrete NÃO é órfão — está agendado em vercel.json:24-26 ('0 10 * * 1'), então a aba 'cron/lembrete' permanece 'viva' e o módulo NÃO está 100% morto (a aba já estava 'viva', mas a ficha hedgeava 'verificar se há cron'; agora confirmado); (b) a evidência do achado de schema-drift citava ':240' erroneamente — a linha 240 consome o resultado, não chama from('membros'); corrigido para 229 e 336; (c) registrei a diferença de comportamento do bug 'membros' entre buildKPI (engolido por allSettled→count 0) e buildAG (await em Promise.all, pode lançar 500); (d) anotei que o cliente api.governanca.relatorio(sigla) não repassa ?mes (só o backend aceita). Nenhum achado foi removido — todos têm sustentação no código. Estados das abas mantidos: KPI e AG 'sem_fonte' (membros), OKR/DRE/DE/CC 'incerta' (lógica viva, sem UI), observacoes 'legada', cron/lembrete 'viva'.","rota":"(sem rota frontend dedicada)","pageFile":"","backendRouteFile":"backend/routes/governanca.js","apiNamespace":"governanca"},{"slug":"cruzamentos","nome":"Cruzamentos de Pessoas","categoria":"Administrativo / Inteligência (dados de pessoas)","para_que_serve":"Ferramenta de consulta livre (read-only) que cruza critérios sobre a base de pessoas pra responder perguntas como \"quantos voluntários dizimam?\", \"convertidos que ainda não estão em grupo\" ou \"participou do NEXT mas não serve\". Combina os 5 valores da Jornada (Seguir, Conectar, Investir, Servir, Generosidade) com papéis no sistema (voluntário, ex-visitante, inscrito no NEXT, em grupo ativo, contribuinte 90d). Cada critério é um chip de 3 estados: indiferente / tem (✓) / não tem (✕). Devolve contagem (match de total), percentual, barra e a lista paginada de pessoas. NÃO grava nada — é só leitura/segmentação. Saída prática: copiar e-mails da lista pra ação pastoral/comunicação.","quem_usa":"Restrito a admin/diretor (role admin ou diretor). O gate é só no frontend: o componente bloqueia com \"Acesso restrito\" se profile.role não for admin/diretor (CruzamentosPessoas.jsx:68 isAdmin, 124 early-return) e o backend /jornada/cruzar exige apenas authenticate (jornada.js:31), sem authorizeModule nem checagem de role no handler /cruzar (jornada.js:215). Na prática quem usa: Marcos/Matheus e diretoria, a partir da URL /admin/cruzamentos (App.tsx:515).","entrada":["Não há lançamento de dado. O usuário só seleciona critérios (chips) na única tela — não existem abas de formulário.","Grupo 'Valores da Jornada': chips Seguir / Conectar / Investir / Servir / Generosidade (CruzamentosPessoas.jsx:36-42).","Grupo 'Papéis no sistema': chips Voluntário ativo / Já foi visitante / Inscrito no NEXT / Em grupo ativo / Contribuinte 90d (CruzamentosPessoas.jsx:47-53).","Cada clique alterna indiferente→tem→não tem (nextEstado, linhas 58-62); 'Limpar filtros' zera (limparTudo, linha 87); botão '↻ Atualizar dados' força refresh da view materializada (forcarRefresh, linha 104)."],"processamento":["AUTOMÁTICO (consulta) — POST /api/jornada/cruzar (jornada.js:215) chama a RPC SQL cruzar_pessoas(p_criterios, p_limit, p_offset) (migration 20260511100000_escala_50k_indices_views_materializadas.sql:213). A RPC monta um WHERE dinâmico (linhas 236-258) sobre a view materializada vw_pessoas_papeis_mat e devolve total_geral, total_match, percentual e a página de pessoas em UMA query (linhas 276-283 · escala 100k+). limit capado em 500 no backend (jornada.js:218).","AUTOMÁTICO (origem dos booleanos) — vw_pessoas_papeis_mat (migration:22) pré-calcula por pessoa: valor_seguir = mem_trilha_valores etapa∈(conversao,primeiro_contato,batismo) concluída (linhas 44-49); valor_conectar/in_grupo_ativo = mem_grupo_membros sem saiu_em (linhas 40,50); valor_investir = cui_jornada180 com data_encontro nos últimos 90d (linhas 51-55); valor_servir = mem_voluntarios ate IS NULL (linha 56); valor_generosidade/is_contribuinte = mem_contribuicoes nos últimos 90d (linhas 41,57-60); is_voluntario = vol_profiles (linha 34); is_visitante = int_visitantes (linha 36); is_inscrito_next = next_inscricoes (linha 38). Base = SOMENTE mem_membros com active=true (linhas 63-64).","AUTOMÁTICO (atualização) — a view é MATERIALIZADA: dados ficam congelados até um REFRESH. Cron horário do Vercel chama GET/POST /api/jornada/cron/refresh-papeis (jornada.js:28-29 → RPC refresh_vw_pessoas_papeis_mat, REFRESH CONCURRENTLY · migration:95).","MANUAL — botão '↻ Atualizar dados' chama POST /api/jornada/refresh-papeis (jornada.js:246 · jornadaApi.refreshPapeis em api.js:1974), restrito a admin/diretor no handler (jornada.js:247), pra refrescar a view depois de inserir dados em massa."],"saida":["Card de contagem: total_match de total_geral + percentual + barra de progresso (CruzamentosPessoas.jsx:228-271).","Lista paginada de pessoas (PAGE_SIZE 100 no front; RPC capa em 500 por chamada): foto/inicial, nome, e-mail, telefone, status; navegação Anterior/Próxima por offset (linhas 277-352).","Export único: 'Copiar emails' — junta os e-mails da PÁGINA atual no clipboard (não é CSV, não exporta toda a base; copiarEmails linhas 117-122).","NÃO gera KPI, relatório persistido nem alimenta nenhum dashboard — é consulta efêmera."],"integracoes":{"alimenta":["Não alimenta nenhum módulo/tabela — é estritamente leitura. O único 'efeito' é copiar e-mails pro clipboard pra uso fora do sistema."],"alimentado_por":["mem_membros (base, só active=true) — via vw_pessoas_papeis_mat","mem_trilha_valores → valor_seguir (via view)","mem_grupo_membros → valor_conectar / in_grupo_ativo (via view)","cui_jornada180 → valor_investir (via view)","mem_voluntarios → valor_servir (via view)","mem_contribuicoes → valor_generosidade / is_contribuinte (via view)","vol_profiles → is_voluntario; int_visitantes → is_visitante; next_inscricoes → is_inscrito_next (via view)","Atualização via RPC refresh_vw_pessoas_papeis_mat (cron horário + botão manual)"]},"abas":[{"nome":"(página única — sem abas)","funcao":"O módulo é uma só tela. Não há Tabs nem estado de tab no componente; o padrão de UI são dois GRUPOS de chips. Modelo os 'grupos' como seções pra auditoria.","passo_a_passo":["Abrir /admin/cruzamentos (admin/diretor)","Clicar nos chips até o estado desejado (tem/não tem)","Ler contagem/percentual; abrir 'Ver lista'","Opcional: 'Copiar emails' ou '↻ Atualizar dados'"],"estado":"viva","evidencia":"CruzamentosPessoas.jsx:66-74 (sem Tabs/useState de tab); render único linhas 132-356","recomendacao":"Manter. Se um dia virar multi-aba, extrair os grupos de CRITERIOS."},{"nome":"Grupo · Valores da Jornada","funcao":"Filtra por Seguir/Conectar/Investir/Servir/Generosidade, calculados pelos booleanos da view.","passo_a_passo":["Clicar no chip do valor (ex.: Servir ✓)","Combinar com outro (ex.: Generosidade ✓)","Ver match e lista"],"estado":"viva","evidencia":"CruzamentosPessoas.jsx:36-42; colunas valor_* em migration 20260511100000:44-60","recomendacao":"Funciona, mas ver achado sobre 'Seguir' incompleto e base só-membros-ativos."},{"nome":"Grupo · Papéis no sistema","funcao":"Filtra por papel binário (voluntário, ex-visitante, inscrito NEXT, em grupo ativo, contribuinte 90d).","passo_a_passo":["Clicar no chip do papel","Combinar com valores da Jornada","Ver match e copiar e-mails"],"estado":"viva","evidencia":"CruzamentosPessoas.jsx:47-53; colunas is_voluntario/is_visitante/is_inscrito_next/in_grupo_ativo/is_contribuinte em migration:34-41. Reclassificado de 'redundante' para 'viva': 3 dos 5 chips (Voluntário/Visitante/NEXT) são papéis DISTINTOS sem equivalente no grupo Valores; só 2 são duplicados.","recomendacao":"Manter. Apenas 'Em grupo ativo' (= Conectar, mesma subquery mem_grupo_membros) e 'Contribuinte 90d' (= Generosidade, mesma subquery mem_contribuicoes) são redundantes — a própria UI admite (linhas 51-52). Marcar como atalho do mesmo set ou remover esses 2 pra evitar confusão; os outros 3 são únicos e devem ficar."}],"achados_auditoria":[{"severidade":"alto","descricao":"O critério 'Seguir a Jesus' (valor_seguir) na view materializada SÓ olha mem_trilha_valores. Mas a própria documentação do endpoint diz que Seguir deveria considerar também cui_convertidos e batismo_inscricoes (jornada.js:35). Convertido que está em cui_convertidos/batismo mas sem etapa concluída em mem_trilha_valores aparece como 'não Seguir' → subcontagem do filtro. Pior: a base da view é SOMENTE mem_membros com active=true, então convertidos que entraram só por cultos_decisoes_pessoas/cui_convertidos e nunca viraram mem_membros ativo ficam invisíveis no cruzamento — mesma doença do NSM≈0/duplicatas.","evidencia":"migration 20260511100000:44-49 (valor_seguir só trilha) e :63-64 (WHERE m.active=true); contraste com docstring jornada.js:35","recomendacao":"Alinhar valor_seguir à definição canônica de convertido (incluir cui_convertidos/batismo_inscricoes) e revisar se a base deve ser mem_membros ativo ou a pessoa canônica unificada. Documentar a limitação na UI enquanto não unificado."},{"severidade":"medio","descricao":"Dado potencialmente DESATUALIZADO sem nenhum aviso de quão velho. A view é materializada e só atualiza no cron horário ou no botão manual. Entre refreshes, contagens e listas refletem o estado da última hora. A view TEM a coluna atualizado_em (migration:62), mas a RPC cruzar_pessoas NEM A SELECIONA (só id/nome/email/telefone/status/foto_url, migration:270-271), então o frontend nunca recebe o timestamp — e a UI não o exibe. O usuário não tem como saber se precisa apertar '↻ Atualizar dados'.","evidencia":"RPC seleciona só 6 colunas sem atualizado_em (migration:270-271); REFRESH só via cron/botão (jornada.js:28-29,246); UI sem referência a atualizado_em (CruzamentosPessoas.jsx)","recomendacao":"Incluir atualizado_em no SELECT da RPC e exibir 'dados de HH:MM' no header da tela."},{"severidade":"baixo","descricao":"'Copiar emails' só copia a PÁGINA atual (100), não o conjunto inteiro do match; e não há export CSV. O toast diz 'N emails copiados' contando os e-mails não-vazios da página, o que pode dar impressão de que copiou todos do match.","evidencia":"copiarEmails usa resultado.membros (página corrente) — CruzamentosPessoas.jsx:117-122; PAGE_SIZE=100 (linha 64)","recomendacao":"Oferecer 'copiar todos os e-mails do match' (buscar todas as páginas) ou export CSV, deixando explícito que o botão atual é só da página."},{"severidade":"baixo","descricao":"Rota /admin/cruzamentos não tem ModuleGuard no App.tsx (só Suspense); o controle de acesso é só client-side (isAdmin no componente) e o endpoint /jornada/cruzar exige apenas authenticate, sem authorizeModule nem checagem de role no handler. Embora a tela bloqueie a renderização, a API responderia a QUALQUER usuário autenticado que chamasse POST /jornada/cruzar diretamente — exposição de PII de pessoas em lote (nome/e-mail/telefone/status). Note que o endpoint vizinho /refresh-papeis JÁ valida role no handler (jornada.js:247), evidenciando a inconsistência: o /cruzar, que devolve os dados, não valida.","evidencia":"App.tsx:515 sem ModuleGuard; jornada.js:31 router.use(authenticate) sem authorizeModule; handler /cruzar (jornada.js:215-241) sem checagem de role, ao contrário de /refresh-papeis (jornada.js:247)","recomendacao":"Aplicar checagem de role admin/diretor (como já há em /refresh-papeis) ou authorizeModule no handler /cruzar, já que retorna PII em lote."},{"severidade":"baixo","descricao":"Dois dos cinco chips do grupo 'Papéis no sistema' são funcionalmente redundantes com 'Valores da Jornada': 'Em grupo ativo' (in_grupo_ativo) = 'Conectar' (valor_conectar) — leem a MESMA subquery mem_grupo_membros sem saída; e 'Contribuinte (90d)' (is_contribuinte) = 'Generosidade' (valor_generosidade) — mesma subquery mem_contribuicoes 90d. A própria UI admite isso no texto de info dos chips. Os outros 3 chips (Voluntário/Visitante/NEXT) NÃO são redundantes.","evidencia":"migration 20260511100000:40 (in_grupo_ativo) vs :50 (valor_conectar) — subquery idêntica; :41 (is_contribuinte) vs :57-60 (valor_generosidade) — idêntica; UI info em CruzamentosPessoas.jsx:51-52","recomendacao":"Remover os 2 duplicados ou marcá-los como atalho do mesmo set, evitando que o usuário ache que são filtros distintos."}],"verificacao_notas":"Reabri CruzamentosPessoas.jsx, jornada.js, api.js e a migration real (20260511100000_escala_50k_indices_views_materializadas.sql). Confiança ALTA. Todos os 5 achados se sustentam com evidência precisa — nenhum removido. Correções/refinamentos: (1) o achado 'médio' (dado desatualizado) ficou MAIS forte: a RPC cruzar_pessoas nem seleciona atualizado_em (migration:270-271), então não é só 'a UI não mostra' — o dado nunca chega ao front. (2) o achado 'baixo' de auth ganhou evidência adicional: o endpoint vizinho /refresh-papeis JÁ valida role no handler (jornada.js:247) enquanto o /cruzar (que devolve PII) não — inconsistência clara. (3) Linhas dos chips corrigidas (estavam 32-43/44-55 na ficha original; reais 36-42/47-53). (4) RECLASSIFIQUEI a aba 'Grupo · Papéis no sistema' de 'redundante' para 'viva': só 2 dos 5 chips são duplicados (grupo_ativo, contribuinte); os outros 3 (Voluntário/Visitante/NEXT) são papéis distintos sem equivalente — marcar o grupo inteiro como redundante era impreciso. A redundância dos 2 chips permanece registrada como achado baixo separado. Entrada/processamento/saída/integrações conferem com o código (limit capado em 500 na RPC e 100 de PAGE_SIZE no front; base só active=true confirmada na migration:64).","rota":"/admin/cruzamentos","pageFile":"src/pages/admin/CruzamentosPessoas.jsx","backendRouteFile":"backend/routes/jornada.js","apiNamespace":"jornada"},{"slug":"solicitacoes-responsaveis","nome":"Responsáveis por Solicitação","categoria":"Administração · Solicitações","para_que_serve":"Tela de configuração que define QUEM é responsável por cada área atendedora de Solicitações. Quem for cadastrado como responsável de uma área (1) recebe notificação direta de toda nova solicitação daquela área via extraTargetIds e (2) passa a ver, no Kanban/lista de Solicitações, todas as solicitações da sua área — mesmo sem ter nível de permissão no módulo (a fila \"Para Atender\" é liberada por estar em area_solicitacoes_responsaveis, não pela matriz). É o ponto único que governa o roteamento da fila de atendimento de Solicitações por pessoa: além da visibilidade, se a área tiver exatamente 1 responsável a solicitação é auto-atribuída a ele.","quem_usa":"Admin (Marcos/Matheus) e diretores (role 'diretor'). O backend PUT /area-responsaveis revalida role admin/diretor in-handler e recusa os demais com 403. É tela de governança por ROLE (não pela matriz de módulos), não de operação diária.","entrada":["Tela única (sem abas): grade com um card por área. Em cada card, o admin adiciona/remove pessoas via picker com busca por nome/email (PessoaPicker).","A lista de pessoas selecionáveis vem de permissoes.colaboradores() — só colaboradores reais (exclui quem veio do formulário de membresia/voluntariado).","Edição é local (editMap); nada é gravado até clicar 'Salvar todas' na barra sticky que aparece quando há áreas modificadas (isDirty). 'Descartar' reverte o editMap ao estado original."],"processamento":["MANUAL: o admin escolhe as pessoas por área e salva. salvarTudo() itera SÓ as áreas modificadas (dirtyAreas) e chama solicitacoes.areaResponsaveis.save(area, profile_ids) uma vez por área (SolicitacoesResponsaveis.jsx:249-251), contando saved/failed.","AUTOMÁTICO (backend) PUT /solicitacoes/area-responsaveis (solicitacoes.js:854-888): valida role admin/diretor, apaga TODOS os vínculos da área (DELETE eq area) e reinsere o array novo em area_solicitacoes_responsaveis com criado_por=userId — substituição total, não incremental (864-881).","AUTOMÁTICO (consumo ao criar) POST /solicitacoes (solicitacoes.js:439-453): se a área (finalAreaResp) tem EXATAMENTE 1 responsável, faz UPDATE solicitacoes.responsavel_id; se 0 ou >1, deixa nulo (qualquer um da fila pega).","AUTOMÁTICO (notificação) notificar(...) com extraTargetIds = responsaveisDaArea (solicitacoes.js:459-468): além das regras do módulo, sempre notifica os responsáveis cadastrados da área.","AUTOMÁTICO (visibilidade da fila) GET /solicitacoes (solicitacoes.js:127-137) e GET /meu-papel (271-284): consultam area_solicitacoes_responsaveis por profile_id pra liberar a fila 'Para Atender' (atende = areas.length>0) e o filtro .or(area_responsavel.in(...)).","AUTOMÁTICO (autorização) PATCH de gestão (solicitacoes.js:694-704) e POST /:id/vincular-ml (916-925): checam se o usuário está em area_solicitacoes_responsaveis da área antes de permitir gerir/vincular a solicitação."],"saida":["Telas: a própria grade de áreas com contagem de responsáveis por card e indicador de mudança não salva. Não gera relatório/KPI/export próprio.","Saída efetiva é COMPORTAMENTAL e vive em OUTRO módulo (/solicitacoes): habilita a fila 'Para Atender', auto-atribui responsavel_id quando há 1 responsável, dispara notificações e libera a gestão (PATCH/vincular-ML) das solicitações da área."],"integracoes":{"alimenta":["Módulo Solicitações (tabela solicitacoes) — via auto-atribuição de responsavel_id quando há exatamente 1 responsável (POST /solicitacoes:447-452)","Sistema de Notificações — via extraTargetIds em notificar() (POST /solicitacoes:467)","Fila/Kanban de Solicitações — via filtro de visibilidade em GET /solicitacoes (127-137) e flag atende em GET /meu-papel (271-284)","Autorização de gestão de solicitação — PATCH (694-704) e POST /:id/vincular-ml (916-925) checam area_solicitacoes_responsaveis"],"alimentado_por":["permissoes.colaboradores() (GET /api/permissoes/colaboradores) — fornece a lista de pessoas selecionáveis (colaboradores ativos, exclui membros/voluntários)","Tabela area_solicitacoes_responsaveis (id, area, profile_id, criado_por, criado_em) — fonte de verdade lida pelo GET /area-responsaveis","Constante AREAS no frontend (SolicitacoesResponsaveis.jsx:160-171) — define as 10 áreas/cores exibidas (NÃO vem do banco; lista fixa e divergente de CATEGORIA_TO_AREA_RESP)"]},"abas":[{"nome":"(tela única — sem abas)","funcao":"Configurar responsáveis por área de solicitação numa grade de cards (um por área), com edição local e botão 'Salvar todas'.","passo_a_passo":["Abrir /admin/solicitacoes-responsaveis","No card da área, abrir o picker e buscar a pessoa por nome/email","Adicionar/remover pessoas (estado local marca a área como modificada com a bolinha verde)","Clicar 'Salvar todas' na barra sticky para persistir só as áreas alteradas (ou 'Descartar')"],"estado":"viva","evidencia":"SolicitacoesResponsaveis.jsx:344-430 (grade), 244-265 (salvarTudo); backend GET/PUT em solicitacoes.js:826-888 — fluxo completo e funcional"}],"achados_auditoria":[{"severidade":"alto","descricao":"GET /area-responsaveis pode quebrar (500): o enriquecimento de perfil seleciona 'nome_completo' da tabela profiles (solicitacoes.js:839), mas profiles NÃO tem essa coluna — todo o resto do código lê profiles com 'name' (auth.js:16, marketing.js:110, grupos.js:1793, etc). A coluna 'nome_completo' existe em outra tabela, 'cargos' (migration 20260518200000:28-30). Como o código faz 'if (error) throw error', um erro de coluna inexistente do PostgREST derruba o GET inteiro e a tela carrega com toast de erro / vazia.","evidencia":"solicitacoes.js:837-840 select('id, nome_completo, email') from profiles; contra-prova: auth.js:16 e marketing.js:110 selecionam 'name'; 20260518200000_permissoes_matriz_reuniao_marcos.sql:28-30 mostra nome_completo em cargos, não em profiles","recomendacao":"Trocar 'nome_completo' por 'name' no select da linha 839, OU remover o enrichment inteiro (ver achado abaixo — é código morto e a causa deste 500)."},{"severidade":"baixo","descricao":"Enriquecimento 'profile' do GET é código morto: o backend monta r.profile (solicitacoes.js:844-847), mas o frontend nunca lê r.profile — em load() só usa r.area e r.profile_id (SolicitacoesResponsaveis.jsx:189-192) e resolve nome/email via profileById, montado de permissoes.colaboradores() (226, 405-406).","evidencia":"SolicitacoesResponsaveis.jsx:189-192 (load só lê r.area/r.profile_id) e 226 (profileById = colaboradores), 405-406 (render usa p?.name/p?.email do profileById); backend solicitacoes.js:834-847 monta profile nunca consumido","recomendacao":"Remover o bloco de enriquecimento de profile do GET (linhas 834-847) — além de morto, é a causa do achado alto. Devolver só os vínculos crus."},{"severidade":"medio","descricao":"Áreas hardcoded no frontend DIVERGEM das áreas reais do roteamento (não é só risco hipotético — já está divergente). A constante AREAS (10 itens fixos) inclui cozinha, limpeza e logistica_estoque, mas NÃO inclui 'producao' — que É um destino de roteamento ativo em CATEGORIA_TO_AREA_RESP (categoria 'producao' → area 'producao'). Logo, responsáveis da área Produção não podem ser cadastrados por esta tela. Inversamente, vínculos salvos em áreas fora da lista (área órfã no banco) não aparecem, pois load() só semeia o editMap para as AREAS conhecidas.","evidencia":"SolicitacoesResponsaveis.jsx:160-171 (lista fixa de 10, sem 'producao') vs solicitacoes.js:58-71 CATEGORIA_TO_AREA_RESP que roteia categoria 'producao'→area 'producao'; load() SolicitacoesResponsaveis.jsx:188-192 só popula áreas conhecidas","recomendacao":"Derivar a lista de áreas de uma fonte única compartilhada com o backend (sla_definicoes / CATEGORIA_TO_AREA_RESP — incluir 'producao'), ou ao menos exibir vínculos de áreas desconhecidas como aviso."},{"severidade":"baixo","descricao":"PUT não é transacional nem atômico: apaga todos os vínculos da área (DELETE eq area) e só depois insere o array novo; se o INSERT falhar após o DELETE, a área fica sem responsável até nova tentativa. Além disso o save é feito área por área em loop no frontend, sem rollback agregado (conta saved/failed e segue).","evidencia":"solicitacoes.js:864-881 (delete depois insert, sem transação/RPC); SolicitacoesResponsaveis.jsx:249-257 (loop por área tolerando falhas parciais)","recomendacao":"Encapsular delete+insert numa RPC/transação; ou tolerar via diff/UPSERT em vez de delete-all."},{"severidade":"baixo","descricao":"Autorização por ROLE, não pela matriz de módulos: o middleware do arquivo roda authenticate, e o PUT revalida role admin/diretor in-handler (correto). A tela é alcançável por qualquer admin/diretor sem checagem de módulo específica — coerente com o design ('independente das outras permissões'). Vale só documentar que o controle é por ROLE.","evidencia":"solicitacoes.js:855-857 (check de role no handler do PUT)","recomendacao":"Sem ação necessária; manter documentado que o acesso é por role admin/diretor."}],"verificacao_notas":"Reabri os 3 arquivos reais e validei cada veredito. (1) Achado ALTO confirmado e reforçado com contra-prova: solicitacoes.js:839 seleciona 'nome_completo' de profiles; todo o resto do código (auth.js:16, marketing.js:110, grupos.js:1793, lgpd.js:54) usa 'name', e a única migration com 'nome_completo' (20260518200000) adiciona a coluna em 'cargos', não em 'profiles' → GET 500 confirmado. (2) Código morto do enrichment confirmado: frontend só usa r.area/r.profile_id (linhas 189-192) e profileById vem de colaboradores (226) — mantido como baixo. (3) Achado MÉDIO confirmado e ELEVADO de hipótese para fato concreto: a lista AREAS (10 itens) não tem 'producao', que é destino ativo em CATEGORIA_TO_AREA_RESP (solicitacoes.js:58-71) → responsáveis de Produção não configuráveis aqui; corrigi a evidência. (4) PUT delete-then-insert sem transação confirmado (864-881) + loop por área no frontend (249-257). (5) Autorização por role confirmada (855-857). Nenhum achado foi removido; todos sustentados por código. Entrada/processamento/saída/integrações batem com o código (refinei os números de linha e adicionei o detalhe do auto-atribui só-com-1-responsável e a divergência da lista AREAS). A única aba está corretamente classificada como 'viva'. Confiança: ALTA.","rota":"/admin/solicitacoes-responsaveis","pageFile":"src/pages/admin/SolicitacoesResponsaveis.jsx","backendRouteFile":"backend/routes/solicitacoes.js","apiNamespace":"solicitacoes"},{"slug":"notificacao-regras","nome":"Regras de Notificação","categoria":"Dados / IA / Admin","para_que_serve":"Tela administrativa única (sem abas) que define QUEM recebe as notificações in-app (sino) e push (PWA) de cada módulo do ERP. Para cada par módulo+pessoa cria-se uma \"regra\" em notificacao_regras (ativo=true). Se um módulo não tem nenhuma regra ativa, o fallback do backend manda a notificação daquele módulo para TODOS os usuários com role admin ou diretor (backend/services/notificar.js:9-25). A tela NÃO gera notificações nem decide o conteúdo/gatilho — só roteia destinatários.","quem_usa":"Administradores e diretores (role admin/diretor). Os 3 endpoints de regras são gated por authorize('admin','diretor') (backend/routes/notificacoes.js:132,146,162). Na prática Marcos/Matheus (admins) e os diretores configuram quem da equipe recebe o quê.","entrada":["Seleciona um módulo no dropdown 'Selecione módulo...' (lista FIXA de 21 itens em MODULOS, NotificacaoRegras.jsx:10-32)","Seleciona um usuário no dropdown 'Selecione usuário...' (carregado de profiles via supabaseClient/anon key direto no front, NotificacaoRegras.jsx:50-56 e :91-95)","Clica '+ Adicionar Regra' → notificacoes.regras.create → POST /notificacoes/regras (upsert por modulo,profile_id · NotificacaoRegras.jsx:60-67)","Para revogar: clica 'Remover' no card do módulo → notificacoes.regras.remove → DELETE /notificacoes/regras/:id (NotificacaoRegras.jsx:69-71)"],"processamento":["MANUAL (config): o admin cria/remove regras na tela. Backend: POST /notificacoes/regras faz upsert em notificacao_regras com ativo:true, onConflict 'modulo,profile_id' (notificacoes.js:146-159); DELETE remove a regra por id (notificacoes.js:162-173).","AUTOMÁTICO (consumo das regras): toda chamada a notificar() sem targetIds passa por resolverDestinatarios(modulo), que lê notificacao_regras WHERE modulo=? AND ativo=true; se não houver regra ativa, faz fallback para profiles role IN (admin,diretor) (notificar.js:9-25). Nota: targetIds explícito ignora as regras (notificar.js:32).","AUTOMÁTICO (geração periódica): cron GET /notificacoes/cron (Bearer CRON_SECRET, comparação timing-safe, notificacoes.js:7-25) chama gerarTodasNotificacoes() em notificacaoGenerator.js, que roda os geradores (RH, Financeiro, Logística, Patrimônio, Membresia, KPIs, Cuidados, JornadaConvertidos, Grupos, Solicitações/administrativo, Marketing, Online).","AUTOMÁTICO (geração imediata/event-driven): chamadas diretas a notificar({modulo:...}) espalhadas pelos módulos (events, integracao, grupos, membresia, marketing, producao, nps, publicBatismo, wifiSync, voluntariado, governanca, planejamento, apresentacoes, solicitacoes, agents/apply/*, etc).","AUTOMÁTICO (push): notificar() dispara enviarPushParaUsers em background para os usuários efetivamente inseridos (no-op se VAPID não configurado, notificar.js:80-88)."],"saida":["Grid de cards (1 por módulo da lista MODULOS) mostrando as pessoas que recebem cada módulo, ou o texto 'Nenhuma regra — todos admin/diretor recebem' (NotificacaoRegras.jsx:100-126).","Efeito a jusante: linhas em notificacoes (sino no topbar) e push PWA para os destinatários resolvidos.","Não há relatório, KPI ou export nesta tela."],"integracoes":{"alimenta":["Tabela notificacao_regras (via POST/DELETE /notificacoes/regras)","Consumida por bac o (:387), membresia (:437, membresia.js:1993), kpis (:472, gestao.js:268), cuidados (cuidados.js:123,393,426), next (membresia.js:1204, publicNext.js:165), voluntariado (voluntariado.js:2278), grupos (grupos.js:799+, publicGrupos.js:309), integracao (integracao.js:457, membresia.js:1347), batismos (publicBatismo.js:182), nps (nps.js:159,337), marketing (marketing.js:342+), producao (producao.js:246), wifi (wifiSync.js:135), eventos (events.js:161), projetos (tasks.js:183)."},{"nome":"Card de módulo · 'piloto'","funcao":"Deveria rotear o 'Relatório diário do agente · feedback dos testadores + erros capturados'.","passo_a_passo":["Selecionar 'Piloto (testes)'","Adicionar destinatário"],"estado":"sem_fonte","evidencia":"NotificacaoRegras.jsx:11 declara o módulo, mas NENHUM notificar({modulo:'piloto'}) existe no backend (grep do regex modulo:'piloto'|'generosidade'|'processos' = No matches found). Card sempre exibirá 'Nenhuma regra' sem efeito prático."},{"nome":"Card de módulo · 'generosidade'","funcao":"Deveria rotear 'Indicações de dízimo/oferta via NEXT'.","passo_a_passo":["Selecionar 'Generosidade'","Adicionar destinatário"],"estado":"sem_fonte","evidencia":"NotificacaoRegras.jsx:24 declara o módulo, mas não há notificar({modulo:'generosidade'}) (grep vazio). As indicações de dízimo/oferta do NEXT saem como modulo:'next' (membresia.js:1204) — o card nunca recebe nada."},{"nome":"Card de módulo · 'processos'","funcao":"Deveria rotear 'Novos processos, OKRs e acompanhamento de indicadores'.","passo_a_passo":["Selecionar 'Processos'","Adicionar destinatário"],"estado":"legada","evidencia":"NotificacaoRegras.jsx:27. O módulo /processos foi descontinuado (CLAUDE.md: 'Processos removido… redireciona pra /eventos'). Nenhum notificar({modulo:'processos'}) (grep vazio). Resíduo de redesenho."},{"nome":"Módulos AUSENTES da tela (disparam, mas não têm card)","funcao":"Vários módulos disparam notificações com slugs que NÃO existem na lista MODULOS, então não podem ser configur ate({ membro_id }) sem tratar { error }","recomendacao":"Trocar .ilike por igualdade normalizada (lower) e/ou escapar o valor; logar a falha do update de membro_id."},{"severidade":"baixo","descricao":"DevocionalLogin faz navigate('/devocional/hoje') durante o render (efeito colateral no corpo do componente) quando user existe, em vez de em useEffect ou \u003cNavigate>.","evidencia":"DevocionalLogin.tsx:27-30 if (user) { navigate('/devocional/hoje', { replace: true }); return null; }","recomendacao":"Mover o redirect para useEffect ou usar \u003cNavigate replace> para evitar navegação durante render."}],"verificacao_notas":"Verificação adversarial contra os arquivos vivos (devocionalMembro.js, DevocionalLogin.tsx, DevocionalHoje.tsx, DevocionalHistorico via grep, src/api.js, kpiAutoCollector.js, jornada.js). TODAS as 3 abas confirmadas VIVAS — endpoints reais existem em api.js (devocionalMembro.{hoje,checkIn,historico} linhas 2012-2016; publicDevocional.login linha 2020). TODOS os 4 achados SUSTENTADOS com evidência precisa: (1) medio confirmado — jornada.js não tem nenhuma ref a devocional, 'investir' vem só de cui_jornada180.data_encontro 90d; (2-4) baixos confirmados linha a linha. Correções de precisão na ficha: os arquivos de front são .tsx (não .jsx); refinei números de linha (coletor KPI 380-390; jornada investir 67-72/124/167; login redirect 27-30; checkIn 93-147); removi da 'saida' as menções a vw_devocional_adesao_* e GET /devocional-planos/metricas-cuidados porque NÃO foram confirmadas neste escopo (pertencem ao módulo Cuidados); ajustei entrada/processamento pra refletir o filtro real .eq('active', true) e os nomes de coluna reais (data_devocional, observacoes, devocional_item_id). Nível de confiança ALTO: todo veredito tem âncora arquivo:linha verificada.","rota":"/devocional","pageFile":"src/pages/devocional/DevocionalLogin.jsx","backendRouteFile":"backend/routes/devocionalMembro.js","apiNamespace":"devocionalMembro"}],"mapa":{"espinha":"A coluna vertebral do ERP CBRio é a JORNADA DO CONVERTIDO rumo ao NSM (\"novo convertido engajado em ≥1 valor em até 60 dias\"). O fluxo nasce no CULTO (Integração lança frequência/decisões no modal de culto → tabela cultos + cultos_decisoes_pessoas), que por triggers cria mem_membros (visitante), mem_trilha_valores etapa 'conversao' e nsm_eventos (Kids fica de fora por design). A DECISÃO vira CONVERTIDO em Cuidados (cui_convertidos), onde o encontro pastoral e o desfecho geram ENCAMINHAMENTOS (jornada_encaminhamentos) para três caixas de entrada: Grupos, Voluntariado e a própria Jornada 180. O funil de pós-decisão também passa por Next (matrículas/turmas) e por Next-Batismo/Entradas (a vitrine de triagem do Kevyn que resolve duplicatas e liga pessoa a vínculo), culminando em MEMBRESIA — a tabela canônica mem_membros que Painel/NSM, Grupos, Voluntariado e Next-Batismo leem por membro_id. O PAINEL CBRIO e o MONITORAMENTO OKR são os terminais read-only que medem essa jornada (NSM, mandalas, matriz Valor×Área). Em paralelo correm os TRILHOS ADMINISTRATIVOS que não tocam a jornada mas a sustentam: SOLICITAÇÕES (intake hierárquico → fila por área → KPIs ADM-*-G/Q de SLA e NPS interno, que alimentam as matrizes Gestão×Área e Criativo×Área do Painel); PRODUÇÃO de culto (cronograma por etapas, KPIs PROD-CULTO-* isolados do NSM por desenho); FINANCEIRO (ledger único fin_transacoes → DRE + Generosidade, que alimenta o valor Generosidade do NSM); RH (quadro, folha, organograma → cobertura de licença que mexe em permissões); e o CÉREBRO CBRio, que sincroniza quase todos os módulos (membro, evento, projeto, contribuição, voluntário, acompanhamento) para o vault Obsidian no SharePoint. Atravessando tudo: o sistema de PERMISSÕES (cargo×módulo + boost por área) governa visibilidade/acesso, e as NOTIFICAÇÕES (notificar + notificacaoGenerator) entregam os alertas de cada módulo ao sino in-app.","arestas":[{"de":"integracao","para":"membresia","via":"cultos_decisoes_pessoas → trigger cria mem_membros (status visitante)"},{"de":"integracao","para":"painel-cbrio","via":"cultos/vw_culto_stats → cultos_recalc_kpis → KPIs SED/BRG/ONL/KIDS/AMI + NSM"},{"de":"integracao","para":"cuidados","via":"decisão/conversão vira cui_convertidos"},{"de":"integracao","para":"membresia","via":"mem_trilha_valores etapa 'conversao'/'batismo' (jornada Seguir)"},{"de":"integracao","para":"online","via":"frequência/decisões online lançadas no modal de culto preenchem cultos.online_*"},{"de":"cuidados","para":"grupos","via":"jornada_encaminhamentos destino='grupos' (caixa Encaminhados)"},{"de":"cuidados","para":"voluntariado","via":"jornada_encaminhamentos destino='voluntarios' (caixa Encaminhados)"},{"de":"cuidados","para":"cuidados","via":"jornada_encaminhamentos destino='jornada180' (caixa própria)"},{"de":"cuidados","para":"dados-brutos","via":"POST /agregado → dados_brutos (aconselhamento/capelania/devocional/jornada180/convertidos atendidos)"},{"de":"cuidados","para":"membresia","via":"POST /criar-membro cria mem_membros status visitante"},{"de":"cuidados","para":"cerebro","via":"enqueueSync('acompanhamento')"},{"de":"cuidados","para":"integracao","via":"GET /jornada-convertidos alimenta a aba Next e a cobertura de batismo"},{"de":"cuidados","para":"kids","via":"jornada-convertidos area='kids' (aba Novos convertidos, tende vazia por design)"},{"de":"grupos","para":"painel-cbrio","via":"mem_grupo_membros (participação ativa) → KPI/NSM valor Conectar"},{"de":"grupos","para":"whatsapp-admin","via":"sync de whatsapp_lideres + estudo_semana enviado aos líderes"},{"de":"grupos","para":"cerebro","via":"materiais (cerebro_fila → SharePoint)"},{"de":"voluntariado","para":"membresia","via":"findOrCreateMembro em POST /profiles e /me/register-member; quer_servir=true"},{"de":"voluntariado","para":"painel-cbrio","via":"vol_check_ins/vol_team_members/mem_voluntarios + RPC kpi_servir_comunidade → NSM valor Servir"},{"de":"voluntariado","para":"cerebro","via":"enqueueSync('voluntario')"},{"de":"voluntariado","para":"membresia","via":"vol_profiles/vol_team_members/vol_check_ins exibidos no detalhe do membro (aba Serviço)"},{"de":"next","para":"membresia","via":"findOrCreateMembro no insert da inscrição (membro_id, status visitante)"},{"de":"next","para":"integracao","via":"next_indicacoes/next_inscricoes → notificações e cobertura Next/batismo"},{"de":"next","para":"voluntariado","via":"next_indicacoes tipo='servir' → KPI voluntariado.interessados_integrados"},{"de":"next","para":"painel-cbrio","via":"KPIs NEXT-01/02/03 (batismos/voluntarios/dizimo)"},{"de":"next","para":"grupos","via":"next_inscricao_id em jornada_encaminhamentos (Fase 2 do funil)"},{"de":"next","para":"cuidados","via":"sync de devolutiva terminal volta para next_indicacoes/next_matriculas"},{"de":"membresia","para":"painel-cbrio","via":"mem_membros é a tabela canônica lida por NSM/Painel/Grupos/Voluntariado/Next-Batismo (membro_id)"},{"de":"membresia","para":"cerebro","via":"enqueueSync('membro') e enqueueSync('contribuicao-mes')"},{"de":"membresia","para":"next","via":"totem inscreve em next_inscricoes"},{"de":"membresia","para":"integracao","via":"totem agenda apresentacao_bebes + notifica módulo integracao"},{"de":"membresia","para":"financeiro","via":"mem_contribuicoes alimentam Generosidade/KPIs"},{"de":"totem-membro","para":"membresia","via":"PUT /totem/membros/:id (cadastro + foto)"},{"de":"totem-membro","para":"grupos","via":"POST /totem/grupos/:id/entrar (mem_grupo_membros)"},{"de":"totem-membro","para":"next","via":"POST /totem/next/inscrever (next_inscricoes)"},{"de":"totem-membro","para":"integracao","via":"batismo (batismo_inscricoes origem totem) + apresentacao_bebes"},{"de":"totem-kids","para":"integracao","via":"trigger consolida cultos.presencial_kids/decisoes_kids ao encerrar sessão"},{"de":"totem-kids","para":"integracao","via":"trigger cria cultos_decisoes_pessoas tipo='kids'"},{"de":"totem-kids","para":"painel-cbrio","via":"cultos.kids_freq → KPI KID-01"},{"de":"totem-kids","para":"membresia","via":"cria mem_membros (visitante) + mem_familias no check-in/importação"},{"de":"online","para":"monitoramento-okr","via":"online_engajamento (retenção/compartilhamento/cliques)"},{"de":"online","para":"painel-cbrio","via":"cultos.online_* (pico/DS/DDUS) → KPIs ONL-*"},{"de":"online","para":"integracao","via":"backfillCultoVideoIds liga youtube_video_id ao culto"},{"de":"solicitacoes","para":"painel-cbrio","via":"vw_solicitacoes_sla + nps_nota → KPIs ADM-*-G/ADM-*-Q (matrizes Gestão/Criativo)"},{"de":"solicitacoes","para":"marketing","via":"categoria=marketing aprovada → trigger cria marketing_campanhas (triagem)"},{"de":"solicitacoes","para":"financeiro","via":"reembolso/pagamento/compras aprovados caem na fila financeira (Yago)"},{"de":"solicitacoes","para":"notificacao-regras","via":"notificar() resolve destinatários por módulo"},{"de":"solicitacoes-responsaveis","para":"solicitacoes","via":"area_solicitacoes_responsaveis define fila, auto-atribuição e autorização"},{"de":"financeiro","para":"painel-cbrio","via":"vw_doacoes_mensal/unificada → coletor KPI generosidade (NSM)"},{"de":"financeiro","para":"solicitacoes","via":"consome fila de aprovação financeira (pendentes-financeiro/aprovar/reprovar)"},{"de":"rh","para":"permissoes-admin","via":"cobertura de licença gera overrides em permissoes_modulo (expira_em)"},{"de":"rh","para":"cerebro","via":"enqueueSync('funcionario')"},{"de":"rh","para":"painel-cbrio","via":"rh_funcionarios fornece nome/cargo do líder dos KPIs"},{"de":"rh","para":"governanca","via":"rh_funcionarios alimenta cards de quadro nas reuniões"},{"de":"permissoes-admin","para":"rh","via":"backend de permissões reusado na aba Acessos/ficha do funcionário"},{"de":"eventos","para":"marketing","via":"cycle_phase_tasks area='marketing' → trigger materializa cards origem='evento'"},{"de":"eventos","para":"cerebro","via":"enqueueSync('evento')"},{"de":"eventos","para":"planejamento","via":"events/cycle_phase_tasks lidos no Kanban/Gantt do Planejamento"},{"de":"marketing","para":"solicitacoes","via":"PATCH status='concluido' ao aprovar campanha → aciona NPS e fecha o ciclo"},{"de":"marketing","para":"painel-cbrio","via":"KPIs MKT-* + ADM-C-*-PRODUCAO/MARKETING"},{"de":"marketing","para":"cerebro","via":"entregáveis para SharePoint biblioteca Criativo (Microsoft Graph)"},{"de":"producao","para":"painel-cbrio","via":"culto_producao* → KPIs PROD-CULTO-* (fora do NSM por desenho)"},{"de":"producao","para":"solicitacoes","via":"aba Solicitações lê fila area_responsavel='producao'"},{"de":"nps","para":"dados-brutos","via":"sincronizarKpi → dados_brutos (nps_geral/next/lideres/voluntarios/culto)"},{"de":"nps","para":"painel-cbrio","via":"KPIs de satisfação + CULTO-NPS-* nos PainelArea"},{"de":"dados-brutos","para":"painel-cbrio","via":"trigger recalcula kpi_valores_calculados → mandalas/matriz/alertas"},{"de":"dados-brutos","para":"integracao","via":"CalendarioCultos embutido grava em cultos"},{"de":"painel-cbrio","para":"painel-cbrio","via":"recalcular_nsm() escreve em nsm_estado"},{"de":"gestao","para":"notificacao-regras","via":"POST /pulso/cobrar → notificação 'cobranca_kpi' ao líder"},{"de":"gestao","para":"painel-cbrio","via":"metas institucionais/específicas sobrescrevem kpi_indicadores_taticos.meta_valor"},{"de":"gestao","para":"painel-cbrio","via":"recalcula kpi_valores_calculados (RPC recalcular_todos_kpis_adm)"},{"de":"ritual","para":"painel-cbrio","via":"okr_revisoes consumido na camada 3 do detalhe do KPI"},{"de":"ritual","para":"painel-cbrio","via":"revisar KPI em alerta promove is_okr=true (efeito colateral)"},{"de":"revisao-estrategica","para":"projetos","via":"UPDATE em projects (mesma tabela)"},{"de":"revisao-estrategica","para":"expansao","via":"UPDATE em expansion_milestones (mesma tabela)"},{"de":"governanca","para":"notificacao-regras","via":"notificar() no cron de lembrete"},{"de":"assistente-ia","para":"financeiro","via":"handlers de apply (categorizar/pagar/reembolso/alerta)"},{"de":"assistente-ia","para":"painel-cbrio","via":"handler apply KPIs/OKR (alertar líder)"},{"de":"assistente-ia","para":"rh","via":"handlers apply (documento/treinamento/férias)"},{"de":"assistente-ia","para":"cerebro","via":"busca semântica no vault injetada no contexto do chat"},{"de":"feedback","para":"notificacao-regras","via":"agente piloto_triage_watcher → notificações dos admins"},{"de":"wifi","para":"membresia","via":"fn_wifi_processar_vinculos cria visitante para presentes recorrentes"},{"de":"wifi","para":"integracao","via":"cruza presencial_adulto (lançado na Integração) com conexões WiFi"},{"de":"wifi","para":"membresia","via":"cruza CPF com mem_membros/grupos/voluntários/contribuições/batismo/next"},{"de":"apresentacoes","para":"cerebro","via":"coletarContextoCompleto injeta notas do vault no deck"},{"de":"apresentacoes","para":"notificacao-regras","via":"notificar() tipo apresentacao_pronta"},{"de":"dashboard","para":"rh","via":"GET /rh/dashboard (cards Colaboradores/Férias)"},{"de":"dashboard","para":"financeiro","via":"GET /financeiro/dashboard (Saldo/Contas Vencendo)"},{"de":"dashboard","para":"patrimonio","via":"GET /patrimonio/dashboard (Bens)"},{"de":"dashboard","para":"logistica","via":"GET /logistica/dashboard (Pedidos)"},{"de":"dashboard","para":"cuidados","via":"GET /cuidados/dashboard (Pessoas Acompanhadas)"},{"de":"dashboard-semanal","para":"financeiro","via":"embute DashboardFinanceiroSemanal (/financeiro-v2)"},{"de":"dashboard-semanal","para":"painel-cbrio","via":"aba KPIs reembrulha /kpis/v2/taticos e /painel/kpi/:id"},{"de":"minha-area","para":"painel-cbrio","via":"OkrRevisaoModal grava okr_revisoes; lê vw_kpi_taticos_status"},{"de":"cruzamentos","para":"membresia","via":"vw_pessoas_papeis_mat sobre mem_membros (leitura/cruzamento de papéis)"},{"de":"logistica","para":"solicitacoes","via":"/estoque/gerar-compra cria solicitação de compra"},{"de":"devocional","para":"cuidados","via":"mem_devocionais (check-in) → KPI cuidados.devocional_membros no dashboard"},{"de":"devocional","para":"membresia","via":"resolveMembro auto-linka profiles.membro_id por e-mail"},{"de":"next-batismo","para":"membresia","via":"membroMatch acharOuCriarGuardado/buscarCandidatos (matching unificado de pessoa)"},{"de":"patrimonio","para":"logistica","via":"aba Movimentações grava em log_movimentacoes (domínio de Estoque)"},{"de":"planejamento","para":"eventos","via":"aprovar proposta cria events (criacao_origem='ciclo_planejamento')"},{"de":"planejamento","para":"projetos","via":"aprovar proposta cria projects"},{"de":"planejamento","para":"eventos","via":"drag no Kanban grava status em cycle_phase_tasks/event_tasks"},{"de":"planejamento","para":"projetos","via":"drag no Kanban grava status em project_tasks"},{"de":"projetos","para":"cerebro","via":"enqueueSync('projeto')"},{"de":"cerebro","para":"membresia","via":"vault Obsidian/SharePoint (notas derivadas de membros)"}],"achados_transversais":[{"titulo":"KPIs sem fonte espalhados pelo sistema estratégico","descricao":"Metade do painel estratégico do presidente fica em branco: ~13 de ~25 indicadores do Monitoramento OKR não têm fonte (OKRs inteiros como Eficiência Financeira e Prontidão de Expansão estão 100% vazios). O mesmo padrão se repete em vários PainelArea (aba Dados sempre vazia para AMI/Bridge porque os KPIs usam fonte_auto sem formula_config), no NPS de líderes em Grupos, no NPS comparativo de Produção, e nos KPIs RH-/INFRA-/FIN- que dependem de lançamento manual em Dados Brutos que ninguém faz. O denominador comum é que a estrutura (KPI + view) existe, mas o coletor não, ou a fonte operacional ainda não foi populada — e a UI muitas vezes mostra 0/'—' sem distinguir 'sem dado' de 'meta não atingida'.","recomendacao":"Adotar um padrão único de UI que diferencie 'sem coletor', 'coletor existe mas sem dado' e 'zero real'. Priorizar com a diretoria quais fontes ligar (o módulo Produção já tem duração; NPS pode vir de pesquisa pós-culto). Cada ligação é um ramo na RPC + a chave 'live' no front."},{"titulo":"Definição não-unificada de 'convertido/engajado' fragmenta o NSM","descricao":"A pessoa canônica da jornada não é única: cui_convertidos e cultos_decisoes_pessoas são listas separadas, e o card NSM (recalcular_nsm, só mem_trilha_valores ≤60d), o drilldown 'Ver pessoas' (cruzamento de 9 atividades) e o critério 'Seguir' de Cruzamentos (só mem_trilha_valores sobre mem_membros active) usam definições DIFERENTES de engajamento. Convertidos que entraram só por uma porta e nunca viraram mem_membros ativo ficam invisíveis. É a raiz do NSM≈0 e das duplicatas, já reconhecida como a sessão de arquitetura pendente.","recomendacao":"Unificar a fonte canônica de 'convertido' (incluir cui_convertidos/batismo_inscricoes) e alinhar a definição de engajamento entre card, drilldown e cruzamentos. Concluir a sessão de arquitetura da jornada (auditar fontes + unificar pessoa+eventos)."},{"titulo":"Funções de matching de pessoa e criação de membro espalhadas/duplicadas","descricao":"Cada porta de entrada criava pessoa à sua maneira: findOrCreateMembro (voluntariado/next), findMembroByCpf de Cuidados que na verdade busca por TELEFONE (vinculando ao membro errado), merge_membros, resolveMembro do devocional por e-mail. O membroMatch unificado (acharOuCriarGuardado) já foi criado e plugado em várias portas (batismo, grupos, voluntariado, totem), mas Cuidados ainda usa o lookup quebrado por CPF≠telefone, e o working tree auditado nem tinha o serviço — sinal de drift.","recomendacao":"Plugar membroMatch em todas as portas restantes (Cuidados é o mais urgente: o lookup por CPF contra a coluna telefone vincula ao membro errado em produção). Centralizar a regra CPF→e-mail→telefone+nome→cria como único caminho."},{"titulo":"Hard-deletes irreversíveis fora da política de soft-delete","descricao":"Padrão recorrente de DELETE direto em tabelas que deveriam ter soft-delete ou que apagam histórico/PII: int_acompanhamentos (sem authorizeModule, PII pastoral), expansion_milestones em cascata (apaga marcos+tarefas+dependências), project_tasks/comments, mem_familias (está na whitelist mas usa .delete()), mem_grupo_encontros (agregável em KPI), apresentacoes, dados_brutos, eventos (apaga até o audit_log), pat_bens, log_movimentacoes. Foge da regra global de app_soft_delete.","recomendacao":"Varredura sistemática: converter para app_soft_delete onde a tabela está na whitelist, e exigir authorizeModule de nível adequado nos DELETE. Atenção especial a int_acompanhamentos (mesmo bug já corrigido em /visitantes) e expansion_milestones."},{"titulo":"Autorização inconsistente — backend confia no gating do frontend","descricao":"Vários módulos só aplicam router.use(authenticate) sem authorizeModule por nível nos endpoints de escrita, confiando que a UI esconde os botões: Cuidados (quase todos os POST/PATCH/DELETE), Patrimônio (piso de escrita 2 para deletes), Projetos (PATCH de status/subtask/comentário), Expansão (frontend libera nível 3 mas backend exige diretor → 403), Ritual e Cruzamentos (rotas sem ModuleGuard, PII em lote), Dashboard-Semanal (endpoint de IA pago aberto a qualquer autenticado). Como o backend usa service_role e bypassa RLS, a única barreira real fica frágil.","recomendacao":"Padronizar authorizeModule(slug, nível) coerente com a regra do front nos endpoints de escrita; gatear rotas sensíveis (ritual, cruzamentos) com ModuleGuard; alinhar gating front↔back em Expansão."},{"titulo":"Drift git↔produção: working tree muito atrás de origin/main","descricao":"Múltiplas fichas (RH 842 vs 1516 linhas, Produção pré-redesenho vs cronograma por etapas já mergeado, Cuidados com 3 abas vs 'Próximos passos' fundido, membroMatch ausente) confirmam que o working tree da branch atual está muito atrás de origin/main, descrevendo versões que NÃO estão em produção. Também há drift schema↔migrations (views como vw_dados_brutos_completo sem colunas de validação, função fn_monitoramento_okr_raw que pode estar numa versão antiga).","recomendacao":"Sempre auditar/implementar a partir de origin/main (worktree limpo). Confirmar definições vivas de views/funções no banco antes de qualquer mudança, dado o histórico recorrente de migrations não aplicadas."},{"titulo":"Listas hardcoded duplicadas divergem da realidade do backend","descricao":"Catálogos mantidos à mão em vários lugares que divergem da fonte viva: MODULOS de Notificação (3 fantasmas piloto/generosidade/processos + 8 módulos reais ausentes como Solicitações/Online), AREAS de Solicitações-Responsáveis (sem 'producao'), capacidade do templo (1050 no Dashboard-Semanal vs 1200 na Integração vs 1050 hardcoded), 3 catálogos paralelos de agentes no Assistente IA. Módulo novo que dispara notificação cai silenciosamente no fallback admin/diretor.","recomendacao":"Fonte única de verdade: derivar listas de módulos/áreas/capacidades da tabela modulos/sla_definicoes ou de constantes compartilhadas backend↔frontend, em vez de hardcode divergente."},{"titulo":"Dados que entram mas ninguém consome (endpoints e abas órfãos)","descricao":"Vários dados/endpoints existem sem consumidor: /dashboard/pmo,workload,kanban,sync-areas (nenhum front); telemetria de custo de Apresentações (/uso/resumo); urgência-frequente e calendário de reservas em Solicitações; PATCH /ritual/revisao (ciclo de fechamento sem UI); log_solicitacoes_compra/log_movimentacoes na Logística; visitantes/acompanhamentos na Integração; renderDashboard morto no Financeiro; AbaPulso/AbaSaude na Gestão; agents.memory. Frequência de encontros de Grupos não vira KPI; % comparecimento do Next idem.","recomendacao":"Decidir caso a caso entre construir a UI faltante (urgência-frequente, calendário de reservas, fechamento do ritual) ou remover endpoint/aba para reduzir superfície morta e risco de manutenção fantasma."},{"titulo":"Comprovantes e documentos sensíveis em buckets públicos","descricao":"PII financeira exposta por getPublicUrl: comprovantes de reembolso/pagamento em Solicitações (bucket 'solicitacoes'), PDFs de NF na Logística (bucket 'log-arquivos'), uploads feitos direto do frontend com anon key. Qualquer um com a URL acessa.","recomendacao":"Migrar para buckets privados + signed URLs com TTL (padrão já usado no Marketing/SharePoint) e rotear uploads sensíveis pelo backend service_role."},{"titulo":"Cap de 1000 linhas do PostgREST em agregações sem paginação","descricao":"Padrão recorrente de agregação client-side ou .in()/select sem .range() que truncará silenciosamente quando o histórico crescer: KPIs de Membresia (mem_membros já >1000), relatórios de Voluntariado (schedules/check-ins), Cruzamentos, Revisão Estratégica. O módulo Produção já foi corrigido com fetchAllPaged — o padrão a replicar.","recomendacao":"Mover agregações pesadas para RPC/view SQL ou paginar com loop (.range), conforme a regra documentada do cap de 1000. Auditar membresia.js (KPIs) e voluntariado.js (relatórios) como prioritários."},{"titulo":"Coletas que dependem de OAuth/integração externa frágil sem sinalização","descricao":"Online, Integração (Views D+1/D+7) e Monitoramento OKR (Engajamento) dependem do OAuth do YouTube que expira a cada 7 dias (app em modo Testing); WiFi depende de um Supabase externo; Totem Kids depende do agente LRS; pagers/Santander/ML idem. Quando a fonte cai, a tela mostra 0/'—' sem distinguir 'desconectado' de 'sem dado'.","recomendacao":"Publicar o app OAuth do YouTube (sai do cap de 7 dias) e adicionar indicadores de saúde de conexão visíveis nas telas dependentes (último sync, status do token, heartbeat do agente)."}],"modulos_sem_consumidor":["governanca — gera relatórios JSON e roda cron de lembrete, mas não tem rota/menu/frontend; nenhum módulo consome sua saída","ritual — grava okr_revisoes (lida pelo Painel) mas é praticamente inacessível (sem ModuleGuard, sem item de menu) e o ciclo de fechamento (PATCH revisao) não tem UI","cruzamentos — consulta read-only que só copia e-mails pro clipboard; não alimenta nenhum módulo/tabela","apresentacoes — gera decks HTML; a telemetria de custo (/uso/resumo) não tem consumidor e o produto não alimenta outros módulos","feedback — telemetria de piloto; só o agente piloto_triage_watcher consome (via notificações dos admins), nenhum módulo de negócio","perfil — só atualiza profiles (avatar/telefone/senha); não produz saída consumida por outro módulo além do avatar global","monitoramento-okr — terminal 100% read-only; consome de muitos mas não alimenta nada","dashboard-semanal — read-only/análise; só grava suas próprias tabelas de config (metas, indicadores IA), não alimenta módulos de negócio","minha-area — read-only; só grava okr_revisoes (efeito mínimo); não alimenta outros módulos","dashboard — landing read-only de navegação; não grava nem alimenta nada (backend dashboard.js é órfão)","patrimonio — silo: pat_bens/categorias/localizacoes/inventarios lidos só pela própria tela; não alimenta KPI/NSM/nenhum módulo","expansao — silo: expansion_milestones/tasks lidos só pela própria tela (e por Revisão Estratégica); não alimenta KPI/NSM/notificações","revisao-estrategica — edita projects/expansion_milestones (tabelas de outros módulos) e grava revision_log; não tem coletor/KPI próprio nem alimenta painel"],"possiveis_faltantes":["kids-painel — o inventário lista 'kids' (PainelArea da área Kids) e 'kids-painel' como itens distintos, mas só há ficha de 'kids'; 'kids-painel' parece ser o mesmo módulo ou uma duplicata de slug a confirmar","cba — área histórica (Igrejas CBA acompanhadas) citada em várias integrações e no NSM, mas sem módulo/ficha próprio; hoje aparece oculta no Painel (filtrada) e como constante legada — confirmar se deve ter visão própria ou ser removida","entradas — renomeação de next-batismo para 'Entradas' (PR #1191) com Ficha de Entrada, aba Buscar pessoa e aba Base inteira; é a vitrine de triagem do funil e a futura tela canônica de pessoa, mas não tem ficha verificada separada de next-batismo","quiosque/lounge (check-in de batismo) — programa de captura de identidade na origem (Totem Membro + selfie + etiqueta QR, PR #1208) em desenvolvimento; ainda não tem ficha consolidada e cruza com Totem Membro/Next-Batismo","app mobile de jornada (Matheus) — app de entrada de frequência de grupos e tela de fotos do batizando, ligado ao Supabase; é dependência-chave de Grupos (coleta de frequência) e do quiosque, mas vive fora do ERP web e não tem ficha","governance/ritual frontend — ambos têm backend vivo mas frontend ausente/inacessível; se a intenção é mantê-los, falta a tela; se não, falta a decisão de descontinuar"],"resumo_executivo":"O ERP CBRio está organizado em torno de uma coluna vertebral clara — a jornada do convertido rumo ao NSM (culto → decisão → Integração → Cuidados → encaminhamentos → Grupos/Voluntariado/Next → Membresia), medida pelos terminais read-only Painel CBRio e Monitoramento OKR — e de trilhos administrativos paralelos (Solicitações, Produção, Financeiro, RH, Cérebro) que sustentam a operação e alimentam os KPIs ADM. A arquitetura de integração é rica e majoritariamente saudável: a maioria dos módulos escreve numa tabela canônica (mem_membros, cultos, dados_brutos, jornada_encaminhamentos) que outros leem, e o Cérebro sincroniza quase tudo para a base de conhecimento. Os riscos sistêmicos não são de plumbing, mas de adoção e consistência: (1) a definição de 'convertido/engajado' ainda não é única, o que mantém o NSM perto de zero e gera duplicatas — a unificação da pessoa canônica é a prioridade estratégica; (2) metade dos indicadores estratégicos fica em branco por falta de fonte/coletor ou de dado operacional, sem a UI distinguir 'sem dado' de 'meta não batida'; (3) há dívidas transversais de segurança (hard-deletes de PII fora da política, endpoints de escrita confiando no gating do frontend, comprovantes em buckets públicos, cap de 1000 do PostgREST em agregações). O sistema também acumula superfície morta (módulos sem consumidor como Governança e Ritual, endpoints órfãos, listas hardcoded divergentes) e um drift recorrente entre o working tree e produção que exige sempre auditar a partir de origin/main. Em resumo: a espinha está bem desenhada; o trabalho de maior alavancagem é unificar a pessoa da jornada, ligar as fontes que faltam aos KPIs e fazer uma varredura de padronização de segurança e limpeza de código morto."}}</script>
