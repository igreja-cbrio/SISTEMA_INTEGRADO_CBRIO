<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ AQUI O ZOOM FICA LIVRE, ao contrário do index.html do ERP (que trava
         com user-scalable=no por causa dos botões flutuantes). Quem responde o
         censo está em pé, no culto, e precisa poder aproximar o texto — era o
         que o `usePermitirZoom()` da página tinha que desfazer à mão. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Censo CBRio</title>
    <meta name="description" content="Ajude a CBRio a conhecer melhor a nossa comunidade: são alguns minutos e você pode parar e continuar depois." />
    <!-- ⚠️ SEM Google Tag Manager de propósito: esta página coleta CPF, nome,
         telefone, endereço e vínculo com a igreja. Rastreamento de anúncio não
         entra onde há dado pessoal (mesma régua do gate por hostname no
         index.html). -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#00B39D" />
    <meta name="robots" content="noindex" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/public-censo.tsx"></script>
  </body>
</html>
